<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CloudHelper Probe Node</title>
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="settings">
  <div class="shell">
    <aside>
      <h1 class="brand">CloudHelper<br>Probe Node</h1>
      <nav>
        <a class="nav-button" data-page="route" href="route.html">路由</a>
        <a class="nav-button" data-page="status" href="status.html">状态</a>
        <a class="nav-button" data-page="information" href="information.html">信息框</a>
        <a class="nav-button" data-page="settings" href="settings.html">设置</a>
      </nav>
    </aside>
    <main>
      <h2 id="pageTitle" class="page-title">设置</h2>
      <p id="pageSubtitle" class="page-subtitle"></p>
      <section class="page">
        <div class="sub-tabs" role="tablist" aria-label="设置分类">
          <button class="sub-tab-button active" type="button" data-settings-tab="upgrade">升级</button>
          <button class="sub-tab-button" type="button" data-settings-tab="controller">主控</button>
          <button class="sub-tab-button" type="button" data-settings-tab="route">路由设置</button>
          <button class="sub-tab-button" type="button" data-settings-tab="dnsFilter">DNS 拦截</button>
        </div>
        <div id="settingsUpgradePanel" class="tab-panel" data-settings-panel="upgrade">
          <div class="actions">
            <button id="directUpgradeButton" class="command" onclick="checkUpgrade('direct')">Direct Upgrade</button>
            <button id="controllerUpgradeButton" class="command secondary" onclick="checkUpgrade('controller')">主控代理升级</button>
          </div>
          <div class="upgrade-progress" aria-label="升级进度">
            <div id="upgradeProgressFill" class="upgrade-progress-fill"></div>
          </div>
          <div class="upgrade-grid">
            <div>状态<strong id="upgradeState">-</strong></div>
            <div>阶段<strong id="upgradePhase">-</strong></div>
            <div>进度<strong id="upgradePercent">0%</strong></div>
            <div>下载<strong id="upgradeDownload">-</strong></div>
            <div>速度<strong id="upgradeSpeed">-</strong></div>
            <div>版本<strong id="upgradeVersion">-</strong></div>
          </div>
          <div class="status-box" id="upgradeStatus"></div>
        </div>
        <div id="settingsControllerPanel" class="tab-panel" data-settings-panel="controller" hidden>
          <div class="field">
            <label for="controllerUrl">Controller URL</label>
            <input id="controllerUrl" autocomplete="off" placeholder="https://controller.example.com">
          </div>
          <div class="field">
            <label for="nodeId">Node ID</label>
            <input id="nodeId" autocomplete="off">
          </div>
          <div class="field">
            <label for="nodeSecret">Node Secret</label>
            <input id="nodeSecret" type="password" autocomplete="off">
          </div>
          <div class="actions">
            <button id="saveButton" class="command" onclick="saveConfig(true)">Save</button>
            <button class="command neutral" onclick="refreshConfig()">刷新配置</button>
          </div>
          <div id="saveFeedback" class="inline-feedback" aria-live="polite"></div>
          <div class="status-box" id="settingsStatus"></div>
        </div>
        <div id="settingsDNSFilterPanel" class="tab-panel" data-settings-panel="dnsFilter" hidden>
          <p class="hint">仅保存在本机，保存后立即生效。作用于 VPN 接管的流量；未接管的应用与系统旁路连接不经过此检查。</p>
          <p><label><input id="dnsFilterDoH" type="checkbox"> 阻断黑名单 DoH（TCP/UDP 443）</label></p>
          <p><label><input id="dnsFilterDoT" type="checkbox"> 阻断 DoT / DoQ（TCP/UDP 853，所有目标）</label></p>
          <label for="dnsFilterList">DNS 黑名单：每行一个域名或 IP，最多 32 条</label>
          <textarea id="dnsFilterList" rows="8" spellcheck="false" style="width:100%;box-sizing:border-box;resize:vertical" placeholder="dns.google&#10;1.1.1.1"></textarea>
          <p class="hint">域名同时匹配子域名。开启 DoH 阻断后，拒绝黑名单域名查询，并阻断其已缓存 Fake IP 的 TCP/UDP 流量。真实 IP 按上述端口拦截。</p>
          <div class="actions">
            <button id="saveDNSFilterButton" class="command" type="button" onclick="saveDNSFilter()" disabled>保存本机 DNS 设置</button>
            <button id="reloadDNSFilterButton" class="command neutral" type="button" onclick="loadDNSFilter()">重新读取</button>
            <button id="resetDNSFilterButton" class="command neutral" type="button" onclick="saveDNSFilter(true)">恢复默认</button>
          </div>
          <div id="dnsFilterFeedback" class="inline-feedback" aria-live="polite"></div>
        </div>
        <div id="settingsRoutePanel" class="tab-panel" data-settings-panel="route" hidden>
          <p class="hint">每条规则默认跟随主控。改选出口仅保存在本机，刷新主控配置会保留选择；恢复默认后重新跟随主控。</p>
          <div id="routeSettingsGrid" class="route-settings-grid" aria-live="polite"></div>
          <div class="actions">
            <button id="saveRouteSettingsButton" class="command" type="button" onclick="saveRouteSettings()">保存本机出口</button>
            <button id="resetRouteSettingsButton" class="command" type="button" onclick="saveRouteSettings(true)">恢复默认</button>
            <button class="command neutral" type="button" onclick="loadRouteSettings()">重新读取</button>
          </div>
          <div id="routeSettingsFeedback" class="inline-feedback" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
