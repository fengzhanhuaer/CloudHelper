<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2358a6ff'/%3E%3Cstop offset='100%25' stop-color='%232ea043'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='6' y='6' width='52' height='52' rx='12' fill='%230b1628'/%3E%3Cpath d='M22 21L14 32L22 43' stroke='url(%23g)' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M42 21L50 32L42 43' stroke='url(%23g)' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M30 17L34 47' stroke='%239cd0ff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
    <title>CloudHelper 探针看板</title>
    <style>
        :root {
            --bg-base: #070b12;
            --bg-elevated: rgba(15, 22, 34, 0.78);
            --bg-card: rgba(13, 19, 30, 0.76);
            --bg-subtle: rgba(10, 15, 25, 0.72);
            --bg-hover: rgba(24, 35, 54, 0.88);
            --border-subtle: rgba(148, 163, 184, 0.14);
            --border-strong: rgba(148, 163, 184, 0.26);
            --text-primary: #e6edf3;
            --text-secondary: #8b9bb0;
            --text-muted: #64748b;
            --accent: #58a6ff;
            --accent-soft: rgba(88, 166, 255, 0.14);
            --success: #34d399;
            --good: #38bdf8;
            --warn: #facc15;
            --high: #fb923c;
            --danger: #f87171;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
            --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            font-family: var(--sans);
            color: var(--text-primary);
            background-color: var(--bg-base);
            background-image:
                radial-gradient(ellipse 80% 45% at 18% -10%, rgba(56, 189, 248, 0.16), transparent 60%),
                radial-gradient(ellipse 70% 40% at 84% -8%, rgba(52, 211, 153, 0.12), transparent 58%),
                linear-gradient(rgba(148, 163, 184, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
            padding: 20px 16px 36px;
            -webkit-font-smoothing: antialiased;
        }
        .mono {
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
        }
        .container {
            max-width: 1520px;
            margin: 0 auto;
        }
        .shell {
            background: var(--bg-elevated);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 22px 24px 26px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }

        /* Header */
        .topbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 18px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            background: linear-gradient(135deg, rgba(88, 166, 255, 0.26), rgba(52, 211, 153, 0.24));
            border: 1px solid rgba(148, 163, 184, 0.25);
            box-shadow: 0 0 22px rgba(88, 166, 255, 0.22);
        }
        .brand-icon svg {
            width: 22px;
            height: 22px;
        }
        .brand-title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #fff;
            line-height: 1.2;
        }
        .brand-subtitle {
            margin-top: 3px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .topbar-right {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 11px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-subtle);
            font-size: 12px;
            color: var(--text-secondary);
        }
        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55);
            animation: pulse 2.2s infinite;
        }
        .live-pill.paused .live-dot {
            background: var(--warn);
            animation: none;
        }
        .live-pill.error .live-dot {
            background: var(--danger);
            animation: none;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55); }
            70% { box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }
        .btn {
            appearance: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-subtle);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            font-family: var(--sans);
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
            white-space: nowrap;
        }
        .btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-strong);
        }
        .btn.active {
            background: var(--accent-soft);
            border-color: rgba(88, 166, 255, 0.45);
            color: #fff;
        }
        .btn:disabled {
            opacity: 0.55;
            cursor: default;
        }
        .btn-icon {
            width: 14px;
            height: 14px;
            flex: 0 0 auto;
        }
        .btn.loading .btn-icon {
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Tabs */
        .tabs-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }
        .tabs {
            display: inline-flex;
            gap: 4px;
            padding: 4px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
        }
        .tab-button {
            appearance: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            padding: 7px 14px;
            border-radius: 7px;
            font-size: 13.5px;
            font-weight: 500;
            font-family: var(--sans);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .tab-button:hover {
            color: var(--text-primary);
        }
        .tab-button.active {
            color: #fff;
            background: rgba(88, 166, 255, 0.16);
            border-color: rgba(88, 166, 255, 0.35);
            box-shadow: 0 2px 10px rgba(88, 166, 255, 0.12);
        }
        .tab-badge {
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.14);
            color: var(--text-secondary);
        }
        .tab-button.active .tab-badge {
            background: rgba(88, 166, 255, 0.25);
            color: #dbeafe;
        }
        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }

        /* KPI Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }
        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }
        .kpi-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .kpi-value {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }
        .kpi-sub {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .kpi-bar {
            height: 4px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.14);
            overflow: hidden;
            margin-top: 2px;
        }
        .kpi-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--success), var(--good));
            transition: width 0.35s ease;
        }

        /* Toolbars & Filters */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }
        .toolbar-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .search-box {
            position: relative;
            display: inline-flex;
            align-items: center;
            min-width: 220px;
            flex: 1 1 220px;
            max-width: 320px;
        }
        .search-box input {
            width: 100%;
            background: var(--bg-subtle);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 7px 28px 7px 30px;
            font-size: 12.5px;
            font-family: var(--sans);
            outline: none;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        .search-box input:focus {
            border-color: rgba(88, 166, 255, 0.55);
            background: rgba(13, 21, 35, 0.92);
        }
        .search-box input::placeholder {
            color: var(--text-muted);
        }
        .search-icon {
            position: absolute;
            left: 9px;
            width: 14px;
            height: 14px;
            color: var(--text-muted);
            pointer-events: none;
        }
        .search-clear {
            position: absolute;
            right: 6px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 5px;
            font-size: 14px;
            line-height: 1;
            display: none;
        }
        .search-clear.visible {
            display: inline-flex;
        }
        .search-clear:hover {
            color: var(--text-primary);
        }
        .segmented {
            display: inline-flex;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg-subtle);
        }
        .seg-btn {
            appearance: none;
            border: none;
            border-right: 1px solid var(--border-subtle);
            background: transparent;
            color: var(--text-secondary);
            padding: 6px 11px;
            font-size: 12.5px;
            font-family: var(--sans);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
            white-space: nowrap;
        }
        .seg-btn:last-child {
            border-right: none;
        }
        .seg-btn:hover {
            color: var(--text-primary);
        }
        .seg-btn.active {
            background: var(--accent-soft);
            color: #fff;
        }
        .select-control {
            appearance: none;
            background: var(--bg-subtle);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 6px 26px 6px 10px;
            font-size: 12.5px;
            font-family: var(--sans);
            cursor: pointer;
            outline: none;
            background-image: linear-gradient(45deg, transparent 50%, var(--text-secondary) 50%), linear-gradient(135deg, var(--text-secondary) 50%, transparent 50%);
            background-position: calc(100% - 13px) 50%, calc(100% - 8px) 50%;
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
        }
        .select-control:focus {
            border-color: rgba(88, 166, 255, 0.55);
        }
        .select-control option {
            background: #0d1522;
            color: var(--text-primary);
        }

        /* Probe Card Grid */
        .probe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(395px, 100%), 1fr));
            gap: 14px;
        }
        .probe-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 15px 15px 13px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
        }
        .probe-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--success), var(--good));
            opacity: 0.85;
        }
        .probe-card.offline::before {
            background: linear-gradient(90deg, var(--danger), rgba(248, 113, 113, 0.25));
        }
        .probe-card.offline {
            opacity: 0.78;
        }
        .probe-card:hover {
            border-color: rgba(88, 166, 255, 0.32);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
        }
        .probe-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }
        .probe-title-wrap {
            min-width: 0;
            flex: 1 1 auto;
        }
        .probe-title-row {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex: 0 0 auto;
        }
        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.7);
        }
        .status-dot.offline {
            background: var(--danger);
            box-shadow: 0 0 6px rgba(248, 113, 113, 0.45);
        }
        .probe-name {
            font-size: 15px;
            font-weight: 650;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .node-no-tag {
            flex: 0 0 auto;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 5px;
            background: rgba(148, 163, 184, 0.12);
            color: var(--text-secondary);
        }
        .probe-meta-tags {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 5px;
            margin-top: 6px;
        }
        .meta-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 11.5px;
            background: rgba(148, 163, 184, 0.08);
            border: 1px solid rgba(148, 163, 184, 0.12);
            color: var(--text-secondary);
            max-width: 100%;
        }
        .meta-chip a {
            color: var(--accent);
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .meta-chip a:hover {
            text-decoration: underline;
        }
        .status-pill {
            flex: 0 0 auto;
            font-size: 11.5px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 999px;
            border: 1px solid transparent;
        }
        .status-pill.online {
            color: #6ee7b7;
            background: rgba(52, 211, 153, 0.12);
            border-color: rgba(52, 211, 153, 0.34);
        }
        .status-pill.offline {
            color: #fca5a5;
            background: rgba(248, 113, 113, 0.12);
            border-color: rgba(248, 113, 113, 0.34);
        }

        /* Resource Rings */
        .probe-metrics {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            padding: 10px 6px;
            border-radius: 10px;
            background: rgba(7, 11, 18, 0.45);
            border: 1px solid rgba(148, 163, 184, 0.08);
        }
        .metric-gauge {
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .metric-ring {
            --metric-angle: 0deg;
            --metric-color: #34d399;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at center, #0b111c 0 58%, transparent 59%),
                conic-gradient(var(--metric-color) var(--metric-angle), rgba(148, 163, 184, 0.14) 0);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }
        .metric-center {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            font-size: 10.5px;
            font-weight: 700;
            line-height: 1.1;
            padding: 0 2px;
            word-break: break-word;
        }
        .metric-label {
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }
        .metric-caption {
            max-width: 100%;
            color: var(--text-muted);
            font-size: 10.5px;
            line-height: 1.2;
            text-align: center;
            overflow-wrap: anywhere;
        }

        /* Mainstream Latency Section inside Probe Card */
        .section-box {
            padding: 10px 11px;
            border-radius: 10px;
            background: rgba(7, 11, 18, 0.42);
            border: 1px solid rgba(148, 163, 184, 0.09);
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 11.5px;
            color: var(--text-secondary);
        }
        .section-title {
            font-weight: 600;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .chart-jump-btn {
            appearance: none;
            border: 1px solid rgba(88, 166, 255, 0.25);
            background: rgba(88, 166, 255, 0.08);
            color: #93c5fd;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 11px;
            font-family: var(--sans);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .chart-jump-btn:hover {
            background: rgba(88, 166, 255, 0.2);
            color: #fff;
        }
        .latency-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .latency-row {
            display: grid;
            grid-template-columns: minmax(76px, 1.15fr) minmax(44px, 0.8fr) auto auto auto;
            align-items: center;
            gap: 8px;
            padding: 5px 7px;
            border-radius: 7px;
            background: rgba(15, 23, 36, 0.65);
            border: 1px solid rgba(148, 163, 184, 0.08);
            font-size: 12px;
        }
        .latency-row.stale {
            opacity: 0.66;
        }
        .latency-task {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }
        .q-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex: 0 0 auto;
            background: var(--q-color, var(--text-muted));
            box-shadow: 0 0 6px var(--q-color, transparent);
        }
        .latency-task-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-primary);
            font-weight: 500;
        }
        .latency-bar-track {
            height: 5px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.12);
            overflow: hidden;
        }
        .latency-bar-fill {
            height: 100%;
            border-radius: 999px;
            background: var(--q-color, var(--text-muted));
        }
        .latency-val {
            font-weight: 700;
            color: var(--q-color, var(--text-secondary));
            text-align: right;
            white-space: nowrap;
            min-width: 56px;
        }
        .loss-badge {
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 5px;
            white-space: nowrap;
            border: 1px solid transparent;
        }
        .loss-badge.ok {
            color: #86efac;
            background: rgba(52, 211, 153, 0.08);
            border-color: rgba(52, 211, 153, 0.2);
        }
        .loss-badge.warn {
            color: #fde047;
            background: rgba(250, 204, 21, 0.12);
            border-color: rgba(250, 204, 21, 0.3);
        }
        .loss-badge.bad {
            color: #fca5a5;
            background: rgba(248, 113, 113, 0.14);
            border-color: rgba(248, 113, 113, 0.35);
        }
        .loss-badge.muted {
            color: var(--text-muted);
            background: rgba(148, 163, 184, 0.08);
        }
        .fresh-tag {
            font-size: 10.5px;
            color: var(--text-muted);
            white-space: nowrap;
            text-align: right;
        }
        .fresh-tag.warn {
            color: var(--warn);
        }
        .empty-hint {
            font-size: 12px;
            color: var(--text-muted);
            padding: 2px 0;
        }

        /* Traffic Dual Boxes */
        .traffic-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }
        .traffic-box {
            padding: 7px 9px;
            border-radius: 8px;
            background: rgba(15, 23, 36, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.08);
            min-width: 0;
        }
        .traffic-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 3px;
        }
        .traffic-total {
            font-size: 13.5px;
            font-weight: 700;
            color: #fff;
        }
        .traffic-io {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .traffic-rx { color: #7dd3fc; }
        .traffic-tx { color: #a7f3d0; }
        .traffic-foot {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 4px 10px;
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Card Footer */
        .probe-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px 12px;
            padding-top: 8px;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            font-size: 11.5px;
            color: var(--text-secondary);
            margin-top: auto;
        }

        /* Compact List View */
        .probe-table-wrap {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            background: var(--bg-card);
        }
        .probe-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
            min-width: 900px;
        }
        .probe-table th {
            text-align: left;
            padding: 10px 12px;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(7, 11, 18, 0.55);
            border-bottom: 1px solid var(--border-subtle);
            white-space: nowrap;
        }
        .probe-table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.08);
            vertical-align: middle;
        }
        .probe-table tr:last-child td {
            border-bottom: none;
        }
        .probe-table tr:hover td {
            background: rgba(88, 166, 255, 0.05);
        }
        .probe-table tr.offline td {
            opacity: 0.72;
        }
        .mini-bars {
            display: grid;
            grid-template-columns: repeat(3, minmax(66px, 1fr));
            gap: 8px;
        }
        .mini-bar-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .mini-bar-top {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .mini-bar-track {
            height: 4px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.14);
            overflow: hidden;
        }
        .mini-bar-fill {
            height: 100%;
            border-radius: 999px;
        }
        .pill-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .lat-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 7px;
            border-radius: 6px;
            background: rgba(15, 23, 36, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.14);
            font-size: 11.5px;
            white-space: nowrap;
        }
        .lat-pill.stale {
            opacity: 0.62;
        }

        /* Network Status Tab */
        .network-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .network-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .network-card.highlight {
            border-color: rgba(88, 166, 255, 0.65);
            box-shadow: 0 0 0 1px rgba(88, 166, 255, 0.28), 0 12px 32px rgba(88, 166, 255, 0.12);
        }
        .network-head {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }
        .network-node-info {
            min-width: 0;
            flex: 1 1 240px;
        }
        .network-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .network-title {
            font-size: 15.5px;
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .network-hint {
            font-size: 11.5px;
            color: var(--text-muted);
        }

        /* Mainstream Clickable Series Summary Strip */
        .series-strip {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr));
            gap: 8px;
        }
        .series-chip {
            appearance: none;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 9px 11px;
            border-radius: 9px;
            background: rgba(7, 11, 18, 0.54);
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-left: 3px solid var(--series-color, var(--accent));
            color: var(--text-primary);
            cursor: pointer;
            transition: background 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
            font-family: var(--sans);
        }
        .series-chip:hover {
            background: rgba(20, 30, 48, 0.82);
            border-color: rgba(148, 163, 184, 0.28);
            border-left-color: var(--series-color, var(--accent));
        }
        .series-chip.hidden {
            opacity: 0.42;
            filter: grayscale(0.75);
        }
        .series-chip.hidden .series-chip-name {
            text-decoration: line-through;
        }
        .series-chip-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .series-chip-name {
            font-size: 12.5px;
            font-weight: 600;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .series-chip-latest {
            font-size: 13px;
            font-weight: 700;
            color: var(--q-color, #fff);
            white-space: nowrap;
        }
        .series-chip-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Interactive Chart Area */
        .chart-stage {
            position: relative;
            width: 100%;
            height: 280px;
            border-radius: 10px;
            background: rgba(6, 10, 17, 0.62);
            border: 1px solid rgba(148, 163, 184, 0.1);
            overflow: hidden;
            touch-action: pan-y;
        }
        .chart-stage canvas {
            width: 100%;
            height: 280px;
            display: block;
            cursor: crosshair;
        }
        .chart-tooltip {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            opacity: 0;
            z-index: 20;
            min-width: 196px;
            max-width: 290px;
            padding: 9px 11px;
            border-radius: 9px;
            background: rgba(9, 14, 24, 0.94);
            border: 1px solid rgba(148, 163, 184, 0.28);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            font-size: 11.5px;
            transition: opacity 0.08s ease;
        }
        .chart-tooltip.visible {
            opacity: 1;
        }
        .tt-time {
            font-weight: 600;
            color: #fff;
            padding-bottom: 5px;
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.16);
        }
        .tt-row {
            display: grid;
            grid-template-columns: auto minmax(60px, 1fr) auto auto;
            align-items: center;
            gap: 6px;
            padding: 2px 0;
        }
        .tt-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }
        .tt-name {
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tt-lat {
            font-weight: 700;
            text-align: right;
            white-space: nowrap;
        }
        .tt-loss {
            font-size: 11px;
            text-align: right;
            white-space: nowrap;
        }
        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 14px;
            font-size: 11.5px;
            color: var(--text-secondary);
        }
        .legend-items {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .legend-key {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .legend-line {
            width: 14px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
        }
        .legend-bar {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            background: rgba(248, 113, 113, 0.45);
            border: 1px solid rgba(248, 113, 113, 0.75);
        }
        .empty-state {
            background: var(--bg-card);
            border: 1px dashed var(--border-strong);
            border-radius: var(--radius-md);
            padding: 36px 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 13.5px;
        }
        .empty-state small {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 1080px) {
            .kpi-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
        @media (max-width: 640px) {
            body {
                padding: 10px 8px 24px;
            }
            .shell {
                padding: 14px 12px 18px;
                border-radius: 12px;
            }
            .kpi-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .kpi-card {
                padding: 11px 12px;
            }
            .kpi-value {
                font-size: 18px;
            }
            .probe-metrics {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .latency-row {
                grid-template-columns: minmax(70px, 1fr) auto auto;
            }
            .latency-bar-track,
            .fresh-tag {
                display: none;
            }
            .traffic-grid {
                grid-template-columns: 1fr;
            }
            .search-box {
                max-width: none;
                width: 100%;
            }
            .chart-stage,
            .chart-stage canvas {
                height: 235px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="shell">
            <header class="topbar">
                <div class="brand">
                    <div class="brand-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 7L4 12L8 17" stroke="#9cd0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M16 7L20 12L16 17" stroke="#9cd0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M11 5L13 19" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="brand-title">CloudHelper 探针看板</h1>
                        <div class="brand-subtitle">实时脱敏运行状态与网络延迟监测</div>
                    </div>
                </div>
                <div class="topbar-right">
                    <div id="live-pill" class="live-pill" title="页面切换到后台时自动暂停轮询">
                        <span class="live-dot" aria-hidden="true"></span>
                        <span id="live-text" class="mono">同步中...</span>
                    </div>
                    <button id="toggle-auto-refresh" class="btn" type="button" title="暂停或恢复自动刷新">暂停刷新</button>
                    <button id="manual-refresh" class="btn" type="button" title="立即刷新当前页面数据">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
                            <polyline points="21 3 21 9 15 9"/>
                        </svg>
                        刷新
                    </button>
                </div>
            </header>

            <div class="tabs-row">
                <div class="tabs" role="tablist" aria-label="看板视图">
                    <button class="tab-button active" type="button" role="tab" aria-selected="true" data-tab="probe-status">
                        探针状态 <span id="tab-probe-badge" class="tab-badge mono">0/0</span>
                    </button>
                    <button class="tab-button" type="button" role="tab" aria-selected="false" data-tab="network-status">
                        网络延迟曲线 <span id="tab-network-badge" class="tab-badge mono">—</span>
                    </button>
                </div>
            </div>

            <!-- Probe Status Tab -->
            <section id="probe-status" class="tab-panel active">
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-head"><span>节点在线率</span><span id="kpi-online-pct" class="mono">—</span></div>
                        <div class="kpi-value mono" id="kpi-online">-- / --</div>
                        <div class="kpi-bar"><div class="kpi-bar-fill" id="kpi-online-bar"></div></div>
                        <div class="kpi-sub" id="kpi-online-sub">等待探针数据</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-head"><span>在线平均延迟</span><span id="kpi-latency-grade">监测中</span></div>
                        <div class="kpi-value mono" id="kpi-latency">—</div>
                        <div class="kpi-sub" id="kpi-latency-sub">暂无有效延迟样本</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-head"><span>本月合计流量</span><span class="mono">RX + TX</span></div>
                        <div class="kpi-value mono" id="kpi-traffic">—</div>
                        <div class="kpi-sub mono" id="kpi-traffic-sub">↓ — · ↑ —</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-head"><span>主控运行时长</span><span class="mono">Controller</span></div>
                        <div class="kpi-value mono" id="uptime">--:--:--</div>
                        <div class="kpi-sub mono" id="started-at">启动时间: -</div>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="toolbar-group" style="flex: 1 1 320px;">
                        <div class="search-box">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            <input id="probe-search" type="text" placeholder="搜索节点、序号、厂家或归属地..." autocomplete="off">
                            <button id="probe-search-clear" class="search-clear" type="button" aria-label="清除搜索">&times;</button>
                        </div>
                        <div class="segmented" role="group" aria-label="在线状态筛选">
                            <button class="seg-btn active" type="button" data-filter="all">全部 <span id="cnt-all" class="mono">0</span></button>
                            <button class="seg-btn" type="button" data-filter="online">在线 <span id="cnt-online" class="mono">0</span></button>
                            <button class="seg-btn" type="button" data-filter="offline">离线 <span id="cnt-offline" class="mono">0</span></button>
                        </div>
                    </div>
                    <div class="toolbar-group">
                        <select id="probe-sort" class="select-control" aria-label="排序方式">
                            <option value="node_no">按序号排序</option>
                            <option value="online">在线优先</option>
                            <option value="latency">延迟由低到高</option>
                            <option value="cpu">CPU 占用降序</option>
                            <option value="ram">内存占用降序</option>
                            <option value="traffic">月度流量降序</option>
                        </select>
                        <div class="segmented" role="group" aria-label="布局视图">
                            <button class="seg-btn active" type="button" data-view="card">卡片</button>
                            <button class="seg-btn" type="button" data-view="list">列表</button>
                        </div>
                    </div>
                </div>

                <div id="probe-container">
                    <div class="empty-state">正在加载探针状态...</div>
                </div>
            </section>

            <!-- Network Status Tab -->
            <section id="network-status" class="tab-panel">
                <div class="toolbar">
                    <div class="toolbar-group" style="flex: 1 1 320px;">
                        <select id="network-node-filter" class="select-control" aria-label="筛选节点">
                            <option value="all">全部监测节点</option>
                        </select>
                        <div class="search-box">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            <input id="network-search" type="text" placeholder="搜索节点、归属地或监测任务..." autocomplete="off">
                            <button id="network-search-clear" class="search-clear" type="button" aria-label="清除搜索">&times;</button>
                        </div>
                    </div>
                    <div class="toolbar-group">
                        <div class="segmented" role="group" aria-label="网络曲线时间刻度">
                            <button class="seg-btn scale-button active" type="button" data-scale="minute">24小时 · 分钟</button>
                            <button class="seg-btn scale-button" type="button" data-scale="hour">30天 · 小时</button>
                            <button class="seg-btn scale-button" type="button" data-scale="day">180天 · 天</button>
                        </div>
                        <button id="toggle-smooth" class="btn active" type="button" title="平滑曲线与面积填充">平滑曲线</button>
                        <button id="toggle-spike-clamp" class="btn" type="button" title="按 P98 自动限制极端毛刺，避免压扁正常延迟波动">过滤毛刺</button>
                    </div>
                </div>
                <div id="network-grid" class="network-grid">
                    <div class="empty-state">正在加载网络延迟曲线...</div>
                </div>
            </section>
        </div>
    </div>

    <script>
        const els = {
            livePill: document.getElementById('live-pill'),
            liveText: document.getElementById('live-text'),
            toggleAutoRefresh: document.getElementById('toggle-auto-refresh'),
            manualRefresh: document.getElementById('manual-refresh'),
            tabProbeBadge: document.getElementById('tab-probe-badge'),
            tabNetworkBadge: document.getElementById('tab-network-badge'),
            uptime: document.getElementById('uptime'),
            startedAt: document.getElementById('started-at'),
            kpiOnline: document.getElementById('kpi-online'),
            kpiOnlinePct: document.getElementById('kpi-online-pct'),
            kpiOnlineBar: document.getElementById('kpi-online-bar'),
            kpiOnlineSub: document.getElementById('kpi-online-sub'),
            kpiLatency: document.getElementById('kpi-latency'),
            kpiLatencyGrade: document.getElementById('kpi-latency-grade'),
            kpiLatencySub: document.getElementById('kpi-latency-sub'),
            kpiTraffic: document.getElementById('kpi-traffic'),
            kpiTrafficSub: document.getElementById('kpi-traffic-sub'),
            probeSearch: document.getElementById('probe-search'),
            probeSearchClear: document.getElementById('probe-search-clear'),
            probeSort: document.getElementById('probe-sort'),
            probeContainer: document.getElementById('probe-container'),
            cntAll: document.getElementById('cnt-all'),
            cntOnline: document.getElementById('cnt-online'),
            cntOffline: document.getElementById('cnt-offline'),
            networkNodeFilter: document.getElementById('network-node-filter'),
            networkSearch: document.getElementById('network-search'),
            networkSearchClear: document.getElementById('network-search-clear'),
            networkGrid: document.getElementById('network-grid'),
            toggleSmooth: document.getElementById('toggle-smooth'),
            toggleSpikeClamp: document.getElementById('toggle-spike-clamp')
        };

        const seriesColors = [
            '#38bdf8', '#34d399', '#f59e0b', '#c084fc', '#fb7185',
            '#2dd4bf', '#60a5fa', '#a3e635', '#f97316', '#e879f9'
        ];

        const state = {
            activeTab: 'probe-status',
            autoRefresh: true,
            probeFilter: 'all',
            probeSort: 'node_no',
            probeView: readLocalPref('ch_dash_view', 'card'),
            probeQuery: '',
            probes: [],
            probesLoaded: false,
            probeOnlineMap: new Map(),
            networkScale: 'minute',
            networkLoaded: false,
            networkItems: [],
            networkNodeFilter: 'all',
            networkQuery: '',
            highlightNodeKey: '',
            smoothCurve: readLocalPref('ch_dash_smooth', '1') !== '0',
            clampSpikes: readLocalPref('ch_dash_clamp', '0') === '1',
            hiddenSeriesByNode: new Map(),
            chartInstances: new Map(),
            lastSyncAt: null,
            lastError: false,
            probeReqSeq: 0,
            networkReqSeq: 0,
            networkAbort: null
        };

        function readLocalPref(key, fallback) {
            try {
                const v = localStorage.getItem(key);
                return v == null ? fallback : v;
            } catch (_) {
                return fallback;
            }
        }

        function writeLocalPref(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (_) {}
        }

        function escapeHTML(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[ch]);
        }

        function normalizeExternalURL(raw) {
            const text = String(raw || '').trim();
            if (!text) return '';
            try {
                const parsed = new URL(text);
                const protocol = String(parsed.protocol || '').toLowerCase();
                if (protocol !== 'http:' && protocol !== 'https:') return '';
                return parsed.href;
            } catch (_) {
                return '';
            }
        }

        function formatVendorLink(name, rawURL) {
            const cleanName = String(name || '').trim();
            if (!cleanName) return '';
            const safeName = escapeHTML(cleanName);
            const url = normalizeExternalURL(rawURL);
            if (!url) return safeName;
            return '<a href="' + escapeHTML(url) + '" target="_blank" rel="noopener noreferrer" title="' + escapeHTML(url) + '">' + safeName + ' ↗</a>';
        }

        function formatLocations(locations) {
            if (!Array.isArray(locations)) return [];
            return locations.map((x) => String(x || '').trim()).filter(Boolean);
        }

        function formatHMS(seconds) {
            seconds = Math.max(0, Math.floor(Number(seconds) || 0));
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return h + ':' + m + ':' + s;
        }

        function formatControllerUptime(seconds) {
            seconds = Number(seconds);
            if (!Number.isFinite(seconds) || seconds < 0) return '--:--:--';
            const days = Math.floor(seconds / 86400);
            if (days > 0) return days + '天 ' + formatHMS(seconds % 86400);
            return formatHMS(seconds);
        }

        function formatMachineUptime(seconds) {
            seconds = Number(seconds);
            if (!Number.isFinite(seconds) || seconds <= 0) return '-';
            const days = Math.floor(seconds / 86400);
            if (days > 0) return days + '天 ' + formatHMS(seconds % 86400);
            return formatHMS(seconds);
        }

        function formatDateTime(raw) {
            if (!raw) return '-';
            const date = new Date(raw);
            if (!Number.isFinite(date.getTime())) return String(raw);
            return date.toLocaleString('zh-CN', { hour12: false });
        }

        function formatRelativeTime(raw) {
            if (!raw) return '-';
            const ts = Date.parse(raw);
            if (!Number.isFinite(ts)) return String(raw);
            const diffSec = Math.round((Date.now() - ts) / 1000);
            if (diffSec < 5) return '刚刚';
            if (diffSec < 60) return diffSec + '秒前';
            if (diffSec < 3600) return Math.floor(diffSec / 60) + '分钟前';
            if (diffSec < 86400) return Math.floor(diffSec / 3600) + '小时前';
            return Math.floor(diffSec / 86400) + '天前';
        }

        function formatTrafficBytes(value) {
            let bytes = Math.max(0, Number(value) || 0);
            const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB', 'PiB'];
            let unit = 0;
            while (bytes >= 1024 && unit < units.length - 1) {
                bytes /= 1024;
                unit += 1;
            }
            const digits = unit === 0 ? 0 : (bytes >= 100 ? 1 : 2);
            return bytes.toFixed(digits) + ' ' + units[unit];
        }

        function formatBytes(bytes) {
            bytes = Number(bytes);
            if (!Number.isFinite(bytes) || bytes <= 0) return '-';
            const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
            let value = bytes;
            let index = 0;
            while (value >= 1024 && index < units.length - 1) {
                value /= 1024;
                index += 1;
            }
            const digits = value >= 100 ? 0 : (value >= 10 ? 1 : 2);
            return value.toFixed(digits) + ' ' + units[index];
        }

        function formatUsedBytes(bytes) {
            bytes = Number(bytes);
            if (!Number.isFinite(bytes) || bytes < 0) return '-';
            if (bytes === 0) return '0 B';
            return formatBytes(bytes);
        }

        function normalizedPercent(value) {
            value = Number(value);
            if (!Number.isFinite(value)) return 0;
            return Math.max(0, Math.min(100, value));
        }

        function pct(v) {
            if (typeof v !== 'number' || !Number.isFinite(v) || v < 0) return '—';
            return v.toFixed(1) + '%';
        }

        function mixColor(from, to, ratio) {
            ratio = Math.max(0, Math.min(1, Number(ratio) || 0));
            const r = Math.round(from[0] + (to[0] - from[0]) * ratio);
            const g = Math.round(from[1] + (to[1] - from[1]) * ratio);
            const b = Math.round(from[2] + (to[2] - from[2]) * ratio);
            return 'rgb(' + r + ', ' + g + ', ' + b + ')';
        }

        function usageColor(percent) {
            percent = normalizedPercent(percent);
            if (percent <= 60) return mixColor([52, 211, 153], [250, 204, 21], percent / 60);
            return mixColor([250, 204, 21], [248, 113, 113], (percent - 60) / 40);
        }

        function networkMetricValue(value, maximum = Infinity) {
            return typeof value === 'number' && Number.isFinite(value) && value >= 0 && value <= maximum ? value : null;
        }

        // Mainstream latency grading (similar to Nezha / Komari / ServerStatus)
        function latencyQuality(latencyMS, lossPercent, stale, available) {
            if (!available) return { color: '#64748b', label: '待采样', barPct: 0 };
            const lat = networkMetricValue(latencyMS);
            const loss = networkMetricValue(lossPercent, 100);
            if (stale) {
                const bar = lat == null ? (loss === 100 ? 100 : 0) : Math.min(100, Math.max(8, (lat / 350) * 100));
                return { color: '#64748b', label: '已过期', barPct: bar };
            }
            if ((loss != null && loss >= 20) || lat == null) {
                return { color: '#f87171', label: loss === 100 ? '超时' : '丢包高', barPct: 100 };
            }
            const barPct = Math.min(100, Math.max(8, (Math.log10(lat + 10) / Math.log10(410)) * 100));
            if (loss != null && loss >= 5) return { color: '#fb923c', label: '有丢包', barPct };
            if (lat < 50) return { color: '#34d399', label: '极佳', barPct };
            if (lat < 120) return { color: '#38bdf8', label: '良好', barPct };
            if (lat < 220) return { color: '#facc15', label: '一般', barPct };
            if (lat < 350) return { color: '#fb923c', label: '偏高', barPct };
            return { color: '#f87171', label: '高延迟', barPct };
        }

        function formatLatencyDisplay(latencyMS, lossPercent, available) {
            if (!available) return '—';
            const lat = networkMetricValue(latencyMS);
            const loss = networkMetricValue(lossPercent, 100);
            if (lat == null) {
                if (loss != null && loss >= 100) return '超时';
                return '—';
            }
            return (lat >= 100 ? lat.toFixed(0) : lat.toFixed(1)) + ' ms';
        }

        function nodeNoOf(item) {
            const n = Number(item && item.node_no);
            return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
        }

        function nodeKeyOf(item, fallbackIdx) {
            const no = nodeNoOf(item);
            if (no > 0) return 'no:' + no;
            const name = String((item && item.node_name) || '').trim();
            return name ? 'name:' + name : 'idx:' + fallbackIdx;
        }

        function displayNodeName(item, index) {
            const raw = item && item.node_name ? String(item.node_name).trim() : '';
            if (raw) return raw;
            const no = nodeNoOf(item);
            return '节点 #' + String(no > 0 ? no : index + 1);
        }

        function sortedByNodeNo(items) {
            const list = Array.isArray(items) ? items.slice() : [];
            list.sort((a, b) => {
                const an = nodeNoOf(a);
                const bn = nodeNoOf(b);
                if (an > 0 && bn > 0 && an !== bn) return an - bn;
                if (an > 0 && bn <= 0) return -1;
                if (an <= 0 && bn > 0) return 1;
                return String((a && a.node_name) || '').localeCompare(String((b && b.node_name) || ''), 'zh-Hans-CN');
            });
            return list;
        }

        function probeAvgLatency(item) {
            if (!item || !item.online || !Array.isArray(item.network)) return null;
            let sum = 0;
            let count = 0;
            item.network.forEach((n) => {
                if (!n || !n.available || n.stale) return;
                const lat = networkMetricValue(n.latency_avg_ms);
                if (lat != null) {
                    sum += lat;
                    count += 1;
                }
            });
            return count > 0 ? sum / count : null;
        }

        function probeMonthTraffic(item) {
            const t = item && item.traffic;
            if (!t || !t.available) return 0;
            return Math.max(0, Number(t.month_rx_bytes) || 0) + Math.max(0, Number(t.month_tx_bytes) || 0);
        }

        function probePercentMetric(used, total, fallbackPct) {
            if (typeof used === 'number' && Number.isFinite(used) && used >= 0 && typeof total === 'number' && Number.isFinite(total) && total > 0) {
                return normalizedPercent((used / total) * 100);
            }
            if (typeof fallbackPct === 'number' && Number.isFinite(fallbackPct) && fallbackPct >= 0) {
                return normalizedPercent(fallbackPct);
            }
            return -1;
        }

        function updateLiveIndicator() {
            els.livePill.classList.remove('paused', 'error');
            if (state.lastError) {
                els.livePill.classList.add('error');
                els.liveText.textContent = '连接异常 · 重试中';
                return;
            }
            if (!state.autoRefresh) {
                els.livePill.classList.add('paused');
                const t = state.lastSyncAt ? state.lastSyncAt.toLocaleTimeString('zh-CN', { hour12: false }) : '--:--:--';
                els.liveText.textContent = '已暂停 · ' + t;
                return;
            }
            const t = state.lastSyncAt ? state.lastSyncAt.toLocaleTimeString('zh-CN', { hour12: false }) : '同步中...';
            els.liveText.textContent = state.lastSyncAt ? ('更新于 ' + t) : t;
        }

        function updateKPIs(items) {
            const total = items.length;
            let onlineCount = 0;
            let totalMonthRX = 0;
            let totalMonthTX = 0;
            let trafficNodes = 0;
            let latSum = 0;
            let latCount = 0;
            let alertTasks = 0;

            items.forEach((item) => {
                if (item.online) onlineCount += 1;
                if (item.traffic && item.traffic.available) {
                    trafficNodes += 1;
                    totalMonthRX += Math.max(0, Number(item.traffic.month_rx_bytes) || 0);
                    totalMonthTX += Math.max(0, Number(item.traffic.month_tx_bytes) || 0);
                }
                if (item.online && Array.isArray(item.network)) {
                    item.network.forEach((n) => {
                        if (!n || !n.available || n.stale) return;
                        const lat = networkMetricValue(n.latency_avg_ms);
                        const loss = networkMetricValue(n.loss_percent, 100);
                        if (lat != null) {
                            latSum += lat;
                            latCount += 1;
                        }
                        if ((loss != null && loss > 0) || (lat == null && loss === 100)) {
                            alertTasks += 1;
                        }
                    });
                }
            });

            const offlineCount = total - onlineCount;
            const onlinePct = total > 0 ? Math.round((onlineCount / total) * 100) : 0;

            els.tabProbeBadge.textContent = onlineCount + '/' + total;
            els.cntAll.textContent = String(total);
            els.cntOnline.textContent = String(onlineCount);
            els.cntOffline.textContent = String(offlineCount);

            els.kpiOnline.textContent = onlineCount + ' / ' + total;
            els.kpiOnlinePct.textContent = total > 0 ? (onlinePct + '%') : '—';
            els.kpiOnlineBar.style.width = onlinePct + '%';
            els.kpiOnlineSub.textContent = total === 0
                ? '暂无公开探针'
                : (offlineCount === 0 ? '全部节点在线运行正常' : ('当前 ' + offlineCount + ' 个节点离线'));

            if (latCount > 0) {
                const avgLat = latSum / latCount;
                const q = latencyQuality(avgLat, 0, false, true);
                els.kpiLatency.textContent = avgLat.toFixed(1) + ' ms';
                els.kpiLatency.style.color = q.color;
                els.kpiLatencyGrade.textContent = q.label;
                els.kpiLatencyGrade.style.color = q.color;
                els.kpiLatencySub.textContent = alertTasks > 0
                    ? ('有效任务 ' + latCount + ' 项 · ' + alertTasks + ' 项存在丢包')
                    : ('有效监测任务 ' + latCount + ' 项 · 全部无丢包');
            } else {
                els.kpiLatency.textContent = '—';
                els.kpiLatency.style.color = '#fff';
                els.kpiLatencyGrade.textContent = alertTasks > 0 ? '异常' : '暂无';
                els.kpiLatencyGrade.style.color = alertTasks > 0 ? 'var(--danger)' : 'var(--text-secondary)';
                els.kpiLatencySub.textContent = alertTasks > 0
                    ? (alertTasks + ' 项监测任务全部超时')
                    : '暂无在线节点的有效延迟样本';
            }

            if (trafficNodes > 0) {
                els.kpiTraffic.textContent = formatTrafficBytes(totalMonthRX + totalMonthTX);
                els.kpiTrafficSub.textContent = '↓ ' + formatTrafficBytes(totalMonthRX) + '  ·  ↑ ' + formatTrafficBytes(totalMonthTX);
            } else {
                els.kpiTraffic.textContent = '—';
                els.kpiTrafficSub.textContent = '等待探针上报流量';
            }
        }

        function metricGauge(label, percent, used, total) {
            const capacity = used != null || total != null;
            const hasCapacity = typeof used === 'number' && Number.isFinite(used) && used >= 0
                && typeof total === 'number' && Number.isFinite(total) && total > 0;
            const actual = capacity
                ? (hasCapacity ? normalizedPercent((used / total) * 100) : null)
                : (typeof percent === 'number' && Number.isFinite(percent) && percent >= 0 ? normalizedPercent(percent) : null);
            const value = actual == null ? 0 : actual;
            const centerText = actual == null ? '—' : pct(actual);
            const subText = actual == null
                ? '暂无'
                : (hasCapacity ? (formatUsedBytes(used) + '/' + formatBytes(total)) : '实时负载');
            const title = label + ': ' + (actual == null ? '暂无数据' : pct(actual)) + (hasCapacity ? (' (' + formatUsedBytes(used) + ' / ' + formatBytes(total) + ')') : '');
            return '<div class="metric-gauge" title="' + escapeHTML(title) + '">'
                + '<div class="metric-ring" style="--metric-angle:' + (value * 3.6).toFixed(1) + 'deg;--metric-color:' + usageColor(value) + ';">'
                + '<div class="metric-center mono">' + escapeHTML(centerText) + '</div>'
                + '</div>'
                + '<div class="metric-label">' + escapeHTML(label) + '</div>'
                + '<div class="metric-caption mono">' + escapeHTML(subText) + '</div>'
                + '</div>';
        }

        function renderProbeLatencySection(item, key) {
            const network = Array.isArray(item.network) ? item.network : [];
            const jumpBtn = '<button class="chart-jump-btn" type="button" data-jump-node="' + escapeHTML(key) + '">延迟曲线 ↗</button>';
            if (!network.length) {
                return '<div class="section-box">'
                    + '<div class="section-head"><span class="section-title">网络延迟</span>' + jumpBtn + '</div>'
                    + '<div class="empty-hint">暂未分配网络延迟监测任务</div>'
                    + '</div>';
            }
            const rows = network.map((entry) => {
                const stale = !item.online || entry.stale;
                const q = latencyQuality(entry.latency_avg_ms, entry.loss_percent, stale, entry.available);
                const latText = formatLatencyDisplay(entry.latency_avg_ms, entry.loss_percent, entry.available);
                const loss = networkMetricValue(entry.loss_percent, 100);
                let lossHTML = '<span class="loss-badge muted mono">—</span>';
                if (entry.available && loss != null) {
                    if (loss === 0) {
                        lossHTML = '<span class="loss-badge ok mono" title="本轮无丢包">0%</span>';
                    } else if (loss < 20) {
                        lossHTML = '<span class="loss-badge warn mono" title="本轮丢包率">丢包 ' + loss.toFixed(1) + '%</span>';
                    } else {
                        lossHTML = '<span class="loss-badge bad mono" title="严重丢包">丢包 ' + (loss >= 100 ? '100%' : loss.toFixed(1) + '%') + '</span>';
                    }
                }
                const freshLabel = !entry.available
                    ? '待采样'
                    : (stale ? (item.online ? '已过期' : '离线前') : formatRelativeTime(entry.timestamp));
                const fullTitle = (entry.task_name || entry.task_id || '网络监测')
                    + ' · ' + (entry.available ? (latText + ' / 丢包 ' + (loss == null ? '—' : loss.toFixed(1) + '%')) : '等待监测')
                    + (entry.timestamp ? (' · ' + formatDateTime(entry.timestamp)) : '');
                return '<div class="latency-row' + (stale ? ' stale' : '') + '" style="--q-color:' + q.color + '" title="' + escapeHTML(fullTitle) + '">'
                    + '<div class="latency-task"><span class="q-dot"></span><span class="latency-task-name">' + escapeHTML(entry.task_name || entry.task_id || '网络监测') + '</span></div>'
                    + '<div class="latency-bar-track"><div class="latency-bar-fill" style="width:' + q.barPct.toFixed(0) + '%"></div></div>'
                    + '<span class="latency-val mono">' + escapeHTML(latText) + '</span>'
                    + lossHTML
                    + '<span class="fresh-tag' + (stale && entry.available ? ' warn' : '') + ' mono">' + escapeHTML(freshLabel) + '</span>'
                    + '</div>';
            }).join('');

            return '<div class="section-box" aria-label="探针网络延迟与丢包">'
                + '<div class="section-head"><span class="section-title">网络延迟 <span class="mono" style="color:var(--text-muted)">(' + network.length + ')</span></span>' + jumpBtn + '</div>'
                + '<div class="latency-list">' + rows + '</div>'
                + '</div>';
        }

        function renderProbeTrafficSection(traffic) {
            traffic = traffic || {};
            if (!traffic.available) {
                return '<div class="section-box">'
                    + '<div class="section-head"><span class="section-title">流量统计</span></div>'
                    + '<div class="empty-hint">等待探针上报硬件出口流量</div>'
                    + '</div>';
            }
            const bytes = (v) => Math.max(0, Number(v) || 0);
            const totalRX = bytes(traffic.total_rx_bytes);
            const totalTX = bytes(traffic.total_tx_bytes);
            const monthRX = bytes(traffic.month_rx_bytes);
            const monthTX = bytes(traffic.month_tx_bytes);
            return '<div class="section-box" title="仅统计启用中的硬件出口接口；累计从首次采样起计算">'
                + '<div class="traffic-grid">'
                + '<div class="traffic-box">'
                + '<div class="traffic-label"><span>本月流量</span><span class="mono">每月 ' + (Number(traffic.monthly_start_day) || 1) + ' 日</span></div>'
                + '<div class="traffic-total mono">' + formatTrafficBytes(monthRX + monthTX) + '</div>'
                + '<div class="traffic-io mono"><span class="traffic-rx">↓' + formatTrafficBytes(monthRX) + '</span><span class="traffic-tx">↑' + formatTrafficBytes(monthTX) + '</span></div>'
                + '</div>'
                + '<div class="traffic-box">'
                + '<div class="traffic-label"><span>累计流量</span><span class="mono">总计</span></div>'
                + '<div class="traffic-total mono">' + formatTrafficBytes(totalRX + totalTX) + '</div>'
                + '<div class="traffic-io mono"><span class="traffic-rx">↓' + formatTrafficBytes(totalRX) + '</span><span class="traffic-tx">↑' + formatTrafficBytes(totalTX) + '</span></div>'
                + '</div>'
                + '</div>'
                + '<div class="traffic-foot mono"><span>周期起始: ' + escapeHTML(traffic.period_start || '-') + ' UTC</span><span title="' + escapeHTML(formatDateTime(traffic.updated_at)) + '">更新: ' + escapeHTML(formatRelativeTime(traffic.updated_at)) + '</span></div>'
                + '</div>';
        }

        function getFilteredSortedProbes() {
            const q = state.probeQuery.trim().toLowerCase();
            let list = state.probes.filter((item, idx) => {
                if (state.probeFilter === 'online' && !item.online) return false;
                if (state.probeFilter === 'offline' && item.online) return false;
                if (!q) return true;
                const haystack = [
                    displayNodeName(item, idx),
                    String(nodeNoOf(item) || ''),
                    String(item.vendor_name || ''),
                    formatLocations(item.locations).join(' ')
                ].join(' ').toLowerCase();
                return haystack.includes(q);
            });

            list = list.slice();
            list.sort((a, b) => {
                const sortBy = state.probeSort;
                if (sortBy === 'online' && Boolean(a.online) !== Boolean(b.online)) {
                    return a.online ? -1 : 1;
                }
                if (sortBy === 'latency') {
                    const al = probeAvgLatency(a);
                    const bl = probeAvgLatency(b);
                    if (al != null && bl != null && al !== bl) return al - bl;
                    if (al != null && bl == null) return -1;
                    if (al == null && bl != null) return 1;
                }
                if (sortBy === 'cpu') {
                    const ac = Number((a.system && a.system.cpu_percent) ?? -1);
                    const bc = Number((b.system && b.system.cpu_percent) ?? -1);
                    if (ac !== bc) return bc - ac;
                }
                if (sortBy === 'ram') {
                    const ar = probePercentMetric(a.system && a.system.memory_used_bytes, a.system && a.system.memory_total_bytes, a.system && a.system.memory_used_percent);
                    const br = probePercentMetric(b.system && b.system.memory_used_bytes, b.system && b.system.memory_total_bytes, b.system && b.system.memory_used_percent);
                    if (ar !== br) return br - ar;
                }
                if (sortBy === 'traffic') {
                    const at = probeMonthTraffic(a);
                    const bt = probeMonthTraffic(b);
                    if (at !== bt) return bt - at;
                }
                const an = nodeNoOf(a);
                const bn = nodeNoOf(b);
                if (an > 0 && bn > 0 && an !== bn) return an - bn;
                if (an > 0 && bn <= 0) return -1;
                if (an <= 0 && bn > 0) return 1;
                return String((a && a.node_name) || '').localeCompare(String((b && b.node_name) || ''), 'zh-Hans-CN');
            });
            return list;
        }

        function renderProbesView() {
            if (!state.probesLoaded) {
                els.probeContainer.innerHTML = '<div class="empty-state">正在加载探针状态...</div>';
                return;
            }
            if (!state.probes.length) {
                els.probeContainer.innerHTML = '<div class="empty-state">暂无公开探针数据<small>当探针连接并上报状态后将自动展示在此处</small></div>';
                return;
            }
            const list = getFilteredSortedProbes();
            if (!list.length) {
                els.probeContainer.innerHTML = '<div class="empty-state">没有符合筛选条件的探针<small>请尝试清空搜索词或切换在线状态筛选</small></div>';
                return;
            }

            if (state.probeView === 'list') {
                renderProbesTable(list);
                return;
            }

            els.probeContainer.innerHTML = '<div class="probe-grid">' + list.map((item, index) => {
                const sys = item.system || {};
                const nodeNo = nodeNoOf(item);
                const key = nodeKeyOf(item, index);
                const name = displayNodeName(item, index);
                const statusClass = item.online ? 'online' : 'offline';
                const statusText = item.online ? '在线' : '离线';
                const vendorHTML = formatVendorLink(item.vendor_name, item.vendor_url);
                const locs = formatLocations(item.locations);
                const chips = [];
                if (vendorHTML) chips.push('<span class="meta-chip">' + vendorHTML + '</span>');
                locs.forEach((loc) => chips.push('<span class="meta-chip">' + escapeHTML(loc) + '</span>'));
                const metaRow = chips.length ? '<div class="probe-meta-tags">' + chips.join('') + '</div>' : '';
                const machineUptime = formatMachineUptime(item.machine_uptime_seconds);
                const bootTime = formatDateTime(item.machine_boot_time);
                const lastSeenRel = formatRelativeTime(item.last_seen);
                const lastSeenFull = formatDateTime(item.last_seen);

                return '<article class="probe-card ' + statusClass + '">'
                    + '<div class="probe-head">'
                    + '<div class="probe-title-wrap">'
                    + '<div class="probe-title-row">'
                    + '<span class="status-dot ' + statusClass + '"></span>'
                    + '<div class="probe-name" title="' + escapeHTML(name) + '">' + escapeHTML(name) + '</div>'
                    + (nodeNo > 0 ? '<span class="node-no-tag mono">#' + nodeNo + '</span>' : '')
                    + '</div>'
                    + metaRow
                    + '</div>'
                    + '<span class="status-pill ' + statusClass + '">' + statusText + '</span>'
                    + '</div>'
                    + '<div class="probe-metrics">'
                    + metricGauge('CPU', sys.cpu_percent, null, null)
                    + metricGauge('RAM', sys.memory_used_percent, sys.memory_used_bytes, sys.memory_total_bytes)
                    + metricGauge('SWAP', sys.swap_used_percent, sys.swap_used_bytes, sys.swap_total_bytes)
                    + metricGauge('DISK', sys.disk_used_percent, sys.disk_used_bytes, sys.disk_total_bytes)
                    + '</div>'
                    + renderProbeLatencySection(item, key)
                    + renderProbeTrafficSection(item.traffic)
                    + '<div class="probe-footer mono">'
                    + '<span title="开机时间: ' + escapeHTML(bootTime) + '">运行 ' + escapeHTML(machineUptime) + '</span>'
                    + '<span title="最后上报: ' + escapeHTML(lastSeenFull) + '">心跳 ' + escapeHTML(lastSeenRel) + '</span>'
                    + '</div>'
                    + '</article>';
            }).join('') + '</div>';
        }

        function miniBarHTML(label, percent) {
            const valid = percent >= 0;
            const width = valid ? percent.toFixed(0) : '0';
            const color = valid ? usageColor(percent) : '#475569';
            return '<div class="mini-bar-item">'
                + '<div class="mini-bar-top"><span>' + label + '</span><span class="mono">' + (valid ? percent.toFixed(0) + '%' : '—') + '</span></div>'
                + '<div class="mini-bar-track"><div class="mini-bar-fill" style="width:' + width + '%;background:' + color + '"></div></div>'
                + '</div>';
        }

        function renderProbesTable(list) {
            const rows = list.map((item, index) => {
                const sys = item.system || {};
                const nodeNo = nodeNoOf(item);
                const key = nodeKeyOf(item, index);

                const vendorHTML = formatVendorLink(item.vendor_name, item.vendor_url);

                if (locs.length) subBits.push(escapeHTML(locs.join(' / ')));

                const cpuPct = probePercentMetric(null, null, sys.cpu_percent);
                const ramPct = probePercentMetric(sys.memory_used_bytes, sys.memory_total_bytes, sys.memory_used_percent);
                const diskPct = probePercentMetric(sys.disk_used_bytes, sys.disk_total_bytes, sys.disk_used_percent);

                const network = Array.isArray(item.network) ? item.network : [];
                const latPills = network.length
                    ? '<div class="pill-wrap">' + network.map((entry) => {
                        const stale = !item.online || entry.stale;
                        const q = latencyQuality(entry.latency_avg_ms, entry.loss_percent, stale, entry.available);
                        const latText = formatLatencyDisplay(entry.latency_avg_ms, entry.loss_percent, entry.available);

                            ? ' <span style="color:' + (loss >= 20 ? '#fca5a5' : '#fde047') + '">(' + loss.toFixed(0) + '%丢)</span>'
                            : '';
                        return '<span class="lat-pill' + (stale ? ' stale' : '') + '" style="--q-color:' + q.color + '">'
                            + '<span class="q-dot"></span>'
                            + '<span>' + escapeHTML(entry.task_name || entry.task_id) + '</span>'
                            + '<strong class="mono" style="color:' + q.color + '">' + escapeHTML(latText) + '</strong>'

                    }).join('') + '</div>'
