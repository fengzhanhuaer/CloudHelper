<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CloudHelper TG 助手管理</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-base: #070b12;
      --bg-shell: rgba(13, 19, 30, 0.86);
      --bg-card: rgba(16, 24, 38, 0.82);
      --bg-subtle: rgba(9, 14, 23, 0.78);
      --bg-hover: rgba(28, 41, 64, 0.78);
      --border: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(148, 163, 184, 0.3);
      --text: #e6edf3;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-strong: #2563eb;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --ok: #34d399;
      --ok-soft: rgba(52, 211, 153, 0.14);
      --warn: #facc15;
      --warn-soft: rgba(250, 204, 21, 0.14);
      --err: #f87171;
      --err-soft: rgba(248, 113, 113, 0.14);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--text);
      background-color: var(--bg-base);
      background-image:
        radial-gradient(ellipse 75% 45% at 15% -10%, rgba(56, 189, 248, 0.15), transparent 60%),
        radial-gradient(ellipse 65% 40% at 88% -8%, rgba(52, 211, 153, 0.1), transparent 58%);
      padding: 16px 14px 32px;
      -webkit-font-smoothing: antialiased;
    }
    .mono {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }
    .wrap {
      max-width: 1480px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--bg-shell);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 20px 52px rgba(0, 0, 0, 0.44);
      padding: 18px 20px 22px;
    }

    /* Topbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(37, 99, 235, 0.35));
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #bae6fd;
      flex: 0 0 auto;
    }
    .brand h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }
    .brand .sub {
      margin: 3px 0 0;
      font-size: 12px;
      color: var(--text-sub);
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Buttons */
    .btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text);
      border-radius: var(--radius-sm);
      height: 33px;
      padding: 0 12px;
      font-size: 12.5px;
      font-weight: 500;
      font-family: var(--sans);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .btn:hover:enabled {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn.sm {
      height: 28px;
      padding: 0 9px;
      font-size: 12px;
      border-radius: 6px;
    }
    .btn.primary {
      border-color: rgba(56, 189, 248, 0.5);
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.92), rgba(29, 78, 216, 0.95));
      color: #fff;
    }
    .btn.primary:hover:enabled {
      filter: brightness(1.08);
    }
    .btn.danger {
      border-color: rgba(248, 113, 113, 0.35);
      background: rgba(248, 113, 113, 0.12);
      color: #fca5a5;
    }
    .btn.danger:hover:enabled {
      background: rgba(248, 113, 113, 0.22);
      border-color: rgba(248, 113, 113, 0.55);
    }
    .btn.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-sub);
    }
    .btn.ghost:hover:enabled {
      background: rgba(148, 163, 184, 0.1);
      color: #fff;
    }
    .api-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 33px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text);
      font-size: 12px;
      font-family: var(--sans);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .api-pill:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }
    .api-pill.ok {
      border-color: rgba(52, 211, 153, 0.38);
      color: #a7f3d0;
    }
    .api-pill.warn {
      border-color: rgba(250, 204, 21, 0.45);
      background: rgba(250, 204, 21, 0.08);
      color: #fde047;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: 0 0 auto;
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 6px rgba(52, 211, 153, 0.65); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 6px rgba(250, 204, 21, 0.55); }
    .dot.err { background: var(--err); }
    .dot.muted { background: var(--text-muted); }

    /* Toast */
    .toast-host {
      position: fixed;
      top: 16px;
      right: 18px;
      z-index: 1200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: min(440px, calc(100vw - 32px));
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 13px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: rgba(12, 19, 32, 0.96);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .toast.ok { border-color: rgba(52, 211, 153, 0.5); color: #a7f3d0; }
    .toast.warn { border-color: rgba(250, 204, 21, 0.5); color: #fde047; }
    .toast.err { border-color: rgba(248, 113, 113, 0.55); color: #fecaca; }
    .toast-close {
      border: 0;
      background: transparent;
      color: inherit;
      opacity: 0.7;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0 2px;
    }
    .toast-close:hover { opacity: 1; }

    /* Mode Switch */
    .mode-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }
    .mode-tabs {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
    }
    .mode-tab {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-sub);
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--sans);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-tab:hover { color: var(--text); }
    .mode-tab.active {
      background: var(--accent-soft);
      border-color: rgba(56, 189, 248, 0.36);
      color: #fff;
    }
    .pill-count {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-sub);
    }
    .mode-tab.active .pill-count {
      background: rgba(56, 189, 248, 0.25);
      color: #e0f2fe;
    }
    .tg-panel { display: none; }
    .tg-panel.active { display: block; }

    /* Alert Banner */
    .callout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(250, 204, 21, 0.35);
      background: rgba(250, 204, 21, 0.08);
      color: #fef08a;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .callout.info {
      border-color: rgba(56, 189, 248, 0.28);
      background: rgba(56, 189, 248, 0.08);
      color: #bae6fd;
    }

    /* Two-column Workspace */
    .workspace {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .sidebar {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .sidebar-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }
    .sidebar-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .account-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 64vh;
      overflow-y: auto;
    }
    .account-item {
      appearance: none;
      width: 100%;
      text-align: left;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 9px 10px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: rgba(8, 13, 22, 0.55);
      color: var(--text);
      font-family: var(--sans);
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease;
    }
    .account-item:hover {
      background: var(--bg-hover);
      border-color: var(--border);
    }
    .account-item.active {
      background: rgba(56, 189, 248, 0.13);
      border-color: rgba(56, 189, 248, 0.42);
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      background: var(--av-bg, linear-gradient(135deg, #0284c7, #2563eb));
      flex: 0 0 auto;
    }
    .account-meta { min-width: 0; }
    .account-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .account-name {
      font-size: 13.5px;
      font-weight: 600;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account-sub {
      margin-top: 2px;
      font-size: 11.5px;
      color: var(--text-sub);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account-tags {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .badge.ok { color: #6ee7b7; background: var(--ok-soft); border-color: rgba(52, 211, 153, 0.3); }
    .badge.warn { color: #fde047; background: var(--warn-soft); border-color: rgba(250, 204, 21, 0.32); }
    .badge.err { color: #fca5a5; background: var(--err-soft); border-color: rgba(248, 113, 113, 0.32); }
    .badge.info { color: #7dd3fc; background: var(--accent-soft); border-color: rgba(56, 189, 248, 0.3); }
    .badge.muted { color: var(--text-sub); background: rgba(148, 163, 184, 0.12); border-color: rgba(148, 163, 184, 0.2); }

    /* Main Detail Stage */
    .stage {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .tg-chat-frame-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #070b12;
      height: min(72vh, 760px);
      min-height: 520px;
    }
    .tg-chat-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .account-banner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .account-banner-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .account-banner-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .account-banner-sub {
      margin-top: 3px;
      font-size: 12.5px;
      color: var(--text-sub);
    }
    .subtabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .subtab {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-sub);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--sans);
      cursor: pointer;
    }
    .subtab:hover {
      background: rgba(148, 163, 184, 0.08);
      color: var(--text);
    }
    .subtab.active {
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.35);
      color: #fff;
    }

    /* Section & Cards inside Stage */
    .section-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .section-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .subcard {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .subcard-title {
      font-size: 14px;
      font-weight: 650;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Task Cards */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .task-card {
      background: rgba(11, 17, 28, 0.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      transition: border-color 0.15s ease;
    }
    .task-card:hover { border-color: var(--border-strong); }
    .task-card.disabled { opacity: 0.72; }
    .task-card-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .task-card-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1 1 260px;
    }
    .task-target {
      font-size: 14px;
      font-weight: 650;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .task-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }
    .task-msg {
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(148, 163, 184, 0.06);
      border: 1px solid rgba(148, 163, 184, 0.1);
      color: #dbeafe;
      font-size: 13px;
      line-height: 1.48;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .task-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
    }
    .switch input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .switch-track {
      width: 36px;
      height: 20px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.28);
      border: 1px solid rgba(148, 163, 184, 0.28);
      position: relative;
      transition: background 0.16s ease, border-color 0.16s ease;
      flex: 0 0 auto;
    }
    .switch-track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #e2e8f0;
      transition: transform 0.16s ease, background 0.16s ease;
    }
    .switch input:checked + .switch-track {
      background: rgba(52, 211, 153, 0.35);
      border-color: rgba(52, 211, 153, 0.65);
    }
    .switch input:checked + .switch-track::after {
      transform: translateX(16px);
      background: #34d399;
    }
    .switch input:disabled + .switch-track {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Table */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(8, 13, 22, 0.65);
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
      font-size: 12.5px;
    }
    .data-table th,
    .data-table td {
      text-align: left;
      padding: 9px 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      vertical-align: top;
    }
    .data-table th {
      color: var(--text-sub);
      font-weight: 600;
      font-size: 11.5px;
      background: rgba(15, 23, 38, 0.72);
      white-space: nowrap;
    }
    .data-table tr:last-child td { border-bottom: 0; }
    .cell-pre {
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 340px;
    }

    /* Info Grid & Form Controls */
    .info-kv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .kv-tile {
      padding: 10px 12px;
      border-radius: 9px;
      background: rgba(10, 15, 26, 0.7);
      border: 1px solid var(--border);
    }
    .kv-label {
      font-size: 11.5px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .kv-value {
      font-size: 13.5px;
      font-weight: 600;
      color: #fff;
      word-break: break-word;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .field.full { grid-column: 1 / -1; }
    .field-label {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-sub);
    }
    .field-hint {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.45;
    }
    .input,
    select.input,
    textarea.input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: rgba(7, 11, 18, 0.9);
      color: #fff;
      padding: 8px 10px;
      font-size: 13px;
      font-family: var(--sans);
      outline: none;
      transition: border-color 0.15s ease;
    }
    .input:focus,
    select.input:focus,
    textarea.input:focus {
      border-color: rgba(56, 189, 248, 0.65);
    }
    .input:disabled { opacity: 0.55; }
    select.input option { background: #0d1522; color: var(--text); }
    textarea.input { min-height: 92px; resize: vertical; line-height: 1.45; }
    .token-box {
      min-height: 82px;
      font-family: var(--mono);
      font-size: 12px;
      word-break: break-all;
    }

    /* Schedule Picker & Searchable Target Selector */
    .schedule-builder {
      display: grid;
      grid-template-columns: 140px 130px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }
    .target-picker-box {
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(7, 11, 18, 0.88);
      overflow: hidden;
    }
    .target-picker-head {
      display: flex;
      gap: 6px;
      padding: 8px;
      border-bottom: 1px solid var(--border);
    }
    .target-picker-list {
      max-height: 190px;
      overflow-y: auto;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .target-option {
      appearance: none;
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 7px 9px;
      border-radius: 6px;
      font-size: 12.5px;
      font-family: var(--sans);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .target-option:hover { background: rgba(148, 163, 184, 0.1); }
    .target-option.selected {
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.45);
      color: #fff;
    }
    .target-option-main {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .target-option-sub {
      color: var(--text-muted);
      font-size: 11.5px;
      flex: 0 0 auto;
    }
    .selected-target-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-top: 1px solid var(--border);
      background: rgba(56, 189, 248, 0.06);
      font-size: 12px;
      color: #bae6fd;
    }

    /* Notify Checklist */
    .checklist {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .check-step {
      padding: 11px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: rgba(9, 14, 24, 0.72);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .check-step.ok { border-color: rgba(52, 211, 153, 0.35); }
    .check-step-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 650;
      color: #fff;
    }
    .check-step-desc {
      font-size: 11.5px;
      color: var(--text-sub);
      line-height: 1.4;
    }

    /* Empty State */
    .empty {
      padding: 30px 16px;
      text-align: center;
      border: 1px dashed var(--border-strong);
      border-radius: 10px;
      color: var(--text-sub);
      font-size: 13px;
    }
    .empty small {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Modal */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 13, 0.74);
      backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
      z-index: 1000;
      padding: 14px;
    }
    .modal {
      width: min(680px, 96vw);
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      background: #0e1624;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.62);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal.wide { width: min(860px, 96vw); }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .modal-head h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .modal-foot {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    @media (max-width: 960px) {
      .workspace { grid-template-columns: 1fr; }
      .account-list { max-height: 240px; }
      .checklist { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .schedule-builder { grid-template-columns: 1fr 1fr; }
      .schedule-builder .input:last-child { grid-column: 1 / -1; }
    }
    @media (max-width: 600px) {
      body { padding: 8px 6px 24px; }
      .wrap { padding: 12px; border-radius: 12px; }
      .stage { padding: 12px; }
      .modal { padding: 14px; }
    }
  </style>
</head>
<body>
  <div id="toast-host" class="toast-host" aria-live="polite"></div>

  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13"/>
            <path d="M22 2L15 22L11 13L2 9L22 2Z"/>
          </svg>
        </div>
        <div>
          <h1>TG 助手</h1>
          <p class="sub">共享 API Key · 账号与登录 · 任务管理 · Bot 管理与主控通知</p>
        </div>
      </div>
      <!-- mng-quick-nav -->
      <div class="top-actions">
        <button id="btn-api-pill" class="api-pill warn" type="button" title="配置共享 Telegram API ID / API Hash">
          <span class="dot warn" id="api-pill-dot"></span>
          <span id="api-pill-text">检查 API 状态...</span>
        </button>
        <button id="btn-refresh-all" class="btn" type="button" title="刷新账号授权状态与通知配置">刷新状态</button>
        <button id="btn-logout" class="btn ghost" type="button">退出登录</button>
      </div>
    </header>

    <div id="api-banner"></div>

    <div class="mode-bar">
      <div class="mode-tabs" role="tablist" aria-label="TG 助手工作区">
        <button class="mode-tab active" data-panel-tab="assistant" type="button" role="tab" aria-selected="true">
          账号与任务 <span id="badge-accounts" class="pill-count mono">0</span>
        </button>
        <button class="mode-tab" data-panel-tab="notify" type="button" role="tab" aria-selected="false">
          主控通知 <span id="badge-notify" class="pill-count">未就绪</span>
        </button>
      </div>
    </div>

    <!-- Workspace 1: Accounts & Tasks -->
    <section class="tg-panel active" data-panel-content="assistant" role="tabpanel">
      <div class="workspace">
        <aside class="sidebar" aria-label="账号与登录列表">
          <div class="sidebar-head">
            <span class="sidebar-title">账号与登录</span>
            <button id="btn-refresh-accounts" class="btn sm ghost" type="button" title="重新校验所有账号授权状态">校验状态</button>
          </div>
          <div class="sidebar-actions">
            <button id="btn-login-account" class="btn sm primary" type="button">+ 手机号登录</button>
            <button id="btn-token-login" class="btn sm" type="button">Token 导入</button>
          </div>
          <div id="account-list" class="account-list">
            <div class="empty">正在加载账号...</div>
          </div>
        </aside>

        <main id="account-stage" class="stage">
          <div class="empty">正在初始化 TG 助手...</div>
        </main>
      </div>
    </section>

    <!-- Workspace 2: Controller Notifications -->
    <section class="tg-panel" data-panel-content="notify" role="tabpanel">
      <div id="notify-stage" class="stage">
        <div class="empty">正在加载主控通知配置...</div>
      </div>
    </section>
  </div>

  <div id="modal-root"></div>

  <script>
    const state = {
      loading: false,
      scheduleLoading: false,
      pendingLoading: false,
      targetRefreshing: false,
      botLoading: false,
      scheduleHistoryLoading: false,

      api: { api_id: 0, api_hash: '', configured: false },
      accounts: [],
      selectedAccountID: '',
      activePanelTab: 'assistant',
      activeSubTab: 'scheduled-send',
      showSessionToken: false,
      showPendingQueue: true,

      accountCache: {},

      scheduleHistoryItems: [],
      scheduleHistoryTaskID: '',

      notify: {
        overview: null,
        loading: false,
      },

      modal: {
        apiKey: false,
        addAccount: false,
        tokenLogin: false,
        scheduleTask: false,
        scheduleHistory: false,
      },

      draft: {
        apiKeyID: '',
        apiKeyHash: '',

        addAccountLabel: '',
        addAccountPhone: '',
        loginCode: '',
        loginPassword: '',
        inlineLoginCode: '',
        inlineLoginPassword: '',

        tokenLoginLabel: '',
        tokenLoginSessionToken: '',

        scheduleEditingTaskID: '',
        scheduleEnabled: true,
        scheduleTarget: '',
        scheduleTargetSearch: '',
        scheduleFreq: '每天',
        scheduleClock: '09:00',
        scheduleSendAt: '每天 09:00',
        scheduleMessage: '',
        scheduleDelayMax: '0',

        botMode: 'polling',
        botAPIKey: '',
        botTestMessage: 'ping from CloudHelper bot',
      },
      scheduleReqSeq: 0,
    };

    const qs = (id) => document.getElementById(id);

    function escapeHTML(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      })[ch]);
    }

    function showToast(message, level = 'info') {
      const host = qs('toast-host');
      if (!host) return;
      const el = document.createElement('div');
      el.className = 'toast' + (level && level !== 'info' ? ' ' + level : '');
      const text = document.createElement('div');
      text.textContent = String(message || '');
      const close = document.createElement('button');
      close.type = 'button';
      close.className = 'toast-close';
      close.innerHTML = '&times;';
      close.setAttribute('aria-label', '关闭提示');
      close.addEventListener('click', () => el.remove());
      el.appendChild(text);
      el.appendChild(close);
      host.appendChild(el);
      while (host.children.length > 4) host.firstElementChild.remove();
      if (level === 'ok' || level === 'info') {
        window.setTimeout(() => { if (el.parentNode) el.remove(); }, 3400);
      }
    }

    async function requestJSON(url, options = {}) {
      const response = await fetch(url, { credentials: 'same-origin', ...options });
      let payload = {};
      try { payload = await response.json(); } catch (_) {}
      if (!response.ok) {
        const msg = payload && payload.error ? payload.error : `HTTP ${response.status}`;
        throw new Error(msg);
      }
      return payload;
    }

    function getAccountBucket(accountID) {
      const key = String(accountID || '').trim();
      if (!key) {
        return { schedules: [], pending: [], targets: [], bot: { api_key: '', configured: false, mode: 'polling', webhook_path: '', webhook_enabled: false }, loaded: false };
      }
      if (!state.accountCache[key]) {
        state.accountCache[key] = {
          schedules: [],
          pending: [],
          targets: [],
          bot: { api_key: '', configured: false, mode: 'polling', webhook_path: '', webhook_enabled: false },
          loaded: false,
        };
      }
      return state.accountCache[key];
    }

    function getSelectedAccount() {
      return state.accounts.find((item) => item && item.id === state.selectedAccountID) || null;
    }

    function getLoggedInAccounts() {
      return state.accounts.filter((item) => item && item.authorized);
    }

    function syncSelectedAccount() {
      if (state.accounts.length === 0) {
        state.selectedAccountID = '';
        return;
      }
      if (state.accounts.some((item) => item && item.id === state.selectedAccountID)) {
        return;
      }
      const firstAuthed = getLoggedInAccounts()[0];
      state.selectedAccountID = firstAuthed ? firstAuthed.id : state.accounts[0].id;
    }

    function normalizePhone(raw) {
      return String(raw || '').trim().replace(/[^+\d]/g, '');
    }

    function formatDateTime(raw) {
      const value = String(raw || '').trim();
      if (!value) return '-';
      const dt = new Date(value);
      if (Number.isNaN(dt.getTime())) return value;
      return dt.toLocaleString('zh-CN', { hour12: false });
    }

    function formatCountdown(raw) {
      const ts = Date.parse(String(raw || ''));
      if (!Number.isFinite(ts)) return '';
      const diffSec = Math.round((ts - Date.now()) / 1000);
      if (diffSec <= 0) return '即将执行';
      if (diffSec < 60) return `${diffSec}秒后`;
      if (diffSec < 3600) return `${Math.floor(diffSec / 60)}分钟后`;
      if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}小时${Math.floor((diffSec % 3600) / 60)}分后`;
      return `${Math.floor(diffSec / 86400)}天后`;
    }

    function formatTargetType(type) {
      if (type === 'user') return '私聊';
      if (type === 'chat') return '群组';
      if (type === 'channel') return '频道';
      return type || '会话';
    }

    function avatarGradient(seed) {
      const palette = [
        'linear-gradient(135deg, #0284c7, #2563eb)',
        'linear-gradient(135deg, #059669, #0d9488)',
        'linear-gradient(135deg, #7c3aed, #4f46e5)',
        'linear-gradient(135deg, #d97706, #ea580c)',
        'linear-gradient(135deg, #db2777, #9333ea)',
      ];
      let hash = 0;
      const text = String(seed || '');
      for (let i = 0; i < text.length; i += 1) hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      return palette[Math.abs(hash) % palette.length];
    }

    function renderTargetLabel(accountID, targetID) {
      const id = String(targetID || '').trim();
      if (!id) return '-';
      const bucket = getAccountBucket(accountID);
      const hit = bucket.targets.find((item) => item && item.id === id);
      if (!hit) return id;
      const name = String(hit.name || id).trim();
      const user = String(hit.username || '').trim();
      return user ? `${name} (@${user})` : name;
    }

    function parseSendAtToBuilder(expr) {
      const raw = String(expr || '').trim();
      const m = raw.match(/^(每天|每周[一二三四五六日天])\s+(\d{1,2}):(\d{2})$/);
      if (!m) return { freq: '每天', clock: '09:00', matched: false };
      const freq = m[1] === '每周天' ? '每周日' : m[1];
      const hh = String(Math.min(23, Math.max(0, Number(m[2]) || 0))).padStart(2, '0');
      const mm = String(Math.min(59, Math.max(0, Number(m[3]) || 0))).padStart(2, '0');
      return { freq, clock: `${hh}:${mm}`, matched: true };
    }

    function openTGSessionWindow(account) {
      if (!account || !account.authorized) {
        showToast('请先选择一个已登录账号', 'warn');
        return;
      }
      const url = `${window.location.origin}/mng/tg/session?account_id=${encodeURIComponent(account.id)}`;
      const name = `cloudhelper_tg_sessions_${String(account.id || '').replace(/[^a-zA-Z0-9_-]/g, '_')}`;
      window.open(url, name, 'noopener,noreferrer,width=1280,height=860');
    }

    /* ================= Render Top Chrome ================= */
    function renderHeaderChrome() {
      const pill = qs('btn-api-pill');
      const dot = qs('api-pill-dot');
      const text = qs('api-pill-text');
      const banner = qs('api-banner');

      if (state.api.configured) {
        pill.className = 'api-pill ok';
        dot.className = 'dot ok';
        text.textContent = `共享 API 已配置 (${state.api.api_id})`;
        banner.innerHTML = '';
      } else {
        pill.className = 'api-pill warn';
        dot.className = 'dot warn';
        text.textContent = '未配置共享 API Key';
        banner.innerHTML = `
          <div class="callout">
            <span>尚未配置共享 Telegram API Key（API ID / API Hash），请先完成配置后再添加或登录账号。</span>
            <button class="btn sm primary" data-action="open-api-modal" type="button">立即设置 API Key</button>
          </div>
        `;
        const b = banner.querySelector('[data-action="open-api-modal"]');
        if (b) b.addEventListener('click', openAPIKeyModal);
      }

      qs('btn-login-account').disabled = state.loading || !state.api.configured;
      qs('btn-token-login').disabled = state.loading || !state.api.configured;
      qs('btn-refresh-accounts').disabled = state.loading;
      qs('btn-refresh-all').disabled = state.loading;

      const authedCount = getLoggedInAccounts().length;
      qs('badge-accounts').textContent = `${authedCount}/${state.accounts.length}`;

      const ov = state.notify.overview;
      const notifyBadge = qs('badge-notify');
      if (ov && ov.ready) {
        notifyBadge.textContent = '已就绪';
        notifyBadge.style.color = '#6ee7b7';
      } else {
        notifyBadge.textContent = '未就绪';
        notifyBadge.style.color = '';
      }
    }

    function renderPanelTabs() {
      const active = state.activePanelTab === 'notify' ? 'notify' : 'assistant';
      state.activePanelTab = active;
      document.querySelectorAll('[data-panel-tab]').forEach((btn) => {
        const matched = btn.getAttribute('data-panel-tab') === active;
        btn.classList.toggle('active', matched);
        btn.setAttribute('aria-selected', matched ? 'true' : 'false');
      });
      document.querySelectorAll('[data-panel-content]').forEach((panel) => {
        panel.classList.toggle('active', panel.getAttribute('data-panel-content') === active);
      });
    }

    /* ================= Render Sidebar & Account Stage ================= */
    function renderAccountSidebar() {
      const listEl = qs('account-list');
      if (!listEl) return;
      if (state.accounts.length === 0) {
        listEl.innerHTML = '<div class="empty">暂无 TG 账号<small>点击上方「手机号登录」或「Token 导入」添加</small></div>';
        return;
      }
      const notifyAccountID = state.notify.overview && state.notify.overview.settings ? state.notify.overview.settings.notify_account_id : '';
      listEl.innerHTML = state.accounts.map((item) => {
        const active = item.id === state.selectedAccountID ? ' active' : '';
        const phone = String(item.self_phone || item.phone || '').trim();
        const name = String(item.label || item.self_display_name || phone || item.id).trim();
        const initial = name ? name.slice(0, 1).toUpperCase() : 'T';
        const statusBadge = item.authorized
          ? '<span class="badge ok">已登录</span>'
          : (item.pending_code ? '<span class="badge warn">待验证</span>' : '<span class="badge muted">未登录</span>');
        const notifyBadge = notifyAccountID && notifyAccountID === item.id
          ? '<span class="badge info">通知号</span>'
          : '';
        const sub = item.self_username ? `${phone} · @${item.self_username}` : (phone || item.id);
        return `
          <button type="button" class="account-item${active}" data-action="select-account" data-account-id="${escapeHTML(item.id)}">
            <div class="avatar" style="--av-bg:${avatarGradient(item.id)}">${escapeHTML(initial)}</div>
            <div class="account-meta">
              <div class="account-name-row">
                <span class="account-name" title="${escapeHTML(name)}">${escapeHTML(name)}</span>
              </div>
              <div class="account-sub mono">${escapeHTML(sub)}</div>
              <div class="account-tags">${statusBadge}${notifyBadge}</div>
            </div>
          </button>
        `;
      }).join('');

      listEl.querySelectorAll('[data-action="select-account"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = String(btn.getAttribute('data-account-id') || '').trim();
          if (!id || id === state.selectedAccountID) return;
          selectAccount(id);
        });
      });
    }

    function selectAccount(accountID) {
      state.selectedAccountID = accountID;
      state.showSessionToken = false;
      state.draft.inlineLoginCode = '';
      state.draft.inlineLoginPassword = '';
      syncBotDraftFromAccount(accountID);
      renderAccountSidebar();
      renderAccountStage();
      const acc = getSelectedAccount();
      if (acc && acc.authorized) {
        ensureAccountDataLoaded(acc.id, false);
      }
    }

    function syncBotDraftFromAccount(accountID) {
      const bucket = getAccountBucket(accountID);
      state.draft.botMode = bucket.bot.mode === 'webhook' ? 'webhook' : 'polling';
      state.draft.botAPIKey = bucket.bot.api_key || '';
    }

    function renderAccountStage() {
      const stage = qs('account-stage');
      if (!stage) return;
      const account = getSelectedAccount();

      if (!account) {
        stage.innerHTML = `
          <div class="empty">
            还没有选择或添加任何 Telegram 账号
            <small>${state.api.configured ? '请点击左侧「+ 手机号登录」或「Token 导入」开始使用任务管理与 Bot 管理。' : '请先点击右上角配置共享 API Key，再添加 Telegram 账号。'}</small>
            <div style="margin-top:14px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
              ${state.api.configured
                ? '<button class="btn primary" data-action="open-add-account" type="button">+ 手机号登录</button><button class="btn" data-action="open-token-login" type="button">Token 导入</button>'
                : '<button class="btn primary" data-action="open-api-modal" type="button">设置共享 API Key</button>'}
            </div>
          </div>
        `;
        bindStageEvents();
        return;
      }

      const phone = String(account.self_phone || account.phone || '').trim();
      const name = String(account.label || account.self_display_name || phone || account.id).trim();
      const initial = name ? name.slice(0, 1).toUpperCase() : 'T';
      const statusBadge = account.authorized
        ? '<span class="badge ok">已登录</span>'
        : (account.pending_code ? '<span class="badge warn">等待验证码</span>' : '<span class="badge muted">未登录</span>');
      const subParts = [phone];
      if (account.self_display_name) subParts.push(account.self_display_name);
      if (account.self_username) subParts.push('@' + account.self_username);

      const bannerHTML = `
        <div class="account-banner">
          <div class="account-banner-left">
            <div class="avatar" style="width:42px;height:42px;font-size:16px;--av-bg:${avatarGradient(account.id)}">${escapeHTML(initial)}</div>
            <div style="min-width:0">
              <div class="account-banner-title">${escapeHTML(name)} ${statusBadge}</div>
              <div class="account-banner-sub mono">${escapeHTML(subParts.filter(Boolean).join(' · ') || account.id)}</div>
            </div>
          </div>
          <div class="section-group">
            ${account.authorized ? '<button class="btn primary" data-action="open-sessions" type="button">打开 TG 会话 ↗</button>' : ''}
            ${account.authorized ? `<button class="btn" data-action="logout-account" type="button" ${state.loading ? 'disabled' : ''}>登出</button>` : ''}
            <button class="btn danger" data-action="remove-account" type="button" ${state.loading ? 'disabled' : ''}>删除账号</button>
          </div>
        </div>
      `;

      // Unauthorized / pending verification inline workflow
      if (!account.authorized) {
        stage.innerHTML = bannerHTML + `
          <div class="subcard">
            <div class="subcard-title">
              <span>完成账号登录</span>
              <span class="badge ${account.pending_code ? 'warn' : 'muted'}">${account.pending_code ? '已发送验证码，请填写完成验证' : '尚未发送验证码'}</span>
            </div>
            <div class="field-hint">点击「发送验证码」后，查看 Telegram 官方消息或短信中的验证码；若账号开启了两步验证（2FA），请一并填写密码。</div>
            <div class="form-grid">
              <div class="field">
                <label class="field-label" for="inline-login-code">验证码</label>
                <input id="inline-login-code" class="input mono" value="${escapeHTML(state.draft.inlineLoginCode)}" placeholder="输入 Telegram 验证码" ${state.loading || !account.pending_code ? 'disabled' : ''}>
              </div>
              <div class="field">
                <label class="field-label" for="inline-login-password">2FA 两步验证密码（如已开启）</label>
                <input id="inline-login-password" class="input" type="password" value="${escapeHTML(state.draft.inlineLoginPassword)}" placeholder="未开启可留空" ${state.loading || !account.pending_code ? 'disabled' : ''}>
              </div>
            </div>
            <div class="section-group">
              <button class="btn" data-action="inline-send-code" type="button" ${state.loading || !state.api.configured ? 'disabled' : ''}>${account.pending_code ? '重新发送验证码' : '发送验证码'}</button>
              <button class="btn primary" data-action="inline-sign-in" type="button" ${state.loading || !account.pending_code ? 'disabled' : ''}>验证并登录</button>
            </div>
          </div>
        `;
        bindStageEvents();
        return;
      }

      const bucket = getAccountBucket(account.id);
      const enabledCount = bucket.schedules.filter((t) => t && t.enabled).length;
      const subtabsHTML = `
        <div class="subtabs" role="tablist">
          <button class="subtab${state.activeSubTab === 'sessions' ? ' active' : ''}" data-action="switch-subtab" data-subtab="sessions" type="button">
            TG 对话
          </button>
          <button class="subtab${state.activeSubTab === 'scheduled-send' ? ' active' : ''}" data-action="switch-subtab" data-subtab="scheduled-send" type="button">
            任务管理 <span class="pill-count mono">${enabledCount}/${bucket.schedules.length}</span>
          </button>
          <button class="subtab${state.activeSubTab === 'tg-bot' ? ' active' : ''}" data-action="switch-subtab" data-subtab="tg-bot" type="button">
            Bot 管理 <span class="pill-count">${bucket.bot.configured ? '已配置' : '未配置'}</span>
          </button>
          <button class="subtab${state.activeSubTab === 'basic-info' ? ' active' : ''}" data-action="switch-subtab" data-subtab="basic-info" type="button">
            基础信息
          </button>
        </div>
      `;

      let contentHTML = '';
      if (state.activeSubTab === 'sessions') {
        const frameURL = `/mng/tg/session?account_id=${encodeURIComponent(account.id)}&embed=1`;
        contentHTML = `
          <div class="tg-chat-frame-wrap">
            <iframe class="tg-chat-frame" src="${escapeHTML(frameURL)}" title="TG 对话"></iframe>
          </div>
        `;
      } else if (state.activeSubTab === 'tg-bot') {
        contentHTML = renderBotTab(account, bucket);
      } else if (state.activeSubTab === 'basic-info') {
        contentHTML = renderBasicInfoTab(account, bucket);
      } else {
        contentHTML = renderScheduleTab(account, bucket);
      }

      stage.innerHTML = bannerHTML + subtabsHTML + contentHTML;
      bindStageEvents();
    }

    function renderScheduleTab(account, bucket) {
      const busy = state.loading || state.scheduleLoading;
      let tasksHTML = '';
      if (bucket.schedules.length === 0) {
        tasksHTML = '<div class="empty">当前账号还没有定时发送任务<small>点击「+ 新建定时任务」创建每日或每周自动发送任务</small></div>';
      } else {
        tasksHTML = '<div class="task-list">' + bucket.schedules.map((task) => {
          const targetLabel = renderTargetLabel(account.id, task.target);
          const delayMax = Number(task.delay_max_sec || 0);
          const isScheduledSend = task.task_type === 'scheduled_send';
          return `
            <div class="task-card${task.enabled ? '' : ' disabled'}">
              <div class="task-card-top">
                <div class="task-card-left">
                  <label class="switch" title="${task.enabled ? '点击停用任务' : '点击启用任务'}">
                    <input type="checkbox" data-action="toggle-task" data-task-id="${escapeHTML(task.id)}" ${task.enabled ? 'checked' : ''} ${busy ? 'disabled' : ''}>
                    <span class="switch-track"></span>
                  </label>
                  <div style="min-width:0">
                    <div class="task-target" title="${escapeHTML(targetLabel)}">${escapeHTML(targetLabel)}</div>
                    <div class="task-badges">
                      <span class="badge info mono">${escapeHTML(task.send_at || '未设时间')}</span>
                      ${delayMax > 0 ? `<span class="badge muted mono">随机延时 0–${delayMax}s</span>` : ''}
                      <span class="badge ${task.enabled ? 'ok' : 'muted'}">${task.enabled ? '已启用' : '已停用'}</span>
                    </div>
                  </div>
                </div>
                <div class="task-actions">
                  <button class="btn sm" data-action="edit-task" data-task-id="${escapeHTML(task.id)}" type="button" ${busy || !isScheduledSend ? 'disabled' : ''}>编辑</button>
                  <button class="btn sm" data-action="send-now" data-task-id="${escapeHTML(task.id)}" type="button" ${busy || !isScheduledSend ? 'disabled' : ''}>立即发送</button>
                  <button class="btn sm" data-action="task-history" data-task-id="${escapeHTML(task.id)}" type="button" ${busy ? 'disabled' : ''}>记录</button>
                  <button class="btn sm danger" data-action="remove-task" data-task-id="${escapeHTML(task.id)}" type="button" ${busy ? 'disabled' : ''}>删除</button>
                </div>
              </div>
              <div class="task-msg">${escapeHTML(task.message || '（空消息）')}</div>
            </div>
          `;
        }).join('') + '</div>';
      }

      let pendingHTML = '';
      if (state.showPendingQueue) {
        if (bucket.pending.length === 0) {
          pendingHTML = '<div class="field-hint">当前没有待执行的调度任务。</div>';
        } else {
          pendingHTML = `
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>发送目标</th>
                    <th>计划规则</th>
                    <th>下一次执行</th>
                    <th>内容预览</th>
                    <th>状态</th>
                  </tr>
                </thead>
                <tbody>
                  ${bucket.pending.map((item) => {
                    const countdown = formatCountdown(item.next_run_at);
                    const statusBadge = !item.task_exists
                      ? '<span class="badge err">任务不存在</span>'
                      : (item.enabled ? '<span class="badge ok">待执行</span>' : '<span class="badge muted">已停用</span>');
                    return `
                      <tr>
                        <td><strong>${escapeHTML(renderTargetLabel(account.id, item.target))}</strong><div class="field-hint mono">${escapeHTML(item.task_id || '')}</div></td>
                        <td class="mono">${escapeHTML(item.send_at || '-')}${Number(item.delay_sec || 0) > 0 ? `<div class="field-hint">+${item.delay_sec}s 延时</div>` : ''}</td>
                        <td class="mono">${escapeHTML(formatDateTime(item.next_run_at))}${countdown ? `<div class="field-hint" style="color:#7dd3fc">${escapeHTML(countdown)}</div>` : ''}</td>
                        <td><div class="cell-pre">${escapeHTML(item.message || '-')}</div></td>
                        <td>${statusBadge}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `;
        }
      }

      return `
        <div class="section-toolbar">
          <div class="section-group">
            <button class="btn primary" data-action="open-add-task" type="button" ${busy || state.targetRefreshing ? 'disabled' : ''}>+ 新建定时任务</button>
            <button class="btn" data-action="refresh-targets" type="button" ${busy || state.targetRefreshing ? 'disabled' : ''}>${state.targetRefreshing ? '同步会话中...' : `同步发送对象 (${bucket.targets.length})`}</button>
          </div>
          <div class="section-group">
            <button class="btn sm" data-action="refresh-pending" type="button" ${busy || state.pendingLoading ? 'disabled' : ''}>${state.pendingLoading ? '刷新中...' : '刷新待执行队列'}</button>
          </div>
        </div>
        ${tasksHTML}
        <div class="subcard">
          <div class="subcard-title">
            <span>待执行队列 <span class="pill-count mono">${bucket.pending.length}</span></span>
            <button class="btn sm ghost" data-action="toggle-pending" type="button">${state.showPendingQueue ? '收起' : '展开'}</button>
          </div>
          ${pendingHTML}
        </div>
      `;
    }

    function renderBotTab(account, bucket) {
      const bot = bucket.bot;
      const busy = state.loading || state.botLoading;
      return `
        <div class="form-grid">
          <div class="subcard">
            <div class="subcard-title">
              <span>TG BOT 配置</span>
              <span class="badge ${bot.configured ? 'ok' : 'muted'}">${bot.configured ? '已配置' : '未配置'}</span>
            </div>
            <div class="field">
              <label class="field-label" for="inline-bot-mode">接收模式</label>
              <select id="inline-bot-mode" class="input" ${busy ? 'disabled' : ''}>
                <option value="polling" ${state.draft.botMode === 'polling' ? 'selected' : ''}>getUpdates（长轮询，无需公网回调）</option>
                <option value="webhook" ${state.draft.botMode === 'webhook' ? 'selected' : ''}>webhook（HTTPS 回调）</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="inline-bot-key">BOT API Key</label>
              <input id="inline-bot-key" class="input mono" value="${escapeHTML(state.draft.botAPIKey)}" placeholder="来自 @BotFather，例如 123456789:AA..." ${busy ? 'disabled' : ''}>
              <div class="field-hint">向 @BotFather 申请 Bot Token 并保存；如需接收掉线通知与续费提醒，保存后在「主控通知」选择此账号即可。</div>
            </div>
            ${bot.mode === 'webhook' ? `<div class="field-hint mono">Webhook 回调路径：${escapeHTML(bot.webhook_path || '-')}（${bot.webhook_enabled ? '已启用' : '未启用'}）</div>` : ''}
            <div class="section-group">
              <button class="btn primary" data-action="save-bot-key" type="button" ${busy ? 'disabled' : ''}>${state.botLoading ? '保存中...' : '保存 BOT 配置'}</button>
              <button class="btn" data-action="refresh-bot" type="button" ${busy ? 'disabled' : ''}>刷新</button>
              <button class="btn ghost" data-action="goto-notify" type="button">前往主控通知 →</button>
            </div>
          </div>

          <div class="subcard">
            <div class="subcard-title">
              <span>测试 BOT 发送</span>
              <span class="badge info">私聊推送验证</span>
            </div>
            <div class="field">
              <label class="field-label" for="tg-bot-test-message">测试消息内容</label>
              <textarea id="tg-bot-test-message" class="input" ${busy ? 'disabled' : ''}>${escapeHTML(state.draft.botTestMessage)}</textarea>
              <div class="field-hint">该 BOT 会向当前登录账号发送私聊消息；需先在 Telegram 中给该 BOT 发送过 /start。</div>
            </div>
            <div class="section-group">
              <button class="btn primary" data-action="test-bot-send" type="button" ${busy || !bot.configured ? 'disabled' : ''}>发送测试消息</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderBasicInfoTab(account, bucket) {
      const token = String(account.session_token || '');
      return `
        <div class="info-kv-grid">
          <div class="kv-tile"><div class="kv-label">账号备注</div><div class="kv-value">${escapeHTML(account.label || '-')}</div></div>
          <div class="kv-tile"><div class="kv-label">手机号</div><div class="kv-value mono">${escapeHTML(account.self_phone || account.phone || '-')}</div></div>
          <div class="kv-tile"><div class="kv-label">Telegram 显示名</div><div class="kv-value">${escapeHTML(account.self_display_name || '-')}</div></div>
          <div class="kv-tile"><div class="kv-label">用户名</div><div class="kv-value mono">${account.self_username ? '@' + escapeHTML(account.self_username) : '-'}</div></div>
          <div class="kv-tile"><div class="kv-label">最近登录时间</div><div class="kv-value mono">${escapeHTML(formatDateTime(account.last_login_at))}</div></div>
          <div class="kv-tile"><div class="kv-label">缓存会话对象</div><div class="kv-value mono">${bucket.targets.length} 个</div></div>
        </div>
        <div class="subcard">
          <div class="subcard-title">
            <span>Session Token（敏感凭据）</span>
            <div class="section-group">
              <button class="btn sm" data-action="toggle-token" type="button">${state.showSessionToken ? '隐藏 Token' : '显示 Token'}</button>
              <button class="btn sm" data-action="copy-token" type="button" ${token ? '' : 'disabled'}>复制 Token</button>
            </div>
          </div>
          ${state.showSessionToken
            ? `<textarea class="input token-box" readonly>${escapeHTML(token || '-')}</textarea>`
            : '<div class="field-hint">已默认隐藏 base64 编码的 gotd session 内容，可用于迁移到其他主控的「Token 导入」，请勿泄露。</div>'}
        </div>
      `;
    }

    /* ================= Render Notify Panel ================= */
    function renderNotifyStage() {
      const host = qs('notify-stage');
      if (!host) return;
      const ov = state.notify.overview;
      const settings = (ov && ov.settings) || {
        notify_account_id: '',
        enable_offline: false,
        enable_renewal: false,
        offline_debounce_sec: 60,
        renewal_check_hour: 9,
        renewal_thresholds: [7, 3, 1],
      };
      const authed = getLoggedInAccounts();
      const thresholds = Array.isArray(settings.renewal_thresholds) ? settings.renewal_thresholds.join(' / ') : '7 / 3 / 1';
      const busy = state.notify.loading;

      const step1OK = !!(ov && ov.account_authorized);
      const step2OK = !!(ov && ov.bot_configured);
      const step3OK = !!(ov && ov.ready);

      host.innerHTML = `
        <div class="account-banner" style="padding-bottom:12px">
          <div>
            <div class="account-banner-title">主控通知与 Bot 指令</div>
            <div class="account-banner-sub">节点掉线通知、订阅到期续费提醒，以及私聊控制指令（<code>/status</code>、<code>/upgrade &lt;编号&gt;</code>、<code>/upgrade_all</code>）。</div>
          </div>
          <span class="badge ${step3OK ? 'ok' : 'warn'}">${step3OK ? '通知通道就绪' : '尚未就绪'}</span>
        </div>

        <div class="checklist">
          <div class="check-step ${step1OK ? 'ok' : ''}">
            <div class="check-step-head"><span>1. 选择已授权账号</span><span class="badge ${step1OK ? 'ok' : 'muted'}">${step1OK ? '已完成' : '待配置'}</span></div>
            <div class="check-step-desc">用于接收私聊通知与认证身份${ov && ov.account_label ? `（当前：${escapeHTML(ov.account_label)}）` : ''}。</div>
          </div>
          <div class="check-step ${step2OK ? 'ok' : ''}">
            <div class="check-step-head"><span>2. 配置该账号 BOT</span><span class="badge ${step2OK ? 'ok' : 'muted'}">${step2OK ? '已完成' : '待配置'}</span></div>
            <div class="check-step-desc">在对应账号的「Bot 管理」保存 @BotFather Token（长轮询无需公网）。</div>
          </div>
          <div class="check-step ${step3OK ? 'ok' : ''}">
            <div class="check-step-head"><span>3. 开启推送与测试</span><span class="badge ${step3OK ? 'ok' : 'muted'}">${step3OK ? '可推送' : '未就绪'}</span></div>
            <div class="check-step-desc">${ov && ov.last_push ? `最近推送：${escapeHTML(ov.last_push.action || '')} · ${ov.last_push.success ? '成功' : '失败'} · ${escapeHTML(formatDateTime(ov.last_push.time))}` : '保存下方开关后可点击「测试推送」验证。'}</div>
          </div>
        </div>

        <div class="subcard">
          <div class="form-grid">
            <div class="field">
              <label class="field-label" for="notify-account-select">主控通知账号</label>
              <select id="notify-account-select" class="input" ${busy ? 'disabled' : ''}>
                <option value="">未选择</option>
                ${authed.map((item) => `<option value="${escapeHTML(item.id)}" ${item.id === settings.notify_account_id ? 'selected' : ''}>${escapeHTML(item.label || item.id)} (${escapeHTML(item.self_phone || item.phone || '')})</option>`).join('')}
              </select>
              <div class="field-hint">仅展示已登录授权的账号；请确保该账号已配置 BOT API Key。</div>
            </div>
            <div class="field">
              <label class="field-label">推送开关</label>
              <div style="display:flex;flex-wrap:wrap;gap:18px;padding-top:6px">
                <label class="switch">
                  <input id="notify-enable-offline" type="checkbox" ${settings.enable_offline ? 'checked' : ''} ${busy ? 'disabled' : ''}>
                  <span class="switch-track"></span>
                  <span>探针掉线通知</span>
                </label>
                <label class="switch">
                  <input id="notify-enable-renewal" type="checkbox" ${settings.enable_renewal ? 'checked' : ''} ${busy ? 'disabled' : ''}>
                  <span class="switch-track"></span>
                  <span>订阅续费提醒</span>
                </label>
              </div>
              <div class="field-hint">续费提醒阈值：到期前 ${escapeHTML(thresholds)} 天。</div>
            </div>
            <div class="field">
              <label class="field-label" for="notify-debounce">掉线防抖时间（秒）</label>
              <input id="notify-debounce" class="input mono" type="number" min="1" max="3600" value="${escapeHTML(String(settings.offline_debounce_sec || 60))}" ${busy ? 'disabled' : ''}>
              <div class="field-hint">探针离线持续超过该秒数后再推送告警，避免短闪断误报。</div>
            </div>
            <div class="field">
              <label class="field-label" for="notify-check-hour">每日续费检查时间（0–23 点）</label>
              <input id="notify-check-hour" class="input mono" type="number" min="0" max="23" value="${escapeHTML(String(settings.renewal_check_hour ?? 9))}" ${busy ? 'disabled' : ''}>
              <div class="field-hint">按主控服务器本地时区每日定点检查即将到期的订阅。</div>
            </div>
          </div>
          <div class="section-group">
            <button class="btn primary" data-action="notify-save" type="button" ${busy ? 'disabled' : ''}>${busy ? '处理中...' : '保存通知设置'}</button>
            <button class="btn" data-action="notify-test" type="button" ${busy ? 'disabled' : ''}>发送测试推送</button>
          </div>
        </div>
      `;

      host.querySelector('[data-action="notify-save"]')?.addEventListener('click', () => handleSaveNotify().catch((e) => showToast(`保存通知设置失败：${e.message || e}`, 'err')));
      host.querySelector('[data-action="notify-test"]')?.addEventListener('click', () => handleTestNotify().catch((e) => showToast(`测试推送失败：${e.message || e}`, 'err')));
    }

    /* ================= Modals ================= */
    function renderModal() {
      const root = qs('modal-root');
      let html = '';
      if (state.modal.apiKey) html = renderAPIKeyModal();
      else if (state.modal.addAccount) html = renderAddAccountModal();
      else if (state.modal.tokenLogin) html = renderTokenLoginModal();
      else if (state.modal.scheduleTask) html = renderScheduleTaskModal();
      else if (state.modal.scheduleHistory) html = renderScheduleHistoryModal();
      root.innerHTML = html;
      bindModalEvents();
    }

    function closeModal(key) {
      if (key === 'scheduleTask' && state.scheduleLoading) return;
      if (key === 'scheduleHistory' && state.scheduleHistoryLoading) return;
      if ((key === 'apiKey' || key === 'addAccount' || key === 'tokenLogin') && state.loading) return;
      state.modal[key] = false;
      renderModal();
    }

    function renderAPIKeyModal() {
      return `
        <div class="modal-mask" data-close-modal="apiKey">
          <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-head">
              <h3>设置共享 API Key</h3>
              <button class="btn sm ghost" data-close-modal="apiKey" type="button">&times;</button>
            </div>
            <div class="field-hint">所有 Telegram 账号共享同一组来自 <code>my.telegram.org</code> 的 API ID 与 API Hash。</div>
            <div class="field">
              <label class="field-label" for="api-key-id">共享 API ID</label>
              <input id="api-key-id" class="input mono" value="${escapeHTML(state.draft.apiKeyID)}" placeholder="正整数，例如 12345678" ${state.loading ? 'disabled' : ''}>
            </div>
            <div class="field">
              <label class="field-label" for="api-key-hash">共享 API Hash</label>
              <input id="api-key-hash" class="input mono" value="${escapeHTML(state.draft.apiKeyHash)}" placeholder="32 位十六进制字符串" ${state.loading ? 'disabled' : ''}>
            </div>
            <div class="modal-foot">
              <button class="btn" data-close-modal="apiKey" type="button" ${state.loading ? 'disabled' : ''}>取消</button>
              <button class="btn primary" data-action="save-api-key" type="button" ${state.loading ? 'disabled' : ''}>${state.loading ? '保存中...' : '保存 API'}</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderAddAccountModal() {
      const pendingAcc = state.draft.addAccountCreatedID
        ? state.accounts.find((a) => a.id === state.draft.addAccountCreatedID) || null
        : null;
      const step2Ready = !!(pendingAcc && pendingAcc.pending_code && !pendingAcc.authorized);
      return `
        <div class="modal-mask" data-close-modal="addAccount">
          <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-head">
              <h3>手机号添加并登录账号</h3>
              <button class="btn sm ghost" data-close-modal="addAccount" type="button">&times;</button>
            </div>
            <div class="form-grid">
              <div class="field">
                <label class="field-label" for="add-account-label">账号备注</label>
                <input id="add-account-label" class="input" value="${escapeHTML(state.draft.addAccountLabel)}" placeholder="例如：主号 / 备用号" ${state.loading || step2Ready ? 'disabled' : ''}>
              </div>
              <div class="field">
                <label class="field-label" for="add-account-phone">手机号（含国家区号）</label>
                <input id="add-account-phone" class="input mono" value="${escapeHTML(state.draft.addAccountPhone)}" placeholder="例如：+8613800138000" ${state.loading || step2Ready ? 'disabled' : ''}>
              </div>
              <div class="field">

    function buildTargetOptionListHTML(accountID) {
      const bucket = getAccountBucket(accountID);
      const kw = String(state.draft.scheduleTargetSearch || '').trim().toLowerCase();
      let list = bucket.targets.slice();
      if (kw) {
        list = list.filter((item) => {
          const hay = `${item.name || ''} ${item.username || ''} ${item.id || ''} ${formatTargetType(item.type)}`.toLowerCase();
          return hay.includes(kw);
        });
      }
      if (list.length === 0) {
        return `<div class="field-hint" style="padding:12px;text-align:center">${bucket.targets.length === 0 ? '暂无会话对象，请点击右侧「刷新」同步' : '未找到匹配的会话对象'}</div>`;
      }
      return list.map((item) => {
        const selected = item.id === state.draft.scheduleTarget ? ' selected' : '';
        const name = String(item.name || item.id).trim();
        const sub = `${formatTargetType(item.type)}${item.username ? ' · @' + item.username : ''}`;
        return `
          <button type="button" class="target-option${selected}" data-pick-target="${escapeHTML(item.id)}">
            <span class="target-option-main">${escapeHTML(name)}</span>
            <span class="target-option-sub mono">${escapeHTML(sub)}</span>
          </button>
        `;
      }).join('');
    }

                  <button class="btn" data-action="modal-refresh-targets" type="button" ${busy || state.targetRefreshing ? 'disabled' : ''}>${state.targetRefreshing ? '同步中...' : '刷新'}</button>

              <label class="field-label" for="schedule-delay-max">随机延时最大值（秒）</label>

    function renderScheduleHistoryModal() {
      const body = state.scheduleHistoryLoading
        ? '<div class="empty">正在加载任务执行记录...</div>'
