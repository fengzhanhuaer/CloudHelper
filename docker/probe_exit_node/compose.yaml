services:
  cloudhelper-probe-exit-node:
    image: ghcr.io/fengzhanhuaer/cloudhelper-probe-exit-node-shell:latest
    container_name: cloudhelper-probe-exit-node
    restart: unless-stopped
    network_mode: host
    mem_limit: 1g
    pids_limit: 512
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      PROBE_NODE_ID: "19"
      PROBE_NODE_SECRET: "your-node-secret"
      PROBE_CONTROLLER_URL: "https://controller.example.com"
    volumes:
      - ./program:/opt/cloudhelper/probe_exit_node/program
      - ./data:/opt/cloudhelper/probe_exit_node/data
      - ./log:/opt/cloudhelper/probe_exit_node/log
      - ./temp:/opt/cloudhelper/probe_exit_node/temp
