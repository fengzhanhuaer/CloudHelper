<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CloudHelper TG 助手管理</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: radial-gradient(circle at top, #1a2436 0%, #0d1117 45%, #090c12 100%);
      color: #dceaff;
      min-height: 100vh;
    }
    .wrap {
      width: calc(100vw - 32px);
      margin: 3vh auto;
      border: 1px solid rgba(150, 185, 240, 0.2);
      border-radius: 14px;
      background: rgba(10, 16, 26, 0.78);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
      padding: 16px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 24px; }
    .sub { margin: 6px 0 0; color: #9fc2ff; font-size: 13px; }
    .btn {
      min-width: 108px;
      border: 1px solid rgba(130, 176, 246, 0.36);
      background: rgba(35, 52, 78, 0.75);
      color: #fff;
      border-radius: 8px;
      height: 34px;
      padding: 0 12px;
      cursor: pointer;
    }
    .btn.primary {
      border-color: rgba(126, 200, 255, 0.66);
      background: linear-gradient(180deg, rgba(77, 138, 220, 0.88) 0%, rgba(55, 107, 186, 0.92) 100%);
    }
    .btn.warn {
      border-color: rgba(250, 176, 108, 0.66);
      background: linear-gradient(180deg, rgba(171, 110, 48, 0.92) 0%, rgba(132, 82, 36, 0.92) 100%);
    }
    .btn:disabled { opacity: .58; cursor: not-allowed; }
    .btn:hover:enabled { filter: brightness(1.06); }

    .status {
      border: 1px solid rgba(126, 200, 255, 0.3);
      background: rgba(8, 14, 23, 0.62);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.45;
      min-height: 38px;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 12px;
    }
    .status.ok { border-color: rgba(112, 221, 159, 0.46); color: #9ff7c0; }
    .status.err { border-color: rgba(255, 145, 145, 0.52); color: #ffadad; }
    .status.warn { border-color: rgba(255, 196, 122, 0.52); color: #ffd38f; }

    .content-block {
      border: 1px solid rgba(150, 185, 240, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      padding: 14px;
    }
    .top-tab-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .top-tab-btn {
      border: 1px solid rgba(140, 177, 238, 0.4);
      background: rgba(30, 47, 73, 0.7);
      border-radius: 999px;
      color: #dceaff;
      height: 36px;
      padding: 0 16px;
      cursor: pointer;
      font-weight: 600;
    }
    .top-tab-btn.active {
      border-color: rgba(153, 204, 255, 0.82);
      background: rgba(70, 122, 204, 0.68);
    }
    .tg-panel { display: none; }
    .tg-panel.active { display: block; }
    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .title-row h2 { margin: 0; font-size: 22px; }
    .content-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .identity-card {
      border: 1px solid rgba(150, 185, 240, 0.2);
      border-radius: 12px;
      background: rgba(7, 11, 18, 0.42);
      padding: 12px;
      color: #e1ecff;
      display: grid;
      gap: 10px;
    }
    .subtab-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .subtab-btn {
      border: 1px solid rgba(140, 177, 238, 0.4);
      background: rgba(30, 47, 73, 0.7);
      border-radius: 999px;
      color: #dceaff;
      height: 34px;
      padding: 0 14px;
      cursor: pointer;
    }
    .notify-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin: 8px 0;
    }
    .notify-grid label { display:flex; flex-direction:column; gap:4px; font-size:13px; }
    .notify-grid label.notify-check { flex-direction:row; align-items:center; gap:6px; }
    .notify-grid select, .notify-grid input[type="number"] { min-height:30px; }
    .notify-overview { margin-top:8px; display:grid; gap:6px; }
    .notify-badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; }
    .notify-badge.ok { background: rgba(46, 160, 67, 0.25); color:#7ee787; }
    .notify-badge.off { background: rgba(248, 81, 73, 0.22); color:#ff7b72; }
    .subtab-btn.active {
      border-color: rgba(153, 204, 255, 0.82);
      background: rgba(70, 122, 204, 0.68);
    }

    .tg-account-summary {
      border: 1px solid rgba(150, 185, 240, 0.2);
      border-radius: 10px;
      background: rgba(8, 14, 24, 0.55);
      padding: 12px;
      display: grid;
      gap: 12px;
    }
    .tg-account-basic-list {
      display: grid;
      gap: 8px;
    }
    .tg-account-basic-row {
      display: grid;
      grid-template-columns: 132px 1fr;
      gap: 10px;
      align-items: center;
      font-size: 14px;
    }
    .tg-account-basic-label { color: #9fc2ff; font-size: 13px; }
    .tg-account-basic-value { word-break: break-word; }
    .tg-account-summary-line { color: #b9d7ff; font-size: 13px; line-height: 1.45; }

    .tg-schedule-panel,
    .tg-schedule-list {
      display: grid;
      gap: 10px;
    }
    .tg-session-toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: end;
      margin-bottom: 12px;
    }
    .tg-session-toolbar label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 180px;
      font-size: 13px;
      color: #9fc2ff;
    }
    .tg-session-toolbar input,
    .tg-session-toolbar select {
      min-height: 34px;
    }
    .tg-session-summary {
      color: #b9d7ff;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .tg-chat-shell {
      min-height: 68vh;
      display: grid;
      grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
      border: 1px solid rgba(150, 185, 240, 0.22);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(7, 12, 18, 0.58);
    }
    .tg-chat-sidebar {
      min-width: 0;
      border-right: 1px solid rgba(150, 185, 240, 0.16);
      background: rgba(10, 17, 28, 0.72);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
    }
    .tg-chat-sidebar-head,
    .tg-chat-main-head,
    .tg-chat-composer {
      padding: 12px;
      border-bottom: 1px solid rgba(150, 185, 240, 0.14);
    }
    .tg-chat-main-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 66px;
      background: rgba(12, 20, 34, 0.86);
    }
    .tg-chat-title {
      font-size: 16px;
      font-weight: 700;
      color: #f3f8ff;
      word-break: break-word;
    }
    .tg-chat-subtitle {
      margin-top: 3px;
      color: #8eaed6;
      font-size: 12px;
      word-break: break-all;
    }
    .tg-chat-list {
      min-height: 0;
      overflow: auto;
      padding: 6px;
      display: grid;
      align-content: start;
      gap: 4px;
    }
    .tg-chat-item {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: #dceaff;
      border-radius: 8px;
      padding: 10px;
      text-align: left;
      cursor: pointer;
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }
    .tg-chat-item:hover {
      background: rgba(80, 132, 209, 0.16);
    }
    .tg-chat-item.active {
      border-color: rgba(153, 204, 255, 0.42);
      background: rgba(72, 128, 207, 0.32);
    }
    .tg-chat-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      background: linear-gradient(135deg, rgba(62, 171, 214, 0.92), rgba(73, 110, 210, 0.92));
    }
    .tg-chat-item-title,
    .tg-chat-item-sub {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .tg-chat-item-title { font-size: 14px; font-weight: 650; }
    .tg-chat-item-sub { margin-top: 3px; color: #8eaed6; font-size: 12px; }
    .tg-chat-main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: linear-gradient(180deg, rgba(12, 20, 32, 0.72), rgba(8, 13, 21, 0.9));
    }
    .tg-chat-messages {
      min-height: 0;
      overflow: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tg-chat-empty {
      height: 100%;
      min-height: 260px;
      display: grid;
      place-items: center;
      color: #8eaed6;
      text-align: center;
      padding: 24px;
    }
    .tg-message-row {
      display: flex;
      justify-content: flex-start;
    }
    .tg-message-row.out {
      justify-content: flex-end;
    }
    .tg-message-bubble {
      max-width: min(680px, 78%);
      border: 1px solid rgba(150, 185, 240, 0.16);
      border-radius: 8px;
      padding: 8px 10px;
      background: rgba(23, 36, 56, 0.92);
      color: #eef6ff;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .tg-message-row.out .tg-message-bubble {
      border-color: rgba(107, 208, 165, 0.2);
      background: rgba(37, 111, 91, 0.82);
    }
    .tg-message-row.service {
      justify-content: center;
    }
    .tg-message-row.service .tg-message-bubble {
      max-width: 80%;
      border-color: rgba(150, 185, 240, 0.12);
      background: rgba(100, 120, 150, 0.16);
      color: #b9d7ff;
      text-align: center;
      font-size: 12px;
    }
    .tg-message-sender {
      margin-bottom: 3px;
      color: #9fc2ff;
      font-size: 12px;
      font-weight: 650;
    }
    .tg-message-meta {
      margin-top: 4px;
      color: rgba(220, 234, 255, 0.68);
      font-size: 11px;
      text-align: right;
    }
    .tg-chat-composer {
      border-top: 1px solid rgba(150, 185, 240, 0.14);
      border-bottom: 0;
      background: rgba(12, 20, 34, 0.9);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
    }
    .tg-chat-composer textarea {
      min-height: 42px;
      max-height: 150px;
      resize: vertical;
    }
    .probe-table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid rgba(150, 185, 240, 0.2);
      border-radius: 8px;
      background: rgba(7, 12, 18, 0.58);
    }
    table.probe-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }
    .probe-table th,
    .probe-table td {
      border-bottom: 1px solid rgba(150, 185, 240, 0.14);
      text-align: left;
      vertical-align: top;
      padding: 8px 7px;
      font-size: 13px;
      color: #dceaff;
    }
    .probe-table th {
      color: #9fc2ff;
      font-weight: 600;
      background: rgba(30, 45, 71, 0.38);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .probe-table-sub {
      color: #8caedc;
      font-size: 12px;
      margin-top: 2px;
      word-break: break-all;
    }
    .tg-schedule-table-message {
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 420px;
    }
    .tg-schedule-table-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tg-schedule-row-toggle,
    .tg-schedule-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    .probe-settings-modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 12, 0.66);
      display: grid;
      place-items: center;
      z-index: 999;
      padding: 12px;
    }
    .probe-settings-modal {
      width: min(860px, 96vw);
      max-height: 92vh;
      overflow: auto;
      border: 1px solid rgba(150, 185, 240, 0.28);
      border-radius: 12px;
      background: rgba(10, 16, 26, 0.98);
      box-shadow: 0 12px 42px rgba(0, 0, 0, 0.5);
      padding: 14px;
    }
    .row {
      display: grid;
      grid-template-columns: 126px 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
    .row label {
      color: #9fc2ff;
      text-align: right;
      font-size: 13px;
    }
    .input,
    select.input,
    textarea.input {
      width: 100%;
      border: 1px solid rgba(150, 185, 240, 0.32);
      border-radius: 8px;
      outline: none;
      background: rgba(7, 12, 19, 0.84);
      color: #fff;
      padding: 7px 10px;
      font-size: 13px;
      line-height: 1.4;
    }
    .input:focus,
    select.input:focus,
    textarea.input:focus {
      border-color: rgba(154, 210, 255, 0.92);
    }
    textarea.input { min-height: 100px; resize: vertical; }
    .tg-session-token {
      min-height: 92px;
      font-family: Consolas, "SFMono-Regular", Menlo, monospace;
      font-size: 12px;
      line-height: 1.45;
      word-break: break-all;
    }

    .tg-schedule-field {
      margin-bottom: 10px;
      display: grid;
      gap: 6px;
    }
    .tg-target-picker {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .muted { color: #8eaed6; }

    @media (max-width: 860px) {
      .row,
      .tg-account-basic-row {
        grid-template-columns: 1fr;
      }
      .row label,
      .tg-account-basic-label {
        text-align: left;
      }
      .topbar { align-items: flex-start; }
      .btn { min-width: 94px; }
      .tg-chat-shell {
        grid-template-columns: 1fr;
        min-height: 72vh;
      }
      .tg-chat-sidebar {
        border-right: 0;
        border-bottom: 1px solid rgba(150, 185, 240, 0.16);
        max-height: 42vh;
      }
      .tg-chat-main {
        min-height: 58vh;
      }
      .tg-chat-main-head {
        align-items: flex-start;
      }
      .tg-message-bubble {
        max-width: 92%;
      }
      .tg-chat-composer {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1 id="page-title">/mng/tg</h1>
        <p id="page-subtitle" class="sub">参照 manager 侧统一交互：账号登录、任务管理、TG Bot 全流程。</p>
      </div>
      <div class="content-actions">
        <button id="btn-account-manage" class="btn" type="button">账号管理</button>
        <button id="btn-login-account" class="btn" type="button">登录账号</button>
        <button id="btn-token-login" class="btn" type="button">Token登录</button>
        <button id="btn-api-settings" class="btn" type="button">设置API</button>
        <button id="btn-back" class="btn" type="button">返回磁贴面板</button>
        <button id="btn-logout" class="btn" type="button">退出登录</button>
      </div>
    </div>

    <div id="status-box" class="status">初始化中...</div>

    <div class="top-tab-list" role="tablist" aria-label="TG 管理面板">
      <button class="top-tab-btn active" data-panel-tab="assistant" type="button" role="tab" aria-selected="true">TG助手</button>
      <button class="top-tab-btn" data-panel-tab="notify" type="button" role="tab" aria-selected="false">主控通知</button>
    </div>

    <div class="content-block tg-panel active" data-panel-content="assistant" role="tabpanel">
      <div class="title-row">
        <h2>TG助手</h2>
      </div>
      <p class="muted">共享 API Key（API ID / API Hash）、账号与登录、任务管理、Bot 管理。</p>

      <div id="identity-card" class="identity-card"></div>
    </div>

    <div class="content-block tg-panel" data-panel-content="notify" role="tabpanel">
      <div id="notify-card" class="identity-card"></div>
    </div>
  </div>

  <div id="modal-root"></div>

  <script>
    const state = {
      loading: false,
      scheduleLoading: false,
      pendingLoading: false,
      targetRefreshing: false,
      sessionLoading: false,
      sessionSending: false,
      botLoading: false,
      scheduleHistoryLoading: false,

      status: '初始化中...',
      statusLevel: '',

      api: { api_id: 0, api_hash: '', configured: false },
      accounts: [],
      selectedAccountID: '',
      activeLoggedInAccountID: '',
      activePanelTab: 'assistant',
      activeSubTab: 'basic-info',

      scheduleList: [],
      targetList: [],
      filteredTargetList: [],
      selectedSessionTarget: '',
      sessionMessages: [],
      sessionWS: null,
      pendingTaskItems: [],
      scheduleHistoryItems: [],
      scheduleHistoryTaskID: '',

      botConfig: {
        api_key: '',
        configured: false,
        mode: 'polling',
        webhook_path: '',
        webhook_enabled: false,
      },

      notify: {
        overview: null,
        loading: false,
      },

      modal: {
        apiKey: false,
        addAccount: false,
        tokenLogin: false,
        manageAccount: false,
        scheduleTask: false,
        scheduleHistory: false,
        botAPIKey: false,
      },

      draft: {
        apiKeyID: '',
        apiKeyHash: '',

        addAccountSelectedID: '',
        addAccountLabel: '',
        addAccountPhone: '',
        loginCode: '',
        loginPassword: '',
        tokenLoginLabel: '',
        tokenLoginSessionToken: '',

        scheduleEditingTaskID: '',
        scheduleEnabled: false,
        scheduleTarget: '',
        scheduleTargetSearch: '',
        scheduleSendAt: '每天 09:00',
        scheduleMessage: '',
        scheduleDelayMax: '0',

        botMode: 'polling',
        botAPIKey: '',
        botTestMessage: 'ping from bot test',
        sessionSearch: '',
        sessionType: 'all',
        sessionMessage: '',
      },
      scheduleRequestSeq: 0,
    };
    const SESSION_REFRESH_INTERVAL_MS = 4000;
    let sessionRefreshTimer = null;

    function qs(id) {
      return document.getElementById(id);
    }

    function setStatus(message, level) {
      state.status = String(message || '');
      state.statusLevel = String(level || '');
      renderStatus();
    }

    function renderStatus() {
      const box = qs('status-box');
      box.textContent = state.status;
      box.className = 'status';
      if (state.statusLevel) {
        box.classList.add(state.statusLevel);
      }
    }

    function renderPanelTabs() {
      const requested = String(state.activePanelTab || '').trim();
      const active = requested === 'notify' ? requested : 'assistant';
      state.activePanelTab = active;
      document.querySelectorAll('[data-panel-tab]').forEach((btn) => {
        const matched = btn.getAttribute('data-panel-tab') === active;
        btn.classList.toggle('active', matched);
        btn.setAttribute('aria-selected', matched ? 'true' : 'false');
      });
      document.querySelectorAll('[data-panel-content]').forEach((panel) => {
        panel.classList.toggle('active', panel.getAttribute('data-panel-content') === active);
      });
      renderTGSessionPanel();
    }

    function closeSessionWS() {
      const ws = state.sessionWS;
      state.sessionWS = null;
      if (ws) {
        try { ws.close(); } catch (_) {}
      }
    }

    function openTGSessionWindow() {
      const active = getActiveLoggedInAccount();
      if (!active) {
        setStatus('请先选择一个已登录账号', 'warn');
        return;
      }
      const url = `${window.location.origin}/mng/tg/session?account_id=${encodeURIComponent(active.id)}`;
      const opened = window.open(url, 'cloudhelper_tg_sessions', 'noopener,noreferrer,width=1280,height=860');
      if (!opened) {
        setStatus('浏览器拦截了 TG 会话窗口，请允许弹窗后重试。', 'warn');
      }
    }

    function escapeHTML(value) {
      return String(value || '').replace(/[&<>"\x27]/g, (ch) => {
        if (ch === '&') return '&' + 'amp;';
        if (ch === '<') return '&' + 'lt;';
        if (ch === '>') return '&' + 'gt;';
        if (ch === '"') return '&' + 'quot;';
        return '&' + '#39;';
      });
    }

    async function requestJSON(url, options = {}) {
      const response = await fetch(url, { credentials: 'same-origin', ...options });
      let payload = {};
      try { payload = await response.json(); } catch (_) {}
      if (!response.ok) {
        const msg = payload && payload.error ? payload.error : `HTTP ${response.status}`;
        throw new Error(msg);
      }
      return payload;
    }

    function getLoggedInAccounts() {
      return state.accounts.filter((item) => item && item.authorized);
    }

    function getSelectedAccount() {
      return state.accounts.find((item) => item.id === state.selectedAccountID) || null;
    }

    function getActiveLoggedInAccount() {
      return getLoggedInAccounts().find((item) => item.id === state.activeLoggedInAccountID) || null;
    }

    function normalizePhone(raw) {
      const value = String(raw || '').trim();
      if (!value) return '';
      return value.replace(/[^+\d]/g, '');
    }

    function formatDateTime(raw) {
      const value = String(raw || '').trim();
      if (!value) return '-';
      const dt = new Date(value);
      if (Number.isNaN(dt.getTime())) return value;
      return dt.toLocaleString();
    }

    function renderTargetLabel(targetID) {
      const id = String(targetID || '').trim();
      if (!id) return '-';
      const hit = state.targetList.find((item) => item.id === id);
      if (!hit) return id;
      if (hit.username && String(hit.username).trim()) {
        return `${hit.name} (@${hit.username})`;
      }
      return hit.name;
    }

    function syncSelectedAccounts() {
      if (state.accounts.length === 0) {
        state.selectedAccountID = '';
        state.activeLoggedInAccountID = '';
        return;
      }
      if (!state.accounts.some((item) => item.id === state.selectedAccountID)) {
        state.selectedAccountID = state.accounts[0].id;
      }
      const loggedIn = getLoggedInAccounts();
      if (loggedIn.length === 0) {
        state.activeLoggedInAccountID = '';
        return;
      }
      if (!loggedIn.some((item) => item.id === state.activeLoggedInAccountID)) {
        state.activeLoggedInAccountID = loggedIn[0].id;
      }
    }

    function setLoadingState(patch) {
      Object.assign(state, patch);
      renderMain();
    }

    function openModal(key) {
      state.modal[key] = true;
      renderModal();
    }

    function closeModal(key) {
      if (key === 'scheduleTask' && state.scheduleLoading) return;
      if (key === 'scheduleHistory' && state.scheduleHistoryLoading) return;
      if (key === 'botAPIKey' && state.botLoading) return;
      if ((key === 'addAccount' || key === 'tokenLogin' || key === 'manageAccount' || key === 'apiKey') && state.loading) return;
      state.modal[key] = false;
      renderModal();
    }

    function renderMain() {
      syncSelectedAccounts();
      const loggedInAccounts = getLoggedInAccounts();
      const activeLoggedInAccount = getActiveLoggedInAccount();

      const headerButtonsDisabled = state.loading;
      qs('btn-account-manage').disabled = headerButtonsDisabled;
      qs('btn-login-account').disabled = headerButtonsDisabled || !state.api.configured;
      qs('btn-token-login').disabled = headerButtonsDisabled || !state.api.configured;
      qs('btn-api-settings').disabled = headerButtonsDisabled;

      let html = '';
      html += '<div>已登录账号 Tab</div>';

      if (loggedInAccounts.length === 0) {
        html += '<div>当前没有已登录账号。</div>';
      } else {
        html += '<div class="subtab-list">';
        loggedInAccounts.forEach((item) => {
          const active = state.activeLoggedInAccountID === item.id ? ' active' : '';
          html += `<button class="subtab-btn${active}" data-action="switch-active-account" data-account-id="${escapeHTML(item.id)}" type="button">${escapeHTML(item.label || item.id)}</button>`;
        });
        html += '</div>';

        html += '<div class="subtab-list">';
        html += `<button class="subtab-btn${state.activeSubTab === 'basic-info' ? ' active' : ''}" data-action="switch-subtab" data-subtab="basic-info" type="button">基础信息</button>`;
        html += '<button class="subtab-btn" data-action="open-sessions" type="button">TG会话</button>';
        html += `<button class="subtab-btn${state.activeSubTab === 'scheduled-send' ? ' active' : ''}" data-action="switch-subtab" data-subtab="scheduled-send" type="button">定时发送</button>`;
        html += `<button class="subtab-btn${state.activeSubTab === 'tg-bot' ? ' active' : ''}" data-action="switch-subtab" data-subtab="tg-bot" type="button">TG BOT</button>`;
        html += '</div>';

        if (activeLoggedInAccount) {
          html += '<div class="tg-account-summary">';

          if (state.activeSubTab === 'basic-info') {
            html += renderBasicInfoBlock(activeLoggedInAccount);
          } else if (state.activeSubTab === 'tg-bot') {
            html += renderBotBlock(activeLoggedInAccount);
          } else {
            html += renderScheduleBlock(activeLoggedInAccount);
          }

          html += '</div>';
        } else {
          html += '<div class="tg-account-summary-line">请先选择一个已登录账号。</div>';
        }
      }

      qs('identity-card').innerHTML = html;
      bindDynamicMainEvents();
    }

    function renderNotifyCard() {
      const host = qs('notify-card');
      if (!host) return;
      const ov = state.notify.overview;
      const settings = (ov && ov.settings) || {
        notify_account_id: '', enable_offline: false, enable_renewal: false,
        offline_debounce_sec: 60, renewal_check_hour: 9, renewal_thresholds: [7, 3, 1],
      };
      const authed = getLoggedInAccounts();
      let options = '<option value="">未选择</option>';
      authed.forEach((item) => {
        const sel = item.id === settings.notify_account_id ? ' selected' : '';
        options += `<option value="${escapeHTML(item.id)}"${sel}>${escapeHTML(item.label || item.id)}</option>`;
      });
      const thresholds = Array.isArray(settings.renewal_thresholds) ? settings.renewal_thresholds.join(' / ') : '7 / 3 / 1';
      const disabled = state.notify.loading ? 'disabled' : '';
      const badge = (ok, text) => `<span class="notify-badge ${ok ? 'ok' : 'off'}">${escapeHTML(text)}</span>`;

      let overviewHTML = '';
      if (ov) {
        overviewHTML += '<div class="notify-overview">';
        overviewHTML += `<div>当前通知机器人：${ov.account_label ? escapeHTML(ov.account_label) : '<span class="muted">未选择</span>'}</div>`;
        overviewHTML += `<div>${badge(!!ov.account_authorized, ov.account_authorized ? '账号已授权' : '账号未授权')} ${badge(!!ov.bot_configured, ov.bot_configured ? 'BOT已配置' : 'BOT未配置')} ${badge(!!ov.ready, ov.ready ? '可推送' : '不可推送')}</div>`;
        if (ov.last_push) {
          const lp = ov.last_push;
          overviewHTML += `<div class="muted">最近推送：${escapeHTML(lp.action || '')} · ${lp.success ? '成功' : '失败'} · ${escapeHTML(lp.time || '')}</div>`;
        }
        overviewHTML += '</div>';
      }

      host.innerHTML = `
        <div class="title-row"><h2>主控通知</h2></div>
        <p class="muted">选择一个已登录且已配置 BOT 的账号作为主控通知机器人。掉线通知与续费提醒会推送到该账号的 TG 私聊；该账号的 BOT 同时支持 /status 查看状态、/upgrade &lt;编号&gt; 升级、/upgrade_all 全部升级。配置步骤：① 找 @BotFather 创建 BOT 取得 api key → ② 在「TG BOT」子页保存 api key（polling 模式无需公网）→ ③ 在此选为通知账号并开启开关。</p>
        <div class="notify-grid">
          <label>通知账号
            <select id="notify-account-select" ${disabled}>${options}</select>
          </label>
          <label class="notify-check"><input id="notify-enable-offline" type="checkbox" ${settings.enable_offline ? 'checked' : ''} ${disabled}> 掉线通知</label>
          <label class="notify-check"><input id="notify-enable-renewal" type="checkbox" ${settings.enable_renewal ? 'checked' : ''} ${disabled}> 续费提醒</label>
          <label>掉线防抖(秒)
            <input id="notify-debounce" type="number" min="1" max="3600" value="${escapeHTML(String(settings.offline_debounce_sec || 60))}" ${disabled}>
          </label>
          <label>每日检查(点)
            <input id="notify-check-hour" type="number" min="1" max="23" value="${escapeHTML(String(settings.renewal_check_hour))}" ${disabled}>
          </label>
          <div class="muted">续费提醒阈值：到期前 ${escapeHTML(thresholds)} 天</div>
        </div>
        <div class="content-actions">
          <button class="btn primary" data-action="notify-save" ${disabled}>保存通知设置</button>
          <button class="btn" data-action="notify-test" ${disabled}>测试推送</button>
        </div>
        ${overviewHTML}
      `;
      bindNotifyEvents();
    }

    function formatTGSessionType(type) {
      const value = String(type || '').trim();
      if (value === 'user') return '私聊';
      if (value === 'chat') return '群组';
      if (value === 'channel') return '频道';
      return value || '-';
    }

    function sessionMessagesFingerprint(messages) {
      return (Array.isArray(messages) ? messages : []).map((msg) => {
        const id = Number(msg && msg.id || 0);
        const date = String(msg && msg.date || '');
        const out = msg && msg.out ? '1' : '0';
        const service = msg && msg.service ? '1' : '0';
        const text = String(msg && msg.text || '');
        const mediaType = String(msg && msg.media_type || '');
        const mediaPath = String(msg && msg.media_path || '');
        return [id, date, out, service, text, mediaType, mediaPath].join(':');
      }).join('|');
    }

    function getSessionWSURL(accountID, targetID) {
      const url = new URL(window.location.href);
      url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
      url.pathname = '/mng/api/tg/session/ws';
      url.search = new URLSearchParams({
        account_id: accountID,
        target: targetID,
      }).toString();
      return url.toString();
    }

    function getFilteredSessionTargets() {
      const keyword = String(state.draft.sessionSearch || '').trim().toLowerCase();
      const type = String(state.draft.sessionType || 'all').trim();
      let list = Array.isArray(state.targetList) ? state.targetList.slice() : [];
      if (type !== 'all') {
        list = list.filter((item) => String(item && item.type || '').trim() === type);
      }
      if (keyword) {
        list = list.filter((item) => {
          const id = String(item && item.id || '').toLowerCase();
          const name = String(item && item.name || '').toLowerCase();
          const username = String(item && item.username || '').toLowerCase();
          const kind = String(item && item.type || '').toLowerCase();
          return id.includes(keyword) || name.includes(keyword) || username.includes(keyword) || kind.includes(keyword);
        });
      }
      return list;
    }

    function renderTGSessionPanel(options = {}) {
      const host = qs('tg-session-card');
      if (!host) return;
      const preserveScroll = options.preserveScroll === true;
      const previousBox = preserveScroll ? qs('tg-chat-messages') : null;
      const previousScrollTop = previousBox ? previousBox.scrollTop : 0;
      const wasNearBottom = previousBox ? (previousBox.scrollHeight - previousBox.scrollTop - previousBox.clientHeight) <= 24 : true;
      const active = getActiveLoggedInAccount();
      if (!active) {
        host.innerHTML = `
          <div class="title-row"><h2>TG会话</h2></div>
          <div class="tg-account-summary-line">请先在「TG助手」中登录并选择一个账号。</div>
        `;
        return;
      }
      const filtered = getFilteredSessionTargets();
      if (!state.selectedSessionTarget && filtered.length > 0) {
        state.selectedSessionTarget = filtered[0].id || '';
      }
      const typeCounts = { user: 0, chat: 0, channel: 0 };
      (Array.isArray(state.targetList) ? state.targetList : []).forEach((item) => {
        const type = String(item && item.type || '').trim();
        if (typeCounts[type] !== undefined) typeCounts[type] += 1;
      });
      const selected = getSelectedSessionTarget();
      let sessionItems = '';
      if (filtered.length === 0) {
        sessionItems = '<div class="tg-chat-empty">暂无匹配会话</div>';
      } else {
        sessionItems = filtered.map((item) => {
          const username = String(item && item.username || '').trim();
          const itemID = String(item && item.id || '').trim();
          const title = String(item && item.name || itemID || '-').trim();
          const initial = title ? title.slice(0, 1).toUpperCase() : '#';
          const activeClass = itemID === state.selectedSessionTarget ? ' active' : '';
          return `
            <button class="tg-chat-item${activeClass}" data-action="open-session-target" data-target-id="${escapeHTML(itemID)}" type="button">
              <div class="tg-chat-avatar">${escapeHTML(initial)}</div>
              <div>
                <div class="tg-chat-item-title">${escapeHTML(title)}</div>
                <div class="tg-chat-item-sub">${escapeHTML(formatTGSessionType(item && item.type))}${username ? ` · @${escapeHTML(username)}` : ''}</div>
              </div>
            </button>
          `;
        }).join('');
      }
      const messages = renderSessionMessages();
      const selectedTitle = selected ? String(selected.name || selected.id || '-') : '请选择会话';
      const selectedSubtitle = selected ? formatSessionSubtitle(selected) : '刷新或选择左侧会话';
      host.innerHTML = `
        <div class="title-row">
          <h2>TG会话</h2>
          <div class="content-actions">
            <button class="btn" data-action="refresh-session-targets" type="button" ${state.loading || state.targetRefreshing ? 'disabled' : ''}>${state.targetRefreshing ? '刷新中...' : '刷新TG会话'}</button>
          </div>
        </div>
        <div class="tg-account-basic-row"><div class="tg-account-basic-label">当前账号</div><div class="tg-account-basic-value">${escapeHTML(active.label)} (${escapeHTML(active.phone)})</div></div>
        <div class="tg-session-summary">全部 ${state.targetList.length} ｜ 私聊 ${typeCounts.user} ｜ 群组 ${typeCounts.chat} ｜ 频道 ${typeCounts.channel} ｜ 当前显示 ${filtered.length}</div>
        <div class="tg-chat-shell">
          <aside class="tg-chat-sidebar">
            <div class="tg-chat-sidebar-head">
              <div class="tg-session-toolbar" style="margin-bottom:0">
                <label>搜索
                  <input id="tg-session-search" class="input" value="${escapeHTML(state.draft.sessionSearch)}" placeholder="名称 / username / id / 类型">
                </label>
                <label>类型
                  <select id="tg-session-type" class="input">
                    <option value="all" ${state.draft.sessionType === 'all' ? 'selected' : ''}>全部</option>
                    <option value="user" ${state.draft.sessionType === 'user' ? 'selected' : ''}>私聊</option>
                    <option value="chat" ${state.draft.sessionType === 'chat' ? 'selected' : ''}>群组</option>
                    <option value="channel" ${state.draft.sessionType === 'channel' ? 'selected' : ''}>频道</option>
                  </select>
                </label>
              </div>
            </div>
            <div class="tg-chat-sidebar-head" style="border-bottom:0;padding-top:0">
              <button class="btn" data-action="load-session-messages" type="button" ${!selected || state.sessionLoading ? 'disabled' : ''}>${state.sessionLoading ? '加载中...' : '刷新消息'}</button>
            </div>
            <div class="tg-chat-list">${sessionItems}</div>
          </aside>
          <section class="tg-chat-main">
            <div class="tg-chat-main-head">
              <div>
                <div class="tg-chat-title">${escapeHTML(selectedTitle)}</div>
                <div class="tg-chat-subtitle">${escapeHTML(selectedSubtitle)}</div>
              </div>
              <div class="content-actions">
                <button class="btn" data-action="load-older-session-messages" type="button" ${!selected || state.sessionLoading || state.sessionMessages.length === 0 ? 'disabled' : ''}>更早</button>
                <button class="btn" data-action="use-session-target" data-target-id="${escapeHTML(state.selectedSessionTarget || '')}" type="button" ${!selected ? 'disabled' : ''}>设为定时对象</button>
              </div>
            </div>
            <div id="tg-chat-messages" class="tg-chat-messages">${messages}</div>
            <div class="tg-chat-composer">
              <textarea id="tg-session-message" class="input" placeholder="输入消息" ${!selected || state.sessionSending ? 'disabled' : ''}>${escapeHTML(state.draft.sessionMessage)}</textarea>
              <button class="btn primary" data-action="send-session-message" type="button" ${!selected || state.sessionSending || !String(state.draft.sessionMessage || '').trim() ? 'disabled' : ''}>${state.sessionSending ? '发送中...' : '发送'}</button>
            </div>
          </section>
        </div>
      `;
      bindTGSessionEvents();
      if (preserveScroll && previousBox) {
        const box = qs('tg-chat-messages');
        if (box) {
          box.scrollTop = wasNearBottom ? box.scrollHeight : previousScrollTop;
        }
      } else {
        scrollSessionMessagesToBottom();
      }
    }

    function getSelectedSessionTarget() {
      const id = String(state.selectedSessionTarget || '').trim();
      if (!id) return null;
      return (Array.isArray(state.targetList) ? state.targetList : []).find((item) => item && item.id === id) || null;
    }

    function formatSessionSubtitle(item) {
      if (!item) return '';
      const bits = [formatTGSessionType(item.type), item.id || ''];
      if (item.username) bits.push('@' + item.username);
      return bits.filter(Boolean).join(' · ');
    }

    function renderSessionMessages() {
      if (state.sessionLoading && state.sessionMessages.length === 0) {
        return '<div class="tg-chat-empty">消息加载中...</div>';
      }
      if (!state.selectedSessionTarget) {
        return '<div class="tg-chat-empty">请选择一个会话</div>';
      }
      if (state.sessionMessages.length === 0) {
        return '<div class="tg-chat-empty">暂无消息</div>';
      }
      return state.sessionMessages.map((msg) => {
        const out = !!(msg && msg.out);
        const service = !!(msg && msg.service);
        const rowClass = 'tg-message-row' + (out ? ' out' : '') + (service ? ' service' : '');
        const sender = !out && !service && msg.sender_name ? `<div class="tg-message-sender">${escapeHTML(msg.sender_name)}</div>` : '';
        return `
          <div class="${rowClass}">
            <div class="tg-message-bubble">
              ${sender}
              <div>${escapeHTML(msg && msg.text || '')}</div>
              <div class="tg-message-meta">${escapeHTML(formatDateTime(msg && msg.date || ''))}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function scrollSessionMessagesToBottom() {
      const box = qs('tg-chat-messages');
      if (!box) return;
      box.scrollTop = box.scrollHeight;
    }

    function bindNotifyEvents() {
      document.querySelectorAll('[data-action="notify-save"]').forEach((btn) => {
        btn.addEventListener('click', () => handleSaveNotify().catch((err) => setStatus(`保存通知设置失败：${err.message || err}`, 'err')));
      });
      document.querySelectorAll('[data-action="notify-test"]').forEach((btn) => {
        btn.addEventListener('click', () => handleTestNotify().catch((err) => setStatus(`测试推送失败：${err.message || err}`, 'err')));
      });
    }

    function bindTGSessionEvents() {
      const search = qs('tg-session-search');
      if (search) {
        const applySearch = () => {
          state.draft.sessionSearch = String(search.value || '');
          renderTGSessionPanel();
        };
        search.addEventListener('change', applySearch);
        search.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') applySearch();
        });
      }
      const type = qs('tg-session-type');
      if (type) {
        type.addEventListener('change', () => {
          state.draft.sessionType = String(type.value || 'all');
          renderTGSessionPanel();
        });
      }
      document.querySelectorAll('[data-action="refresh-session-targets"]').forEach((btn) => {
        btn.addEventListener('click', () => handleRefreshTargets().catch((err) => setStatus(`刷新TG会话失败：${err.message || err}`, 'err')));
      });
      document.querySelectorAll('[data-action="open-session-target"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const targetID = String(btn.getAttribute('data-target-id') || '').trim();
          if (!targetID || targetID === state.selectedSessionTarget) return;
          closeSessionWS();
          state.selectedSessionTarget = targetID;
          state.sessionMessages = [];
          renderTGSessionPanel();
          loadSessionMessages({ silent: true }).catch((err) => setStatus(`加载会话消息失败：${err.message || err}`, 'err'));
          connectSessionWS();
        });
      });
      document.querySelectorAll('[data-action="load-session-messages"]').forEach((btn) => {
        btn.addEventListener('click', () => loadSessionMessages().catch((err) => setStatus(`加载会话消息失败：${err.message || err}`, 'err')));
      });
      document.querySelectorAll('[data-action="load-older-session-messages"]').forEach((btn) => {
        btn.addEventListener('click', () => loadOlderSessionMessages().catch((err) => setStatus(`加载更早消息失败：${err.message || err}`, 'err')));
      });
      const composer = qs('tg-session-message');
      if (composer) {
        composer.addEventListener('input', () => {
          state.draft.sessionMessage = composer.value;
          const sendBtn = document.querySelector('[data-action="send-session-message"]');
          if (sendBtn) {
            sendBtn.disabled = !state.selectedSessionTarget || state.sessionSending || !String(state.draft.sessionMessage || '').trim();
          }
        });
        composer.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendSessionMessage().catch((err) => setStatus(`发送消息失败：${err.message || err}`, 'err'));
          }
        });
      }
      document.querySelectorAll('[data-action="send-session-message"]').forEach((btn) => {
        btn.addEventListener('click', () => sendSessionMessage().catch((err) => setStatus(`发送消息失败：${err.message || err}`, 'err')));
      });
      document.querySelectorAll('[data-action="use-session-target"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const targetID = String(btn.getAttribute('data-target-id') || '').trim();
          if (!targetID) return;
          state.draft.scheduleTarget = targetID;
          state.activePanelTab = 'assistant';
          state.activeSubTab = 'scheduled-send';
          buildFilteredTargetList();
          renderPanelTabs();
          renderMain();
          setStatus(`已选择发送对象：${renderTargetLabel(targetID)}`, 'ok');
        });
      });
    }

    async function loadNotify(options = {}) {
      try {
        const ov = await requestJSON('/mng/api/tg/notify/get');
        state.notify.overview = ov || null;
        renderNotifyCard();
      } catch (error) {
        if (options.silent !== true) {
          setStatus(`加载通知设置失败：${error.message || error}`, 'err');
        }
      }
    }

    async function handleSaveNotify() {
      const accountID = String((qs('notify-account-select') || {}).value || '').trim();
      const enableOffline = !!(qs('notify-enable-offline') && qs('notify-enable-offline').checked);
      const enableRenewal = !!(qs('notify-enable-renewal') && qs('notify-enable-renewal').checked);
      const debounce = parseInt((qs('notify-debounce') || {}).value, 10);
      const checkHour = parseInt((qs('notify-check-hour') || {}).value, 10);
      state.notify.loading = true;
      renderNotifyCard();
      try {
        const payload = {
          notify_account_id: accountID,
          enable_offline: enableOffline,
          enable_renewal: enableRenewal,
          offline_debounce_sec: Number.isFinite(debounce) ? debounce : 0,
          renewal_check_hour: Number.isFinite(checkHour) ? checkHour : -1,
        };
        const ov = await requestJSON('/mng/api/tg/notify/set', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        state.notify.overview = ov || null;
        setStatus('已保存主控通知设置', 'ok');
      } finally {
        state.notify.loading = false;
        renderNotifyCard();
      }
    }

    async function handleTestNotify() {
      state.notify.loading = true;
      renderNotifyCard();
      try {
        await requestJSON('/mng/api/tg/notify/test', { method: 'POST' });
        setStatus('测试推送已发送', 'ok');
        await loadNotify({ silent: true });
      } finally {
        state.notify.loading = false;
        renderNotifyCard();
      }
    }

    function renderBasicInfoBlock(account) {
      return `
        <div class="tg-account-basic-list">
          <div class="tg-account-basic-row"><div class="tg-account-basic-label">当前账号</div><div class="tg-account-basic-value">${escapeHTML(account.label || '-')}</div></div>
          <div class="tg-account-basic-row"><div class="tg-account-basic-label">手机号</div><div class="tg-account-basic-value">${escapeHTML(account.phone || '-')}</div></div>

    function buildFilteredTargetList() {
      const keyword = String(state.draft.scheduleTargetSearch || '').trim().toLowerCase();
      let list = Array.isArray(state.targetList) ? state.targetList.slice() : [];
      if (keyword) {
        list = list.filter((item) => {
          const id = String(item.id || '').toLowerCase();
          const name = String(item.name || '').toLowerCase();
          const username = String(item.username || '').toLowerCase();
          return id.includes(keyword) || name.includes(keyword) || username.includes(keyword);
        });
      }
      if (state.draft.scheduleTarget.trim()) {
        const selected = state.targetList.find((item) => item.id === state.draft.scheduleTarget.trim());
        if (selected && !list.some((item) => item.id === selected.id)) {
          list = [selected, ...list];
        }
      }
      state.filteredTargetList = list;
      return list;
    }

    function bindStaticEvents() {
      qs('btn-back').addEventListener('click', () => {
        location.href = '/mng/panel';
      });
      qs('btn-logout').addEventListener('click', () => logout().catch(() => { location.href = '/mng'; }));
      document.querySelectorAll('[data-panel-tab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.activePanelTab = String(btn.getAttribute('data-panel-tab') || 'assistant');
          renderPanelTabs();
          if (state.activePanelTab === 'sessions') {
            const active = getActiveLoggedInAccount();

    async function loadData(options = {}) {
      const silent = options.silent === true;
      if (!silent) {
        state.loading = true;
        setStatus('正在加载 TG 设置与账号...');
        renderMain();
      }
      try {
        const [apiKey, accountsData] = await Promise.all([
          requestJSON('/mng/api/tg/api/get'),
          requestJSON('/mng/api/tg/accounts/list'),
        ]);
        state.api = apiKey || { api_id: 0, api_hash: '', configured: false };
        state.accounts = Array.isArray(accountsData.accounts) ? accountsData.accounts : [];
        syncSelectedAccounts();
        renderMain();
        renderTGSessionPanel();
        renderModal();
        loadNotify({ silent: true });
        if (!silent) {
          if (!state.api.configured) {
            setStatus('请先设置 API，再添加/登录账号', 'warn');
          } else {
            setStatus(state.accounts.length > 0 ? `已加载 TG 账号（${state.accounts.length} 个）` : '暂无 TG 账号，请先添加', 'ok');
          }
        }
      } catch (error) {
        if (!silent) {
          setStatus(`加载 TG 数据失败：${error.message || error}`, 'err');
        }
      } finally {
        if (!silent) {
          state.loading = false;
          renderMain();
          renderModal();
        }
      }
    }

    async function loadAccounts(options = {}) {
      const silent = options.silent === true;
      if (!silent) {
        setLoadingState({ loading: true });
        setStatus('正在加载 TG 账号列表...');
      }
      try {
        const payload = await requestJSON('/mng/api/tg/accounts/list');
        state.accounts = Array.isArray(payload.accounts) ? payload.accounts : [];
        syncSelectedAccounts();
        renderMain();
        renderTGSessionPanel();

          setStatus(state.accounts.length > 0 ? `已加载 TG 账号（${state.accounts.length} 个）` : '暂无 TG 账号，请先添加', 'ok');
        }
      } catch (error) {
        if (!silent) {
          setStatus(`加载 TG 账号失败：${error.message || error}`, 'err');
        }
      } finally {
        if (!silent) {
          setLoadingState({ loading: false });
        }
      }
    }

    async function loadSchedule(accountID, options = {}) {

      const requestSeq = state.scheduleRequestSeq + 1;
      state.scheduleRequestSeq = requestSeq;
      const silent = options.silent === true;
      state.scheduleLoading = true;
      renderMain();
      if (!silent) {
        setStatus('正在加载任务列表...');
      }
      try {
        const payload = await requestJSON('/mng/api/tg/schedule/list', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: normalizedAccountID }),
        });
        if (requestSeq !== state.scheduleRequestSeq) {
          return;
        }
        state.scheduleList = Array.isArray(payload.schedules) ? payload.schedules : [];
        renderMain();
        if (!silent) {
          const account = getActiveLoggedInAccount();
          setStatus(`已加载账号 ${account ? account.label : normalizedAccountID} 的任务列表（${state.scheduleList.length} 个）`, 'ok');
        }

        state.scheduleLoading = false;
        renderMain();

    async function loadTargets(accountID, options = {}) {

      if (!normalizedAccountID) return;
      const silent = options.silent === true;
      if (!silent) {
        setStatus('正在加载发送对象列表...');

      state.targetRefreshing = true;

      renderModal();

        if (!state.targetList.some((item) => item.id === state.draft.scheduleTarget)) {

        }
        syncSelectedSessionTarget();
        buildFilteredTargetList();
        renderTGSessionPanel();

    function syncSelectedSessionTarget() {
      const list = Array.isArray(state.targetList) ? state.targetList : [];
      if (list.some((item) => item && item.id === state.selectedSessionTarget)) {
        return;
      }
      state.selectedSessionTarget = list.length > 0 ? String(list[0].id || '') : '';
      state.sessionMessages = [];
    }

    async function loadSessionMessages(options = {}) {
      const account = getActiveLoggedInAccount();
      const targetID = String(state.selectedSessionTarget || '').trim();
      if (!account || !targetID) return;
      const silent = options.silent === true;
      const background = options.background === true;
      const preserveScroll = options.preserveScroll === true;
      const accountID = account.id;
      const beforeFingerprint = sessionMessagesFingerprint(state.sessionMessages);
      if (!background) {
        state.sessionLoading = true;
        renderTGSessionPanel();
        if (!silent) {
          setStatus('正在加载会话消息...');
        }
      }
      try {
        const payload = await requestJSON('/mng/api/tg/session/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: accountID, target: targetID, limit: 50 }),
        });
        if (!getActiveLoggedInAccount() || getActiveLoggedInAccount().id !== accountID || state.selectedSessionTarget !== targetID) {
          return;
        }
        const nextMessages = Array.isArray(payload.messages) ? payload.messages : [];
        const nextFingerprint = sessionMessagesFingerprint(nextMessages);
        if (nextFingerprint !== beforeFingerprint) {
          state.sessionMessages = nextMessages;
          renderTGSessionPanel(background ? { preserveScroll } : {});
        } else if (!background) {
          renderTGSessionPanel();
        }
        if (!silent && !background) {
          setStatus(`已加载会话消息（${state.sessionMessages.length} 条）`, 'ok');
        }
      } finally {
        if (!background) {
          state.sessionLoading = false;
          renderTGSessionPanel();
        }
      }
    }

    async function loadOlderSessionMessages() {
      const account = getActiveLoggedInAccount();
      const targetID = String(state.selectedSessionTarget || '').trim();
      if (!account || !targetID || state.sessionMessages.length === 0) return;
      const oldestID = state.sessionMessages.reduce((min, item) => {
        const id = Number(item && item.id || 0);
        return id > 0 && (min <= 0 || id < min) ? id : min;
      }, 0);
      if (oldestID <= 0) return;
      const accountID = account.id;
      state.sessionLoading = true;
      renderTGSessionPanel();
      setStatus('正在加载更早消息...');
      try {
        const payload = await requestJSON('/mng/api/tg/session/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: accountID, target: targetID, limit: 50, offset_id: oldestID }),
        });
        if (!getActiveLoggedInAccount() || getActiveLoggedInAccount().id !== accountID || state.selectedSessionTarget !== targetID) {
          return;
        }
        const older = Array.isArray(payload.messages) ? payload.messages : [];
        const seen = new Set(state.sessionMessages.map((item) => Number(item && item.id || 0)));
        state.sessionMessages = older.filter((item) => !seen.has(Number(item && item.id || 0))).concat(state.sessionMessages);
        renderTGSessionPanel();
        setStatus(`已加载更早消息（新增 ${older.length} 条）`, 'ok');
      } finally {
        state.sessionLoading = false;
        renderTGSessionPanel();
      }
    }

    async function sendSessionMessage() {
      const account = getActiveLoggedInAccount();
      const targetID = String(state.selectedSessionTarget || '').trim();
      const message = String(state.draft.sessionMessage || '').trim();
      if (!account || !targetID || !message || state.sessionSending) return;
      const accountID = account.id;
      state.sessionSending = true;
      renderTGSessionPanel();
      try {
        const payload = await requestJSON('/mng/api/tg/session/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: accountID, target: targetID, message }),
        });
        if (!getActiveLoggedInAccount() || getActiveLoggedInAccount().id !== accountID || state.selectedSessionTarget !== targetID) {
          return;
        }
        if (payload.message) {
          state.sessionMessages = state.sessionMessages.concat([payload.message]);
        }
        state.draft.sessionMessage = '';
        renderTGSessionPanel();
        setStatus('消息已发送', 'ok');
      } finally {
        state.sessionSending = false;
        renderTGSessionPanel();
      }
    }

    function startSessionAutoRefresh() {
      if (sessionRefreshTimer) return;
      const refresh = () => {
        if (document.hidden) return;
        const active = getActiveLoggedInAccount();
        const targetID = String(state.selectedSessionTarget || '').trim();
        if (!active || !targetID || state.sessionLoading || state.sessionSending) return;
        loadSessionMessages({ silent: true, background: true, preserveScroll: true }).catch(() => {});
      };
      sessionRefreshTimer = window.setInterval(refresh, SESSION_REFRESH_INTERVAL_MS);
      document.addEventListener('visibilitychange', refresh);

    function connectSessionWS() {
      const active = getActiveLoggedInAccount();
      const targetID = String(state.selectedSessionTarget || '').trim();
      if (!active || !targetID || !window.WebSocket) return false;
      if (state.sessionWS && state.sessionWS.readyState === WebSocket.OPEN) {
        return true;
      }
      try {
        const ws = new WebSocket(getSessionWSURL(active.id, targetID));
        state.sessionWS = ws;
        ws.onopen = () => {
          setStatus('TG 会话实时连接已建立', 'ok');
        };
        ws.onmessage = (event) => {
          let payload = null;
          try {
            payload = JSON.parse(event.data);
          } catch (_) {
            return;
          }
          if (!payload || payload.account_id !== active.id || payload.target !== targetID) return;
          if (payload.type === 'session.snapshot' && Array.isArray(payload.messages)) {
            const nextFingerprint = sessionMessagesFingerprint(payload.messages);
            if (nextFingerprint !== sessionMessagesFingerprint(state.sessionMessages)) {
              state.sessionMessages = payload.messages;
              renderTGSessionPanel({ preserveScroll: true });
            }
          } else if (payload.type === 'session.error') {
            setStatus(`实时连接已断开：${payload.error || 'unknown error'}`, 'warn');
          }
        };
        ws.onerror = () => {
          setStatus('TG 会话实时连接异常，已尝试回退', 'warn');
        };
        ws.onclose = () => {
          if (state.sessionWS === ws) state.sessionWS = null;
          window.setTimeout(() => {
            if (document.hidden) return;
            connectSessionWS();
          }, 1200);
        };
        return true;
      } catch (_) {
        return false;
      }
    }

      const active = getActiveLoggedInAccount();
      if (!active) {
        setStatus('请先选择一个已登录账号', 'warn');
        return;
      }

      const editingTaskID = String(state.draft.scheduleEditingTaskID || '').trim();
      const target = String(state.draft.scheduleTarget || '').trim();
      const sendAt = String(state.draft.scheduleSendAt || '').trim();
      const message = String(state.draft.scheduleMessage || '').trim();
      const delayMax = Number.parseInt(String(state.draft.scheduleDelayMax || '0').trim(), 10) || 0;
      const enabled = state.draft.scheduleEnabled === true;
      const isEditing = !!editingTaskID;

      if (!target) {
        setStatus('请先选择发送目标', 'warn');
        return;
      }
      if (enabled && !sendAt) {
        setStatus('请填写定时发送时间', 'warn');
        return;
      }
      if (enabled && !message) {
        setStatus('请填写定时发送内容', 'warn');
        return;
      }
      if (delayMax < 0) {
        setStatus('随机延时最大值不能小于 0', 'warn');
        return;
      }

      state.scheduleLoading = true;
      renderMain();
      renderModal();
      setStatus(isEditing ? `正在修改任务：${editingTaskID}...` : `正在为账号 ${active.label} 新增任务...`);
      try {
        const endpoint = isEditing ? '/mng/api/tg/schedule/update' : '/mng/api/tg/schedule/add';
        const payload = {
          account_id: active.id,
          task_id: editingTaskID,
          task_type: 'scheduled_send',
          enabled,
          target,
          send_at: sendAt,
          message,
          delay_min_sec: 0,
          delay_max_sec: delayMax,
        };
        const res = await requestJSON(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const schedules = Array.isArray(res.schedules) ? res.schedules : [];
        state.scheduleList = schedules;
        state.modal.scheduleTask = false;
        state.draft.scheduleEditingTaskID = '';
        state.draft.scheduleTargetSearch = '';

        await loadPendingTasks(active.id, { silent: true });
        setStatus(isEditing ? `任务已更新（当前共 ${schedules.length} 个）` : `已新增任务：${active.label}（当前共 ${schedules.length} 个）`, 'ok');
      } catch (error) {
        setStatus(`${isEditing ? '修改任务' : '新增任务'}失败：${error.message || error}`, 'err');
      } finally {
        state.scheduleLoading = false;
        renderMain();
        renderModal();
      }
    }

          setStatus(`TG BOT 测试发送成功：${text}`, 'ok');
        } else {
          setStatus(`TG BOT 测试发送成功：chat_id=${result.chat_id} message_id=${result.message_id}`, 'ok');
        }
      } catch (error) {
        setStatus(`TG BOT 测试发送失败：${error.message || error}`, 'err');
      } finally {
        state.botLoading = false;
        renderMain();
      }
    }

    async function ensureSession() {
      const payload = await requestJSON('/mng/api/session');
      if (!payload.authenticated) {
        location.href = '/mng';
        return false;
      }
      return true;
    }

    async function logout() {
      await fetch('/mng/api/logout', { method: 'POST', credentials: 'same-origin' });
      location.href = '/mng';
    }

    async function bootstrap() {
      bindStaticEvents();
      renderStatus();
      renderPanelTabs();
      renderMain();
      renderNotifyCard();
      renderModal();

      const ok = await ensureSession().catch(() => false);
      if (!ok) {
        location.href = '/mng';
        return;
      }

      await loadData();
      const active = getActiveLoggedInAccount();
      if (active) {
        await Promise.all([
          loadSchedule(active.id, { silent: true }),
          loadPendingTasks(active.id, { silent: true }),
          loadTargets(active.id, { silent: true }),
          loadBotAPIKey(active.id, { silent: true }),
        ]);
      }
      const consumedTarget = consumeSessionWindowTargetSelection();
      startSessionAutoRefresh();
      connectSessionWS();
      if (!consumedTarget) setStatus('TG 页面初始化完成', 'ok');
      renderMain();
      renderModal();
    }

    bootstrap().catch((err) => {
      setStatus(`初始化失败：${err && err.message ? err.message : err}`, 'err');
    });
  </script>
</body>
</html>
