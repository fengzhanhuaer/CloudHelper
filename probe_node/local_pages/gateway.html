<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>网关代理 - Probe Node</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#0d1117;color:#c9d1d9;font:14px system-ui}h1{font-size:24px;color:white}.tabs{display:flex;gap:16px;overflow-x:auto;border-bottom:1px solid #30363d;margin:20px 0}.tabs a{white-space:nowrap;color:#8b949e;text-decoration:none;padding:12px 0}.tabs .active{color:white;border-bottom:2px solid #58a6ff}section{max-width:950px;padding:20px;border:1px solid #30363d;border-radius:8px;background:#161b22}label{display:block;margin:16px 0 8px}textarea,select,button{background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:9px;font:inherit}textarea{width:100%;min-height:110px}select{max-width:100%;min-width:180px}button{cursor:pointer;margin:8px 8px 0 0}.primary{background:#1f6feb;color:white}.hint{color:#8b949e;line-height:1.7}#notice{white-space:pre-wrap}#selected{display:flex;gap:8px;flex-wrap:wrap}#selected button{overflow-wrap:anywhere;max-width:100%}@media(max-width:600px){body{padding:12px}section{padding:14px}}</style></head><body>
<h1>虚拟路由</h1><p class="hint">网关代理：允许指定探针访问本节点的局域网。</p><nav class="tabs"><a href="/local/virtual-router#status">路由设置</a><a href="/local/virtual-router#routeStatus">路由状态</a><a href="/local/virtual-router#connections">最近连接</a><a class="active" href="/local/virtual-router/gateway">网关代理</a><!-- product-virtual-router-subtabs --></nav>
<section><form id="form"><label><input id="enabled" type="checkbox"> 启用网关代理</label><label for="cidrs">代理网段</label><textarea id="cidrs" placeholder="192.168.50.0/24&#10;192.168.60.0/24" spellcheck="false"></textarea><p class="hint">每行一个私有 IPv4 网段，最多32个。目标设备看到的来源为本节点的 LAN 地址。</p><label for="nodes">允许远程访问的节点</label><select id="nodes"></select><button id="add" type="button">添加</button><div id="selected"></div><p class="hint">配置会保存在本机；获准节点收到网段路由后也会保存，重启恢复。主控同步可能需要片刻。</p><button class="primary" id="save" type="submit">保存并应用</button><button id="refresh" type="button">重新读取</button><p id="notice" role="status"></p></form></section>
<script>
const $=id=>document.getElementById(id);let allowed=[],nodes=[];
function renderSelected(){ $('selected').textContent='';for(const id of allowed){const b=document.createElement('button');b.type='button';b.textContent=(nodes.find(n=>n.node_id===id)?.display_name||id)+' ×';b.onclick=()=>{allowed=allowed.filter(v=>v!==id);renderSelected()};$('selected').appendChild(b)}}
async function request(body){const r=await fetch('/local/api/virtual_router/gateway',{method:body?'POST':'GET',credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data}
async function load(){try{const d=await request();nodes=d.nodes||[];allowed=d.config.allowed_node_ids||[];$('enabled').checked=d.config.enabled;$('cidrs').value=(d.config.proxy_cidrs||[]).join('\n');$('nodes').textContent='';for(const n of nodes.filter(n=>n.node_id!==d.node_id)){const o=document.createElement('option');o.value=n.node_id;o.textContent=n.display_name||n.node_id;$('nodes').appendChild(o)}renderSelected();$('notice').textContent='已读取本地配置'}catch(e){$('notice').textContent=e.message}}
$('add').onclick=()=>{const id=$('nodes').value;if(id&&!allowed.includes(id))allowed.push(id);renderSelected()};$('refresh').onclick=load;
$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{await request({enabled:$('enabled').checked,proxy_cidrs:$('cidrs').value.split(/[\s,;]+/).filter(Boolean),allowed_node_ids:allowed});$('notice').textContent='已保存，等待主控同步'}catch(e){$('notice').textContent=e.message}finally{$('save').disabled=false}};load();
</script></body></html>
