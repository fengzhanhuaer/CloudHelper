name: Build

on:
  push:
    branches:
      - mapledev
    paths-ignore:
      - 'version'

permissions:
  contents: read

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Version and Tag
        id: bump_version
        shell: bash
        run: |
          if [ ! -f "version" ]; then
            echo "0.0.0" > version
          fi

          VERSION=$(cat version | tr -d '\r')
          IFS='.' read -r -a parts <<< "$VERSION"
          patch=$((parts[2] + 1))
          NEW_VERSION="${parts[0]}.${parts[1]}.$patch"
          while git ls-remote --exit-code --tags origin "refs/tags/v$NEW_VERSION" >/dev/null 2>&1; do
            patch=$((patch + 1))
            NEW_VERSION="${parts[0]}.${parts[1]}.$patch"
          done
          echo "$NEW_VERSION" > version
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push

          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

  build-probe-controller:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tagged Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: v${{ needs.prepare-release.outputs.new_version }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: probe_controller/go.sum

      - name: Build Probe Controller (Linux amd64)
        working-directory: probe_controller
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
        shell: bash
        run: go build -ldflags "-X github.com/cloudhelper/probe_controller/internal/core.BuildVersion=v${NEW_VERSION}" -o cloudhelper-probe-controller-linux-amd64 .

      - name: Upload Probe Controller Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudhelper-probe-controller-linux-amd64
          path: probe_controller/cloudhelper-probe-controller-linux-amd64

  build-probe-node:
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: cloudhelper-probe-node-linux-amd64
            artifact_name: cloudhelper-probe-node-linux-amd64
          - goos: linux
            goarch: arm64
            output: cloudhelper-probe-node-linux-arm64
            artifact_name: cloudhelper-probe-node-linux-arm64
          - goos: windows
            goarch: amd64
            output: cloudhelper-probe-node-windows-amd64.exe
            artifact_name: cloudhelper-probe-node-windows-amd64.exe
    steps:
      - name: Checkout Tagged Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: v${{ needs.prepare-release.outputs.new_version }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: probe_node/go.sum

      - name: Build Probe Node (${{ matrix.goos }} ${{ matrix.goarch }})
        working-directory: probe_node
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
        shell: bash
        run: go build -ldflags "-X main.BuildVersion=v${NEW_VERSION}" -o ${{ matrix.output }} .

      - name: Upload Probe Node Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: probe_node/${{ matrix.output }}

  build-probe-exit-node:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tagged Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: v${{ needs.prepare-release.outputs.new_version }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: probe_node/go.sum

      - name: Build Mihomo Exit Probe (Linux amd64 only)
        working-directory: probe_node
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
        shell: bash
        run: go build -tags mihomo_exit -ldflags "-X main.BuildVersion=v${NEW_VERSION}" -o cloudhelper-probe-exit-node-linux-amd64 .

      - name: Upload Mihomo Exit Probe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudhelper-probe-exit-node-linux-amd64
          path: probe_node/cloudhelper-probe-exit-node-linux-amd64

  build-probe-node-docker:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Tagged Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: v${{ needs.prepare-release.outputs.new_version }}

      - name: Resolve Docker Image Name
        id: image
        shell: bash
        run: |
          IMAGE_REPO=$(printf 'ghcr.io/%s/cloudhelper-probe-node' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image_repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Probe Node Docker Image
        uses: docker/build-push-action@v6
        with:
          context: docker/probe_node
          file: docker/probe_node/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.image_repo }}:v${{ needs.prepare-release.outputs.new_version }}
            ${{ steps.image.outputs.image_repo }}:${{ needs.prepare-release.outputs.new_version }}
            ${{ steps.image.outputs.image_repo }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=v${{ needs.prepare-release.outputs.new_version }}

  build-probe-exit-node-docker:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Tagged Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: v${{ needs.prepare-release.outputs.new_version }}

      - name: Resolve Docker Image Name
        id: image
        shell: bash
        run: |
          IMAGE_REPO=$(printf 'ghcr.io/%s/cloudhelper-probe-exit-node-shell' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image_repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Mihomo Exit Probe Shell
        uses: docker/build-push-action@v6
        with:
          context: docker/probe_exit_node
          file: docker/probe_exit_node/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.image_repo }}:v${{ needs.prepare-release.outputs.new_version }}
            ${{ steps.image.outputs.image_repo }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=v${{ needs.prepare-release.outputs.new_version }}

  build-probe-node-android:
    needs: prepare-release
    runs-on: ubuntu-latest
    environment: android-release-signing
    steps:
      - name: Checkout Tagged Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: v${{ needs.prepare-release.outputs.new_version }}

      - name: Setup JDK for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Restore Android NDK cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          key: ${{ runner.os }}-android-ndk-27.2.12479018

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          accept_licenses() {
            set +o pipefail
            yes | "$SDKMANAGER" --licenses >/dev/null
            set -o pipefail
          }
          accept_licenses || true
          packages=(
            "platform-tools"
            "platforms;android-35"
            "build-tools;35.0.0"
          )
          if [ ! -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            packages+=("ndk;27.2.12479018")
          else
            echo "Using existing Android NDK at $ANDROID_HOME/ndk/27.2.12479018"
          fi
          install_packages() {
            "$SDKMANAGER" --install "${packages[@]}"
          }
          if ! install_packages; then
            echo "Android SDK install failed once; clearing partial downloads and retrying" >&2
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/temp"
            install_packages
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: probe_node/go.sum

      - name: Restore gomobile tool cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/gomobile
            ~/go/bin/gobind
            ~/go/pkg/gomobile
          key: ${{ runner.os }}-gomobile-go1.26.4-ndk27.2.12479018-${{ hashFiles('probe_node/go.mod', 'probe_node/go.sum') }}

      - name: Restore mobilecore AAR cache
        uses: actions/cache@v4
        with:
          path: probe_node_android/app/libs/mobilecore.aar
          key: ${{ runner.os }}-mobilecore-aar-go1.26.4-ndk27.2.12479018-${{ hashFiles('probe_node/**/*.go', 'probe_node/go.mod', 'probe_node/go.sum') }}

      - name: Build Probe Node Android mobilecore AAR
        working-directory: probe_node
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        shell: bash
        run: |
          mkdir -p ../probe_node_android/app/libs
          if [ -f ../probe_node_android/app/libs/mobilecore.aar ]; then
            echo "Using cached mobilecore.aar"
            exit 0
          fi
          export PATH="$(go env GOPATH)/bin:$PATH"
          export GOFLAGS="-mod=mod"
          GOMOBILE_ROOT="$(go env GOPATH)/pkg/gomobile"
          go mod download
          if ! command -v gomobile >/dev/null 2>&1; then
            go install -mod=mod golang.org/x/mobile/cmd/gomobile
          fi
          if ! command -v gobind >/dev/null 2>&1; then
            go install -mod=mod golang.org/x/mobile/cmd/gobind
          fi
          if [ -d "$GOMOBILE_ROOT" ]; then
            echo "Using cached gomobile init at $GOMOBILE_ROOT"
          else
            gomobile init
          fi
          gomobile bind \
            -target=android/arm64 \
            -androidapi 26 \
            -o ../probe_node_android/app/libs/mobilecore.aar \
            ./mobilecore

      - name: Build Probe Node Android unsigned release (arm64)
        working-directory: probe_node_android
        env:
          CLOUDHELPER_VERSION: v${{ needs.prepare-release.outputs.new_version }}
        shell: bash
        run: gradle :app:assembleRelease -PcloudhelperAndroidUnsignedRelease=true

      - name: Stage Probe Node Android unsigned APK
        shell: bash
        run: cp probe_node_android/app/build/outputs/apk/release/app-release-unsigned.apk probe_node_android/cloudhelper-probe-node-android-arm64-unsigned.apk

      - name: Restore Android signing key
        env:
          CLOUDHELPER_ANDROID_KEYSTORE_BASE64: ${{ secrets.CLOUDHELPER_ANDROID_KEYSTORE_BASE64 }}
          CLOUDHELPER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CLOUDHELPER_ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set +x
          if [ -z "$CLOUDHELPER_ANDROID_KEYSTORE_BASE64" ] || [ -z "$CLOUDHELPER_ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "Android signing secrets are incomplete. Configure CLOUDHELPER_ANDROID_KEYSTORE_BASE64 and CLOUDHELPER_ANDROID_KEYSTORE_PASSWORD in the android-release-signing environment." >&2
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/cloudhelper-android-signing"
          printf '%s' "$CLOUDHELPER_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cloudhelper-android-signing/release.p12"

      - name: Sign Probe Node Android APK
        env:
          CLOUDHELPER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CLOUDHELPER_ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set +x
          ZIPALIGN="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          SIGNING_PASS_FILE="$RUNNER_TEMP/cloudhelper-android-signing/keystore.pass"
          printf '%s' "$CLOUDHELPER_ANDROID_KEYSTORE_PASSWORD" > "$SIGNING_PASS_FILE"
          chmod 600 "$SIGNING_PASS_FILE"
          "$ZIPALIGN" -p -f 4 probe_node_android/cloudhelper-probe-node-android-arm64-unsigned.apk probe_node_android/cloudhelper-probe-node-android-arm64-aligned.apk
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/cloudhelper-android-signing/release.p12" \
            --ks-type PKCS12 \
            --ks-pass "file:$SIGNING_PASS_FILE" \
            --out probe_node_android/cloudhelper-probe-node-android-arm64.apk \
            probe_node_android/cloudhelper-probe-node-android-arm64-aligned.apk
          "$APKSIGNER" verify --verbose probe_node_android/cloudhelper-probe-node-android-arm64.apk

      - name: Clean Android signing material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/cloudhelper-android-signing"

      - name: Upload Probe Node Android signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudhelper-probe-node-android-arm64.apk
          path: probe_node_android/cloudhelper-probe-node-android-arm64.apk

  create-release:
    needs:
      - prepare-release
      - build-probe-controller
      - build-probe-node
      - build-probe-exit-node
      - build-probe-node-docker
      - build-probe-exit-node-docker
      - build-probe-node-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Tagged Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: v${{ needs.prepare-release.outputs.new_version }}

      - name: Download Probe Controller Artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudhelper-probe-controller-linux-amd64
          path: release-assets

      - name: Download Probe Node Artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudhelper-probe-node-linux-amd64
          path: release-assets

      - name: Download Probe Node Artifact (arm64)
        uses: actions/download-artifact@v4
        with:
          name: cloudhelper-probe-node-linux-arm64
          path: release-assets

      - name: Download Probe Node Artifact (windows amd64)
        uses: actions/download-artifact@v4
        with:
          name: cloudhelper-probe-node-windows-amd64.exe
          path: release-assets

      - name: Download Mihomo Exit Probe Artifact (linux amd64)
        uses: actions/download-artifact@v4
        with:
          name: cloudhelper-probe-exit-node-linux-amd64
          path: release-assets

      - name: Download Probe Node Android Artifact (arm64)
        uses: actions/download-artifact@v4
        with:
          name: cloudhelper-probe-node-android-arm64.apk
          path: release-assets

      - name: Generate Mihomo Exit Paired Upgrade Manifest
        shell: bash
        env:
          NEW_VERSION: ${{ needs.prepare-release.outputs.new_version }}
        run: |
          PROGRAM_SHA256=$(sha256sum release-assets/cloudhelper-probe-exit-node-linux-amd64 | awk '{print $1}')
          cat > release-assets/cloudhelper-probe-exit-node-manifest.json <<EOF
          {
            "schema_version": 1,
            "version": "v${NEW_VERSION}",
            "build_kind": "mihomo_exit",
            "os": "linux",
            "arch": "amd64",
            "compatible_program_versions": {"min": "v${NEW_VERSION}", "max": "v${NEW_VERSION}"},
            "program": {"asset": "cloudhelper-probe-exit-node-linux-amd64", "sha256": "${PROGRAM_SHA256}"},
            "mihomo": {
              "version": "v1.19.29",
              "asset": "mihomo-linux-amd64-compatible-v1.19.29.gz",
              "url": "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.29/mihomo-linux-amd64-compatible-v1.19.29.gz",
              "sha256": "5612e698e96c8b8ad15abc4c0a4f098eba9234354b4f248cb97f2528e215b094"
            }
          }
          EOF

      - name: Stage Mihomo License
        shell: bash
        run: cp THIRD_PARTY_LICENSES/mihomo-LICENSE release-assets/mihomo-LICENSE

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-release.outputs.new_version }}
          name: Release v${{ needs.prepare-release.outputs.new_version }}
          files: |
            release-assets/cloudhelper-probe-controller-linux-amd64
            release-assets/cloudhelper-probe-node-linux-amd64
            release-assets/cloudhelper-probe-node-linux-arm64
            release-assets/cloudhelper-probe-node-windows-amd64.exe
            release-assets/cloudhelper-probe-exit-node-linux-amd64
            release-assets/cloudhelper-probe-exit-node-manifest.json
            release-assets/mihomo-LICENSE
            release-assets/cloudhelper-probe-node-android-arm64.apk
