<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CloudHelper 路由管理</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family:Segoe UI,Roboto,Arial,sans-serif; background:#0d1117; color:#c9d1d9; }
    .wrap { width:calc(100vw - 32px); margin:3vh auto; padding:20px; box-sizing:border-box; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
    h1 { margin:0; font-size:24px; }
    .sub { color:#8b949e; margin:6px 0 0; font-size:13px; }
    .btn { padding:8px 12px; border-radius:8px; border:1px solid #30363d; background:#21262d; color:#c9d1d9; cursor:pointer; transition:border-color .16s ease, background .16s ease, transform .16s ease; }
    .btn:hover { border-color:#58a6ff; background:#262f3a; transform:translateY(-1px); }
    .btn.primary { background:#1f6feb; border-color:#2f81f7; color:#fff; }
    .btn.danger { background:#2b181b; border-color:#6e2b33; color:#ffb3ad; }
    .btn.danger:hover { border-color:#ff7b72; background:#3a2024; }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .status { margin:8px 0 12px; border-radius:8px; border:1px solid #30363d; background:#161b22; padding:10px; font-size:13px; white-space:pre-wrap; }
    .status.ok { color:#7ee787; }
    .status.warn { color:#f2cc60; }
    .status.err { color:#ff7b72; }
    .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .tab { padding:8px 12px; border-radius:999px; border:1px solid #30363d; background:#161b22; color:#c9d1d9; cursor:pointer; }
    .tab.active { border-color:#58a6ff; color:#58a6ff; }
    .panel { border:1px solid #30363d; border-radius:12px; background:#161b22; padding:14px; box-shadow:0 18px 48px rgba(0,0,0,.22); }
    .section { display:none; }
    .section.active { display:block; }
    .row { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
    .row label { min-width:92px; color:#8b949e; font-size:13px; }
    input, select, textarea { background:#0d1117; color:#c9d1d9; border:1px solid #30363d; border-radius:8px; padding:7px 8px; min-width:160px; outline:none; transition:border-color .16s ease, box-shadow .16s ease; }
    input:focus, select:focus, textarea:focus { border-color:#58a6ff; box-shadow:0 0 0 3px rgba(88,166,255,.14); }
    textarea { width:100%; min-height:150px; box-sizing:border-box; resize:vertical; line-height:1.45; }
    input.small, select.small { min-width:110px; }
    input.wide, select.wide { min-width:260px; }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th, td { border-bottom:1px solid #30363d; padding:10px 8px; text-align:left; vertical-align:top; font-size:13px; }
    th { color:#8b949e; font-weight:600; }
    tbody tr:hover td { background:rgba(88,166,255,.035); }
    .mono { font-family:Consolas,monospace; }
    .muted { color:#8b949e; }
    .small { font-size:12px; }
    .stack { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .stack > .box { min-width:0; }
    @media (max-width: 1080px) { .stack { grid-template-columns:1fr; } }
    .box { border:1px solid #30363d; border-radius:10px; padding:12px; background:#111820; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .toolbar-actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
    .summary-pill { display:inline-flex; align-items:center; min-height:30px; padding:0 10px; border:1px solid #30363d; border-radius:999px; background:#0d1117; color:#9fb1c1; }
    .config-grid { display:grid; grid-template-columns:120px minmax(120px, 180px) 120px minmax(240px, 1fr); gap:10px; align-items:center; }
    .config-grid label { color:#8b949e; font-size:13px; }
    @media (max-width: 820px) { .toolbar { align-items:flex-start; flex-direction:column; } .config-grid { grid-template-columns:1fr; } }
    .box-title { display:flex; align-items:center; justify-content:space-between; gap:8px; color:#c9d1d9; font-weight:600; }
    .box-title::before { content:""; width:8px; height:8px; border-radius:999px; background:#2ea043; box-shadow:0 0 0 4px rgba(46,160,67,.12); }
    .box-title.filterable { justify-content:flex-start; flex-wrap:wrap; }
    .filter-control { display:flex; align-items:center; gap:8px; margin-left:auto; color:#8b949e; font-size:12px; font-weight:400; }
    .filter-control > span { flex:0 0 auto; white-space:nowrap; }
    .filter-control select { flex:1; min-width:180px; }
    .table-shell { overflow:auto; margin-top:8px; border:1px solid #30363d; border-radius:10px; }
    .table-shell table { margin-top:0; }
    .table-shell th { background:#0d1117; position:sticky; top:0; z-index:1; }
    .table-shell tr:last-child td { border-bottom:0; }
    .check-cell { text-align:center; vertical-align:middle; width:54px; }
    .check-cell input { min-width:0; width:18px; height:18px; accent-color:#2ea043; }
    .fake-ip-toolbar { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .fake-ip-scroll { max-height:260px; overflow:auto; }
    .doh-config { display:grid; grid-template-columns:120px minmax(0, 1fr); gap:10px; align-items:center; }
    .doh-config label { color:#8b949e; font-size:13px; }
    .doh-config input[type="checkbox"] { min-width:0; width:18px; height:18px; accent-color:#2ea043; }
    .doh-config input[type="text"] { width:100%; min-width:0; box-sizing:border-box; }
    .doh-endpoint { display:flex; align-items:center; gap:8px; min-width:0; }
    .doh-endpoint input { flex:1; cursor:pointer; }
    .doh-record-scroll { max-height:480px; overflow:auto; }
    .doh-answer { max-width:360px; white-space:normal; overflow-wrap:anywhere; }
    .doh-status { display:inline-block; font-size:12px; border-radius:999px; padding:2px 8px; border:1px solid #30363d; }
    .doh-status.ok { color:#7ee787; border-color:#238636; }
    .doh-status.rejected { color:#f2cc60; border-color:#9e6a03; }
    .doh-status.error { color:#ff7b72; border-color:#da3633; }
    .route-state { display:inline-block; font-size:12px; border-radius:999px; padding:2px 8px; border:1px solid #30363d; }
    .route-state.ok { color:#7ee787; border-color:#238636; }
    .route-state.warn { color:#f2cc60; border-color:#9e6a03; }
    .route-state.err { color:#ff7b72; border-color:#da3633; }
    .route-error { color:#ff7b72; }
    .endpoint-stack { display:grid; gap:7px; min-width:260px; }
    .endpoint-row { display:grid; grid-template-columns:58px minmax(0, 1fr); align-items:center; gap:6px; }
    .endpoint-row .label { color:#8b949e; font-size:12px; }
    .endpoint-row input, .endpoint-row select { min-width:0; width:100%; box-sizing:border-box; }
    .endpoint-hint { padding-left:64px; color:#8b949e; font-size:12px; line-height:1.4; }
    .name-input { min-width:220px; width:100%; box-sizing:border-box; }
    .rule-editor { min-width:360px; }
    .route-rule-actions { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .special-exit-layout { display:grid; grid-template-columns:minmax(0, 1fr); gap:12px; }
    .special-exit-layout[hidden] { display:none; }
    .special-exit-subtabs { display:flex; gap:6px; margin-bottom:12px; border-bottom:1px solid #30363d; }
    .special-exit-subtab { padding:9px 12px; border:0; border-bottom:2px solid transparent; background:transparent; color:#8b949e; cursor:pointer; }
    .special-exit-subtab.active { color:#58a6ff; border-bottom-color:#58a6ff; }
    .special-exit-subpane[hidden] { display:none; }
    .special-exit-layout textarea { min-height:88px; }
    .special-exit-rule-grid { display:grid; grid-template-columns:minmax(260px, 2fr) minmax(220px, 1fr); gap:12px; align-items:end; }
    .special-exit-rule-grid > * { min-width:0; width:100%; box-sizing:border-box; }
    .special-exit-field { display:grid; gap:6px; color:#8b949e; font-size:12px; }
    .special-exit-field textarea, .special-exit-field select { min-width:0; width:100%; box-sizing:border-box; }
    .special-exit-rule-name { color:#c9d1d9; font-weight:600; }
    .special-exit-status-list { display:grid; gap:8px; margin-top:10px; }
    .special-exit-status-item { border-top:1px solid #30363d; padding-top:8px; overflow-wrap:anywhere; }
    .special-exit-connectivity-row { padding:8px 0; border-bottom:1px solid #30363d; overflow-wrap:anywhere; }
    .special-exit-connectivity-row:last-child { border-bottom:0; }
    .special-exit-subscriptions { display:grid; gap:10px; margin-top:10px; }
    .special-exit-subscription { border-top:1px solid #30363d; padding-top:10px; }
    .special-exit-subscription-grid { display:grid; grid-template-columns:minmax(140px, 1fr) minmax(280px, 2fr) auto auto auto; gap:8px; align-items:center; }
    .special-exit-subscription-grid > * { min-width:0; width:100%; box-sizing:border-box; }
    .special-exit-proxy-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:0 16px; max-height:240px; overflow:auto; margin-top:10px; }
    .special-exit-proxy-item { border-top:1px solid #30363d; padding:8px 0; overflow-wrap:anywhere; }
    .special-exit-proxy-group { min-width:0; }
    .special-exit-proxy-group-title { grid-column:1 / -1; padding:10px 0 6px; color:#8b949e; font-size:12px; font-weight:600; }
    .special-exit-layout .box-title > span:first-child { flex:0 0 auto; white-space:nowrap; }
    @media (max-width: 820px) { .special-exit-rule-grid, .special-exit-subscription-grid { grid-template-columns:1fr; } }
    @media (max-width: 620px) {
      .box-title.filterable { align-items:flex-start; flex-direction:column; }
      .filter-control { width:100%; margin-left:0; }
      .filter-control select { width:auto; min-width:0; box-sizing:border-box; }
      .doh-config { grid-template-columns:1fr; }
      .doh-endpoint { align-items:stretch; flex-direction:column; }
      .special-exit-layout .box-title { align-items:flex-start; flex-wrap:wrap; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>/mng/route</h1>
        <p class="sub">路由管理：虚拟路由拓扑规则与运行状态。</p>
      </div>
      <div>
        <button id="btn-back" class="btn" type="button">返回磁贴面板</button>
        <button id="btn-logout" class="btn" type="button">退出登录</button>
      </div>
    </div>

    <div id="status-box" class="status">初始化中...</div>

    <div class="tabs">
      <button class="tab active" data-tab="topology" type="button">拓扑规则</button>
      <button class="tab" data-tab="route-rules" type="button">路由规则</button>
      <button class="tab" data-tab="special-exits" type="button">二次分流</button>
      <button class="tab" data-tab="fake-ip" type="button">Fake IP</button>
      <button class="tab" data-tab="doh" type="button">DoH</button>
      <button class="tab" data-tab="route" type="button">路由状态</button>
    </div>

    <div class="panel">
      <section id="section-topology" class="section active">
        <div class="toolbar">
          <div class="toolbar-actions">
            <button id="btn-vr-refresh" class="btn" type="button">刷新拓扑</button>
            <button id="btn-vr-add-rule" class="btn" type="button">添加规则</button>
            <button id="btn-vr-save" class="btn primary" type="button">保存拓扑</button>
          </div>
          <span id="vr-summary" class="summary-pill small">未加载</span>
        </div>
        <div class="box" style="margin-bottom:12px;">
          <div class="config-grid">
            <label for="vr-enabled">启用</label>
            <select id="vr-enabled" class="small">
              <option value="true">启用</option>
              <option value="false">禁用</option>
            </select>
            <label for="vr-cidr">FakeIP CIDR</label>
            <input id="vr-cidr" class="wide mono" value="198.18.0.0/15" />
          </div>
        </div>
        <div class="stack">
          <div class="box">
            <div class="box-title"><span>探针静态 IP</span></div>
            <div class="table-shell">
              <table>
                <thead>
                  <tr>
                    <th>探针</th>
                    <th>静态 IP</th>
                    <th>端口</th>
                  </tr>
                </thead>
                <tbody id="vr-ip-body"></tbody>
              </table>
            </div>
          </div>
          <div class="box">
            <div class="box-title filterable">
              <span>拓扑规则</span>
              <label class="filter-control" for="vr-rule-node-filter">
                <span>筛选探针</span>
                <select id="vr-rule-node-filter" class="small">
                  <option value="">全部探针</option>
                </select>
              </label>
            </div>
            <div class="table-shell">
              <table>
                <thead>
                  <tr>
                    <th>启用</th>
                    <th>A 端（主动）</th>
                    <th>B 端（监听）</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="vr-rule-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <section id="section-route-rules" class="section">
        <div class="row">
          <button id="btn-route-rules-refresh" class="btn" type="button">刷新路由规则</button>
          <button id="btn-route-rule-add" class="btn" type="button">创建路由规则</button>
          <button id="btn-route-rules-save" class="btn primary" type="button">保存路由规则</button>
          <span id="route-rules-summary" class="small muted">未加载</span>
        </div>
        <table>
          <thead>
            <tr>
              <th style="width:260px;">路由规则</th>
              <th style="width:220px;">处理方式</th>
              <th>条目</th>
              <th style="width:150px;">操作</th>
            </tr>
          </thead>
          <tbody id="route-rules-body"></tbody>
        </table>
      </section>

      <section id="section-special-exits" class="section">
        <div class="special-exit-subtabs" role="tablist" aria-label="二次分流配置">
          <button class="special-exit-subtab active" data-special-exit-tab="subscriptions" type="button">Clash 订阅</button>
          <button class="special-exit-subtab" data-special-exit-tab="nodes" type="button">探针出口</button>
        </div>
        <div id="special-exit-pane-subscriptions" class="special-exit-subpane">
          <div class="toolbar">
            <div class="toolbar-actions">
              <button id="btn-special-exit-library-refresh" class="btn" type="button">刷新</button>
              <button id="btn-special-exit-subscription-add" class="btn" type="button">添加订阅</button>
              <button id="btn-special-exit-library-save" class="btn primary" type="button">保存订阅</button>
            </div>
            <span id="special-exit-library-summary" class="summary-pill small">未加载</span>
          </div>
          <div class="box">
            <div class="box-title"><span>Clash 订阅</span></div>
            <div id="special-exit-subscriptions" class="special-exit-subscriptions"></div>
          </div>
          <div class="box" style="margin-top:12px;">
            <div class="box-title"><span>已提取节点</span><span id="special-exit-proxy-count" class="muted small">0 个</span></div>
            <div id="special-exit-proxies" class="special-exit-proxy-list"></div>
          </div>
        </div>
        <div id="special-exit-pane-nodes" class="special-exit-subpane" hidden>
          <div class="toolbar">
            <div class="toolbar-actions">
              <button id="btn-special-exit-refresh" class="btn" type="button">刷新</button>
              <button id="btn-special-exit-save" class="btn primary" type="button">保存</button>
              <button id="btn-special-exit-delete" class="btn danger" type="button">删除配置</button>
            </div>
            <span id="special-exit-summary" class="summary-pill small">未加载</span>
          </div>
          <div class="box" style="margin-bottom:12px;">
            <div class="config-grid">
              <label for="special-exit-node">特殊探针</label>
              <select id="special-exit-node"></select>
            </div>
          </div>
          <div id="special-exit-empty" class="box muted small">请选择特殊探针。</div>
          <div id="special-exit-detail" class="special-exit-layout" hidden>
            <div class="box">
              <div class="box-title"><span>路由规则出口</span></div>
              <div id="special-exit-rules" class="special-exit-status-list"></div>
            </div>
            <div class="box" style="margin-top:12px;">
              <div class="box-title"><span>运行状态</span></div>
              <div id="special-exit-status-list" class="special-exit-status-list"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="section-fake-ip" class="section">
        <div class="row">
          <button id="btn-fake-ip-refresh" class="btn" type="button">刷新 Fake IP</button>
          <button id="btn-fake-ip-reset" class="btn" type="button">重置全部 Fake IP</button>
          <span id="fake-ip-library-summary" class="small muted">未加载</span>
        </div>
        <div class="row">
          <label for="fake-ip-search">搜索</label>
          <input id="fake-ip-search" class="wide" type="search" placeholder="域名 / Fake IP / 动作 / 规则 / 出口 / 过期时间" autocomplete="off" />
        </div>
        <div class="fake-ip-scroll">
          <table>
            <thead>
              <tr>
                <th>域名</th>
                <th>Fake IP</th>
                <th>动作</th>
                <th>规则/出口</th>
                <th>过期时间</th>
              </tr>
            </thead>
            <tbody id="fake-ip-library-body"></tbody>
          </table>
        </div>
      </section>

      <section id="section-doh" class="section">
        <div class="toolbar">
          <div class="toolbar-actions">
            <button id="btn-doh-refresh" class="btn" type="button">刷新</button>
            <button id="btn-doh-save" class="btn primary" type="button">保存配置</button>
            <button id="btn-doh-rotate-token" class="btn danger" type="button">轮换令牌</button>
          </div>
          <span id="doh-service-summary" class="summary-pill small">未加载</span>
        </div>
        <div class="box" style="margin-bottom:12px;">
          <div class="doh-config">
            <label for="doh-enabled">启用 DoH</label>
            <input id="doh-enabled" type="checkbox" />
            <label for="doh-upstream">直连上游</label>
            <input id="doh-upstream" type="text" class="mono" placeholder="https://dns.alidns.com/dns-query" autocomplete="off" />
            <label for="doh-endpoint">DoH 端点</label>
            <div class="doh-endpoint">
              <input id="doh-endpoint" type="text" class="mono" readonly title="点击复制 DoH 端点" />
              <button id="btn-doh-copy" class="btn" type="button">复制端点</button>
            </div>
          </div>
        </div>
        <div class="toolbar">
          <div class="toolbar-actions">
            <button id="btn-doh-query-refresh" class="btn" type="button">刷新记录</button>
            <button id="btn-doh-query-clear" class="btn danger" type="button">清空记录</button>
            <input id="doh-query-search" class="wide" type="search" placeholder="域名 / 客户端 / 应答 / 规则 / 出口" autocomplete="off" />
            <select id="doh-query-action" class="small">
              <option value="">全部动作</option>
              <option value="fake_ip">Fake IP</option>
              <option value="direct">直连</option>
              <option value="reject">拒绝</option>
            </select>
            <select id="doh-query-status" class="small">
              <option value="">全部状态</option>
              <option value="ok">成功</option>
              <option value="rejected">已拒绝</option>
              <option value="error">失败</option>
            </select>
          </div>
          <span id="doh-query-summary" class="summary-pill small">暂无记录</span>
        </div>
        <div class="table-shell doh-record-scroll">
          <table>
            <thead>
              <tr>
                <th>时间</th>
                <th>客户端</th>
                <th>域名</th>
                <th>类型</th>
                <th>动作</th>
                <th>应答 / 出口</th>
                <th>状态</th>
                <th>耗时</th>
              </tr>
            </thead>
            <tbody id="doh-query-body"></tbody>
          </table>
        </div>
      </section>

      <section id="section-route" class="section">
        <div class="row">
          <button id="btn-vr-status-refresh" class="btn" type="button">刷新路由状态</button>
          <button id="btn-vr-latency-probe" class="btn primary" type="button">立即延迟探测</button>
          <label for="vr-status-node-filter">筛选探针</label>
          <select id="vr-status-node-filter" class="small">
            <option value="">全部探针</option>
          </select>
          <label for="vr-speed-source">源节点</label>
          <select id="vr-speed-source"></select>
          <label for="vr-speed-target">目的节点</label>
          <select id="vr-speed-target"></select>
          <button id="btn-vr-speed-test" class="btn primary" type="button">测速</button>
          <span id="vr-status-summary" class="small muted">暂无状态</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>运行态</th>
              <th>状态</th>
              <th>探针 A</th>
              <th>探针 B</th>
              <th>统计</th>
              <th>虚拟 Ping</th>
              <th>最近活动</th>
            </tr>
          </thead>
          <tbody id="vr-status-body"></tbody>
        </table>
      </section>
    </div>
  </div>

  <script>
    const DEFAULTS = {
      virtualRouterServicePort: 12040,
    };

    const state = {
      activeTab: 'topology',
      nodes: [],
      virtualRouterStatus: [],
      routeRules: [],
      specialExits: [],
      specialExitLibrary: { subscriptions: [], proxy_names: [], proxy_options: [] },
      specialExitLibraryDraft: null,
      specialExitSubTab: 'subscriptions',
      specialExitStatuses: [],
      specialExitRouteRules: [],
      selectedSpecialExitNodeID: '',
      specialExitDrafts: {},
      fakeIPSearch: '',
      doh: { enabled: false, upstream: '', endpoint_path: '', updated_at: '' },
      dohQueries: [],
      dohQuerySummary: {},
      dohQuerySearch: '',
      dohQueryAction: '',
      dohQueryStatus: '',
      dohRefreshTimer: 0,
      virtualRouterRuleNodeFilterID: '',
      virtualRouterStatusNodeFilterID: '',
      virtualRouterSpeedSourceID: '',
      virtualRouterSpeedTargetID: '',
      virtualRouter: {
        enabled: true,
        fake_ip_cidr: '198.18.0.0/15',
        probe_ips: [],
        topology_rules: [],
        fake_ip_library: { version: 1, updated_at: '', items: [] },
      },
      virtualRouterNodeIDs: [],
      cloudflareDDNSRecords: [],
      virtualRouterCFDomains: [],
    };

    function setStatus(message, level) {
      const box = document.getElementById('status-box');
      box.textContent = String(message || '');
      box.className = 'status';
      if (level) box.classList.add(level);
    }

    async function requestJSON(url, options = {}) {
      const response = await fetch(url, { credentials: 'same-origin', ...options });
      let payload = {};
      try { payload = await response.json(); } catch (_) {}
      if (!response.ok) {
        const msg = payload && payload.error ? payload.error : `HTTP ${response.status}`;
        throw new Error(msg);
      }
      return payload;
    }

    function escapeHTML(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeNodeID(raw) {
      const value = String(raw || '').trim();
      if (!value) return '';
      const n = Number.parseInt(value, 10);
      if (!Number.isFinite(n) || n <= 0) return '';
      return String(n);
    }

    function normalizePort(raw, fallback = 0) {
      const n = Number.parseInt(String(raw || ''), 10);
      if (!Number.isFinite(n) || n <= 0 || n > 65535) return fallback;
      return n;
    }

    function formatBytes(value) {
      const n = Number(value || 0);
      if (!Number.isFinite(n) || n <= 0) return '0 B';
      if (n >= 1024 * 1024 * 1024) return `${(n / 1024 / 1024 / 1024).toFixed(1)} GB`;
      if (n >= 1024 * 1024) return `${(n / 1024 / 1024).toFixed(1)} MB`;
      if (n >= 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${Math.round(n)} B`;
    }

    async function ensureSession() {
      const payload = await requestJSON('/mng/api/session');
      if (!payload.authenticated) {
        location.href = '/mng';
        return false;
      }
      return true;
    }

    async function loadNodes() {
      const payload = await requestJSON('/mng/api/probe/nodes');
      state.nodes = Array.isArray(payload.nodes)
        ? payload.nodes
          .map((item) => ({
            node_no: Number.parseInt(String(item.node_no || '0'), 10),
            node_name: String(item.node_name || '').trim(),
            node_kind: String(item.node_kind || 'normal').trim() || 'normal',
          }))
          .filter((item) => Number.isFinite(item.node_no) && item.node_no > 0)
          .sort((a, b) => a.node_no - b.node_no)
        : [];
    }

    async function loadCloudflareDDNSRecords() {
      const payload = await requestJSON('/mng/api/cloudflare/ddns/records');
      state.cloudflareDDNSRecords = Array.isArray(payload.records) ? payload.records : [];
    }

    async function loadVirtualRouter(silent) {
      const payload = await requestJSON('/mng/api/route/virtual_router');
      state.virtualRouter = payload.item || {
        enabled: true,
        fake_ip_cidr: '198.18.0.0/15',
        probe_ips: [],
        topology_rules: [],
        route_rules: [],
        fake_ip_library: { version: 1, updated_at: '', items: [] },
      };
      state.routeRules = Array.isArray(state.virtualRouter.route_rules) ? state.virtualRouter.route_rules : state.routeRules;
      state.virtualRouterNodeIDs = Array.isArray(payload.node_ids) ? payload.node_ids.map((v) => String(v || '').trim()).filter(Boolean) : [];
      state.virtualRouterCFDomains = Array.isArray(payload.cf_domains) ? payload.cf_domains : [];
      renderVirtualRouter();
      renderFakeIPLibrary();
      if (!silent) setStatus('拓扑规则已刷新', 'ok');
    }

    async function loadVirtualRouterStatus(silent) {
      const payload = await requestJSON('/mng/api/route/virtual_router/status');
      state.virtualRouterStatus = Array.isArray(payload.items) ? payload.items : [];
      renderVirtualRouterStatus();
      if (!silent) setStatus(`路由状态已刷新：${state.virtualRouterStatus.length} 条`, 'ok');
    }

    async function refreshVirtualRouterStatusWithReport() {
      const payload = await requestJSON('/mng/api/route/virtual_router/status', { method: 'POST' });
      const sync = payload.sync || {};
      const total = Number(sync.total || 0);
      const dispatched = Number(sync.dispatched || 0);
      const offline = Number(sync.offline || 0);
      const failed = Number(sync.failed || 0);
      setStatus(`已召唤状态上报：${dispatched}/${total}，离线 ${offline}，失败 ${failed}`, failed > 0 ? 'warn' : 'ok');
      await loadVirtualRouterStatus(true);
      window.setTimeout(() => {
        loadVirtualRouterStatus(true).catch((err) => setStatus(`刷新路由状态失败：${err.message || err}`, 'err'));
      }, 900);
    }

    async function loadRouteRules(silent) {
      const payload = await requestJSON('/mng/api/route/virtual_router/route_rules');
      state.routeRules = Array.isArray(payload.items) ? payload.items : [];
      state.virtualRouter.route_rules = state.routeRules;
      renderRouteRules();
      renderFakeIPLibrary();
      if (!silent) setStatus(`路由规则已刷新：${state.routeRules.length} 个`, 'ok');
    }

    function blankSpecialExitDraft(nodeID) {
      return {
        node_id: normalizeNodeID(nodeID), rules: [],
      };
    }

    function editableSpecialExitSubscriptions(saved, current) {
      const draftsByID = new Map((Array.isArray(current) ? current : []).map((item) => [String(item.id || ''), item]));
      return (Array.isArray(saved) ? saved : []).map((item, index) => {
        const existing = draftsByID.get(String(item.id || '')) || {};
        return {
          id: String(item.id || `subscription-${index + 1}`),
          name: String(existing.name || item.name || `订阅 ${index + 1}`),
          enabled: existing.enabled === undefined ? item.enabled !== false : existing.enabled !== false,
          url: String(existing.url || ''), configured: item.configured === true,
          last_subscription_refresh_at: String(item.last_subscription_refresh_at || ''),
          last_subscription_refresh_error: String(item.last_subscription_refresh_error || ''),
        };
      });
    }

    function currentSpecialExitDraft() {
      const nodeID = normalizeNodeID(state.selectedSpecialExitNodeID);
      if (!nodeID) return null;
      if (!state.specialExitDrafts[nodeID]) {
        const saved = state.specialExits.find((item) => normalizeNodeID(item.node_id) === nodeID);
        state.specialExitDrafts[nodeID] = saved
          ? { ...blankSpecialExitDraft(nodeID), ...JSON.parse(JSON.stringify(saved)) }
          : blankSpecialExitDraft(nodeID);
      }
      return state.specialExitDrafts[nodeID];
    }

    async function loadSpecialExits(silent) {
      const [configs, library, statuses] = await Promise.all([
        requestJSON('/mng/api/route/special_exits'),
        requestJSON('/mng/api/route/special_exit_subscriptions'),
        requestJSON('/mng/api/route/special_exits/status'),
      ]);
      state.specialExits = Array.isArray(configs.items) ? configs.items : [];
      const currentLibraryDraft = state.specialExitLibraryDraft || {};
      state.specialExitLibrary = library || { subscriptions: [], proxy_names: [], proxy_options: [] };
      state.specialExitLibraryDraft = {
        ...JSON.parse(JSON.stringify(state.specialExitLibrary)),
        subscriptions: editableSpecialExitSubscriptions(state.specialExitLibrary.subscriptions, currentLibraryDraft.subscriptions),
      };
      state.specialExitRouteRules = Array.isArray(configs.route_rules) ? configs.route_rules : [];
      state.specialExitStatuses = Array.isArray(statuses.items) ? statuses.items : [];
      const candidates = state.nodes.filter((item) => item.node_kind === 'mihomo_exit');
      if (!candidates.some((item) => normalizeNodeID(item.node_no) === normalizeNodeID(state.selectedSpecialExitNodeID))) {
        state.selectedSpecialExitNodeID = '';
      }
      state.specialExits.forEach((saved) => {
        const nodeID = normalizeNodeID(saved.node_id);
        state.specialExitDrafts[nodeID] = {
          ...blankSpecialExitDraft(nodeID), ...JSON.parse(JSON.stringify(saved)),
        };
      });
      renderSpecialExits();
      if (!silent) setStatus(`二次分流已刷新：${state.specialExits.length} 个特殊探针`, 'ok');
    }

    function renderSpecialExits() {
      document.querySelectorAll('[data-special-exit-tab]').forEach((button) => button.classList.toggle('active', button.dataset.specialExitTab === state.specialExitSubTab));
      document.getElementById('special-exit-pane-subscriptions').hidden = state.specialExitSubTab !== 'subscriptions';
      document.getElementById('special-exit-pane-nodes').hidden = state.specialExitSubTab !== 'nodes';
      const candidates = state.nodes.filter((item) => item.node_kind === 'mihomo_exit');
      const nodeSelect = document.getElementById('special-exit-node');
      nodeSelect.innerHTML = candidates.length
        ? '<option value="">请选择特殊探针</option>' + candidates.map((item) => `<option value="${escapeHTML(item.node_no)}">#${escapeHTML(item.node_no)} ${escapeHTML(item.node_name || '')}</option>`).join('')
        : '<option value="">暂无特殊探针</option>';
      nodeSelect.value = normalizeNodeID(state.selectedSpecialExitNodeID);
      const draft = currentSpecialExitDraft();
      document.getElementById('special-exit-detail').hidden = !draft;
      const empty = document.getElementById('special-exit-empty');
      empty.hidden = !!draft;
      empty.textContent = candidates.length ? '请选择特殊探针。' : '暂无特殊探针，请先在探针管理中创建 Mihomo 出口探针。';
      document.getElementById('btn-special-exit-save').disabled = !draft;
      document.getElementById('btn-special-exit-delete').disabled = !draft || !state.specialExits.some((item) => normalizeNodeID(item.node_id) === normalizeNodeID(draft.node_id));
      renderSpecialExitSubscriptions();
      renderSpecialExitProxies();
      renderSpecialExitRules(draft);
      renderSpecialExitStatus();
      const configured = state.specialExits.length;
      document.getElementById('special-exit-summary').textContent = `已配置 ${configured}`;
      const library = state.specialExitLibrary || {};
      document.getElementById('special-exit-library-summary').textContent = `${Array.isArray(library.subscriptions) ? library.subscriptions.length : 0} 个订阅 · ${Array.isArray(library.proxy_names) ? library.proxy_names.length : 0} 个节点`;
    }

    function renderSpecialExitSubscriptions() {
      const host = document.getElementById('special-exit-subscriptions');
      const draft = state.specialExitLibraryDraft;
      const subscriptions = draft && Array.isArray(draft.subscriptions) ? draft.subscriptions : [];
      if (!subscriptions.length) {
        host.innerHTML = '<div class="muted small">暂无 Clash 配置。</div>';
        return;
      }
      host.innerHTML = subscriptions.map((source, index) => {
        const configured = source.configured ? '已保存URL' : '未保存URL';
        const refresh = source.last_subscription_refresh_error
          ? `<span class="route-error">${escapeHTML(source.last_subscription_refresh_error)}</span>`
          : escapeHTML(source.last_subscription_refresh_at || '未刷新');
        return `<div class="special-exit-subscription" data-special-exit-subscription="${index}">
          <div class="special-exit-subscription-grid">
            <input data-se-subscription-name="${index}" type="text" value="${escapeHTML(source.name || '')}" placeholder="配置名称" />
            <input data-se-subscription-url="${index}" class="mono" type="url" value="${escapeHTML(source.url || '')}" placeholder="Clash 配置 URL（留空保留）" autocomplete="url" />
            <select data-se-subscription-enabled="${index}"><option value="true" ${source.enabled === false ? '' : 'selected'}>使用</option><option value="false" ${source.enabled === false ? 'selected' : ''}>停用</option></select>
            <button class="btn" data-se-subscription-refresh="${index}" type="button">提取节点</button>
            <button class="btn danger" data-se-subscription-remove="${index}" type="button">删除</button>
          </div>
          <div class="small muted" style="margin-top:8px;">${configured} · ${refresh}</div>
        </div>`;
      }).join('');
      bindSpecialExitSubscriptionEvents();
    }

    function bindSpecialExitSubscriptionEvents() {
      const draft = state.specialExitLibraryDraft;
      if (!draft) return;
      document.querySelectorAll('[data-se-subscription-name]').forEach((element) => element.addEventListener('input', () => {
        const index = Number(element.dataset.seSubscriptionName);
        if (draft.subscriptions[index]) draft.subscriptions[index].name = String(element.value || '');
      }));
      document.querySelectorAll('[data-se-subscription-enabled]').forEach((element) => element.addEventListener('change', () => {
        const index = Number(element.dataset.seSubscriptionEnabled);
        if (draft.subscriptions[index]) draft.subscriptions[index].enabled = element.value !== 'false';
      }));
      document.querySelectorAll('[data-se-subscription-url]').forEach((element) => element.addEventListener('input', () => {
        const index = Number(element.dataset.seSubscriptionUrl);
        if (draft.subscriptions[index]) draft.subscriptions[index].url = String(element.value || '').trim();
      }));
      document.querySelectorAll('[data-se-subscription-remove]').forEach((element) => element.addEventListener('click', () => {
        const index = Number(element.dataset.seSubscriptionRemove);
        if (index >= 0 && index < draft.subscriptions.length) draft.subscriptions.splice(index, 1);
        renderSpecialExitSubscriptions();
      }));
      document.querySelectorAll('[data-se-subscription-refresh]').forEach((element) => element.addEventListener('click', () => {
        refreshSpecialExitSubscription(Number(element.dataset.seSubscriptionRefresh)).catch((err) => setStatus(`提取节点失败：${err.message || err}`, 'err'));
      }));
    }

    function addSpecialExitSubscription() {
      const draft = state.specialExitLibraryDraft;
      if (!draft) return;
      const sequence = draft.subscriptions.length + 1;
      const existingIDs = new Set(draft.subscriptions.map((item) => String(item.id || '')));
      let id = '';
      do { id = `subscription-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`; } while (existingIDs.has(id));
      draft.subscriptions.push({ id, name: `Clash 配置 ${sequence}`, enabled: true, url: '', configured: false });
      renderSpecialExitSubscriptions();
    }

    function renderSpecialExitProxies() {
      const library = state.specialExitLibrary || {};
      const options = Array.isArray(library.proxy_options) ? library.proxy_options : [];
      const groups = new Map();
      options.forEach((option) => {
        const source = String(option.subscription_name || '未标记来源');
        if (!groups.has(source)) groups.set(source, []);
        groups.get(source).push(String(option.name || ''));
      });
      document.getElementById('special-exit-proxy-count').textContent = `${options.length} 个`;
      document.getElementById('special-exit-proxies').innerHTML = options.length
        ? Array.from(groups.entries()).map(([source, names]) => `<div class="special-exit-proxy-group"><div class="special-exit-proxy-group-title">${escapeHTML(source)} · ${names.length}</div>${names.map((name) => `<div class="special-exit-proxy-item">${escapeHTML(name)}</div>`).join('')}</div>`).join('')
        : '<div class="muted small">尚未提取节点。</div>';
    }

    function assignedSpecialExitRules(draft) {
      if (!draft) return [];
      const targets = new Map((Array.isArray(draft.rules) ? draft.rules : []).map((rule) => [String(rule.route_rule_id || ''), String(rule.target || 'DIRECT').trim() || 'DIRECT']));
      return (Array.isArray(state.specialExitRouteRules) ? state.specialExitRouteRules : [])
        .filter((rule) => routeRuleAction(rule) === 'probe_exit' && normalizeNodeID(rule.exit_node_id) === normalizeNodeID(draft.node_id))
        .map((rule) => ({
          route_rule_id: String(rule.id || ''),
          name: String(rule.name || rule.id || ''),
          target: targets.get(String(rule.id || '')) || 'DIRECT',
        }));
    }

    function renderSpecialExitRules(draft) {
      const host = document.getElementById('special-exit-rules');
      const rules = assignedSpecialExitRules(draft);
      if (draft) draft.rules = rules;
      if (!rules.length) {
        host.innerHTML = '<div class="muted small">暂无指向当前探针的路由规则。</div>';
        return;
      }
      const proxyOptions = Array.isArray(state.specialExitLibrary.proxy_options) ? state.specialExitLibrary.proxy_options : [];
      const proxyNames = proxyOptions.map((option) => String(option.name || ''));
      host.innerHTML = rules.map((rule, index) => {
        const target = String(rule.target || 'DIRECT').trim() || 'DIRECT';
        const unavailable = target !== 'DIRECT' && !proxyNames.includes(target)
          ? `<option value="${escapeHTML(target)}" selected>${escapeHTML(target)}（不可用）</option>`
          : '';
        return `<div class="special-exit-status-item" data-special-exit-rule="${index}">
        <div class="special-exit-rule-grid">
          <div class="special-exit-rule-name">${escapeHTML(rule.name || rule.route_rule_id)}</div>
          <label class="special-exit-field"><span>出口方式</span><select data-se-rule-target="${index}"><option value="DIRECT" ${target === 'DIRECT' ? 'selected' : ''}>直出</option>${unavailable}${proxyOptions.map((option) => { const name = String(option.name || ''); const source = String(option.subscription_name || '未标记来源'); return `<option value="${escapeHTML(name)}" ${name === target ? 'selected' : ''}>${escapeHTML(source)} / ${escapeHTML(name)}</option>`; }).join('')}</select></label>
        </div>
      </div>`;
      }).join('');
      bindSpecialExitRuleEvents();
    }

    function renderSpecialExitStatus() {
      const host = document.getElementById('special-exit-status-list');
      const nodeID = normalizeNodeID(state.selectedSpecialExitNodeID);
      const item = state.specialExitStatuses.find((status) => normalizeNodeID(status.node_id) === nodeID);
      if (!nodeID || !item) {
        host.innerHTML = '<div class="muted small">当前探针暂无运行状态，保存配置并等待探针上报。</div>';
        return;
      }
      const correctBuild = item.build_kind === 'mihomo_exit';
      const synchronized = Number(item.desired_revision || 0) > 0
        && Number(item.desired_revision || 0) === Number(item.applied_revision || 0)
        && String(item.desired_sha256 || '').toLowerCase() === String(item.applied_sha256 || '').toLowerCase();
      const ready = item.online && correctBuild && synchronized && item.exit_ready && item.healthy;
      const stateClass = ready ? 'ok' : 'err';
      const stateText = !item.online ? '离线' : !correctBuild ? '安装包不匹配' : !synchronized ? '配置未同步' : ready ? '就绪' : '未就绪';
      const error = item.last_apply_error ? `<div class="route-error small">${escapeHTML(item.last_apply_error)}</div>` : '';
      const connectivity = Array.isArray(item.connectivity) ? item.connectivity : [];
      const selectedTargets = assignedSpecialExitRules(currentSpecialExitDraft()).map((rule) => String(rule.target || '')).filter((target) => target && target !== 'DIRECT');
      const connectivityRows = connectivity.length
        ? connectivity.map((result) => {
          const label = result.subscription_name ? `${result.subscription_name} / ${result.target}` : result.target;
          const resultClass = result.reachable ? 'ok' : 'err';
          const resultText = result.reachable ? `${Number(result.latency_ms || 0)} ms` : (result.error || '不可达');
          return `<div class="special-exit-connectivity-row"><div>${escapeHTML(label)} <span class="route-state ${resultClass}">${result.reachable ? '可达' : '不可达'}</span></div><div class="small muted">${escapeHTML(resultText)} · ${escapeHTML(result.checked_at || '等待探测')}</div></div>`;
        }).join('')
        : `<div class="muted small">${selectedTargets.length ? '等待探测。' : '当前规则未选择二级节点。'}</div>`;
      host.innerHTML = `<div class="special-exit-status-item"><div>${escapeHTML(nodeLabel(item.node_id))} <span class="route-state ${stateClass}">${stateText}</span></div><div class="small muted">探针 ${escapeHTML(item.probe_version || '-')} · Mihomo ${escapeHTML(item.mihomo_version || '-')}</div><div class="small muted">会话 ${escapeHTML(item.active_sessions || 0)} · ↑ ${escapeHTML(formatBytes(item.bytes_up))} · ↓ ${escapeHTML(formatBytes(item.bytes_down))}</div>${error}</div><div class="special-exit-status-item"><div class="special-exit-rule-name">出口连通性</div>${connectivityRows}</div>`;
    }

    function bindSpecialExitRuleEvents() {
      const draft = currentSpecialExitDraft();
      if (!draft) return;
      const setValue = (selector, field, transform) => document.querySelectorAll(selector).forEach((element) => {
        const apply = () => {
          const index = Number.parseInt(element.getAttribute(selector.slice(1, -1)) || '-1', 10);
          if (index >= 0 && index < draft.rules.length) draft.rules[index][field] = transform(element);
        };
        element.addEventListener(element.tagName === 'TEXTAREA' || element.tagName === 'INPUT' ? 'input' : 'change', apply);
      });
      setValue('[data-se-rule-target]', 'target', (element) => String(element.value || '').trim());
    }

    function captureSpecialExitPayload() {
      const draft = currentSpecialExitDraft();
      if (!draft) throw new Error('请选择特殊探针');
      const proxyNames = new Set((Array.isArray(state.specialExitLibrary.proxy_names) ? state.specialExitLibrary.proxy_names : []).map(String));
      for (const [index, rule] of (draft.rules || []).entries()) {
        const target = String(rule.target || 'DIRECT').trim() || 'DIRECT';
        if (target !== 'DIRECT' && !proxyNames.has(target)) throw new Error(`路由规则 ${index + 1} 请选择有效的出口节点`);
      }
      return {
        node_id: draft.node_id,
        rules: (draft.rules || []).map((rule) => ({ route_rule_id: rule.route_rule_id, target: String(rule.target || 'DIRECT').trim() || 'DIRECT' })),
      };
    }

    function captureSpecialExitLibraryPayload() {
      const draft = state.specialExitLibraryDraft;
      if (!draft) throw new Error('Clash 订阅尚未加载');
      return {
        subscriptions: (draft.subscriptions || []).map((source) => ({
          id: source.id, name: source.name, enabled: source.enabled !== false, url: source.url || '',
        })),
      };
    }

    async function persistSpecialExit() {
      const item = captureSpecialExitPayload();
      const result = await requestJSON('/mng/api/route/special_exits', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item }) });
      state.specialExitDrafts[item.node_id] = { ...blankSpecialExitDraft(item.node_id), ...JSON.parse(JSON.stringify(result.item || item)) };
      return { item, result };
    }

    async function saveSpecialExit() {
      const { item, result } = await persistSpecialExit();
      await Promise.all([loadVirtualRouter(true), loadRouteRules(true), loadSpecialExits(true)]);
      const sync = result.sync || {};
      if (Number(sync.failed || 0) > 0) {
        setStatus(`二次分流已保存，但下发失败：${nodeLabel(item.node_id)}`, 'warn');
        return;
      }
      if (Number(sync.offline || 0) > 0 || Number(sync.dispatched || 0) === 0) {
        setStatus(`二次分流已保存，探针当前离线：${nodeLabel(item.node_id)}`, 'warn');
        return;
      }
      const desired = result.item || {};
      const applied = await waitForSpecialExitApplied(item.node_id, desired.desired_revision, desired.desired_sha256, 8000);
      setStatus(applied ? `二次分流已保存并同步：${nodeLabel(item.node_id)}` : `二次分流已下发，等待探针应用：${nodeLabel(item.node_id)}`, applied ? 'ok' : 'warn');
    }

    async function waitForSpecialExitApplied(nodeID, revision, sha256Value, timeoutMS) {
      const deadline = Date.now() + timeoutMS;
      while (Date.now() < deadline) {
        await new Promise((resolve) => window.setTimeout(resolve, 450));
        await loadSpecialExits(true);
        const item = state.specialExitStatuses.find((status) => normalizeNodeID(status.node_id) === normalizeNodeID(nodeID));
        if (item && Number(item.applied_revision || 0) === Number(revision || 0) && String(item.applied_sha256 || '').toLowerCase() === String(sha256Value || '').toLowerCase()) return true;
        if (item && item.last_apply_error) return false;
      }
      return false;
    }

    async function persistSpecialExitLibrary() {
      const item = captureSpecialExitLibraryPayload();
      const result = await requestJSON('/mng/api/route/special_exit_subscriptions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item }) });
      state.specialExitLibrary = result.library || state.specialExitLibrary;
      state.specialExitLibraryDraft = { ...JSON.parse(JSON.stringify(state.specialExitLibrary)), subscriptions: editableSpecialExitSubscriptions(state.specialExitLibrary.subscriptions, []) };
      return result;
    }

    async function saveSpecialExitLibrary() {
      await persistSpecialExitLibrary();
      await loadSpecialExits(true);
      setStatus('全局 Clash 订阅已保存', 'ok');
    }

    async function refreshSpecialExitSubscription(index) {
      const draft = state.specialExitLibraryDraft;
      if (!draft || !draft.subscriptions[index]) throw new Error('订阅不存在');
      const subscriptionID = String(draft.subscriptions[index].id || '');
      await persistSpecialExitLibrary();
      const result = await requestJSON('/mng/api/route/special_exits/subscription/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ subscription_id: subscriptionID }) });
      await loadSpecialExits(true);
      const skipped = Number(result.skipped_proxy_count || 0);
      const skippedText = skipped > 0 ? `，已跳过 ${skipped} 个 Mihomo 不支持的 AnyTLS+Reality 节点` : '';
      setStatus(`节点提取完成：${Number(result.proxy_count || 0)} 个节点${skippedText}`, 'ok');
    }

    async function deleteSpecialExit() {
      const draft = currentSpecialExitDraft();
      if (!draft || !window.confirm(`确认删除 ${nodeLabel(draft.node_id)} 的二次分流配置？`)) return;
      await requestJSON('/mng/api/route/special_exits', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ node_id: draft.node_id }) });
      delete state.specialExitDrafts[draft.node_id];
      await Promise.all([loadVirtualRouter(true), loadRouteRules(true), loadSpecialExits(true)]);
      setStatus('二次分流配置已删除', 'ok');
    }

    async function loadDoHSettings(silent) {
      const payload = await requestJSON('/mng/api/route/doh');
      state.doh = payload.item || { enabled: false, upstream: '', endpoint_path: '', updated_at: '' };
      renderDoHSettings();
      if (!silent) setStatus('DoH 配置已刷新', 'ok');
    }

    async function loadDoHQueries(silent) {
      const payload = await requestJSON('/mng/api/route/doh/queries?limit=500');
      state.dohQueries = Array.isArray(payload.items) ? payload.items : [];
      state.dohQuerySummary = payload.summary || {};
      renderDoHQueries();
      if (!silent) setStatus(`DoH 查询记录已刷新：${state.dohQueries.length} 条`, 'ok');
    }

    function renderDoHSettings() {
      const item = state.doh || {};
      document.getElementById('doh-enabled').checked = !!item.enabled;
      document.getElementById('doh-upstream').value = String(item.upstream || '');
      const endpointPath = String(item.endpoint_path || '').trim();
      const endpoint = endpointPath ? `${location.origin}${endpointPath}` : '';
      document.getElementById('doh-endpoint').value = endpoint;
      const summary = document.getElementById('doh-service-summary');
      summary.textContent = item.enabled ? '服务已启用' : '服务已停用';
      summary.style.color = item.enabled ? '#7ee787' : '#8b949e';
    }

    function formatDoHTimestamp(value) {
      const date = new Date(String(value || ''));
      if (Number.isNaN(date.getTime())) return String(value || '-');
      return date.toLocaleString('zh-CN', { hour12: false });
    }

    function dohActionLabel(value) {
      const labels = { fake_ip: 'Fake IP', direct: '直连', reject: '拒绝' };
      return labels[String(value || '')] || String(value || '-');
    }

    function dohStatusLabel(value) {
      const labels = { ok: '成功', rejected: '已拒绝', error: '失败' };
      return labels[String(value || '')] || String(value || '-');
    }

    function renderDoHQueries() {
      const search = String(state.dohQuerySearch || '').trim().toLowerCase();
      const action = String(state.dohQueryAction || '');
      const status = String(state.dohQueryStatus || '');
      const filtered = (Array.isArray(state.dohQueries) ? state.dohQueries : []).filter((item) => {
        if (action && String(item.action || '') !== action) return false;
        if (status && String(item.status || '') !== status) return false;
        if (!search) return true;
        const haystack = [
          item.client_ip,
          item.domain,
          item.query_type,
          item.action,
          item.rule_id,
          item.rule_name,
          item.exit_node_id,
          item.status,
          item.error,
          ...(Array.isArray(item.answers) ? item.answers : []),
        ].join(' ').toLowerCase();
        return haystack.includes(search);
      });
      const body = document.getElementById('doh-query-body');
      if (!filtered.length) {
        body.innerHTML = `<tr><td colspan="8" class="muted">${state.dohQueries.length ? '没有匹配的 DoH 查询记录。' : '暂无 DoH 查询记录。'}</td></tr>`;
      } else {
        body.innerHTML = filtered.map((item) => {
          const answers = Array.isArray(item.answers) && item.answers.length ? item.answers.join(', ') : '-';
          const exit = item.exit_node_id ? nodeLabel(item.exit_node_id) : '';
          const rule = item.rule_name || item.rule_id || '';
          const answerDetails = [answers, exit ? `出口 ${exit}` : '', rule ? `规则 ${rule}` : ''].filter(Boolean);
          const error = item.error ? `<div class="route-error small">${escapeHTML(item.error)}</div>` : '';
          return `<tr>
            <td class="mono small">${escapeHTML(formatDoHTimestamp(item.timestamp))}</td>
            <td class="mono">${escapeHTML(item.client_ip || '-')}</td>
            <td><span class="mono" data-doh-copy="${escapeHTML(item.domain || '')}" title="点击复制域名">${escapeHTML(item.domain || '-')}</span></td>
            <td class="mono">${escapeHTML(item.query_type || '-')}</td>
            <td>${escapeHTML(dohActionLabel(item.action))}</td>
            <td class="doh-answer">${answerDetails.map((value) => `<div>${escapeHTML(value)}</div>`).join('')}</td>
            <td><span class="doh-status ${escapeHTML(item.status || '')}">${escapeHTML(dohStatusLabel(item.status))}</span>${error}</td>
            <td class="mono">${escapeHTML(String(Number(item.latency_ms || 0)))} ms</td>
          </tr>`;
        }).join('');
      }
      const summary = state.dohQuerySummary || {};
      document.getElementById('doh-query-summary').textContent = `显示 ${filtered.length}/${Number(summary.total || state.dohQueries.length || 0)} · Fake IP ${Number(summary.fake_ip || 0)} · 直连 ${Number(summary.direct || 0)} · 拒绝 ${Number(summary.reject || 0)} · 失败 ${Number(summary.error || 0)}`;
    }

    async function saveDoHSettings(rotateToken) {
      const enabled = document.getElementById('doh-enabled').checked;
      const upstream = String(document.getElementById('doh-upstream').value || '').trim();
      const payload = await requestJSON('/mng/api/route/doh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled, upstream, rotate_token: !!rotateToken }),
      });
      state.doh = payload.item || state.doh;
      renderDoHSettings();
      setStatus(rotateToken ? 'DoH 访问令牌已轮换，旧端点已失效' : 'DoH 配置已保存', 'ok');
    }

    async function clearDoHQueries() {
      if (!window.confirm('确认清空全部 DoH 查询记录？此操作不会影响 DoH 配置和 Fake IP 映射。')) return;
      const payload = await requestJSON('/mng/api/route/doh/queries', { method: 'DELETE' });
      state.dohQueries = Array.isArray(payload.items) ? payload.items : [];
      state.dohQuerySummary = payload.summary || {};
      renderDoHQueries();
      setStatus('DoH 查询记录已清空', 'ok');
    }

    async function copyDoHValue(value, label) {
      const text = String(value || '').trim();
      if (!text) throw new Error('没有可复制的内容');
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
      }
      setStatus(`${label || '内容'}已复制`, 'ok');
    }

    function updateDoHRefreshTimer() {
      if (state.dohRefreshTimer) {
        window.clearInterval(state.dohRefreshTimer);
        state.dohRefreshTimer = 0;
      }
      if (state.activeTab !== 'doh') return;
      state.dohRefreshTimer = window.setInterval(() => {
        loadDoHQueries(true).catch((err) => setStatus(`刷新 DoH 查询记录失败：${err.message || err}`, 'err'));
      }, 3000);
    }

    function nodeLabel(nodeID) {
      const clean = normalizeNodeID(nodeID);
      const node = state.nodes.find((item) => String(item.node_no || '') === clean);
      return node ? `#${node.node_no} ${node.node_name || ''}`.trim() : `#${clean || '-'}`;
    }

    function cloudflareDomainCandidates(nodeID) {
      const normalized = normalizeNodeID(nodeID);
      const seen = new Set();
      const rows = [];
      (Array.isArray(state.virtualRouterCFDomains) ? state.virtualRouterCFDomains : []).forEach((item) => {
        const name = String(item && item.domain || '').trim();
        if (!name || seen.has(name)) return;
        const itemNodeID = normalizeNodeID(item && (item.node_id || item.node_no));
        if (normalized && itemNodeID !== normalized) return;
        seen.add(name);
        rows.push({
          name,
          source: 'cloudflare',
          source_label: 'CF',
          content_ip: '',
        });
      });
      (Array.isArray(state.cloudflareDDNSRecords) ? state.cloudflareDDNSRecords : []).forEach((item) => {
        const name = String(item && item.record_name || '').trim();
        if (!name || seen.has(name)) return;
        const itemNodeID = normalizeNodeID(item && (item.node_id || item.node_no));
        if (normalized && itemNodeID !== normalized) return;
        seen.add(name);
        rows.push({
          name,
          source: 'ddns',
          source_label: 'DDNS',
          content_ip: String(item && item.content_ip || '').trim(),
        });
      });
      rows.sort((a, b) => a.name.localeCompare(b.name));
      return rows;
    }

    function virtualRouterDomainSelect(rule, idx, side) {
      const domainKey = side === 'from' ? 'from_service_domain' : 'to_service_domain';
      const nodeKey = side === 'from' ? 'from_node_id' : 'to_node_id';
      const value = String(rule && rule[domainKey] || '').trim();
      const options = cloudflareDomainCandidates(rule && rule[nodeKey]);
      const hasCurrent = value && options.some((item) => item.name === value);
      const rows = [`<option value="" ${value ? '' : 'selected'}>不使用域名</option>`];
      if (value && !hasCurrent) rows.push(`<option value="${escapeHTML(value)}" selected>${escapeHTML(value)} (当前)</option>`);
      options.forEach((item) => {
        rows.push(`<option value="${escapeHTML(item.name)}" ${item.name === value ? 'selected' : ''}>${escapeHTML(item.name)}</option>`);
      });
      return `<select data-vr-domain-select="${idx}" data-vr-domain-side="${escapeHTML(side)}">${rows.join('')}</select>`;
    }

    function reconcileVirtualRouterDomainForNode(rule, side) {
      if (!rule || (side !== 'from' && side !== 'to')) return;
      const domainKey = side === 'from' ? 'from_service_domain' : 'to_service_domain';
      const nodeKey = side === 'from' ? 'from_node_id' : 'to_node_id';
      const value = String(rule[domainKey] || '').trim();
      if (!value) return;
      const options = cloudflareDomainCandidates(rule[nodeKey]);
      if (!options.some((item) => item.name === value)) rule[domainKey] = '';
    }

    function virtualRouterNodeOptions(selected) {
      const ids = state.virtualRouterNodeIDs.length
        ? state.virtualRouterNodeIDs
        : state.nodes.map((item) => String(item.node_no || '')).filter(Boolean);
      return ids.map((id) => `<option value="${escapeHTML(id)}" ${String(selected || '') === String(id) ? 'selected' : ''}>${escapeHTML(nodeLabel(id))}</option>`).join('');
    }

    function normalizeVirtualRouterRouteLayer(raw) {
      const value = String(raw || '').trim().toLowerCase();
      if (value === 'http2' || value === 'h2' || value === 'http' || value === 'https' || value === 'websocket' || value === 'ws' || value === 'wss') return 'http2';
      if (value === 'http3' || value === 'h3' || value === 'quic' || value === 'websocket-h3' || value === 'ws-h3') return 'http3';
      return 'auto';
    }

    function virtualRouterRouteLayerSelect(rule, idx) {
      const value = normalizeVirtualRouterRouteLayer(rule && rule.route_layer);
      return `<select data-vr-route-layer="${idx}">
        <option value="auto" ${value === 'auto' ? 'selected' : ''}>auto</option>
        <option value="http2" ${value === 'http2' ? 'selected' : ''}>http2</option>
        <option value="http3" ${value === 'http3' ? 'selected' : ''}>http3</option>
      </select>`;
    }

    function virtualRouterSpeedNodeIDs() {
      const ids = new Set();
      (state.virtualRouterNodeIDs || []).forEach((id) => {
        const clean = normalizeNodeID(id);
        if (clean) ids.add(clean);
      });
      const cfg = state.virtualRouter || {};
      (cfg.probe_ips || []).forEach((item) => {
        const clean = normalizeNodeID(item && item.node_id);
        if (clean) ids.add(clean);
      });
      (cfg.topology_rules || []).forEach((rule) => {
        const from = normalizeNodeID(rule && rule.from_node_id);
        const to = normalizeNodeID(rule && rule.to_node_id);
        if (from) ids.add(from);
        if (to) ids.add(to);
      });
      (state.virtualRouterStatus || []).forEach((item) => {
        const from = normalizeNodeID(item && item.from_node_id);
        const to = normalizeNodeID(item && item.to_node_id);
        if (from) ids.add(from);
        if (to) ids.add(to);
      });
      if (!ids.size) {
        state.nodes.forEach((item) => {
          const clean = normalizeNodeID(item && item.node_no);
          if (clean) ids.add(clean);
        });
      }
      return Array.from(ids).sort((a, b) => Number(a) - Number(b));
    }

    function refreshVirtualRouterSpeedControls() {
      const source = document.getElementById('vr-speed-source');
      const target = document.getElementById('vr-speed-target');
      if (!source || !target) return;
      const ids = virtualRouterSpeedNodeIDs();
      if (!state.virtualRouterSpeedSourceID && ids.length) state.virtualRouterSpeedSourceID = ids[0];
      if (!state.virtualRouterSpeedTargetID && ids.length > 1) state.virtualRouterSpeedTargetID = ids.find((id) => id !== state.virtualRouterSpeedSourceID) || ids[0];
      const options = (selected) => ids.map((id) => `<option value="${escapeHTML(id)}" ${String(selected || '') === String(id) ? 'selected' : ''}>${escapeHTML(nodeLabel(id))}</option>`).join('');
      source.innerHTML = options(state.virtualRouterSpeedSourceID);
      target.innerHTML = options(state.virtualRouterSpeedTargetID);
    }

    function refreshVirtualRouterNodeFilter(controlID, stateKey) {
      const control = document.getElementById(controlID);
      if (!control) return;
      const ids = virtualRouterSpeedNodeIDs();
      const current = normalizeNodeID(state[stateKey]);
      state[stateKey] = current && ids.includes(current) ? current : '';
      control.innerHTML = [
        '<option value="">全部探针</option>',
        ...ids.map((id) => `<option value="${escapeHTML(id)}">${escapeHTML(nodeLabel(id))}</option>`),
      ].join('');
      control.value = state[stateKey];
    }

    function renderVirtualRouter() {
      const cfg = state.virtualRouter || {};
      document.getElementById('vr-enabled').value = cfg.enabled === false ? 'false' : 'true';
      document.getElementById('vr-cidr').value = String(cfg.fake_ip_cidr || '198.18.0.0/15');

      const ips = Array.isArray(cfg.probe_ips) ? cfg.probe_ips : [];
      const ipBody = document.getElementById('vr-ip-body');
      if (!ips.length) {
        ipBody.innerHTML = '<tr><td colspan="3" class="muted">暂无探针静态 IP，刷新后会按已知探针自动生成。</td></tr>';
      } else {
        ipBody.innerHTML = ips.map((item, idx) => `
          <tr>
            <td>${escapeHTML(nodeLabel(item.node_id))}<div class="small muted mono">${escapeHTML(item.node_id || '')}</div></td>
            <td><input data-vr-ip="${idx}" class="mono" value="${escapeHTML(item.ip || '')}" /></td>
            <td><input data-vr-ip-port="${idx}" class="mono" type="number" min="1" max="65535" value="${escapeHTML(item.service_port || DEFAULTS.virtualRouterServicePort)}" /></td>
          </tr>
        `).join('');
      }

      const rules = Array.isArray(cfg.topology_rules) ? cfg.topology_rules : [];
      const ruleBody = document.getElementById('vr-rule-body');
      refreshVirtualRouterNodeFilter('vr-rule-node-filter', 'virtualRouterRuleNodeFilterID');
      const ruleNodeFilterID = normalizeNodeID(state.virtualRouterRuleNodeFilterID);
      const visibleRules = rules.map((rule, idx) => ({ rule, idx })).filter(({ rule }) => {
        if (!ruleNodeFilterID) return true;
        return normalizeNodeID(rule && rule.from_node_id) === ruleNodeFilterID
          || normalizeNodeID(rule && rule.to_node_id) === ruleNodeFilterID;
      });
      if (!rules.length) {
        ruleBody.innerHTML = '<tr><td colspan="4" class="muted">暂无拓扑规则。</td></tr>';
      } else if (!visibleRules.length) {
        ruleBody.innerHTML = `<tr><td colspan="4" class="muted">没有与“${escapeHTML(nodeLabel(ruleNodeFilterID))}”相关的拓扑规则。</td></tr>`;
      } else {
        ruleBody.innerHTML = visibleRules.map(({ rule, idx }) => `
          <tr>
            <td class="check-cell"><input data-vr-rule-enabled="${idx}" type="checkbox" ${rule.enabled === false ? '' : 'checked'} /></td>
            <td>
              <div class="endpoint-stack">
                <div class="endpoint-row"><span class="label">入口探针</span><select data-vr-rule-from="${idx}">${virtualRouterNodeOptions(rule.from_node_id)}</select></div>
                <div class="endpoint-row"><span class="label">协议</span>${virtualRouterRouteLayerSelect(rule, idx)}</div>
                <div class="endpoint-hint">主动连接监听探针，不在本端配置监听。</div>
              </div>
            </td>
            <td>
              <div class="endpoint-stack">
                <div class="endpoint-row"><span class="label">监听探针</span><select data-vr-rule-to="${idx}">${virtualRouterNodeOptions(rule.to_node_id)}</select></div>
                <div class="endpoint-row"><span class="label">监听域名</span>${virtualRouterDomainSelect(rule, idx, 'to')}</div>
              </div>
            </td>
            <td>
              <div class="route-rule-actions">
                <button class="btn primary" data-vr-rule-save="${idx}" type="button">保存</button>
                <button class="btn danger" data-vr-rule-remove="${idx}" type="button">删除</button>
              </div>
            </td>
          </tr>
        `).join('');
      }
      bindVirtualRouterEvents();
      const ruleCountText = ruleNodeFilterID ? `${visibleRules.length}/${rules.length}` : String(rules.length);
      document.getElementById('vr-summary').textContent = `探针 IP ${ips.length} 个，拓扑规则 ${ruleCountText} 条`;
      refreshVirtualRouterSpeedControls();
    }

    function bindVirtualRouterEvents() {
      document.querySelectorAll('[data-vr-ip]').forEach((el) => {
        el.addEventListener('input', () => {
          const idx = Number.parseInt(el.getAttribute('data-vr-ip') || '-1', 10);
          const ips = state.virtualRouter.probe_ips || [];
          if (idx >= 0 && idx < ips.length) ips[idx].ip = String(el.value || '').trim();
        });
      });
      document.querySelectorAll('[data-vr-ip-port]').forEach((el) => {
        el.addEventListener('input', () => {
          const idx = Number.parseInt(el.getAttribute('data-vr-ip-port') || '-1', 10);
          const ips = state.virtualRouter.probe_ips || [];
          if (idx >= 0 && idx < ips.length) ips[idx].service_port = normalizePort(el.value, DEFAULTS.virtualRouterServicePort);
        });
      });
      document.querySelectorAll('[data-vr-rule-enabled]').forEach((el) => {
        el.addEventListener('change', () => {
          const idx = Number.parseInt(el.getAttribute('data-vr-rule-enabled') || '-1', 10);
          const rules = state.virtualRouter.topology_rules || [];
          if (idx >= 0 && idx < rules.length) rules[idx].enabled = !!el.checked;
        });
      });
      document.querySelectorAll('[data-vr-rule-from]').forEach((el) => {
        el.addEventListener('change', () => {
          const idx = Number.parseInt(el.getAttribute('data-vr-rule-from') || '-1', 10);
          const rules = state.virtualRouter.topology_rules || [];
          if (idx < 0 || idx >= rules.length) return;
          rules[idx].from_node_id = normalizeNodeID(el.value);
          rules[idx].from_service_domain = '';
          rules[idx].from_service_port = 0;
          renderVirtualRouter();
        });
      });
      document.querySelectorAll('[data-vr-rule-to]').forEach((el) => {
        el.addEventListener('change', () => {
          const idx = Number.parseInt(el.getAttribute('data-vr-rule-to') || '-1', 10);
          const rules = state.virtualRouter.topology_rules || [];
          if (idx < 0 || idx >= rules.length) return;
          rules[idx].to_node_id = normalizeNodeID(el.value);
          reconcileVirtualRouterDomainForNode(rules[idx], 'to');
          renderVirtualRouter();
        });
      });
      document.querySelectorAll('[data-vr-route-layer]').forEach((el) => {
        el.addEventListener('change', () => {
          const idx = Number.parseInt(el.getAttribute('data-vr-route-layer') || '-1', 10);
          const rules = state.virtualRouter.topology_rules || [];
          if (idx >= 0 && idx < rules.length) rules[idx].route_layer = normalizeVirtualRouterRouteLayer(el.value);
        });
      });
      document.querySelectorAll('[data-vr-rule-save]').forEach((el) => {
        el.addEventListener('click', () => {
          const idx = Number.parseInt(el.getAttribute('data-vr-rule-save') || '-1', 10);
          saveVirtualRouterRule(idx).catch((err) => setStatus(`保存拓扑规则失败：${err.message || err}`, 'err'));
        });
      });
      document.querySelectorAll('[data-vr-rule-remove]').forEach((el) => {
        el.addEventListener('click', () => {
          const idx = Number.parseInt(el.getAttribute('data-vr-rule-remove') || '-1', 10);
          const rules = state.virtualRouter.topology_rules || [];
          if (idx < 0 || idx >= rules.length) return;
          rules.splice(idx, 1);
          renderVirtualRouter();
        });
      });
      document.querySelectorAll('[data-vr-domain-select]').forEach((el) => {
        el.addEventListener('change', () => {
          const idx = Number.parseInt(el.getAttribute('data-vr-domain-select') || '-1', 10);
          const side = String(el.getAttribute('data-vr-domain-side') || '').trim();
          const rules = state.virtualRouter.topology_rules || [];
          if (idx < 0 || idx >= rules.length || side !== 'to') return;
          rules[idx].to_service_domain = String(el.value || '').trim();
          renderVirtualRouter();
        });
      });
    }

    function addVirtualRouterRule() {
      const ids = state.virtualRouterNodeIDs.length
        ? state.virtualRouterNodeIDs
        : state.nodes.map((item) => String(item.node_no || '')).filter(Boolean);
      if (ids.length < 2) {
        setStatus('至少需要两个探针才能添加拓扑规则', 'warn');
        return;
      }
      if (!Array.isArray(state.virtualRouter.topology_rules)) state.virtualRouter.topology_rules = [];
      state.virtualRouter.topology_rules.push({
        id: '',
        name: '',
        from_node_id: ids[0],
        to_node_id: ids[1],
        direction: 'forward',
        from_service_domain: '',
        from_service_port: 0,
        to_service_domain: '',
        to_service_port: 0,
        route_layer: 'auto',
        enabled: true,
      });
      renderVirtualRouter();
    }

    function virtualRouterRulePayload(rule) {
      return {
        id: String(rule.id || '').trim(),
        name: String(rule.name || '').trim(),
        from_node_id: normalizeNodeID(rule.from_node_id),
        to_node_id: normalizeNodeID(rule.to_node_id),
        direction: 'forward',
        from_service_domain: '',
        from_service_port: 0,
        from_tls_spki_sha256: String(rule.from_tls_spki_sha256 || '').trim(),
        to_service_domain: String(rule.to_service_domain || '').trim(),
        to_service_port: 0,
        to_tls_spki_sha256: String(rule.to_tls_spki_sha256 || '').trim(),
        route_layer: normalizeVirtualRouterRouteLayer(rule.route_layer),
        user_id: String(rule.user_id || '').trim(),
        user_public_key: String(rule.user_public_key || '').trim(),
        secret: String(rule.secret || '').trim(),
        auth_ticket: String(rule.auth_ticket || '').trim(),
        enabled: rule.enabled !== false,
        note: String(rule.note || '').trim(),
      };
    }

    async function saveVirtualRouterRule(index) {
      const rules = state.virtualRouter.topology_rules || [];
      if (index < 0 || index >= rules.length) throw new Error('拓扑规则不存在');
      const result = await requestJSON('/mng/api/route/virtual_router/topology_rules', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item: virtualRouterRulePayload(rules[index]) }),
      });
      if (!result.item || !String(result.item.id || '').trim()) throw new Error('服务端未返回已保存的拓扑规则');
      rules[index] = result.item;
      renderVirtualRouter();
      setRuleSaveStatus(`拓扑规则“${result.item.id}”已保存`, result.sync);
    }

    async function saveVirtualRouter() {
      state.virtualRouter.enabled = document.getElementById('vr-enabled').value !== 'false';
      state.virtualRouter.fake_ip_cidr = String(document.getElementById('vr-cidr').value || '').trim() || '198.18.0.0/15';
      (state.virtualRouter.probe_ips || []).forEach((item) => {
        item.service_port = normalizePort(item.service_port, DEFAULTS.virtualRouterServicePort);
      });
      (state.virtualRouter.topology_rules || []).forEach((rule) => {
        rule.from_service_domain = '';
        rule.from_service_port = 0;
        rule.to_service_port = 0;
        rule.route_layer = normalizeVirtualRouterRouteLayer(rule.route_layer);
      });
      const result = await requestJSON('/mng/api/route/virtual_router', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state.virtualRouter),
      });
      state.virtualRouter = result.item || state.virtualRouter;
      renderVirtualRouter();
      const sync = result.sync || {};
      const dispatched = Number(sync.dispatched || 0);
      const offline = Number(sync.offline || 0);
      const failed = Number(sync.failed || 0);
      const total = Number(sync.total || 0);
      const syncText = total > 0 ? `，已通知在线探针 ${dispatched}/${total}，离线 ${offline}，失败 ${failed}` : '';
      setStatus(`拓扑规则已保存${syncText}`, failed > 0 ? 'warn' : 'ok');
    }

    function routeStatusLabel(status) {
      const value = String(status || '').trim();
      if (value === 'ready') return '就绪';
      if (value === 'connected') return '已连接';
      if (value === 'listening') return '监听中';
      if (value === 'configured') return '已配置';
      if (value === 'missing_runtime') return '未上报运行态';
      if (value === 'offline') return '探针离线';
      if (value === 'failed') return '失败';
      if (value === 'disabled') return '已禁用';
      if (value === 'partial') return '部分就绪';
      return value || '-';
    }

    function routeStatusClass(status) {
      const value = String(status || '').trim();
      if (value === 'ready' || value === 'connected' || value === 'listening') return 'route-state ok';
      if (value === 'failed' || value === 'offline' || value === 'missing_runtime') return 'route-state err';
      return 'route-state warn';
    }

    function normalizeVirtualRouterBridgeText(value) {
      return String(value || '')
        .replace(/upstream bridge/g, 'bridge')
        .replace(/downstream bridge/g, 'bridge');
    }

    function routeSideErrors(side) {
      if (String(side && side.status || '').trim() !== 'failed') return [];
      const stats = (side && side.virtual_router) || {};
      const errors = [];
      const pingError = String(stats.last_ping_error || '').trim();
      const openError = String(stats.last_open_error || '').trim();
      if (pingError) errors.push(`虚拟 ping 失败：${normalizeVirtualRouterBridgeText(pingError)}`);
      if (openError) errors.push(`打开子流失败：${normalizeVirtualRouterBridgeText(openError)}`);
      return errors;
    }

    function summarizeBridgeSessions(item) {
      const bridgeStatus = (item && item.bridge_status) || {};
      const sessions = Array.isArray(bridgeStatus.sessions)
        ? bridgeStatus.sessions
        : (Array.isArray(item && item.bridge_sessions) ? item.bridge_sessions : []);
      const active = sessions.filter((entry) => !(entry && entry.closed));
      return { sessions, active, updatedAt: String(bridgeStatus.updated_at || '').trim() };
    }

    function renderBridgeSessions(item) {
      const summary = summarizeBridgeSessions(item);
      const active = summary.active.length;
      const updatedAt = summary.updatedAt ? ` · ${summary.updatedAt}` : '';
      const details = summary.active.slice(0, 3).map((entry) => {
        const remote = String((entry && entry.remote_addr) || '').trim() || '-';
        const streams = Number(entry && entry.streams_current);
        const rtt = Number(entry && entry.rtt_ms);
        return `物理对端 ${remote} 子通道=${Number.isFinite(streams) ? streams : '-'} rtt=${Number.isFinite(rtt) ? Math.trunc(rtt) + 'ms' : '-'}`;
      });
      return `<div class="small muted">桥接物理连接 ${active} 条${escapeHTML(updatedAt)}</div>${details.map((line) => `<div class="small muted">${escapeHTML(line)}</div>`).join('')}`;
    }

    function routeProtocolLabel(value) {
      const text = String(value || '').trim().toLowerCase();
      if (!text || text === 'default') return 'auto';
      if (text === 'websocket' || text === 'ws' || text === 'wss' || text === 'http2' || text === 'h2') return 'http2';
      if (text === 'websocket-h3' || text === 'ws-h3' || text === 'http3' || text === 'h3' || text === 'quic') return 'http3';
      return text;
    }

    function routeSideSelectedProtocol(side) {
      const candidates = [side && side.next_state, side && side.prev_state, side && side.listen_state];
      for (const state of candidates) {
        const selected = String(state && state.selected_protocol || '').trim();
        if (selected) return selected;
      }
      return '';
    }

    function routeSideConfiguredProtocol(side) {
      const raw = String((side && (side.next_route_layer || side.prev_route_layer || side.route_layer)) || '').trim();
      return routeProtocolLabel(raw);
    }

    function routeSideProtocolText(side) {
      const configured = routeSideConfiguredProtocol(side);
      const selectedRaw = routeSideSelectedProtocol(side);
      const selected = selectedRaw ? routeProtocolLabel(selectedRaw) : '';
      if (!selected || selected === configured) return `协议 ${configured}`;
      return `协议 ${configured} -> ${selected}`;
    }

    function renderLastVirtualPingContext(stats) {
      const item = stats || {};
      const parts = [];
      const direction = String(item.last_ping_direction || '').trim();
      const pingAt = String(item.last_ping_at || '').trim();
      if (direction || pingAt) {
        const latency = Number(item.last_ping_latency_ms || 0);
        parts.push(`<div class="small muted">最近虚拟 ping ${escapeHTML(direction || '-')} ${escapeHTML(latency ? `${latency}ms` : '-')} @ ${escapeHTML(pingAt || '-')}</div>`);
      }
      const virtualLatency = Number(item.last_virtual_ping_latency_ms || 0);
      const virtualAt = String(item.last_virtual_ping_at || '').trim();
      if (virtualLatency > 0 || virtualAt) {
        const src = String(item.last_virtual_ping_source_ip || '').trim();
