<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CloudHelper TG 会话</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1018;
      --surface: #111925;
      --surface-raised: #172231;
      --surface-hover: #1c2a3c;
      --border: #26364a;
      --border-soft: #1d2a3a;
      --text: #eef5fc;
      --muted: #8fa5bc;
      --accent: #2aabee;
      --accent-strong: #168dcc;
      --success: #5fd19b;
      --danger: #ff7f87;
      --warning: #f5bd68;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: #0e1621;
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }
    .wrap {
      width: 100vw;
      height: 100vh;
      margin: 0;
      background: #0e1621;
    }
    .topbar { display: none; }
    h1 { margin: 0; font-size: 24px; }
    .sub { margin: 6px 0 0; color: #9fc2ff; font-size: 13px; }
    .btn {
      min-width: 108px;
      border: 1px solid var(--border);
      background: var(--surface-raised);
      color: var(--text);
      border-radius: 6px;
      height: 36px;
      padding: 0 12px;
      cursor: pointer;
    }
    .btn.primary {
      border-color: var(--accent);
      background: var(--accent-strong);
    }
    .btn:disabled { opacity: .58; cursor: not-allowed; }
    .btn:hover:enabled { filter: brightness(1.06); }
    .status {
      position: fixed;
      z-index: 20;
      top: 14px;
      right: 18px;
      max-width: min(440px, calc(100vw - 36px));
      border: 1px solid var(--border);
      background: #172231;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .34);
      border-radius: 7px;
      padding: 9px 12px;
      font-size: 13px;
      line-height: 1.45;
      min-height: 38px;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }
    .status:empty { display: none; }
    .status.ok { border-color: #327659; color: #a4e7c7; }
    .status.err { border-color: #91484f; color: #ffb2b7; }
    .status.warn { border-color: #8c6a37; color: #f8d69d; }
    .content-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .content-block {
      height: 100%;
      min-height: 0;
    }
    .identity-card {
      height: 100%;
      min-height: 0;
    }
    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .title-row h2 { margin: 0; font-size: 22px; }
    .tg-account-basic-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid rgba(150, 185, 240, 0.12);
    }
    .tg-account-basic-label { color: #8eaed6; font-size: 13px; }
    .tg-account-basic-value { color: #eef6ff; word-break: break-word; }
    .tg-account-summary-line {
      border: 1px solid rgba(150, 185, 240, 0.14);
      border-radius: 10px;
      padding: 12px;
      color: #a9c7f3;
      background: rgba(255, 255, 255, 0.03);
    }
    .tg-session-toolbar {
      display: grid;
      gap: 8px;
    }
    .tg-session-toolbar label {
      display: grid;
      gap: 6px;
      color: #9fc2ff;
      font-size: 12px;
    }
    .input,
    .tg-session-toolbar input,
    .tg-session-toolbar select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #0d141e;
      color: var(--text);
      min-height: 34px;
      padding: 8px 10px;
      outline: none;
    }
    .tg-session-summary {
      color: var(--muted);
      font-size: 12px;
      margin: 7px 0 11px;
    }
    .tg-chat-shell {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      overflow: hidden;
      height: 100%;
      background: var(--surface);
    }
    .tg-chat-sidebar {
      border-right: 1px solid var(--border);
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #111b27;
    }
    .tg-chat-sidebar-head,
    .tg-chat-main-head,
    .tg-chat-composer {
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }
    .tg-chat-main-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 68px;
      background: #121b28;
    }
    .tg-chat-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      word-break: break-word;
    }
    .tg-chat-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      word-break: break-word;
    }
    .tg-chat-list {
      flex: 1;
      overflow: auto;
      min-height: 0;
      padding: 0;
    }
    .tg-chat-item {
      width: 100%;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      padding: 9px 12px;
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 10px;
      align-items: center;
      text-align: left;
      cursor: pointer;
    }
    .tg-chat-item:hover { background: var(--surface-hover); }
    .tg-chat-item.active { background: #2b5278; }
    .tg-chat-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--avatar-color, #35678d);
      color: #fff;
      font-weight: 700;
    }
    .tg-chat-item-title,
    .tg-chat-item-sub {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tg-chat-item-title { font-size: 14px; font-weight: 650; }
    .tg-chat-item-sub { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .tg-chat-main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 0;
    }
    .tg-chat-messages {
      overflow: auto;
      padding: 18px clamp(14px, 3vw, 42px);
      min-height: 0;
      background-color: #0e1621;
      background-image: radial-gradient(rgba(130, 159, 187, .055) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .tg-chat-empty {
      color: var(--muted);
      padding: 48px 16px;
      text-align: center;
    }
    .tg-message-row {
      display: flex;
      justify-content: flex-start;
      width: 100%;
      margin: 5px 0;
    }
    .tg-message-row.out { justify-content: flex-end; }
    .tg-message-row.service { justify-content: center; }
    .tg-message-bubble {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      max-width: min(680px, 78%);
      flex: 0 1 auto;
      border: 1px solid #2a3b4e;
      border-radius: 8px;
      background: #182534;
      padding: 9px 11px 7px;
      word-break: break-word;
      line-height: 1.32;
    }
    .tg-message-row.out .tg-message-bubble {
      background: #175f87;
      border-color: #247da9;
    }
    .tg-message-row.service .tg-message-bubble {
      max-width: min(620px, 90%);
      background: #17202b;
      color: var(--muted);
      text-align: center;
      align-items: center;
    }
    .tg-message-sender {
      color: #9fc2ff;
      font-size: 12px;
      margin: 0;
      font-weight: 650;
    }
    .tg-message-text {
      white-space: pre-wrap;
      width: 100%;
      overflow-wrap: anywhere;
    }
    .tg-message-text a {
      color: #8ec5ff;
      text-decoration: underline;
    }
    .tg-message-text code { padding: 1px 4px; border-radius: 3px; background: rgba(0, 0, 0, .25); font-family: Consolas, monospace; }
    .tg-message-text pre { margin: 5px 0 0; padding: 8px 10px; overflow: auto; border-left: 3px solid var(--accent); background: rgba(0, 0, 0, .25); white-space: pre-wrap; font-family: Consolas, monospace; }
    .tg-message-text .spoiler { padding: 0 3px; border-radius: 2px; background: #42505f; color: transparent; cursor: pointer; }
    .tg-message-text .spoiler:hover { color: inherit; }
    .tg-message-media-wrap {
      display: inline-block;
      margin-top: 8px;
      max-width: min(320px, 100%);
    }
    .tg-message-media {
      display: block;
      max-width: 100%;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.18);
    }
    .tg-message-meta {
      color: rgba(220, 234, 255, 0.62);
      font-size: 11px;
      margin-top: 0;
      text-align: right;
      align-self: flex-end;
    }
    .tg-chat-composer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
      border-bottom: 0;
      border-top: 1px solid var(--border);
      background: #121b28;
    }
    .tg-chat-composer textarea {
      min-height: 42px;
      max-height: 140px;
      resize: none;
      line-height: 1.45;
    }
    .tg-message-day {
      width: max-content;
      max-width: 90%;
      margin: 14px auto 10px;
      padding: 4px 9px;
      border-radius: 10px;
      background: rgba(24, 37, 52, .92);
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }
    .tg-sidebar-title-row, .tg-chat-heading-row, .tg-composer-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .tg-sidebar-actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 34px;
      min-width: 34px;
      height: 34px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 17px;
    }
    .tg-chat-context { min-width: 0; }
    .tg-composer-wrap { min-width: 0; }
    .tg-composer-meta { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .tg-back-link { color: #9ad9fb; text-decoration: none; font-size: 12px; white-space: nowrap; }
    .tg-back-link:hover { text-decoration: underline; }
    .tg-send-btn { min-width: 76px; height: 42px; }
    .tg-mobile-back { display: none; }
    .tg-session-toolbar label { position: relative; }
    .tg-session-toolbar label span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .tg-account-summary-line { margin: auto; max-width: 560px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 760px) {
      body { overflow: hidden; }
      .wrap { height: 100dvh; min-height: 0; }
      .tg-account-basic-row { grid-template-columns: 1fr; }
      .tg-chat-shell { grid-template-columns: 1fr; }
      .tg-chat-sidebar {
        border-right: 0;
      }
      .tg-chat-shell { height: 100%; }
      .tg-chat-list { max-height: none; min-height: 0; }
      .tg-chat-main { display: none; height: 100%; min-height: 0; }
      .tg-chat-shell.chat-open .tg-chat-sidebar { display: none; }
      .tg-chat-shell.chat-open .tg-chat-main { display: grid; }
      .tg-chat-main-head { align-items: center; padding: 10px; }
      .tg-mobile-back { display: grid; margin-right: 2px; }
      .tg-chat-context { flex: 1; }
      .tg-message-row { margin: 5px 0; }
      .tg-message-bubble { max-width: 88%; }
      .tg-message-row.service .tg-message-bubble { max-width: 96%; }
      .tg-chat-messages { min-height: 0; max-height: none; padding: 14px 9px; }
      .tg-chat-composer { grid-template-columns: 1fr auto; padding: 9px; }
      .tg-composer-meta { display: none; }
      .tg-send-btn { width: auto; min-width: 64px; }
      .status { top: 10px; right: 10px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>TG会话</h1>
        <p class="sub">独立窗口展示当前 TG 账号的会话、消息与发送入口。</p>
      </div>
    </div>
    <div id="status-box" class="status">初始化中...</div>
    <div class="content-block">
      <div id="tg-session-card" class="identity-card"></div>
    </div>
  </div>

  <script>
    const state = {
      loading: false,
      sessionLoading: false,
      sessionSending: false,
      status: '初始化中...',
      statusLevel: '',
      accounts: [],
      selectedAccountID: '',
      activeLoggedInAccountID: '',
      requestedAccountID: '',
      accountSessions: {},
    };
    const SESSION_REFRESH_INTERVAL_MS = 4000;
    let sessionRefreshTimer = null;
    let statusDismissTimer = null;

    function qs(id) {
      return document.getElementById(id);
    }

    function setStatus(message, level) {
      if (statusDismissTimer) {
        window.clearTimeout(statusDismissTimer);
        statusDismissTimer = null;
      }
      state.status = String(message || '');
      state.statusLevel = String(level || '');
      renderStatus();
      if (level === 'ok') {
        statusDismissTimer = window.setTimeout(() => {
          state.status = '';
          state.statusLevel = '';
          renderStatus();
          statusDismissTimer = null;
        }, 2200);
      }
    }

    function renderStatus() {
      const box = qs('status-box');
      box.textContent = state.status;
      box.className = 'status';
      if (state.statusLevel) box.classList.add(state.statusLevel);
    }

    function escapeHTML(value) {
      return String(value || '').replace(/[&<>"\x27]/g, (ch) => {
        if (ch === '&') return '&' + 'amp;';
        if (ch === '<') return '&' + 'lt;';
        if (ch === '>') return '&' + 'gt;';
        if (ch === '"') return '&' + 'quot;';
        return '&' + '#39;';
      });
    }

    async function requestJSON(url, options = {}) {
      const response = await fetch(url, { credentials: 'same-origin', ...options });
      let payload = {};
      try { payload = await response.json(); } catch (_) {}
      if (!response.ok) {
        const msg = payload && payload.error ? payload.error : `HTTP ${response.status}`;
        throw new Error(msg);
      }
      return payload;
    }

    function getLoggedInAccounts() {
      return state.accounts.filter((item) => item && item.authorized);
    }

    function getActiveLoggedInAccount() {
      return getLoggedInAccounts().find((item) => item.id === state.activeLoggedInAccountID) || null;
    }

    function getSessionAccount() {
      const requested = String(state.requestedAccountID || '').trim();
      if (requested) {
        return state.accounts.find((item) => item && item.authorized && item.id === requested) || null;
      }
      return getActiveLoggedInAccount();
    }

    function createAccountSessionState() {
      return {
        sessionLoading: false,
        sessionSending: false,
        targetList: [],
        selectedSessionTarget: '',
        sessionMessages: [],
        sessionWS: null,
        mobileListOpen: true,
        draft: {
          sessionSearch: '',
          sessionType: 'all',
          sessionMessage: '',
        },
      };
    }

    function getAccountSessionState(accountID) {
      const key = String(accountID || '').trim() || '__none__';
      if (!state.accountSessions[key]) {
        state.accountSessions[key] = createAccountSessionState();
      }
      return state.accountSessions[key];
    }

    function getCurrentSessionState() {
      const active = getSessionAccount();
      return getAccountSessionState(active && active.id);
    }

    function getRequestedAccountID() {
      try {
        return String(new URLSearchParams(window.location.search).get('account_id') || '').trim();
      } catch (error) {
        return '';
      }
    }

    function syncSelectedAccounts() {
      if (state.accounts.length === 0) {
        state.selectedAccountID = '';
        state.activeLoggedInAccountID = '';
        return;
      }
      if (!state.accounts.some((item) => item.id === state.selectedAccountID)) {
        state.selectedAccountID = state.accounts[0].id;
      }
      const loggedIn = getLoggedInAccounts();
      if (loggedIn.length === 0) {
        state.activeLoggedInAccountID = '';
        return;
      }
      if (state.requestedAccountID) {
        if (loggedIn.some((item) => item.id === state.requestedAccountID)) {
          state.activeLoggedInAccountID = state.requestedAccountID;
          state.selectedAccountID = state.requestedAccountID;
        } else {
          state.activeLoggedInAccountID = '';
          state.selectedAccountID = state.requestedAccountID;
        }
        return;
      }
      if (!loggedIn.some((item) => item.id === state.activeLoggedInAccountID)) {
        state.activeLoggedInAccountID = loggedIn[0].id;
      }
    }

    function closeSessionWS(accountID) {
      const session = accountID ? getAccountSessionState(accountID) : getCurrentSessionState();
      const ws = session.sessionWS;
      session.sessionWS = null;
      if (ws) {
        try { ws.close(); } catch (_) {}
      }
    }

    function formatDateTime(raw) {
      const value = String(raw || '').trim();
      if (!value) return '-';
      const dt = new Date(value);
      if (Number.isNaN(dt.getTime())) return value;
      return dt.toLocaleString();
    }

    function formatMessageTime(raw) {
      const dt = new Date(String(raw || ''));
      if (Number.isNaN(dt.getTime())) return '';
      return dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatMessageDay(raw) {
      const dt = new Date(String(raw || ''));
      if (Number.isNaN(dt.getTime())) return '';
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(today.getDate() - 1);
      const key = (value) => `${value.getFullYear()}-${value.getMonth()}-${value.getDate()}`;
      if (key(dt) === key(today)) return '今天';
      if (key(dt) === key(yesterday)) return '昨天';
      return dt.toLocaleDateString();
    }

    function avatarColor(value) {
      const colors = ['#3f7cac', '#4c8b75', '#8968a8', '#a06b54', '#4d82a8', '#8a7350'];
      let hash = 0;
      const text = String(value || '');
      for (let i = 0; i < text.length; i += 1) hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      return colors[Math.abs(hash) % colors.length];
    }

    function formatTGSessionType(type) {
      const value = String(type || '').trim();
      if (value === 'user') return '私聊';
      if (value === 'chat') return '群组';
      if (value === 'channel') return '频道';
      return value || '-';
    }

    function formatSessionSubtitle(item) {
      if (!item) return '';
      const bits = [formatTGSessionType(item.type), item.id || ''];
      if (item.username) bits.push('@' + item.username);
      return bits.filter(Boolean).join(' · ');
    }

    function sessionMessagesFingerprint(messages) {
      return (Array.isArray(messages) ? messages : []).map((msg) => {
        const id = Number(msg && msg.id || 0);
        const date = String(msg && msg.date || '');
        const out = msg && msg.out ? '1' : '0';
        const service = msg && msg.service ? '1' : '0';
        const text = String(msg && msg.text || '');
        const mediaType = String(msg && msg.media_type || '');
        const mediaPath = String(msg && msg.media_path || '');
        return [id, date, out, service, text, mediaType, mediaPath].join(':');
      }).join('|');
    }

    function getSessionWSURL(accountID, targetID) {
      const url = new URL(window.location.href);
      url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
      url.pathname = '/mng/api/tg/session/ws';
      url.search = new URLSearchParams({
        account_id: accountID,
        target: targetID,
      }).toString();
      return url.toString();
    }

    function getFilteredSessionTargets(session) {
      const bucket = session || getCurrentSessionState();
      const keyword = String(bucket.draft.sessionSearch || '').trim().toLowerCase();
      const type = String(bucket.draft.sessionType || 'all').trim();
      let list = Array.isArray(bucket.targetList) ? bucket.targetList.slice() : [];
      if (type !== 'all') {
        list = list.filter((item) => String(item && item.type || '').trim() === type);
      }
      if (keyword) {
        list = list.filter((item) => {
          const id = String(item && item.id || '').toLowerCase();
          const name = String(item && item.name || '').toLowerCase();
          const username = String(item && item.username || '').toLowerCase();
          const kind = String(item && item.type || '').toLowerCase();
          return id.includes(keyword) || name.includes(keyword) || username.includes(keyword) || kind.includes(keyword);
        });
      }
      return list;
    }

    function getSelectedSessionTarget(session) {
      const bucket = session || getCurrentSessionState();
      const id = String(bucket.selectedSessionTarget || '').trim();
      if (!id) return null;
      return (Array.isArray(bucket.targetList) ? bucket.targetList : []).find((item) => item && item.id === id) || null;
    }

    function promoteTGSessionTarget(session, targetID) {
      const bucket = session || getCurrentSessionState();
      const id = String(targetID || '').trim();
      if (!id || !Array.isArray(bucket.targetList) || bucket.targetList.length === 0) return;
      const index = bucket.targetList.findIndex((item) => item && item.id === id);
      if (index <= 0) return;
      const next = bucket.targetList.slice();
      const [item] = next.splice(index, 1);
      next.unshift(item);
      bucket.targetList = next;
    }

    function renderTGMessageMedia(msg) {
      if (!msg) return '';
      const mediaType = String(msg.media_type || '').trim();
      const mediaURL = String(msg.media_url || '').trim();
      if (!mediaType || !mediaURL) return '';
      const label = mediaType === 'sticker' ? '贴纸' : mediaType === 'custom_emoji' ? '自定义表情' : mediaType === 'video' ? '视频' : mediaType === 'photo' ? '图片' : '文件';
      if (mediaType === 'video') {
        return `<a class="tg-message-media-wrap" href="${escapeHTML(mediaURL)}" target="_blank" rel="noreferrer"><video class="tg-message-media" src="${escapeHTML(mediaURL)}" controls preload="metadata"></video></a>`;
      }
      return `<a class="tg-message-media-wrap" href="${escapeHTML(mediaURL)}" target="_blank" rel="noreferrer"><img class="tg-message-media" src="${escapeHTML(mediaURL)}" alt="${escapeHTML(label)}"></a>`;
    }

    function renderMessageText(text, formats) {
      const source = String(text || '');
      const entities = Array.isArray(formats) ? formats.filter((item) => item && Number(item.length) > 0) : [];
      if (entities.length > 0) {
        const units = Array.from(source);
        const utf16Offsets = [];
        let offset = 0;
        units.forEach((char) => { utf16Offsets.push(offset); offset += char.length; });
        utf16Offsets.push(offset);
        const toIndex = (utf16) => {
          const value = Math.max(0, Number(utf16) || 0);
          let index = 0;
          while (index < utf16Offsets.length - 1 && utf16Offsets[index] < value) index += 1;
          return index;
        };
        const wrapText = (html, entity, rawText) => {
          const type = String(entity.type || '');
          if (type === 'bold') return `<strong>${html}</strong>`;
          if (type === 'italic') return `<em>${html}</em>`;
          if (type === 'underline') return `<u>${html}</u>`;
          if (type === 'strike') return `<s>${html}</s>`;
          if (type === 'code') return `<code>${html}</code>`;
          if (type === 'pre') return `<pre>${html}</pre>`;
          if (type === 'spoiler') return `<span class="spoiler" tabindex="0">${html}</span>`;
          if (type === 'url') {
            const href = String(entity.url || rawText);
            if (!/^https?:\/\//i.test(href)) return html;
            return `<a href="${escapeHTML(href)}" target="_blank" rel="noreferrer">${html}</a>`;
          }
          return html;
        };
        const boundaries = new Set([0, units.length]);
        const normalized = [];
        entities.forEach((entity) => {
          const start = toIndex(entity.offset);
          const end = toIndex(Number(entity.offset) + Number(entity.length));
          if (end <= start) return;
          boundaries.add(start);
          boundaries.add(end);
          normalized.push({ ...entity, start, end });
        });
        const points = Array.from(boundaries).sort((a, b) => a - b);
        let html = '';
        for (let i = 0; i < points.length - 1; i += 1) {
          const start = points[i];
          const end = points[i + 1];
          const rawText = units.slice(start, end).join('');
          let segment = escapeHTML(rawText);
          normalized
            .filter((entity) => entity.start <= start && entity.end >= end)
            .sort((a, b) => (b.end - b.start) - (a.end - a.start))
            .forEach((entity) => { segment = wrapText(segment, entity, rawText); });
          html += segment;
        }
        return html;
      }
      const parts = [];
      const pattern = /(https?:\/\/[^\s<>"']+)/gi;
      let lastIndex = 0;
      let match = null;
      while ((match = pattern.exec(source)) !== null) {
        const index = match.index;
        if (index > lastIndex) {
          parts.push(escapeHTML(source.slice(lastIndex, index)));
        }
        const url = match[0];
        parts.push(`<a href="${escapeHTML(url)}" target="_blank" rel="noreferrer">${escapeHTML(url)}</a>`);
        lastIndex = index + url.length;
      }
      if (lastIndex < source.length) {
        parts.push(escapeHTML(source.slice(lastIndex)));
      }
      return parts.join('');
    }

    function renderSessionMessages(session) {
      const bucket = session || getCurrentSessionState();
      if (bucket.sessionLoading && bucket.sessionMessages.length === 0) {
        return '<div class="tg-chat-empty">消息加载中...</div>';
      }
      if (!bucket.selectedSessionTarget) {
        return '<div class="tg-chat-empty">请选择一个会话</div>';
      }
      if (bucket.sessionMessages.length === 0) {
        return '<div class="tg-chat-empty">暂无消息</div>';
      }
      let previousDay = '';
      return bucket.sessionMessages.map((msg) => {
        const out = !!(msg && msg.out);
        const service = !!(msg && msg.service);
        const rowClass = 'tg-message-row' + (out ? ' out' : '') + (service ? ' service' : '');
        const sender = !out && !service && msg.sender_name ? `<div class="tg-message-sender">${escapeHTML(msg.sender_name)}</div>` : '';
        const day = formatMessageDay(msg && msg.date || '');
        const dayDivider = day && day !== previousDay ? `<div class="tg-message-day">${escapeHTML(day)}</div>` : '';
        previousDay = day;
        return `
          ${dayDivider}
          <div class="${rowClass}">
            <div class="tg-message-bubble">
              ${sender}
              <div class="tg-message-text">${renderMessageText(msg && msg.text || '', msg && msg.formats)}</div>
              ${renderTGMessageMedia(msg)}
              <div class="tg-message-meta">${escapeHTML(formatMessageTime(msg && msg.date || ''))}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function scrollSessionMessagesToBottom() {
      const box = qs('tg-chat-messages');
      if (!box) return;
      box.scrollTop = box.scrollHeight;
    }

    function renderTGSessionPanel(options = {}) {
      const host = qs('tg-session-card');
      if (!host) return;
      const preserveScroll = options.preserveScroll === true;
      const previousBox = preserveScroll ? qs('tg-chat-messages') : null;
      const previousScrollTop = previousBox ? previousBox.scrollTop : 0;
      const wasNearBottom = previousBox ? (previousBox.scrollHeight - previousBox.scrollTop - previousBox.clientHeight) <= 24 : true;
      const focusSearch = options.focusSearch === true;
      const searchCursor = Number(options.searchCursor || 0);
      const active = getSessionAccount();
      if (!active) {
        const emptyMessage = state.requestedAccountID
          ? '当前选中的 TG 账号未登录或不存在，请在「TG助手」重新选择账号。'
          : '请先在「TG助手」中登录并选择一个账号。';
        host.innerHTML = `
          <div class="tg-account-summary-line">${escapeHTML(emptyMessage)}</div>
        `;
        bindTGSessionEvents();
        return;
      }
      const session = getAccountSessionState(active.id);
      const filtered = getFilteredSessionTargets(session);
      if (!session.selectedSessionTarget && filtered.length > 0) {
        session.selectedSessionTarget = filtered[0].id || '';
      }
      const selected = getSelectedSessionTarget(session);
      let sessionItems = '';
      if (filtered.length === 0) {
        sessionItems = '<div class="tg-chat-empty">暂无匹配会话</div>';
      } else {
        sessionItems = filtered.map((item) => {
          const username = String(item && item.username || '').trim();
          const itemID = String(item && item.id || '').trim();
          const title = String(item && item.name || itemID || '-').trim();
          const initial = title ? title.slice(0, 1).toUpperCase() : '#';
          const activeClass = itemID === session.selectedSessionTarget ? ' active' : '';
          return `
            <button class="tg-chat-item${activeClass}" data-action="open-session-target" data-target-id="${escapeHTML(itemID)}" type="button" aria-pressed="${itemID === session.selectedSessionTarget ? 'true' : 'false'}">
              <div class="tg-chat-avatar" style="--avatar-color:${escapeHTML(avatarColor(itemID))}">${escapeHTML(initial)}</div>
              <div>
                <div class="tg-chat-item-title">${escapeHTML(title)}</div>
                <div class="tg-chat-item-sub">${escapeHTML(formatTGSessionType(item && item.type))}${username ? ` · @${escapeHTML(username)}` : ''}</div>
              </div>
            </button>
          `;
        }).join('');
      }
      const messages = renderSessionMessages(session);
      const selectedTitle = selected ? String(selected.name || selected.id || '-') : '请选择会话';
      const selectedSubtitle = selected ? formatSessionSubtitle(selected) : '选择左侧会话';
      host.innerHTML = `
        <div class="tg-chat-shell${selected && !session.mobileListOpen ? ' chat-open' : ''}">
          <aside class="tg-chat-sidebar">
            <div class="tg-chat-sidebar-head">
              <div class="tg-sidebar-title-row">
                <div>
                  <div class="tg-chat-title">${escapeHTML(active.label || 'TG 会话')}</div>
                  <div class="tg-chat-subtitle">${escapeHTML(active.phone)}</div>
                </div>
                <div class="tg-sidebar-actions">
                  <a class="btn icon-btn" href="/mng/tg" title="返回 TG 助手" aria-label="返回 TG 助手">‹</a>
                  <button class="btn icon-btn" data-action="refresh-session-targets" type="button" title="刷新会话" aria-label="刷新会话" ${session.sessionLoading ? 'disabled' : ''}>↻</button>
                </div>
              </div>
              <div class="tg-session-toolbar" style="margin-bottom:0">
                <label><span>搜索会话</span>
                  <input id="tg-session-search" class="input" value="${escapeHTML(session.draft.sessionSearch)}" placeholder="搜索" autocomplete="off">
                </label>
              </div>
            </div>
            <div class="tg-chat-list">${sessionItems}</div>
          </aside>
          <section class="tg-chat-main">
            <div class="tg-chat-main-head">
              <button class="btn icon-btn tg-mobile-back" data-action="close-mobile-chat" type="button" title="返回会话列表" aria-label="返回会话列表">‹</button>
              <div class="tg-chat-context">
                <div class="tg-chat-title">${escapeHTML(selectedTitle)}</div>
                <div class="tg-chat-subtitle">${escapeHTML(selectedSubtitle)}</div>
              </div>
            </div>
            <div id="tg-chat-messages" class="tg-chat-messages">${messages}</div>
            <div class="tg-chat-composer">
              <div class="tg-composer-wrap">
                <textarea id="tg-session-message" class="input" rows="1" maxlength="4096" placeholder="${selected ? '输入消息...' : '请先选择会话'}" ${!selected || session.sessionSending ? 'disabled' : ''}>${escapeHTML(session.draft.sessionMessage)}</textarea>
                <div class="tg-composer-meta"><span>Enter 发送，Shift + Enter 换行</span><span id="tg-message-count">${String(session.draft.sessionMessage || '').length} / 4096</span></div>
              </div>
              <button class="btn primary tg-send-btn" data-action="send-session-message" type="button" ${!selected || session.sessionSending || !String(session.draft.sessionMessage || '').trim() ? 'disabled' : ''}>${session.sessionSending ? '发送中...' : '发送'}</button>
            </div>
          </section>
        </div>
      `;
      bindTGSessionEvents();
      if (focusSearch) {
        const nextSearch = qs('tg-session-search');
        if (nextSearch) {
          nextSearch.focus();
          nextSearch.setSelectionRange(searchCursor, searchCursor);
        }
      }
      if (preserveScroll && previousBox) {
        const box = qs('tg-chat-messages');
        if (box) {
          box.scrollTop = wasNearBottom ? box.scrollHeight : previousScrollTop;
        }
      } else {
        scrollSessionMessagesToBottom();
      }
    }

    function bindTGSessionEvents() {
      const active = getSessionAccount();
      const session = active ? getAccountSessionState(active.id) : getCurrentSessionState();
      const search = qs('tg-session-search');
      if (search) {
        const applySearch = () => {
          session.draft.sessionSearch = String(search.value || '');
          renderTGSessionPanel({ focusSearch: true, searchCursor: search.selectionStart || 0 });
        };
        search.addEventListener('input', applySearch);
      }
      document.querySelectorAll('[data-action="close-mobile-chat"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          session.mobileListOpen = true;
          renderTGSessionPanel();
        });
      });
      document.querySelectorAll('[data-action="refresh-session-targets"]').forEach((btn) => {
        btn.addEventListener('click', () => loadTargets(active && active.id).catch((err) => setStatus(`刷新会话失败：${err.message || err}`, 'err')));
      });
      document.querySelectorAll('[data-action="open-session-target"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const targetID = String(btn.getAttribute('data-target-id') || '').trim();
          if (!targetID) return;
          if (targetID === session.selectedSessionTarget) {
            session.mobileListOpen = false;
            renderTGSessionPanel();
            return;
          }
          closeSessionWS(active && active.id);
          session.selectedSessionTarget = targetID;
          session.mobileListOpen = false;
          session.sessionMessages = [];
          renderTGSessionPanel();
          loadSessionMessages({ silent: true }).catch((err) => setStatus(`加载会话消息失败：${err.message || err}`, 'err'));
          connectSessionWS();
        });
      });
      const composer = qs('tg-session-message');
      if (composer) {
        const resizeComposer = () => {
          composer.style.height = 'auto';
          composer.style.height = `${Math.min(composer.scrollHeight, 140)}px`;
        };
        resizeComposer();
        composer.addEventListener('input', () => {
          session.draft.sessionMessage = composer.value;
          resizeComposer();
          const count = qs('tg-message-count');
          if (count) count.textContent = `${composer.value.length} / 4096`;
          const sendBtn = document.querySelector('[data-action="send-session-message"]');
          if (sendBtn) sendBtn.disabled = !session.selectedSessionTarget || session.sessionSending || !String(session.draft.sessionMessage || '').trim();
        });
        composer.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendSessionMessage().catch((err) => setStatus(`发送消息失败：${err.message || err}`, 'err'));
          }
        });
      }
      document.querySelectorAll('[data-action="send-session-message"]').forEach((btn) => {
        btn.addEventListener('click', () => sendSessionMessage().catch((err) => setStatus(`发送消息失败：${err.message || err}`, 'err')));
      });
    }

    async function ensureSession() {
      const payload = await requestJSON('/mng/api/session');
      if (!payload.authenticated) {
        location.href = '/mng';
        return false;
      }
      return true;
    }

    async function loadAccounts(options = {}) {
      const silent = options.silent === true;
      if (!silent) {
        state.loading = true;
        setStatus('正在加载 TG 账号列表...');
        renderTGSessionPanel();
      }
      try {
        const payload = await requestJSON('/mng/api/tg/accounts/list');
        state.accounts = Array.isArray(payload.accounts) ? payload.accounts : [];
        syncSelectedAccounts();
        renderTGSessionPanel();
        const active = getSessionAccount();
        const session = active ? getAccountSessionState(active.id) : null;
        if (active && session && session.targetList.length === 0) {
          await loadTargets(active.id, { silent: true });
        }
        if (!silent) {
          setStatus(state.accounts.length > 0 ? `已加载 TG 账号（${state.accounts.length} 个）` : '暂无 TG 账号，请先添加', 'ok');
        }
      } catch (error) {
        if (!silent) setStatus(`加载 TG 账号失败：${error.message || error}`, 'err');
      } finally {
        if (!silent) {
          state.loading = false;
          renderTGSessionPanel();
        }
      }
    }

    async function loadTargets(accountID, options = {}) {
      const normalizedAccountID = String(accountID || '').trim();
      if (!normalizedAccountID) return;
      const silent = options.silent === true;
      const session = getAccountSessionState(normalizedAccountID);
      if (!silent) setStatus('正在加载会话对象列表...');
      try {
        let payload = await requestJSON('/mng/api/tg/targets/list', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: normalizedAccountID }),
        });
        if (!Array.isArray(payload.targets) || payload.targets.length === 0) {
          payload = await requestJSON('/mng/api/tg/targets/refresh', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ account_id: normalizedAccountID }),
          });
        }
        session.targetList = Array.isArray(payload.targets) ? payload.targets : [];
        if (!session.targetList.some((item) => item.id === session.selectedSessionTarget)) {
          session.selectedSessionTarget = session.targetList.length > 0 ? session.targetList[0].id : '';
          session.sessionMessages = [];
        }
        renderTGSessionPanel();
        if (session.selectedSessionTarget && session.sessionMessages.length === 0) {
          loadSessionMessages({ silent: true }).catch((err) => setStatus(`加载会话消息失败：${err.message || err}`, 'err'));
        }
        if (!silent) setStatus(`已加载会话对象（${session.targetList.length} 个）`, 'ok');
      } catch (error) {
        if (!silent) setStatus(`加载会话对象失败：${error.message || error}`, 'err');
      }
    }

    async function loadSessionMessages(options = {}) {
      const active = getSessionAccount();
      const session = active ? getAccountSessionState(active.id) : getCurrentSessionState();
      const targetID = String(session.selectedSessionTarget || '').trim();
      if (!active || !targetID) return;
      const accountID = active.id;
      const silent = options.silent === true;
      const background = options.background === true;
      const preserveScroll = options.preserveScroll === true;
      const beforeFingerprint = sessionMessagesFingerprint(session.sessionMessages);
      if (!background) {
        session.sessionLoading = true;
        renderTGSessionPanel();
        if (!silent) setStatus('正在加载会话消息...');
      }
      try {
        const payload = await requestJSON('/mng/api/tg/session/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: accountID, target: targetID, limit: 50 }),
        });
        const current = getSessionAccount();
        const currentSession = getAccountSessionState(accountID);
        if (!current || current.id !== accountID || currentSession.selectedSessionTarget !== targetID) return;
        const nextMessages = Array.isArray(payload.messages) ? payload.messages : [];
        const nextFingerprint = sessionMessagesFingerprint(nextMessages);
        if (nextFingerprint !== beforeFingerprint) {
          currentSession.sessionMessages = nextMessages;
          renderTGSessionPanel(background ? { preserveScroll } : {});
        } else if (!background) {
          renderTGSessionPanel();
        }
        if (!silent && !background) setStatus(`已加载会话消息（${currentSession.sessionMessages.length} 条）`, 'ok');
      } finally {
        if (!background) {
          session.sessionLoading = false;
          renderTGSessionPanel();
        }
      }
    }

    async function sendSessionMessage() {
      const active = getSessionAccount();
      const session = active ? getAccountSessionState(active.id) : getCurrentSessionState();
      const targetID = String(session.selectedSessionTarget || '').trim();
      const message = String(session.draft.sessionMessage || '').trim();
      if (!active || !targetID || !message || session.sessionSending) return;
      const accountID = active.id;
      session.sessionSending = true;
      renderTGSessionPanel();
      try {
        const payload = await requestJSON('/mng/api/tg/session/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: accountID, target: targetID, message }),
        });
        const current = getSessionAccount();
        const currentSession = getAccountSessionState(accountID);
        if (!current || current.id !== accountID || currentSession.selectedSessionTarget !== targetID) return;
        if (payload.message) currentSession.sessionMessages = currentSession.sessionMessages.concat([payload.message]);
        currentSession.draft.sessionMessage = '';
        renderTGSessionPanel();
        setStatus('消息已发送', 'ok');
      } finally {
        session.sessionSending = false;
        renderTGSessionPanel();
      }
    }

    function startSessionAutoRefresh() {
      if (sessionRefreshTimer) return;
      const refresh = () => {
        if (document.hidden) return;
        connectSessionWS();
      };
      sessionRefreshTimer = window.setInterval(refresh, SESSION_REFRESH_INTERVAL_MS);
      document.addEventListener('visibilitychange', refresh);
      window.addEventListener('beforeunload', () => {
        if (sessionRefreshTimer) {
          window.clearInterval(sessionRefreshTimer);
          sessionRefreshTimer = null;
        }
      });
    }

    function connectSessionWS() {
      const active = getSessionAccount();
      const session = active ? getAccountSessionState(active.id) : getCurrentSessionState();
      const targetID = String(session.selectedSessionTarget || '').trim();
      if (!active || !targetID || !window.WebSocket) return false;
      if (session.sessionWS && session.sessionWS.readyState === WebSocket.OPEN) {
        return true;
      }
      try {
        const ws = new WebSocket(getSessionWSURL(active.id, targetID));
        session.sessionWS = ws;
        ws.onopen = () => {};
        ws.onmessage = (event) => {
          let payload = null;
          try {
            payload = JSON.parse(event.data);
          } catch (_) {
            return;
          }
          if (!payload || payload.account_id !== active.id || payload.target !== targetID) return;
          if (payload.type === 'session.snapshot' && Array.isArray(payload.messages)) {
            const nextFingerprint = sessionMessagesFingerprint(payload.messages);
            const currentSession = getAccountSessionState(active.id);
            if (currentSession.selectedSessionTarget !== targetID) return;
            if (nextFingerprint !== sessionMessagesFingerprint(currentSession.sessionMessages)) {
              currentSession.sessionMessages = payload.messages;
              promoteTGSessionTarget(currentSession, targetID);
              syncCurrentSessionMirror(active.id);
              renderTGSessionPanel({ preserveScroll: true });
            }
          } else if (payload.type === 'session.error') {
            setStatus(`实时连接已断开：${payload.error || 'unknown error'}`, 'warn');
          }
        };
        ws.onerror = () => {
          setStatus('TG 会话实时连接异常，已尝试回退', 'warn');
        };
        ws.onclose = () => {
          if (session.sessionWS === ws) session.sessionWS = null;
          window.setTimeout(() => {
            if (document.hidden) return;
            connectSessionWS();
          }, 1200);
        };
        return true;
      } catch (_) {
        return false;
      }
    }

    async function bootstrap() {
      state.requestedAccountID = getRequestedAccountID();
      renderStatus();
      renderTGSessionPanel();
      const ok = await ensureSession().catch(() => false);
      if (!ok) {
        location.href = '/mng';
        return;
      }
      await loadAccounts({ silent: true });
      startSessionAutoRefresh();
      connectSessionWS();
      setStatus('TG 会话窗口初始化完成', 'ok');
      renderTGSessionPanel();
    }

    bootstrap().catch((err) => {
      setStatus(`初始化失败：${err && err.message ? err.message : err}`, 'err');
    });
  </script>
</body>
</html>
