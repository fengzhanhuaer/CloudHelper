        const dst = String(item.last_virtual_ping_dest_ip || '').trim();
        const path = String(item.last_virtual_ping_path || '').trim();
        parts.push(`<div class="small muted">最近 ICMP 帧 ping ${escapeHTML(src || '-')} -> ${escapeHTML(dst || '-')} ${escapeHTML(virtualLatency ? `${virtualLatency}ms` : '-')} @ ${escapeHTML(virtualAt || '-')}${path ? ` / path ${escapeHTML(path)}` : ''}</div>`);
      }
      return parts.join('');
    }

    function renderLastSpeedTestContext(stats) {
      const item = stats || {};
      const at = String(item.last_speed_test_at || '').trim();
      if (!at) return '';
      const source = String(item.last_speed_test_source_node_id || '').trim();
      const target = String(item.last_speed_test_target_node_id || '').trim();
      const err = String(item.last_speed_test_error || '').trim();
      const upMbps = Number(item.last_speed_test_up_mbps || 0);
      const downMbps = Number(item.last_speed_test_down_mbps || 0);
      const up = `上行 ${Number.isFinite(upMbps) && upMbps > 0 ? upMbps.toFixed(2) + ' Mbps' : '-'} / ${formatBytes(item.last_speed_test_up_bytes || 0)}`;
      const down = `下行 ${Number.isFinite(downMbps) && downMbps > 0 ? downMbps.toFixed(2) + ' Mbps' : '-'} / ${formatBytes(item.last_speed_test_down_bytes || 0)}`;
      return `<div class="small muted">最近发帧测速 ${escapeHTML(nodeLabel(source))} -> ${escapeHTML(nodeLabel(target))} @ ${escapeHTML(at)}</div><div class="small muted">${escapeHTML(up)} · ${escapeHTML(down)}</div>${err ? `<div class="small route-error">测速错误：${escapeHTML(err)}</div>` : ''}`;
    }

    function renderRouteSide(side) {
      const item = side || {};
      const stats = item.virtual_router || {};
      const endpoints = [];
      if (item.listen) endpoints.push(`listen ${item.listen}`);
      if (item.next) endpoints.push(`next ${item.next}`);
      if (item.prev) endpoints.push(`prev ${item.prev}`);
      const errors = routeSideErrors(item).map((err) => `<div class="small route-error">${escapeHTML(err)}</div>`).join('');
      return `
        <div><span class="${routeStatusClass(item.status)}">${escapeHTML(routeStatusLabel(item.status))}</span></div>
        <div class="small muted">${escapeHTML(endpoints.join(' / ') || '-')}</div>
        <div class="small muted">${escapeHTML(routeSideProtocolText(item))}</div>
        ${errors}
        ${renderBridgeSessions(item)}
        ${renderLastVirtualPingContext(stats)}
        ${renderLastSpeedTestContext(stats)}
        <div class="small muted">IP rx入口 ${escapeHTML(stats.packets_received || 0)} / ${escapeHTML(formatBytes(stats.bytes_received || 0))} · fwd转发 ${escapeHTML(stats.packets_forwarded || 0)} / ${escapeHTML(formatBytes(stats.bytes_forwarded || 0))} · local投递 ${escapeHTML(stats.packets_delivered || 0)} / ${escapeHTML(formatBytes(stats.bytes_delivered || 0))}</div>
        <div class="small muted">vRouter帧 tx ${escapeHTML(stats.frames_sent || 0)} / ${escapeHTML(formatBytes(stats.frame_bytes_sent || 0))} · rx ${escapeHTML(stats.frames_received || 0)} / ${escapeHTML(formatBytes(stats.frame_bytes_received || 0))}</div>
        <div class="small muted">${escapeHTML(item.last_seen || '-')}</div>
      `;
    }

    function renderVirtualRouterStatus() {
      const body = document.getElementById('vr-status-body');
      const summary = document.getElementById('vr-status-summary');
      const items = Array.isArray(state.virtualRouterStatus) ? state.virtualRouterStatus : [];
      refreshVirtualRouterNodeFilter('vr-status-node-filter', 'virtualRouterStatusNodeFilterID');
      const statusNodeFilterID = normalizeNodeID(state.virtualRouterStatusNodeFilterID);
      const visibleItems = items.filter((item) => {
        if (!statusNodeFilterID) return true;
        return normalizeNodeID(item && item.from_node_id) === statusNodeFilterID
          || normalizeNodeID(item && item.to_node_id) === statusNodeFilterID;
      });
      const ready = visibleItems.filter((item) => String(item.status || '') === 'ready').length;
      const statusCountText = statusNodeFilterID ? `${visibleItems.length}/${items.length}` : String(items.length);
      summary.textContent = items.length ? `规则 ${statusCountText} 条，就绪 ${ready} 条` : '暂无状态';
      refreshVirtualRouterSpeedControls();
      if (!items.length) {
        body.innerHTML = '<tr><td colspan="7" class="muted">暂无路由状态。需要先配置拓扑规则，并等待探针完成一次状态上报。</td></tr>';
        return;
      }
      if (!visibleItems.length) {
        body.innerHTML = `<tr><td colspan="7" class="muted">没有与“${escapeHTML(nodeLabel(statusNodeFilterID))}”相关的路由状态。</td></tr>`;
        return;
      }
      body.innerHTML = visibleItems.map((item) => {
        const fromName = `${nodeLabel(item.from_node_id)}${item.from_ip ? ` / ${item.from_ip}` : ''}`;
        const toName = `${nodeLabel(item.to_node_id)}${item.to_ip ? ` / ${item.to_ip}` : ''}`;
        const latency = Number(item.last_latency_ms || 0);
        const latencyText = Number.isFinite(latency) && latency > 0 ? `${Math.trunc(latency)}ms` : '-';
        const err = item.last_error ? `<div class="small route-error">${escapeHTML(item.last_error)}</div>` : '';
        return `<tr>
          <td><div class="small muted mono">${escapeHTML(item.route_id || '-')}</div><div class="small muted">${escapeHTML(item.direction || '-')}</div></td>
          <td><span class="${routeStatusClass(item.status)}">${escapeHTML(routeStatusLabel(item.status))}</span>${err}</td>
          <td><div>${escapeHTML(fromName)}</div>${renderRouteSide(item.from)}</td>
          <td><div>${escapeHTML(toName)}</div>${renderRouteSide(item.to)}</td>
          <td><div>IP处理事件</div><div class="small muted">规则行汇总=本规则两端 runtime 相加；rx 是入口，fwd/local 是处理结果。</div><div class="small muted">IP rx入口 ${escapeHTML(item.packets_received || 0)} / ${escapeHTML(formatBytes(item.bytes_received || 0))}</div><div class="small muted">IP fwd转发 ${escapeHTML(item.packets_forwarded || 0)} / ${escapeHTML(formatBytes(item.bytes_forwarded || 0))}</div><div class="small muted">IP local投递 ${escapeHTML(item.packets_delivered || 0)} / ${escapeHTML(formatBytes(item.bytes_delivered || 0))}</div><div class="small muted">vRouter帧 tx ${escapeHTML(item.frames_sent || 0)} / ${escapeHTML(formatBytes(item.frame_bytes_sent || 0))}</div><div class="small muted">vRouter帧 rx ${escapeHTML(item.frames_received || 0)} / ${escapeHTML(formatBytes(item.frame_bytes_received || 0))}</div></td>
          <td>${escapeHTML(latencyText)}</td>
          <td><div>${escapeHTML(item.last_packet_at || '-')}</div><div class="small muted">frame ${escapeHTML(item.last_frame_at || '-')}</div><div class="small muted">${escapeHTML(item.updated_at || '-')}</div></td>
        </tr>`;
      }).join('');
    }

    function routeRuleEntriesText(rule) {
      return (Array.isArray(rule && rule.entries) ? rule.entries : []).map((item) => String(item || '').trim()).filter(Boolean).join('\n');
    }

    function routeRuleAction(rule) {
      const value = String(rule && rule.action || '').trim().toLowerCase();
      if (value === 'probe_exit' || value === 'exit' || value === 'probe') return 'probe_exit';
      if (value === 'reject' || value === 'block' || value === 'deny') return 'reject';
      if (value === 'direct') return 'direct';
      return normalizeNodeID(rule && rule.exit_node_id) ? 'probe_exit' : 'direct';
    }

    function routeRuleExitNodeOptions(selected) {
      const ids = state.virtualRouterNodeIDs.length
        ? state.virtualRouterNodeIDs
        : state.nodes.map((item) => String(item.node_no || '')).filter(Boolean);
      const cleanSelected = normalizeNodeID(selected);
      const options = ids.map((id) => {
        const clean = normalizeNodeID(id);
        return `<option value="${escapeHTML(clean)}" ${cleanSelected === clean ? 'selected' : ''}>${escapeHTML(nodeLabel(clean))}</option>`;
      });
      if (cleanSelected && !ids.some((id) => normalizeNodeID(id) === cleanSelected)) {
        options.unshift(`<option value="${escapeHTML(cleanSelected)}" selected>${escapeHTML(nodeLabel(cleanSelected))} (当前)</option>`);
      }
      return options.join('');
    }

    function renderRouteRules() {
      const body = document.getElementById('route-rules-body');
      const summary = document.getElementById('route-rules-summary');
      const rules = Array.isArray(state.routeRules) ? state.routeRules : [];
      const entryCount = rules.reduce((sum, item) => sum + (Array.isArray(item.entries) ? item.entries.length : 0), 0);
      summary.textContent = rules.length ? `路由规则 ${rules.length} 个，条目 ${entryCount} 条` : '暂无路由规则';
      if (!rules.length) {
        body.innerHTML = '<tr><td colspan="4" class="muted">暂无路由规则。</td></tr>';
        return;
      }
      body.innerHTML = rules.map((rule, idx) => `
        <tr>
          <td>
            <input data-route-rule-name="${idx}" class="name-input" value="${escapeHTML(rule.name || '')}" />
            <div class="small muted mono">${escapeHTML(rule.id || '')}</div>
          </td>
          <td>
            <select data-route-rule-action="${idx}">
              <option value="probe_exit" ${routeRuleAction(rule) === 'probe_exit' ? 'selected' : ''}>探针出口</option>
              <option value="direct" ${routeRuleAction(rule) === 'direct' ? 'selected' : ''}>直连</option>
              <option value="reject" ${routeRuleAction(rule) === 'reject' ? 'selected' : ''}>拒绝</option>
            </select>
            <div class="route-rule-exit" style="${routeRuleAction(rule) === 'probe_exit' ? '' : 'display:none;'}">
              <select data-route-rule-exit="${idx}">${routeRuleExitNodeOptions(rule.exit_node_id)}</select>
            </div>
          </td>
          <td class="rule-editor">
            <textarea data-route-rule-entries="${idx}" class="mono" spellcheck="false">${escapeHTML(routeRuleEntriesText(rule))}</textarea>
          </td>
          <td>
            <div class="route-rule-actions">
              <button class="btn primary" data-route-rule-save="${idx}" type="button">保存</button>
              <button class="btn" data-route-rule-remove="${idx}" type="button">删除</button>
            </div>
          </td>
        </tr>
      `).join('');
      bindRouteRuleEvents();
    }

    function currentFakeIPLibrary() {
      const library = state.virtualRouter && state.virtualRouter.fake_ip_library ? state.virtualRouter.fake_ip_library : {};
      return {
        version: Number(library.version || 0),
        updated_at: String(library.updated_at || '').trim(),
        items: Array.isArray(library.items) ? library.items : [],
      };
    }

    function renderFakeIPLibrary() {
      const summary = document.getElementById('fake-ip-library-summary');
      const body = document.getElementById('fake-ip-library-body');
      if (!summary || !body) return;
      const library = currentFakeIPLibrary();
      const keyword = String(state.fakeIPSearch || '').trim().toLowerCase();
      const rows = library.items.map((item) => {
        const action = String(item && item.action || '').trim() || '-';
        const ruleID = String(item && item.rule_id || '').trim();
        const exitNodeID = normalizeNodeID(item && item.exit_node_id);
        const ruleExit = [ruleID ? `规则 ${ruleID}` : '', exitNodeID ? `出口 ${nodeLabel(exitNodeID)}` : ''].filter(Boolean).join(' / ') || '-';
        const row = {
          domain: String(item && item.domain || '').trim(),
          fakeIP: String(item && item.fake_ip || '').trim(),
          action,
          ruleExit,
          expiresAt: String(item && item.expires_at || '').trim(),
        };
        row.searchText = [row.domain, row.fakeIP, row.action, row.ruleExit, row.expiresAt].join(' ').toLowerCase();
        return row;
      }).filter((row) => !keyword || row.searchText.includes(keyword));
      const searchText = keyword ? `，匹配 ${rows.length} 条` : '';
      summary.textContent = `版本 v${library.version || 0}，${library.items.length} 条${searchText}，更新时间 ${library.updated_at || '-'}`;
      if (!library.items.length) {
        body.innerHTML = '<tr><td colspan="5" class="muted">暂无 Fake IP 映射。DNS 命中探针出口规则后会由主控分配。</td></tr>';
        return;
      }
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="5" class="muted">没有匹配的 Fake IP 映射。</td></tr>';
        return;
      }
      body.innerHTML = rows.map((row) => {
        return `<tr>
          <td class="mono">${escapeHTML(row.domain || '-')}</td>
          <td class="mono">${escapeHTML(row.fakeIP || '-')}</td>
          <td>${escapeHTML(row.action)}</td>
          <td>${escapeHTML(row.ruleExit)}</td>
          <td class="mono">${escapeHTML(row.expiresAt || '-')}</td>
        </tr>`;
      }).join('');
    }

    async function resetFakeIPLibrary() {
      if (!window.confirm('确认重置全部虚拟路由 Fake IP？现有域名映射会失效，在线探针会收到同步通知。')) return;
      const result = await requestJSON('/mng/api/route/virtual_router/fake_ip/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      state.virtualRouter.fake_ip_library = result.fake_ip_library || { version: 1, updated_at: '', items: [] };
      renderFakeIPLibrary();
      const sync = result.sync || {};
      const total = Number(sync.total || 0);
      const dispatched = Number(sync.dispatched || 0);
      const offline = Number(sync.offline || 0);
      const failed = Number(sync.failed || 0);
      const syncText = total > 0 ? `，已通知在线探针 ${dispatched}/${total}，离线 ${offline}，失败 ${failed}` : '';
      setStatus(`Fake IP 库已重置${syncText}`, failed > 0 ? 'warn' : 'ok');
    }

    function bindRouteRuleEvents() {
      document.querySelectorAll('[data-route-rule-name]').forEach((el) => {
        el.addEventListener('input', () => {
          const idx = Number.parseInt(el.getAttribute('data-route-rule-name') || '-1', 10);
          if (idx >= 0 && idx < state.routeRules.length) state.routeRules[idx].name = String(el.value || '').trim();
        });
      });
      document.querySelectorAll('[data-route-rule-action]').forEach((el) => {
        el.addEventListener('change', () => {
          const idx = Number.parseInt(el.getAttribute('data-route-rule-action') || '-1', 10);
          if (idx < 0 || idx >= state.routeRules.length) return;
          const action = routeRuleAction({ action: el.value });
          state.routeRules[idx].action = action;
          if (action !== 'probe_exit') {
            state.routeRules[idx].exit_node_id = '';
          } else if (!normalizeNodeID(state.routeRules[idx].exit_node_id)) {
            const first = state.virtualRouterNodeIDs[0] || (state.nodes[0] ? String(state.nodes[0].node_no || '') : '');
            state.routeRules[idx].exit_node_id = normalizeNodeID(first);
          }
          renderRouteRules();
        });
      });
      document.querySelectorAll('[data-route-rule-exit]').forEach((el) => {
        el.addEventListener('change', () => {
          const idx = Number.parseInt(el.getAttribute('data-route-rule-exit') || '-1', 10);
          if (idx >= 0 && idx < state.routeRules.length) {
            state.routeRules[idx].action = 'probe_exit';
            state.routeRules[idx].exit_node_id = normalizeNodeID(el.value);
          }
        });
      });
      document.querySelectorAll('[data-route-rule-entries]').forEach((el) => {
        el.addEventListener('input', () => {
          const idx = Number.parseInt(el.getAttribute('data-route-rule-entries') || '-1', 10);
          if (idx >= 0 && idx < state.routeRules.length) {
            state.routeRules[idx].entries = String(el.value || '').split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
          }
        });
      });
      document.querySelectorAll('[data-route-rule-save]').forEach((el) => {
        el.addEventListener('click', () => {
          const idx = Number.parseInt(el.getAttribute('data-route-rule-save') || '-1', 10);
          if (idx < 0 || idx >= state.routeRules.length) return;
          saveRouteRule(idx).catch((err) => setStatus(`保存路由规则失败：${err.message || err}`, 'err'));
        });
      });
      document.querySelectorAll('[data-route-rule-remove]').forEach((el) => {
        el.addEventListener('click', () => {
          const idx = Number.parseInt(el.getAttribute('data-route-rule-remove') || '-1', 10);
          if (idx < 0 || idx >= state.routeRules.length) return;
          state.routeRules.splice(idx, 1);
          renderRouteRules();
        });
      });
    }

    function addRouteRule() {
      if (!Array.isArray(state.routeRules)) state.routeRules = [];
      state.routeRules.push({
        id: '',
        name: `route-rule-${state.routeRules.length + 1}`,
        action: 'direct',
        exit_node_id: '',
        entries: [
          'domain_suffix:reddit.com',
          'domain_prefix:api.aaaa',
          'domain_keyword:api.aaaa',
          'google.*',
          '*.google.*',
          'cidr:91.108.4.0/22',
        ],
      });
      renderRouteRules();
    }

    function routeRulePayload(rule) {
      return {
        id: String(rule.id || '').trim(),
        name: String(rule.name || '').trim(),
        action: routeRuleAction(rule),
        exit_node_id: routeRuleAction(rule) === 'probe_exit' ? normalizeNodeID(rule.exit_node_id) : '',
        entries: Array.isArray(rule.entries) ? rule.entries.map((item) => String(item || '').trim()).filter(Boolean) : [],
        note: String(rule.note || '').trim(),
      };
    }

    function setRuleSaveStatus(message, sync) {
      const current = sync || {};
      const dispatched = Number(current.dispatched || 0);
      const offline = Number(current.offline || 0);
      const failed = Number(current.failed || 0);
      const total = Number(current.total || 0);
      const syncText = total > 0 ? `，已通知在线探针 ${dispatched}/${total}，离线 ${offline}，失败 ${failed}` : '';
      setStatus(`${message}${syncText}`, failed > 0 ? 'warn' : 'ok');
    }

    async function saveRouteRule(index) {
      if (index < 0 || index >= state.routeRules.length) throw new Error('路由规则不存在');
      const result = await requestJSON('/mng/api/route/virtual_router/route_rules', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item: routeRulePayload(state.routeRules[index]) }),
      });
      if (!result.item || !String(result.item.id || '').trim()) throw new Error('服务端未返回已保存的路由规则');
      state.routeRules[index] = result.item;
      state.virtualRouter.route_rules = state.routeRules;
      renderRouteRules();
      renderFakeIPLibrary();
      setRuleSaveStatus(`路由规则“${result.item.name || result.item.id}”已保存`, result.sync);
    }

    async function saveRouteRules() {
      const items = (Array.isArray(state.routeRules) ? state.routeRules : []).map(routeRulePayload).filter((rule) => rule.name);
      const result = await requestJSON('/mng/api/route/virtual_router/route_rules', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items }),
      });
      state.routeRules = Array.isArray(result.items) ? result.items : items;
      state.virtualRouter.route_rules = state.routeRules;
      renderRouteRules();
      renderFakeIPLibrary();
      setRuleSaveStatus('路由规则已保存并排序', result.sync);
    }

    async function triggerVirtualRouterLatencyProbe() {
      const result = await requestJSON('/mng/api/route/virtual_router/latency_probe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      const total = Number(result.total || 0);
      const dispatched = Number(result.dispatched || 0);
      const offline = Number(result.offline || 0);
      const failed = Number(result.failed || 0);
      setStatus(`延迟探测已下发：${dispatched}/${total}，离线 ${offline}，失败 ${failed}`, failed > 0 ? 'warn' : 'ok');
      await loadVirtualRouterStatus(true).catch(() => {});
      window.setTimeout(() => {
        loadVirtualRouterStatus(true).catch((err) => setStatus(`刷新路由状态失败：${err.message || err}`, 'err'));
      }, 1000);
    }

    async function triggerVirtualRouterSpeedTest() {
      const source = normalizeNodeID(document.getElementById('vr-speed-source').value);
      const target = normalizeNodeID(document.getElementById('vr-speed-target').value);
      if (!source || !target) throw new Error('请选择源节点和目的节点');
      if (source === target) throw new Error('源节点和目的节点不能相同');
      state.virtualRouterSpeedSourceID = source;
      state.virtualRouterSpeedTargetID = target;
      const result = await requestJSON('/mng/api/route/virtual_router/speed_test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source_node_id: source, target_node_id: target }),
      });
      const total = Number(result.total || 0);
      const dispatched = Number(result.dispatched || 0);
      const offline = Number(result.offline || 0);
      const failed = Number(result.failed || 0);
      const detail = Array.isArray(result.failures) && result.failures.length ? `：${result.failures.join('；')}` : '';
      setStatus(`测速已下发：${nodeLabel(source)} -> ${nodeLabel(target)}，${dispatched}/${total}，离线 ${offline}，失败 ${failed}${detail}`, failed > 0 || offline > 0 ? 'warn' : 'ok');
      window.setTimeout(() => {
        loadVirtualRouterStatus(true).catch((err) => setStatus(`刷新路由状态失败：${err.message || err}`, 'err'));
      }, 1200);
      window.setTimeout(() => {
        loadVirtualRouterStatus(true).catch((err) => setStatus(`刷新路由状态失败：${err.message || err}`, 'err'));
      }, 11000);
    }

    async function logout() {
      await fetch('/mng/api/logout', { method: 'POST', credentials: 'same-origin' });
      location.href = '/mng';
    }

    function bindTabs() {
      const tabs = Array.from(document.querySelectorAll('.tab'));
      tabs.forEach((button) => {
        button.addEventListener('click', () => {
          state.activeTab = String(button.dataset.tab || 'topology');
          tabs.forEach((btn) => btn.classList.toggle('active', btn === button));
          document.querySelectorAll('.section').forEach((section) => {
            section.classList.toggle('active', section.id === `section-${state.activeTab}`);
          });
          if (state.activeTab === 'topology') {
            Promise.all([loadCloudflareDDNSRecords(), loadVirtualRouter(true)]).catch((err) => setStatus(`刷新拓扑规则失败：${err.message || err}`, 'err'));
          }
          if (state.activeTab === 'route-rules') {
            Promise.all([loadVirtualRouter(true), loadRouteRules(true)]).catch((err) => setStatus(`刷新路由规则失败：${err.message || err}`, 'err'));
          }
          if (state.activeTab === 'special-exits') {
            loadNodes().then(() => loadSpecialExits(true))
              .then(() => setStatus('二次分流配置与运行状态已刷新', 'ok'))
              .catch((err) => setStatus(`刷新二次分流失败：${err.message || err}`, 'err'));
          }
          if (state.activeTab === 'fake-ip') {
            loadVirtualRouter(true).catch((err) => setStatus(`刷新 Fake IP 失败：${err.message || err}`, 'err'));
          }
          if (state.activeTab === 'doh') {
            Promise.all([loadDoHSettings(true), loadDoHQueries(true)])
              .then(() => setStatus('DoH 配置与查询记录已刷新', 'ok'))
              .catch((err) => setStatus(`刷新 DoH 失败：${err.message || err}`, 'err'));
          }
          if (state.activeTab === 'route') {
            loadVirtualRouterStatus(true).catch((err) => setStatus(`刷新路由状态失败：${err.message || err}`, 'err'));
          }
          updateDoHRefreshTimer();
        });
      });
    }

    function bindActions() {
      document.getElementById('btn-back').addEventListener('click', () => { location.href = '/mng/panel'; });
      document.getElementById('btn-logout').addEventListener('click', () => { logout().catch(() => { location.href = '/mng'; }); });
      document.getElementById('btn-vr-refresh').addEventListener('click', () => {
        Promise.all([loadCloudflareDDNSRecords(), loadVirtualRouter(false)]).catch((err) => setStatus(`刷新拓扑规则失败：${err.message || err}`, 'err'));
      });
      document.getElementById('btn-vr-add-rule').addEventListener('click', addVirtualRouterRule);
      document.getElementById('vr-rule-node-filter').addEventListener('change', (event) => {
        state.virtualRouterRuleNodeFilterID = normalizeNodeID(event.target.value);
        renderVirtualRouter();
      });
      document.getElementById('btn-vr-save').addEventListener('click', () => {
        saveVirtualRouter().catch((err) => setStatus(`保存拓扑规则失败：${err.message || err}`, 'err'));
      });
      document.getElementById('btn-route-rules-refresh').addEventListener('click', () => {
        Promise.all([loadVirtualRouter(true), loadRouteRules(false)]).catch((err) => setStatus(`刷新路由规则失败：${err.message || err}`, 'err'));
      });
      document.getElementById('btn-route-rule-add').addEventListener('click', addRouteRule);
      document.getElementById('btn-route-rules-save').addEventListener('click', () => {
        saveRouteRules().catch((err) => setStatus(`保存路由规则失败：${err.message || err}`, 'err'));
      });
      document.getElementById('btn-special-exit-refresh').addEventListener('click', () => {
        loadNodes().then(() => loadSpecialExits(false)).catch((err) => setStatus(`刷新二次分流失败：${err.message || err}`, 'err'));
      });
      document.getElementById('btn-special-exit-library-refresh').addEventListener('click', () => {
        loadSpecialExits(false).catch((err) => setStatus(`刷新 Clash 订阅失败：${err.message || err}`, 'err'));
      });
      document.querySelectorAll('[data-special-exit-tab]').forEach((button) => button.addEventListener('click', () => {
        state.specialExitSubTab = button.dataset.specialExitTab === 'nodes' ? 'nodes' : 'subscriptions';
        renderSpecialExits();
      }));
      document.getElementById('special-exit-node').addEventListener('change', (event) => {
        state.selectedSpecialExitNodeID = normalizeNodeID(event.target.value);
        renderSpecialExits();
      });
      document.getElementById('btn-special-exit-subscription-add').addEventListener('click', addSpecialExitSubscription);
      document.getElementById('btn-special-exit-library-save').addEventListener('click', () => {
        saveSpecialExitLibrary().catch((err) => setStatus(`保存 Clash 订阅失败：${err.message || err}`, 'err'));
      });
      document.getElementById('btn-special-exit-save').addEventListener('click', () => {
        saveSpecialExit().catch((err) => setStatus(`保存二次分流失败：${err.message || err}`, 'err'));
      });
      document.getElementById('btn-special-exit-delete').addEventListener('click', () => {
        deleteSpecialExit().catch((err) => setStatus(`删除二次分流失败：${err.message || err}`, 'err'));
      });
      document.getElementById('btn-fake-ip-refresh').addEventListener('click', () => {
        loadVirtualRouter(true)
          .then(() => setStatus('Fake IP 已刷新', 'ok'))
          .catch((err) => setStatus(`刷新 Fake IP 失败：${err.message || err}`, 'err'));
      });
      document.getElementById('btn-fake-ip-reset').addEventListener('click', () => {
        resetFakeIPLibrary().catch((err) => setStatus(`重置 Fake IP 库失败：${err.message || err}`, 'err'));
      });
      document.getElementById('fake-ip-search').addEventListener('input', (event) => {
        state.fakeIPSearch = String(event.target.value || '');
        renderFakeIPLibrary();
      });
      document.getElementById('btn-doh-refresh').addEventListener('click', () => {
        Promise.all([loadDoHSettings(true), loadDoHQueries(true)])
          .then(() => setStatus('DoH 配置与查询记录已刷新', 'ok'))
          .catch((err) => setStatus(`刷新 DoH 失败：${err.message || err}`, 'err'));
      });
      document.getElementById('btn-doh-save').addEventListener('click', () => {
        saveDoHSettings(false).catch((err) => setStatus(`保存 DoH 配置失败：${err.message || err}`, 'err'));
      });
      document.getElementById('btn-doh-rotate-token').addEventListener('click', () => {
        if (!window.confirm('确认轮换 DoH 访问令牌？所有使用旧端点的设备会立即停止解析。')) return;
        saveDoHSettings(true).catch((err) => setStatus(`轮换 DoH 令牌失败：${err.message || err}`, 'err'));
      });
      document.getElementById('btn-doh-copy').addEventListener('click', () => {
        copyDoHValue(document.getElementById('doh-endpoint').value, 'DoH 端点').catch((err) => setStatus(err.message || String(err), 'err'));
      });
      document.getElementById('doh-endpoint').addEventListener('click', (event) => {
        copyDoHValue(event.currentTarget.value, 'DoH 端点').catch((err) => setStatus(err.message || String(err), 'err'));
      });
      document.getElementById('btn-doh-query-refresh').addEventListener('click', () => {
        loadDoHQueries(false).catch((err) => setStatus(`刷新 DoH 查询记录失败：${err.message || err}`, 'err'));
      });
      document.getElementById('btn-doh-query-clear').addEventListener('click', () => {
        clearDoHQueries().catch((err) => setStatus(`清空 DoH 查询记录失败：${err.message || err}`, 'err'));
      });
      document.getElementById('doh-query-search').addEventListener('input', (event) => {
        state.dohQuerySearch = String(event.target.value || '');
        renderDoHQueries();
      });
      document.getElementById('doh-query-action').addEventListener('change', (event) => {
        state.dohQueryAction = String(event.target.value || '');
        renderDoHQueries();
      });
      document.getElementById('doh-query-status').addEventListener('change', (event) => {
        state.dohQueryStatus = String(event.target.value || '');
        renderDoHQueries();
      });
      document.getElementById('doh-query-body').addEventListener('click', (event) => {
        const target = event.target.closest('[data-doh-copy]');
        if (!target) return;
        copyDoHValue(target.dataset.dohCopy, '域名').catch((err) => setStatus(err.message || String(err), 'err'));
      });
      document.getElementById('btn-vr-status-refresh').addEventListener('click', () => {
        refreshVirtualRouterStatusWithReport().catch((err) => setStatus(`刷新路由状态失败：${err.message || err}`, 'err'));
      });
      document.getElementById('btn-vr-latency-probe').addEventListener('click', () => {
        triggerVirtualRouterLatencyProbe().catch((err) => setStatus(`延迟探测下发失败：${err.message || err}`, 'err'));
      });
      document.getElementById('vr-status-node-filter').addEventListener('change', (event) => {
        state.virtualRouterStatusNodeFilterID = normalizeNodeID(event.target.value);
        renderVirtualRouterStatus();
      });
      document.getElementById('vr-speed-source').addEventListener('change', (event) => {
        state.virtualRouterSpeedSourceID = normalizeNodeID(event.target.value);
      });
      document.getElementById('vr-speed-target').addEventListener('change', (event) => {
        state.virtualRouterSpeedTargetID = normalizeNodeID(event.target.value);
      });
      document.getElementById('btn-vr-speed-test').addEventListener('click', () => {
        triggerVirtualRouterSpeedTest().catch((err) => setStatus(`测速下发失败：${err.message || err}`, 'err'));
      });
    }

    async function bootstrap() {
      bindTabs();
      bindActions();
      const ok = await ensureSession().catch(() => false);
      if (!ok) {
        location.href = '/mng';
        return;
      }
      await loadNodes();
      await loadCloudflareDDNSRecords().catch(() => {});
      await loadVirtualRouter(true);
      await loadRouteRules(true).catch(() => {});
      await loadSpecialExits(true).catch(() => {});
      await loadVirtualRouterStatus(true).catch(() => {});
      setStatus('路由管理页面初始化完成', 'ok');
    }

    window.addEventListener('beforeunload', () => {
      if (state.dohRefreshTimer) window.clearInterval(state.dohRefreshTimer);
    });

    bootstrap().catch((err) => {
      setStatus(`初始化失败：${err && err.message ? err.message : err}`, 'err');
    });
  </script>
</body>
</html>
