<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudHelper 旁路由</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f4;
      --surface: #ffffff;
      --text: #17211b;
      --muted: #647069;
      --line: #d8ded9;
      --green: #18794e;
      --green-soft: #e6f4ec;
      --amber: #946200;
      --amber-soft: #fff4d6;
      --red: #b42318;
      --red-soft: #feeceb;
      --ink: #27312b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    button, input, textarea, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    .hidden { display: none !important; }
    .shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
    .topbar-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: var(--ink);
      color: #fff;
      font: 700 13px/1 Consolas, monospace;
      flex: 0 0 auto;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 700; }
    .subline { margin-top: 3px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn {
      min-height: 36px;
      padding: 7px 12px;
      border: 1px solid #bfc8c1;
      border-radius: 5px;
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
    }
    .btn:hover { border-color: #839087; background: #f8faf8; }
    .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.danger { background: var(--red-soft); border-color: #efb5b0; color: var(--red); }
    .btn.warn { background: var(--amber-soft); border-color: #e7cf8d; color: #765000; }
    .notice { margin: 18px 0 0; padding: 11px 14px; border-left: 4px solid var(--amber); background: var(--amber-soft); color: #684800; }
    .notice.error { border-color: var(--red); background: var(--red-soft); color: var(--red); }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin: 20px 0 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .status-item { min-height: 92px; padding: 16px; border-right: 1px solid var(--line); }
    .status-item:last-child { border-right: 0; }
    .label { color: var(--muted); font-size: 12px; }
    .value { margin-top: 8px; font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
    .ok { color: var(--green); }
    .warn-text { color: var(--amber); }
    .error-text { color: var(--red); }
    .section { padding: 24px 0; border-bottom: 1px solid var(--line); }
    .section-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
    h2 { margin: 0; font-size: 17px; }
    .section-meta { color: var(--muted); font-size: 12px; text-align: right; overflow-wrap: anywhere; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      border: 1px solid #bfc8c1;
      border-radius: 5px;
      background: var(--surface);
      color: var(--text);
      padding: 9px 10px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(24, 121, 78, .12); }
    textarea { min-height: 82px; resize: vertical; font-family: Consolas, monospace; }
    select[multiple] { min-height: 126px; font-family: Consolas, monospace; }
    .switches { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; min-height: 38px; }
    .check { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; font-weight: 600; }
    .check input { width: 18px; height: 18px; accent-color: var(--green); }
    .allowed-picker { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .allowed-list { display: flex; flex-wrap: wrap; gap: 8px; min-height: 30px; margin-top: 10px; }
    .allowed-item { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 4px 5px 4px 9px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); font-size: 13px; }
    .allowed-item span { overflow-wrap: anywhere; }
    .allowed-remove { width: 24px; height: 24px; border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; }
    .allowed-empty { color: var(--muted); font-size: 13px; align-self: center; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .runtime-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
    .runtime-item { min-height: 78px; background: var(--surface); padding: 13px; }
    .runtime-item .value { font-size: 15px; font-family: Consolas, monospace; }
    .connection-list { border: 1px solid var(--line); background: var(--surface); overflow-x: auto; }
    .connection-row { display: grid; grid-template-columns: minmax(150px, 1fr) 110px minmax(180px, 1.5fr) 100px minmax(180px, 1.4fr); gap: 12px; align-items: center; min-width: 760px; padding: 11px 13px; border-bottom: 1px solid var(--line); }
    .connection-row:last-child { border-bottom: 0; }
    .connection-row.header { background: #f8faf8; color: var(--muted); font-size: 12px; font-weight: 600; }
    .connection-node { font-weight: 700; }
    .connection-detail { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .connection-empty { padding: 18px 13px; color: var(--muted); }
    pre {
      margin: 0;
      min-height: 220px;
      max-height: 420px;
      overflow: auto;
      padding: 14px;
      border: 1px solid #2f3933;
      border-radius: 5px;
      background: #17211b;
      color: #dce5df;
      font: 12px/1.55 Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .auth-wrap { width: min(440px, calc(100% - 32px)); margin: 8vh auto; }
    .auth-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 24px; }
    .auth-panel h1 { margin-bottom: 6px; }
    .auth-panel .field { margin-top: 14px; }
    .auth-panel .btn { width: 100%; margin-top: 18px; }
    .message { min-height: 20px; margin: 12px 0 0; color: var(--muted); font-size: 13px; }
    @media (max-width: 760px) {
      .shell { width: min(100% - 24px, 1120px); }
      .topbar-inner { align-items: flex-start; flex-direction: column; padding: 14px 0; }
      .status-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .status-item:nth-child(2) { border-right: 0; }
      .status-item:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .form-grid, .runtime-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .section-head { flex-direction: column; }
      .section-meta { text-align: left; }
      .connection-list { overflow-x: visible; }
      .connection-row.header { display: none; }
      .connection-row { min-width: 0; grid-template-columns: minmax(0, 1fr) auto; gap: 7px 12px; }
      .connection-path, .connection-latency, .connection-result { grid-column: 1 / -1; }
      .connection-path::before, .connection-latency::before, .connection-result::before { color: var(--muted); font-size: 12px; font-weight: 400; }
      .connection-path::before { content: "路径 "; }
      .connection-latency::before { content: "延迟 "; }
      .connection-result::before { content: "最近结果 "; }
    }
    @media (max-width: 420px) {
      .status-grid { grid-template-columns: 1fr; }
      .status-item { border-right: 0; border-bottom: 1px solid var(--line); }
      .status-item:last-child { border-bottom: 0; }
      .toolbar, .actions { width: 100%; }
      .toolbar .btn, .actions .btn { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <main id="authView" class="auth-wrap hidden">
    <section class="auth-panel">
      <div class="brand">
        <div class="brand-mark">CH</div>
        <div>
          <h1>CloudHelper 旁路由</h1>
          <div class="subline">本地管理</div>
        </div>
      </div>
      <form id="registerForm" class="hidden">
        <div class="field"><label for="registerUsername">用户名</label><input id="registerUsername" type="text" maxlength="64" required /></div>
        <div class="field"><label for="registerPassword">密码</label><input id="registerPassword" type="password" minlength="8" maxlength="128" required /></div>
        <div class="field"><label for="registerConfirm">确认密码</label><input id="registerConfirm" type="password" minlength="8" maxlength="128" required /></div>
        <button class="btn primary" type="submit">创建本地账号</button>
      </form>
      <form id="loginForm" class="hidden">
        <div class="field"><label for="loginUsername">用户名</label><input id="loginUsername" type="text" maxlength="64" required /></div>
        <div class="field"><label for="loginPassword">密码</label><input id="loginPassword" type="password" maxlength="128" required /></div>
        <button class="btn primary" type="submit">登录</button>
      </form>
      <p id="authMessage" class="message"></p>
    </section>
  </main>

  <div id="appView" class="hidden">
    <header class="topbar">
      <div class="shell topbar-inner">
        <div class="brand">
          <div class="brand-mark">CH</div>
          <div>
            <h1>CloudHelper 旁路由</h1>
            <div id="nodeSummary" class="subline">--</div>
          </div>
        </div>
        <div class="toolbar">
          <button id="upgradeBtn" class="btn" type="button">升级</button>
          <button id="refreshBtn" class="btn" type="button">刷新</button>
          <button id="logoutBtn" class="btn" type="button">退出</button>
        </div>
      </div>
    </header>

    <main class="shell">
      <div id="notice" class="notice hidden"></div>
      <div id="upgradeNotice" class="notice hidden"></div>
      <section class="status-grid" aria-label="运行状态">
        <div class="status-item"><div class="label">主控连接</div><div id="controllerStatus" class="value">--</div></div>
        <div class="status-item"><div class="label">数据面</div><div id="dataPlaneStatus" class="value">--</div></div>
        <div class="status-item"><div class="label">网关代理</div><div id="gatewayStatus" class="value">--</div></div>
        <div class="status-item"><div class="label">本地 IP 代理</div><div id="localIPStatus" class="value">--</div></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>旁路由配置</h2>
          <div id="configSource" class="section-meta">本地配置</div>
        </div>
        <form id="configForm">
          <div class="form-grid">
            <div class="field full switches">
              <label class="check"><input id="gatewayEnabled" type="checkbox" />网关代理</label>
              <label class="check"><input id="dnsEnabled" type="checkbox" />LAN DNS</label>
            </div>
            <div class="field"><label for="interfaceName">LAN 网卡</label><select id="interfaceName"></select></div>
            <div class="field"><label for="gatewayAddress">LAN IP</label><input id="gatewayAddress" type="text" maxlength="32" /></div>
            <div class="field"><label for="upstreamGateway">上游网关</label><input id="upstreamGateway" type="text" maxlength="32" /></div>
            <div class="field full switches">
              <label class="check"><input id="localIPEnabled" type="checkbox" />本地 IP 代理</label>
            </div>
            <div class="field full">
              <label for="availableNodeID">允许访问的探针</label>
              <div class="allowed-picker">
                <select id="availableNodeID"></select>
                <button id="addAllowedNodeBtn" class="btn" type="button">添加</button>
              </div>
              <div id="allowedNodeList" class="allowed-list"></div>
            </div>
          </div>
          <div class="actions">
            <button id="saveBtn" class="btn primary" type="submit">保存并应用</button>
            <button id="failOpenBtn" class="btn warn" type="button">故障直通</button>
            <button id="resumeBtn" class="btn danger hidden" type="button">恢复数据面</button>
          </div>
        </form>
      </section>

      <section class="section">
        <div class="section-head"><h2>节点连接</h2><div id="connectionSummary" class="section-meta">--</div></div>
        <div class="connection-list">
          <div class="connection-row header"><span>节点</span><span>状态</span><span>路径</span><span>延迟</span><span>最近结果</span></div>
          <div id="connectionRows"></div>
        </div>
      </section>

      <section class="section">
        <div class="section-head"><h2>运行数据</h2><div id="updatedAt" class="section-meta">--</div></div>
        <div class="runtime-grid">
          <div class="runtime-item"><div class="label">应用修订</div><div id="revision" class="value">--</div></div>
          <div class="runtime-item"><div class="label">运行网卡</div><div id="runtimeInterface" class="value">--</div></div>
          <div class="runtime-item"><div class="label">网关地址</div><div id="runtimeGateway" class="value">--</div></div>
          <div class="runtime-item"><div class="label">TUN 接收</div><div id="tunRx" class="value">--</div></div>
          <div class="runtime-item"><div class="label">TUN 发送</div><div id="tunTx" class="value">--</div></div>
          <div class="runtime-item"><div class="label">最优邻接延迟</div><div id="latency" class="value">--</div></div>
          <div class="runtime-item"><div class="label">运行发布网段</div><div id="runtimePublishedCIDRs" class="value">--</div></div>
          <div class="runtime-item"><div class="label">本地 Web</div><div id="listenAddr" class="value">--</div></div>
          <div class="runtime-item"><div class="label">运行时间</div><div id="uptime" class="value">--</div></div>
        </div>
      </section>

      <section class="section">
        <div class="section-head"><h2>运行日志</h2><button id="logsBtn" class="btn" type="button">刷新日志</button></div>
        <pre id="logs">--</pre>
      </section>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let currentStatus = null;
    let upgradeStatusTimer = null;
    let configDirty = false;
    let configSaveInFlight = false;
    let configNotice = '';
    let statusRequestSequence = 0;
    let appliedStatusSequence = 0;
    let allowedNodeSelection = new Set();

    async function requestJSON(url, options = {}) {
      const response = await fetch(url, {
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      let payload = {};
      try { payload = await response.json(); } catch (_) { payload = {}; }
      if (!response.ok) {
        const error = new Error(payload.error || ('HTTP ' + response.status));
        error.status = response.status;
        throw error;
      }
      return payload;
    }

    function setAuthMessage(text, failed) {
      $('authMessage').textContent = text || '';
      $('authMessage').className = 'message' + (failed ? ' error-text' : '');
    }

    function showAuth(registered) {
      $('appView').classList.add('hidden');
      $('authView').classList.remove('hidden');
      $('registerForm').classList.toggle('hidden', registered);
      $('loginForm').classList.toggle('hidden', !registered);
    }

    function showApp() {
      $('authView').classList.add('hidden');
      $('appView').classList.remove('hidden');
    }

    function formatBytes(value) {
      const bytes = Number(value || 0);
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KiB';
      if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MiB';
      return (bytes / 1024 / 1024 / 1024).toFixed(1) + ' GiB';
    }

    function formatDuration(seconds) {
      const value = Math.max(0, Number(seconds || 0));
      const days = Math.floor(value / 86400);
      const hours = Math.floor((value % 86400) / 3600);
      const minutes = Math.floor((value % 3600) / 60);
      return (days ? days + ' 天 ' : '') + hours + ' 小时 ' + minutes + ' 分';
    }

    function setState(id, text, kind) {
      const element = $(id);
      element.textContent = text;
      element.className = 'value' + (kind ? ' ' + kind : '');
    }

    function escapeHTML(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    }

    function renderConnections(connections, allowedNodeIDs, updateSelector = true) {
      const items = Array.isArray(connections) ? connections : [];
      const allowed = new Set((Array.isArray(allowedNodeIDs) ? allowedNodeIDs : []).map((value) => String(value || '').trim()).filter(Boolean));
      if (updateSelector) allowedNodeSelection = allowed;
      const known = new Map(items.map((item) => [String(item.target_node_id || '').trim(), String(item.target_node_name || '').trim()]));
      allowedNodeSelection.forEach((nodeID) => { if (!known.has(nodeID)) known.set(nodeID, ''); });
      const available = Array.from(known.entries()).filter(([nodeID]) => nodeID && !allowedNodeSelection.has(nodeID)).sort((left, right) => left[0].localeCompare(right[0], undefined, { numeric: true }));
      $('availableNodeID').innerHTML = '<option value="">选择探针</option>' + available.map(([nodeID, nodeName]) =>
        `<option value="${escapeHTML(nodeID)}">#${escapeHTML(nodeID)}${nodeName ? ' ' + escapeHTML(nodeName) : ''}</option>`
      ).join('');
      $('addAllowedNodeBtn').disabled = available.length === 0;
      const selected = Array.from(allowedNodeSelection).sort((left, right) => left.localeCompare(right, undefined, { numeric: true }));
      $('allowedNodeList').innerHTML = selected.length ? selected.map((nodeID) => {
        const nodeName = known.get(nodeID) || '';
        return `<div class="allowed-item"><span>#${escapeHTML(nodeID)}${nodeName ? ' ' + escapeHTML(nodeName) : ''}</span><button class="allowed-remove" type="button" data-node-id="${escapeHTML(nodeID)}" title="移除">×</button></div>`;
      }).join('') : '<span class="allowed-empty">未添加探针</span>';

      const healthy = items.filter((item) => item.status === 'running').length;
      $('connectionSummary').textContent = `${healthy}/${items.length} 可达`;
      if (!items.length) {
        $('connectionRows').innerHTML = '<div class="connection-empty">暂无其他虚拟路由节点</div>';
        return;
      }
      const statusLabels = { running: '可达', degraded: '异常', quarantined: '已隔离', unavailable: '不可达' };
      $('connectionRows').innerHTML = items.map((item) => {
        const status = String(item.status || 'unavailable');
        const statusClass = status === 'running' ? 'ok' : (status === 'degraded' ? 'warn-text' : 'error-text');
        const path = (Array.isArray(item.path) ? item.path : []).map((node) => `#${String(node.node_id || '').trim()}`).join(' > ') || '-';
        const observed = item.last_observed_at ? new Date(item.last_observed_at).toLocaleString() : '-';
        const detail = item.last_error ? `${observed} · ${item.last_error}` : observed;
        return `<div class="connection-row">
          <div><div class="connection-node">#${escapeHTML(item.target_node_id || '-')} ${escapeHTML(item.target_node_name || '')}</div><div class="connection-detail">${escapeHTML(item.target_ip || '-')}</div></div>
          <span class="${statusClass}">${escapeHTML(statusLabels[status] || status)}</span>
          <span class="connection-detail connection-path">${escapeHTML(path)}</span>
          <span class="connection-latency">${Number(item.rtt_ms || 0) > 0 ? escapeHTML(item.rtt_ms) + ' ms' : '-'}</span>
          <span class="connection-detail connection-result">${escapeHTML(detail)}</span>
        </div>`;
      }).join('');
    }

    function renderStatus(data) {
      currentStatus = data;
      const config = data.config || {};
      const gateway = config.gateway_proxy || {};
      const localIP = config.local_ip_proxy || {};
      const runtime = data.runtime || {};
      $('nodeSummary').textContent = '#' + (data.node_id || '-') + ' · ' + (data.hostname || '-') + ' · ' + (data.architecture || '-') + ' · ' + (data.version || 'dev');
      setState('controllerStatus', data.controller_connected ? '已连接' : '未连接', data.controller_connected ? 'ok' : 'warn-text');
      setState('dataPlaneStatus', data.manual_fail_open || runtime.fail_open ? '故障直通' : (runtime.healthy ? '正常' : '异常'), data.manual_fail_open || runtime.fail_open ? 'warn-text' : (runtime.healthy ? 'ok' : 'error-text'));
      setState('gatewayStatus', gateway.enabled ? '已启用' : '已关闭', gateway.enabled ? 'ok' : '');
      setState('localIPStatus', localIP.enabled ? '已启用' : '已关闭', localIP.enabled ? 'ok' : '');
      $('configSource').textContent = '本地配置';
      const preserveForm = configDirty || configSaveInFlight;
      if (!preserveForm) {
        $('gatewayEnabled').checked = gateway.enabled === true;
        $('dnsEnabled').checked = gateway.dns_enabled !== false;
        const configuredInterface = String(gateway.interface || 'auto');
        const interfaces = Array.isArray(data.interfaces) ? data.interfaces : [];
        const interfaceNames = new Set(interfaces.map((item) => String(item.name || '').trim()).filter(Boolean));
        const interfaceOptions = [{ name: 'auto', label: '自动选择' }].concat(interfaces.map((item) => {
          const name = String(item.name || '').trim();
          const addresses = Array.isArray(item.addresses) ? item.addresses.join(', ') : '';
          return { name, label: addresses ? `${name} · ${addresses}` : name };
        }));
        if (configuredInterface !== 'auto' && !interfaceNames.has(configuredInterface)) {
          interfaceOptions.push({ name: configuredInterface, label: `${configuredInterface} · 当前配置` });
        }
        $('interfaceName').innerHTML = interfaceOptions.map((item) => `<option value="${escapeHTML(item.name)}">${escapeHTML(item.label)}</option>`).join('');
        $('interfaceName').value = configuredInterface;
        $('gatewayAddress').value = String(gateway.gateway_address || '192.168.1.150/24').split('/')[0];
        $('upstreamGateway').value = gateway.upstream_gateway || '192.168.1.1';
        $('localIPEnabled').checked = localIP.enabled === true;
      }
      const allowedNodeIDs = preserveForm ? Array.from(allowedNodeSelection) : localIP.allowed_node_ids;
      renderConnections(data.connections, allowedNodeIDs, !preserveForm);
      $('revision').textContent = 'r' + Number(runtime.applied_revision || config.revision || 0);
      $('runtimeInterface').textContent = runtime.interface || '-';
      $('runtimeGateway').textContent = runtime.gateway_address || gateway.gateway_address || '-';
      $('tunRx').textContent = Number(runtime.tun_rx_packets || 0) + ' 包 / ' + formatBytes(runtime.tun_rx_bytes);
      $('tunTx').textContent = Number(runtime.tun_tx_packets || 0) + ' 包 / ' + formatBytes(runtime.tun_tx_bytes);
      $('latency').textContent = Number(runtime.latency_ms || 0) > 0 ? runtime.latency_ms + ' ms' : '-';
      $('runtimePublishedCIDRs').textContent = (runtime.published_cidrs || localIP.published_cidrs || []).join(', ') || '-';
      $('listenAddr').textContent = data.listen_addr || '0.0.0.0:18080';
      $('uptime').textContent = formatDuration(data.uptime_seconds);
      $('updatedAt').textContent = runtime.updated_at ? new Date(runtime.updated_at).toLocaleString() : '-';
      $('failOpenBtn').classList.toggle('hidden', data.manual_fail_open === true);
      $('resumeBtn').classList.toggle('hidden', data.manual_fail_open !== true);
      const error = runtime.last_apply_error || '';
      const notice = $('notice');
      if (error) {
        notice.textContent = error;
        notice.className = 'notice error';
      } else if (data.manual_fail_open) {
        notice.textContent = '故障直通已启用';
        notice.className = 'notice';
      } else if (configNotice) {
        notice.textContent = configNotice;
        notice.className = 'notice';
      } else {
        notice.textContent = '';
        notice.className = 'notice hidden';
      }
    }

    async function loadStatus() {
      const requestSequence = ++statusRequestSequence;
      try {
        const data = await requestJSON('/local/router/api/status');
        if (requestSequence < appliedStatusSequence) return true;
        appliedStatusSequence = requestSequence;
        showApp();
        renderStatus(data);
        return true;
      } catch (error) {
        if (error.status === 401) {
          const bootstrap = await requestJSON('/local/api/auth/bootstrap');
          showAuth(bootstrap.registered === true);
          return false;
        }
        throw error;
      }
    }

    async function loadLogs() {
      const data = await requestJSON('/local/router/api/logs?lines=200');
      $('logs').textContent = data.content || '--';
    }

    function showActionError(error) {
      $('notice').textContent = error.message;
      $('notice').className = 'notice error';
    }

    function setUpgradeNotice(text, kind) {
      const notice = $('upgradeNotice');
      notice.textContent = text || '';
      notice.className = 'notice' + (kind === 'error' ? ' error' : '') + (text ? '' : ' hidden');
    }

    function upgradeStatusText(data) {
      const status = String(data && data.status || 'idle');
      const progress = Math.max(0, Math.min(100, Math.trunc(Number(data && data.progress || 0))));
      const message = String(data && (data.error || data.message) || '').trim();
      return `升级：${status}${progress > 0 ? ` ${progress}%` : ''}${message ? ` · ${message}` : ''}`;
    }

    async function pollUpgradeStatus() {
      try {
        const data = await requestJSON('/local/router/api/upgrade/status');
        const status = String(data && data.status || 'idle');
        const busy = status === 'accepted' || status === 'running';
        $('upgradeBtn').disabled = busy;
        setUpgradeNotice(upgradeStatusText(data), status === 'failed' ? 'error' : '');
        if (!busy && upgradeStatusTimer) {
          clearInterval(upgradeStatusTimer);
          upgradeStatusTimer = null;
        }
      } catch (error) {
        if (upgradeStatusTimer) {
          setUpgradeNotice('升级程序正在重启，页面连接暂时中断');
        }
      }
    }

    async function startUpgrade() {
      $('upgradeBtn').disabled = true;
      setUpgradeNotice('正在通过主控检查新版本');
      try {
        const check = await requestJSON('/local/router/api/upgrade/check', {
          method: 'POST',
          body: JSON.stringify({ mode: 'proxy', release_repo: 'fengzhanhuaer/CloudHelper' }),
        });
        if (!check.upgradeable) {
          setUpgradeNotice(`当前已是最新版本 ${check.current_version || ''}`.trim());
          return;
        }
        if (!check.asset_name) throw new Error(check.asset_error || '未找到匹配的旁路由升级包');
        if (!window.confirm(`升级 ${check.current_version || ''} 到 ${check.latest_version || ''}？`)) {
          setUpgradeNotice('已取消升级');
          return;
        }
        await requestJSON('/local/router/api/upgrade', {
          method: 'POST',
          body: JSON.stringify({ mode: 'proxy', release_repo: 'fengzhanhuaer/CloudHelper' }),
        });
        await pollUpgradeStatus();
        if (!upgradeStatusTimer) upgradeStatusTimer = setInterval(pollUpgradeStatus, 1500);
      } catch (error) {
        setUpgradeNotice('升级失败：' + error.message, 'error');
      } finally {
        if (!upgradeStatusTimer) $('upgradeBtn').disabled = false;
      }
    }

    $('registerForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      setAuthMessage('');
      try {
        await requestJSON('/local/api/auth/register', { method: 'POST', body: JSON.stringify({
          username: $('registerUsername').value,
          password: $('registerPassword').value,
          confirm_password: $('registerConfirm').value,
        }) });
        $('loginUsername').value = $('registerUsername').value;
        showAuth(true);
      } catch (error) { setAuthMessage(error.message, true); }
    });

    $('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      setAuthMessage('');
      try {
        await requestJSON('/local/api/auth/login', { method: 'POST', body: JSON.stringify({ username: $('loginUsername').value, password: $('loginPassword').value }) });
        await loadStatus();
        await loadLogs();
      } catch (error) { setAuthMessage(error.message, true); }
    });

    $('configForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!window.confirm('保存并应用本地旁路由配置？')) return;
      $('saveBtn').disabled = true;
      configSaveInFlight = true;
      try {
        await requestJSON('/local/router/api/config', { method: 'POST', body: JSON.stringify({
          gateway_proxy: {
            enabled: $('gatewayEnabled').checked,
            dns_enabled: $('dnsEnabled').checked,
            interface: $('interfaceName').value.trim(),
            gateway_address: $('gatewayAddress').value.trim(),
            upstream_gateway: $('upstreamGateway').value.trim(),
          },
          local_ip_proxy: {
            enabled: $('localIPEnabled').checked,
            allowed_node_ids: Array.from(allowedNodeSelection),
          },
        }) });
        configDirty = false;
        configNotice = '配置已保存并应用';
        await loadStatus();
      } catch (error) {
        configNotice = error.message;
        $('notice').textContent = error.message;
        $('notice').className = 'notice error';
      } finally {
        configSaveInFlight = false;
        $('saveBtn').disabled = false;
        if (currentStatus) renderStatus(currentStatus);
      }
    });

    function markConfigDirty() {
      configDirty = true;
      configNotice = '有未保存的更改';
      if (currentStatus) renderStatus(currentStatus);
    }
    $('configForm').addEventListener('input', (event) => {
      if (event.target === $('availableNodeID')) return;
      markConfigDirty();
    });
    $('configForm').addEventListener('change', (event) => {
      if (event.target === $('availableNodeID')) return;
      markConfigDirty();
    });
    $('addAllowedNodeBtn').addEventListener('click', () => {
      const nodeID = $('availableNodeID').value.trim();
      if (!nodeID) return;
      allowedNodeSelection.add(nodeID);
      renderConnections(currentStatus && currentStatus.connections, Array.from(allowedNodeSelection), false);
      markConfigDirty();
    });
    $('allowedNodeList').addEventListener('click', (event) => {
      const button = event.target.closest('.allowed-remove');
      if (!button) return;
      allowedNodeSelection.delete(String(button.dataset.nodeId || '').trim());
      renderConnections(currentStatus && currentStatus.connections, Array.from(allowedNodeSelection), false);
      markConfigDirty();
    });
    window.addEventListener('beforeunload', (event) => {
      if (!configDirty) return;
      event.preventDefault();
      event.returnValue = '';
    });

    $('failOpenBtn').addEventListener('click', async () => {
      if (!window.confirm('立即进入故障直通？')) return;
      try {
        await requestJSON('/local/router/api/fail-open', { method: 'POST', body: '{}' });
        await loadStatus();
      } catch (error) { showActionError(error); }
    });
    $('resumeBtn').addEventListener('click', async () => {
      if (!window.confirm('恢复旁路由数据面？')) return;
      try {
        await requestJSON('/local/router/api/resume', { method: 'POST', body: '{}' });
        await loadStatus();
      } catch (error) { showActionError(error); }
    });
    $('refreshBtn').addEventListener('click', async () => { try { await loadStatus(); } catch (error) { showActionError(error); } });
    $('upgradeBtn').addEventListener('click', startUpgrade);
    $('logsBtn').addEventListener('click', async () => { try { await loadLogs(); } catch (error) { showActionError(error); } });
    $('logoutBtn').addEventListener('click', async () => {
      try { await requestJSON('/local/api/auth/logout', { method: 'POST', body: '{}' }); } catch (_) {}
      showAuth(true);
    });

    loadStatus().then((authenticated) => authenticated ? loadLogs() : null).catch((error) => {
      $('authView').classList.remove('hidden');
      setAuthMessage(error.message, true);
    });
    setInterval(() => {
      if (!currentStatus || document.hidden || $('configForm').contains(document.activeElement)) return;
      loadStatus().catch(() => {});
    }, 5000);
  </script>
</body>
</html>
