    /* ================= Event Binding ================= */
    function bindStaticEvents() {
      qs('btn-api-pill').addEventListener('click', openAPIKeyModal);
      qs('btn-refresh-all').addEventListener('click', () => handleRefreshAll().catch((e) => showToast(`刷新失败：${e.message || e}`, 'err')));
      qs('btn-refresh-accounts').addEventListener('click', () => handleRefreshAccounts().catch((e) => showToast(`校验状态失败：${e.message || e}`, 'err')));
      qs('btn-login-account').addEventListener('click', openAddAccountModal);
      qs('btn-token-login').addEventListener('click', openTokenLoginModal);
      qs('btn-logout').addEventListener('click', () => logout().catch(() => { location.href = '/mng'; }));

      document.querySelectorAll('[data-panel-tab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.activePanelTab = btn.getAttribute('data-panel-tab') || 'assistant';
          renderPanelTabs();
          if (state.activePanelTab === 'notify') {
            loadNotify({ silent: true });
          }
        });
      });

      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        for (const key of Object.keys(state.modal)) {
          if (state.modal[key]) {
            closeModal(key);
            break;
          }
        }
      });

      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin) return;
        const data = event.data;
        if (!data || data.type !== 'tg.pickScheduleTarget') return;
        const targetID = String(data.targetID || '').trim();
        const accountID = String(data.accountID || '').trim();
        if (!targetID) return;
        if (accountID && accountID !== state.selectedAccountID) {
          state.selectedAccountID = accountID;
          renderAccountSidebar();
        }
        state.activePanelTab = 'assistant';
        state.activeSubTab = 'scheduled-send';
        renderPanelTabs();
        renderAccountStage();
        openAddScheduleTaskModal();
        state.draft.scheduleTarget = targetID;
        renderModal();
        showToast(`已从 TG 对话带入发送目标：${renderTargetLabel(state.selectedAccountID, targetID)}`, 'ok');
      });
    }

    function bindStageEvents() {
      const stage = qs('account-stage');
      if (!stage) return;
      const account = getSelectedAccount();

      stage.querySelector('[data-action="open-api-modal"]')?.addEventListener('click', openAPIKeyModal);
      stage.querySelector('[data-action="open-add-account"]')?.addEventListener('click', openAddAccountModal);
      stage.querySelector('[data-action="open-token-login"]')?.addEventListener('click', openTokenLoginModal);
      stage.querySelector('[data-action="open-sessions"]')?.addEventListener('click', () => openTGSessionWindow(account));
      stage.querySelector('[data-action="logout-account"]')?.addEventListener('click', () => handleLogoutAccount(account).catch((e) => showToast(`登出失败：${e.message || e}`, 'err')));
      stage.querySelector('[data-action="remove-account"]')?.addEventListener('click', () => handleRemoveAccount(account).catch((e) => showToast(`删除账号失败：${e.message || e}`, 'err')));

      // Inline login for unauthorized account
      const inCode = qs('inline-login-code');
      if (inCode) inCode.addEventListener('input', () => { state.draft.inlineLoginCode = inCode.value; });
      const inPwd = qs('inline-login-password');
      if (inPwd) inPwd.addEventListener('input', () => { state.draft.inlineLoginPassword = inPwd.value; });
      stage.querySelector('[data-action="inline-send-code"]')?.addEventListener('click', () => handleSendCodeForAccount(account).catch((e) => showToast(`发送验证码失败：${e.message || e}`, 'err')));
      stage.querySelector('[data-action="inline-sign-in"]')?.addEventListener('click', () => handleSignInForAccount(account, state.draft.inlineLoginCode, state.draft.inlineLoginPassword, false).catch((e) => showToast(`登录失败：${e.message || e}`, 'err')));

      // Subtabs
      stage.querySelectorAll('[data-action="switch-subtab"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.activeSubTab = btn.getAttribute('data-subtab') || 'scheduled-send';
          if (state.activeSubTab === 'tg-bot' && account) syncBotDraftFromAccount(account.id);
          renderAccountStage();
        });
      });

      // Schedule tab actions
      stage.querySelector('[data-action="open-add-task"]')?.addEventListener('click', openAddScheduleTaskModal);
      stage.querySelector('[data-action="refresh-targets"]')?.addEventListener('click', () => handleRefreshTargets().catch((e) => showToast(`同步发送对象失败：${e.message || e}`, 'err')));
      stage.querySelector('[data-action="refresh-pending"]')?.addEventListener('click', () => account && loadPendingTasks(account.id, { silent: false }).catch((e) => showToast(`刷新队列失败：${e.message || e}`, 'err')));
      stage.querySelector('[data-action="toggle-pending"]')?.addEventListener('click', () => {
        state.showPendingQueue = !state.showPendingQueue;
        renderAccountStage();
      });

      stage.querySelectorAll('[data-action="toggle-task"]').forEach((el) => {
        el.addEventListener('change', () => {
          const id = el.getAttribute('data-task-id') || '';
          handleToggleScheduleTaskEnabled(id, !!el.checked).catch((e) => showToast(`更新任务状态失败：${e.message || e}`, 'err'));
        });
      });
      stage.querySelectorAll('[data-action="edit-task"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (!account) return;
          const id = btn.getAttribute('data-task-id') || '';
          const task = getAccountBucket(account.id).schedules.find((t) => t.id === id);
          if (task) openEditScheduleTaskModal(task);
        });
      });
      stage.querySelectorAll('[data-action="send-now"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-task-id') || '';
          handleSendNowScheduleTask(id).catch((e) => showToast(`立即发送失败：${e.message || e}`, 'err'));
        });
      });
      stage.querySelectorAll('[data-action="task-history"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-task-id') || '';
          openScheduleTaskHistoryModal(id).catch((e) => showToast(`加载记录失败：${e.message || e}`, 'err'));
        });
      });
      stage.querySelectorAll('[data-action="remove-task"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-task-id') || '';
          handleRemoveScheduleTask(id).catch((e) => showToast(`删除任务失败：${e.message || e}`, 'err'));
        });
      });

      // Bot tab inline controls
      const botMode = qs('inline-bot-mode');
      if (botMode) botMode.addEventListener('change', () => { state.draft.botMode = botMode.value === 'webhook' ? 'webhook' : 'polling'; });
      const botKey = qs('inline-bot-key');
      if (botKey) botKey.addEventListener('input', () => { state.draft.botAPIKey = botKey.value; });
      const botMsg = qs('tg-bot-test-message');
      if (botMsg) botMsg.addEventListener('input', () => { state.draft.botTestMessage = botMsg.value; });
      stage.querySelector('[data-action="save-bot-key"]')?.addEventListener('click', () => handleSaveBotAPIKey().catch((e) => showToast(`保存 BOT 配置失败：${e.message || e}`, 'err')));
      stage.querySelector('[data-action="refresh-bot"]')?.addEventListener('click', () => account && loadBotConfig(account.id, { silent: false }).catch((e) => showToast(`刷新 BOT 失败：${e.message || e}`, 'err')));
      stage.querySelector('[data-action="test-bot-send"]')?.addEventListener('click', () => handleTestBotSend().catch((e) => showToast(`测试发送失败：${e.message || e}`, 'err')));
      stage.querySelector('[data-action="goto-notify"]')?.addEventListener('click', () => {
        state.activePanelTab = 'notify';
        renderPanelTabs();
        loadNotify({ silent: true });
      });

      // Basic info token controls
      stage.querySelector('[data-action="toggle-token"]')?.addEventListener('click', () => {
        state.showSessionToken = !state.showSessionToken;
        renderAccountStage();
      });
      stage.querySelector('[data-action="copy-token"]')?.addEventListener('click', async () => {
        const token = account && account.session_token ? String(account.session_token) : '';
        if (!token) return;
        try {
          await navigator.clipboard.writeText(token);
          showToast('已复制 Session Token', 'ok');
        } catch (_) {
          state.showSessionToken = true;
          renderAccountStage();
          showToast('请从文本框手动复制 Session Token', 'warn');
        }
      });
    }

    function bindModalEvents() {
      const root = qs('modal-root');
      if (!root || !root.innerHTML) return;

      root.querySelectorAll('[data-close-modal]').forEach((el) => {
        el.addEventListener('click', (event) => {
          if (el.classList.contains('modal-mask') && event.target !== el) return;
          closeModal(el.getAttribute('data-close-modal') || '');
        });
      });

      // API Key modal
      const apiID = qs('api-key-id');
      if (apiID) apiID.addEventListener('input', () => { state.draft.apiKeyID = apiID.value; });
      const apiHash = qs('api-key-hash');
      if (apiHash) apiHash.addEventListener('input', () => { state.draft.apiKeyHash = apiHash.value; });
      root.querySelector('[data-action="save-api-key"]')?.addEventListener('click', () => handleSaveSharedAPIKey().catch((e) => showToast(`保存 API 失败：${e.message || e}`, 'err')));

      // Add Account modal
      const addLabel = qs('add-account-label');
      if (addLabel) addLabel.addEventListener('input', () => { state.draft.addAccountLabel = addLabel.value; });
      const addPhone = qs('add-account-phone');
      if (addPhone) addPhone.addEventListener('input', () => { state.draft.addAccountPhone = addPhone.value; });
      const loginCode = qs('login-code');
      if (loginCode) loginCode.addEventListener('input', () => { state.draft.loginCode = loginCode.value; });
      const loginPwd = qs('login-password');
      if (loginPwd) loginPwd.addEventListener('input', () => { state.draft.loginPassword = loginPwd.value; });
      root.querySelector('[data-action="modal-send-code"]')?.addEventListener('click', () => handleModalAddAndSendCode().catch((e) => showToast(`发送验证码失败：${e.message || e}`, 'err')));
      root.querySelector('[data-action="modal-sign-in"]')?.addEventListener('click', () => {
        const acc = state.accounts.find((a) => a.id === state.draft.addAccountCreatedID) || null;
        handleSignInForAccount(acc, state.draft.loginCode, state.draft.loginPassword, true).catch((e) => showToast(`登录失败：${e.message || e}`, 'err'));
      });

      // Token login modal
      const tokLabel = qs('token-login-label');
      if (tokLabel) tokLabel.addEventListener('input', () => { state.draft.tokenLoginLabel = tokLabel.value; });
      const tokVal = qs('token-login-session-token');
      if (tokVal) tokVal.addEventListener('input', () => { state.draft.tokenLoginSessionToken = tokVal.value; });
      root.querySelector('[data-action="token-login"]')?.addEventListener('click', () => handleTokenLogin().catch((e) => showToast(`Token 登录失败：${e.message || e}`, 'err')));

      // Schedule Task modal (local target list filtering WITHOUT re-rendering modal -> keeps focus & IME!)
      const enabledEl = qs('schedule-enabled');
      if (enabledEl) enabledEl.addEventListener('change', () => { state.draft.scheduleEnabled = !!enabledEl.checked; });

      const account = getSelectedAccount();
      const accountID = account ? account.id : '';
      const targetSearch = qs('schedule-target-search');
      const targetListEl = qs('schedule-target-list');
      const selectedBarEl = qs('schedule-selected-bar');

      const updateTargetPickerDOM = () => {
        if (!targetListEl) return;
        targetListEl.innerHTML = buildTargetOptionListHTML(accountID);
        if (selectedBarEl) {
          const label = state.draft.scheduleTarget ? renderTargetLabel(accountID, state.draft.scheduleTarget) : '尚未选择发送对象';
          selectedBarEl.innerHTML = `<span>已选：<strong>${escapeHTML(label)}</strong></span><span class="mono">${escapeHTML(state.draft.scheduleTarget || '')}</span>`;
        }
      };

      if (targetSearch) {
        targetSearch.addEventListener('input', () => {
          state.draft.scheduleTargetSearch = targetSearch.value;
          updateTargetPickerDOM();
        });
      }
      if (targetListEl) {
        targetListEl.addEventListener('click', (event) => {
          const btn = event.target.closest('[data-pick-target]');
          if (!btn) return;
          state.draft.scheduleTarget = btn.getAttribute('data-pick-target') || '';
          updateTargetPickerDOM();
        });
      }
      root.querySelector('[data-action="modal-refresh-targets"]')?.addEventListener('click', () => handleRefreshTargets().catch((e) => showToast(`刷新发送对象失败：${e.message || e}`, 'err')));

      const freqEl = qs('schedule-freq');
      const clockEl = qs('schedule-clock');
      const timeEl = qs('schedule-time');
      const syncFromBuilder = () => {
        state.draft.scheduleFreq = freqEl ? freqEl.value : '每天';
        state.draft.scheduleClock = (clockEl && clockEl.value) ? clockEl.value : '09:00';
        state.draft.scheduleSendAt = `${state.draft.scheduleFreq} ${state.draft.scheduleClock}`;
        if (timeEl) timeEl.value = state.draft.scheduleSendAt;
      };
      if (freqEl) freqEl.addEventListener('change', syncFromBuilder);
      if (clockEl) clockEl.addEventListener('input', syncFromBuilder);
      if (timeEl) {
        timeEl.addEventListener('input', () => {
          state.draft.scheduleSendAt = timeEl.value;
          const parsed = parseSendAtToBuilder(timeEl.value);
          if (parsed.matched) {
            state.draft.scheduleFreq = parsed.freq;
            state.draft.scheduleClock = parsed.clock;
            if (freqEl) freqEl.value = parsed.freq;
            if (clockEl) clockEl.value = parsed.clock;
          }
        });
      }

      const msgEl = qs('schedule-message');
      if (msgEl) msgEl.addEventListener('input', () => { state.draft.scheduleMessage = msgEl.value; });
      const delayEl = qs('schedule-delay-max');
      if (delayEl) delayEl.addEventListener('input', () => { state.draft.scheduleDelayMax = delayEl.value; });

    /* ================= API Actions ================= */
    async function loadBaseData(options = {}) {
      const silent = options.silent === true;
      if (!silent) {
        state.loading = true;
        renderHeaderChrome();
      }
      try {
        const [apiKey, accountsData] = await Promise.all([
          requestJSON('/mng/api/tg/api/get'),
          requestJSON('/mng/api/tg/accounts/list'),
        ]);
        state.api = apiKey || { api_id: 0, api_hash: '', configured: false };
        state.accounts = Array.isArray(accountsData.accounts) ? accountsData.accounts : [];
        syncSelectedAccount();
        renderHeaderChrome();
        renderAccountSidebar();
        renderAccountStage();
        renderNotifyStage();
      } finally {
        if (!silent) {
          state.loading = false;
          renderHeaderChrome();
          renderAccountStage();
        }
      }
    }

    async function ensureAccountDataLoaded(accountID, force) {
      const bucket = getAccountBucket(accountID);
      if (bucket.loaded && !force) {
        syncBotDraftFromAccount(accountID);
        return;
      }
      await Promise.all([
        loadSchedule(accountID, { silent: true }),
        loadPendingTasks(accountID, { silent: true }),
        loadTargets(accountID, { silent: true }),
        loadBotConfig(accountID, { silent: true }),
      ]);
      bucket.loaded = true;
      if (state.selectedAccountID === accountID) {
        syncBotDraftFromAccount(accountID);
        renderAccountStage();
      }
    }

    async function handleRefreshAll() {
      await handleRefreshAccounts();
      await loadNotify({ silent: true });
      const acc = getSelectedAccount();
      if (acc && acc.authorized) {
        await ensureAccountDataLoaded(acc.id, true);
      }
    }

    async function handleRefreshAccounts() {
      state.loading = true;
      renderHeaderChrome();
      try {
        const [apiKey, payload] = await Promise.all([
          requestJSON('/mng/api/tg/api/get'),
          requestJSON('/mng/api/tg/accounts/refresh', { method: 'POST' }),
        ]);
        state.api = apiKey || { api_id: 0, api_hash: '', configured: false };
        state.accounts = Array.isArray(payload.accounts) ? payload.accounts : [];
        syncSelectedAccount();
        showToast(`已校验 ${state.accounts.length} 个 TG 账号状态`, 'ok');
      } finally {
        state.loading = false;
        renderHeaderChrome();
        renderAccountSidebar();
        renderAccountStage();
        renderNotifyStage();
      }
    }

    async function handleSaveSharedAPIKey() {
      const apiID = Number.parseInt(String(state.draft.apiKeyID || '').trim(), 10);
      const apiHash = String(state.draft.apiKeyHash || '').trim();
      if (!Number.isFinite(apiID) || apiID <= 0) {
        showToast('共享 API ID 必须是正整数', 'warn');
        return;
      }
      if (!apiHash) {
        showToast('共享 API Hash 不能为空', 'warn');
        return;
      }
      state.loading = true;
      renderModal();
      try {
        const res = await requestJSON('/mng/api/tg/api/set', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ api_id: apiID, api_hash: apiHash }),
        });
        state.api = res || { api_id: apiID, api_hash: apiHash, configured: true };
        state.modal.apiKey = false;
        showToast('共享 API Key 已保存', 'ok');
      } finally {
        state.loading = false;
        renderHeaderChrome();
        renderAccountStage();
        renderModal();
      }
    }

    async function handleModalAddAndSendCode() {
      const label = String(state.draft.addAccountLabel || '').trim();
      const phone = normalizePhone(state.draft.addAccountPhone || '');
      let accountID = String(state.draft.addAccountCreatedID || '').trim();

      if (!accountID) {
        if (!phone) { showToast('请填写手机号', 'warn'); return; }
        if (!phone.startsWith('+')) { showToast('手机号必须包含国家区号，例如 +86...', 'warn'); return; }
      }

      state.loading = true;
      renderModal();
      try {
        if (!accountID) {
          const added = await requestJSON('/mng/api/tg/account/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ label, phone }),
          });
          accountID = added.account && added.account.id ? String(added.account.id) : '';
          if (!accountID) throw new Error('创建账号未返回 account_id');
          state.draft.addAccountCreatedID = accountID;
          state.selectedAccountID = accountID;
        }
        await requestJSON('/mng/api/tg/account/send_code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: accountID }),
        });
        await loadBaseData({ silent: true });
        state.selectedAccountID = accountID;
        showToast('验证码已发送，请查收 Telegram 消息或短信', 'ok');
      } finally {
        state.loading = false;
        renderHeaderChrome();
        renderAccountSidebar();
        renderAccountStage();
        renderModal();
      }
    }

    async function handleSendCodeForAccount(account) {
      if (!account) return;
      state.loading = true;
      renderAccountStage();
      try {
        await requestJSON('/mng/api/tg/account/send_code', {
          method: 'POST',

        renderAccountSidebar();
        renderAccountStage();
      }

    async function handleSignInForAccount(account, rawCode, password, fromModal) {
      if (!account) { showToast('未找到待登录账号', 'warn'); return; }
      const code = String(rawCode || '').trim();
      if (!code) { showToast('请输入验证码', 'warn'); return; }

      state.loading = true;
      if (fromModal) renderModal();
      else renderAccountStage();
      try {
        await requestJSON('/mng/api/tg/account/sign_in', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: account.id, code, password: String(password || '') }),
        });
        await loadBaseData({ silent: true });
        state.selectedAccountID = account.id;
        state.modal.addAccount = false;
        state.draft.loginCode = '';
        state.draft.loginPassword = '';
        state.draft.inlineLoginCode = '';
        state.draft.inlineLoginPassword = '';
        showToast(`账号 ${account.label || account.phone} 登录成功`, 'ok');
        await ensureAccountDataLoaded(account.id, true);
      } finally {
        state.loading = false;
        renderHeaderChrome();
        renderAccountSidebar();
        renderAccountStage();
        renderModal();
      }

    async function handleTokenLogin() {
      const label = String(state.draft.tokenLoginLabel || '').trim();
      const sessionToken = String(state.draft.tokenLoginSessionToken || '').trim();
      if (!sessionToken) { showToast('请粘贴 Session Token', 'warn'); return; }
      state.loading = true;
      renderModal();
      try {
        const res = await requestJSON('/mng/api/tg/account/token_login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label, session_token: sessionToken }),
        });
        const acc = res.account || null;
        await loadBaseData({ silent: true });

          state.selectedAccountID = String(acc.id);
          await ensureAccountDataLoaded(state.selectedAccountID, true);

        state.modal.tokenLogin = false;
        showToast(`Token 登录成功：${acc && acc.label ? acc.label : 'TG 账号'}`, 'ok');

        state.loading = false;
        renderHeaderChrome();
        renderAccountSidebar();
        renderAccountStage();
        renderModal();
      }
    }

    async function handleLogoutAccount(account) {
      if (!account) return;
      if (!window.confirm(`确认登出账号 ${account.label || account.phone} 吗？`)) return;
      state.loading = true;
      renderAccountStage();
      try {
        await requestJSON('/mng/api/tg/account/logout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: account.id }),
        });
        delete state.accountCache[account.id];
        await loadBaseData({ silent: true });
        showToast(`已登出账号：${account.label || account.phone}`, 'ok');
      } finally {
        state.loading = false;
        renderHeaderChrome();
        renderAccountSidebar();
        renderAccountStage();
        renderNotifyStage();
      }
    }

    async function handleRemoveAccount(account) {
      if (!account) return;
      if (!window.confirm(`确认永久删除账号 ${account.label || account.phone} 及其定时任务吗？`)) return;
      state.loading = true;
      renderAccountStage();
      try {
        await requestJSON('/mng/api/tg/account/remove', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: account.id }),
        });
        delete state.accountCache[account.id];
        await loadBaseData({ silent: true });
        showToast(`账号已删除：${account.label || account.phone}`, 'ok');

        if (next && next.authorized) ensureAccountDataLoaded(next.id, false);

        state.loading = false;
        renderHeaderChrome();
        renderAccountSidebar();
        renderAccountStage();
        renderNotifyStage();
      }

    async function loadSchedule(accountID, options = {}) {
      const id = String(accountID || '').trim();
      if (!id) return;
      const reqSeq = ++state.scheduleReqSeq;
      state.scheduleLoading = true;
      try {
        const res = await requestJSON('/mng/api/tg/schedule/list', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: id }),
        });
        if (reqSeq !== state.scheduleReqSeq) return;
        getAccountBucket(id).schedules = Array.isArray(res.schedules) ? res.schedules : [];
        if (state.selectedAccountID === id) renderAccountStage();
      } catch (err) {
        if (!options.silent) showToast(`加载任务列表失败：${err.message || err}`, 'err');
      } finally {
        state.scheduleLoading = false;
        if (state.selectedAccountID === id) renderAccountStage();
      }
    }

      const id = String(accountID || '').trim();
      if (!id) return;
      state.pendingLoading = true;
      if (state.selectedAccountID === id) renderAccountStage();
      try {
        const res = await requestJSON('/mng/api/tg/schedule/pending', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },

        state.pendingLoading = false;
        if (state.selectedAccountID === id) renderAccountStage();

    async function handleRefreshTargets() {

      if (!account || !account.authorized) return;

      renderAccountStage();

      try {
        const res = await requestJSON('/mng/api/tg/targets/refresh', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: account.id }),
        });
        const list = Array.isArray(res.targets) ? res.targets : [];
        getAccountBucket(account.id).targets = list;
        showToast(`已同步 ${list.length} 个发送对象`, 'ok');

        state.targetRefreshing = false;
        renderAccountStage();
        if (state.modal.scheduleTask) renderModal();
      }

    async function handleSaveScheduleTask() {
      const account = getSelectedAccount();
      if (!account || !account.authorized) return;
      const editingID = String(state.draft.scheduleEditingTaskID || '').trim();
      const target = String(state.draft.scheduleTarget || '').trim();
      const sendAt = String(state.draft.scheduleSendAt || '').trim();
      const message = String(state.draft.scheduleMessage || '').trim();
      const delayMax = Number.parseInt(String(state.draft.scheduleDelayMax || '0').trim(), 10) || 0;
      const enabled = state.draft.scheduleEnabled === true;

      if (!target) { showToast('请先选择发送目标', 'warn'); return; }
      if (enabled && !sendAt) { showToast('请设置发送时间', 'warn'); return; }
      if (enabled && !message) { showToast('请填写发送内容', 'warn'); return; }
      if (delayMax < 0) { showToast('随机延时不能小于 0', 'warn'); return; }

      state.scheduleLoading = true;
      renderModal();
      try {
        const endpoint = editingID ? '/mng/api/tg/schedule/update' : '/mng/api/tg/schedule/add';
        const res = await requestJSON(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            account_id: account.id,
            task_id: editingID,
            task_type: 'scheduled_send',
            enabled,
            target,
            send_at: sendAt,
            message,
            delay_min_sec: 0,
            delay_max_sec: delayMax,
          }),
        });
        getAccountBucket(account.id).schedules = Array.isArray(res.schedules) ? res.schedules : [];
        state.modal.scheduleTask = false;
        await loadPendingTasks(account.id, { silent: true });
        showToast(editingID ? '定时任务已更新' : '定时任务已创建', 'ok');
      } finally {
        state.scheduleLoading = false;
        renderAccountStage();
        renderModal();
      }
    }

        await loadPendingTasks(account.id, { silent: true });
        showToast(`任务已${enabled ? '启用' : '停用'}`, 'ok');

        state.scheduleLoading = false;
        renderAccountStage();
      }
    }

    async function loadBotConfig(accountID, options = {}) {

        const payload = await requestJSON('/mng/api/tg/bot/get', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: id }),
        });
        const bucket = getAccountBucket(id);
        bucket.bot = {
          api_key: payload.api_key || '',
          configured: payload.configured === true,
          mode: payload.mode === 'webhook' ? 'webhook' : 'polling',
          webhook_path: payload.webhook_path || '',
          webhook_enabled: payload.webhook_enabled === true,
        };

          syncBotDraftFromAccount(id);

      } finally {
        state.botLoading = false;
        if (state.selectedAccountID === id) renderAccountStage();

    async function handleSaveNotify() {
      const accountID = String((qs('notify-account-select') || {}).value || '').trim();
      const enableOffline = !!(qs('notify-enable-offline') && qs('notify-enable-offline').checked);
      const enableRenewal = !!(qs('notify-enable-renewal') && qs('notify-enable-renewal').checked);
      const debounce = parseInt((qs('notify-debounce') || {}).value, 10);
      const checkHour = parseInt((qs('notify-check-hour') || {}).value, 10);
      state.notify.loading = true;
      renderNotifyStage();
      try {
        const ov = await requestJSON('/mng/api/tg/notify/set', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            notify_account_id: accountID,
            enable_offline: enableOffline,
            enable_renewal: enableRenewal,
            offline_debounce_sec: Number.isFinite(debounce) ? debounce : 60,
            renewal_check_hour: Number.isFinite(checkHour) ? checkHour : 9,
          }),
        });
        state.notify.overview = ov || null;
        showToast('主控通知设置已保存', 'ok');
      } finally {
        state.notify.loading = false;
        renderHeaderChrome();
        renderAccountSidebar();
        renderNotifyStage();
      }
    }

    async function handleTestNotify() {
      state.notify.loading = true;
      renderNotifyStage();
      try {
        await requestJSON('/mng/api/tg/notify/test', { method: 'POST' });
        showToast('测试推送已发送', 'ok');
        await loadNotify({ silent: true });
      } finally {
        state.notify.loading = false;
        renderNotifyStage();
      }
    }

    function consumeSessionWindowTargetSelection() {
      let targetID = '';
      try {
        targetID = String(window.sessionStorage.getItem('cloudhelper_tg_schedule_target') || '').trim();
        window.sessionStorage.removeItem('cloudhelper_tg_schedule_target');
      } catch (_) {}
      const acc = getSelectedAccount();
      if (!targetID || !acc || !acc.authorized) return false;
      openAddScheduleTaskModal();
      state.draft.scheduleTarget = targetID;
      renderModal();
      showToast(`已从会话带入发送目标：${renderTargetLabel(acc.id, targetID)}`, 'ok');
      return true;
    }

    async function ensureSession() {
      const payload = await requestJSON('/mng/api/session');
      if (!payload.authenticated) {
        location.href = '/mng';
        return false;
      }
      return true;
    }

    async function logout() {
      await fetch('/mng/api/logout', { method: 'POST', credentials: 'same-origin' });
      location.href = '/mng';
    }

    async function bootstrap() {
      bindStaticEvents();
      renderPanelTabs();
      const ok = await ensureSession().catch(() => false);
      if (!ok) {
        location.href = '/mng';
        return;
      }
      await Promise.all([loadBaseData(), loadNotify({ silent: true })]);
      const acc = getSelectedAccount();
      if (acc && acc.authorized) {
        await ensureAccountDataLoaded(acc.id, true);
      }
      consumeSessionWindowTargetSelection();
    }

    bootstrap().catch((err) => {
      showToast(`初始化失败：${err && err.message ? err.message : err}`, 'err');
    });
  </script>
</body>
</html>
