                const t = item.traffic || {};
                const trafficCell = t.available
                    ? '<div class="mono" style="font-weight:600;color:#fff">' + formatTrafficBytes((Number(t.month_rx_bytes) || 0) + (Number(t.month_tx_bytes) || 0)) + '</div>'
                      + '<div class="mono" style="font-size:11px;color:var(--text-secondary)"><span class="traffic-rx">↓' + formatTrafficBytes(t.month_rx_bytes) + '</span> · <span class="traffic-tx">↑' + formatTrafficBytes(t.month_tx_bytes) + '</span></div>'
                    : '<span style="color:var(--text-muted)">—</span>';

                return '<tr class="' + statusClass + '">'
                    + '<td>'
                    + '<div class="probe-title-row"><span class="status-dot ' + statusClass + '"></span><strong style="color:#fff">' + escapeHTML(name) + '</strong>' + (nodeNo > 0 ? '<span class="node-no-tag mono">#' + nodeNo + '</span>' : '') + '</div>'
                    + (subBits.length ? '<div style="margin-top:3px;font-size:11.5px;color:var(--text-secondary)">' + subBits.join(' · ') + '</div>' : '')
                    + '</td>'
                    + '<td><div class="mini-bars">' + miniBarHTML('CPU', cpuPct) + miniBarHTML('RAM', ramPct) + miniBarHTML('DISK', diskPct) + '</div></td>'
                    + '<td>' + latPills + '</td>'
                    + '<td>' + trafficCell + '</td>'
                    + '<td class="mono" title="最后心跳: ' + escapeHTML(formatDateTime(item.last_seen)) + '"><div>' + escapeHTML(formatMachineUptime(item.machine_uptime_seconds)) + '</div><div style="font-size:11px;color:var(--text-muted)">' + escapeHTML(formatRelativeTime(item.last_seen)) + '</div></td>'
                    + '<td><button class="chart-jump-btn" type="button" data-jump-node="' + escapeHTML(key) + '">曲线 ↗</button></td>'
                    + '</tr>';
            }).join('');

            els.probeContainer.innerHTML = '<div class="probe-table-wrap"><table class="probe-table">'
                + '<thead><tr><th>节点</th><th style="min-width:230px">系统资源</th><th style="min-width:240px">探针延迟</th><th>本月流量</th><th>运行 / 心跳</th><th>延迟图</th></tr></thead>'
                + '<tbody>' + rows + '</tbody></table></div>';
        }

        /* ================= Network Chart Logic ================= */
        function normalizeNetworkSeries(series) {
            if (!Array.isArray(series)) return [];
            return series.map((entry, idx) => {
                const rawPoints = Array.isArray(entry && entry.points) ? entry.points : [];
                const points = [];
                rawPoints.forEach((p) => {
                    if (!p) return;
                    const ts = Date.parse(p.timestamp);
                    if (!Number.isFinite(ts)) return;
                    points.push({
                        ts,
                        timestamp: p.timestamp,
                        latency: networkMetricValue(p.latency_avg_ms),
                        loss: networkMetricValue(p.loss_percent, 100),
                        ok: Boolean(p.ok)
                    });
                });
                points.sort((a, b) => a.ts - b.ts);
                return {
                    task_id: String((entry && entry.task_id) || ('task-' + idx)),
                    task_name: String((entry && entry.task_name) || (entry && entry.task_id) || '未命名任务'),
                    color: seriesColors[idx % seriesColors.length],
                    points
                };
            }).filter((entry) => entry.points.length > 0);
        }

        function computeSeriesStats(entry) {
            let latSum = 0;
            let latCount = 0;
            let latMin = Infinity;
            let latMax = -Infinity;
            let lossSum = 0;
            let lossCount = 0;
            let latest = null;
            entry.points.forEach((p) => {
                if (!latest || p.ts > latest.ts) latest = p;
                if (p.latency != null) {
                    latSum += p.latency;
                    latCount += 1;
                    if (p.latency < latMin) latMin = p.latency;
                    if (p.latency > latMax) latMax = p.latency;
                }
                if (p.loss != null) {
                    lossSum += p.loss;
                    lossCount += 1;
                }
            });
            return {
                latest,
                avgLat: latCount > 0 ? latSum / latCount : null,
                minLat: latCount > 0 ? latMin : null,
                maxLat: latCount > 0 ? latMax : null,
                avgLoss: lossCount > 0 ? lossSum / lossCount : null
            };
        }

        function niceCeil(maxVal) {
            if (!Number.isFinite(maxVal) || maxVal <= 10) return 10;
            const exp = Math.pow(10, Math.floor(Math.log10(maxVal)));
            const frac = maxVal / exp;
            let niceFrac = 10;
            if (frac <= 1.2) niceFrac = 1.2;
            else if (frac <= 1.5) niceFrac = 1.5;
            else if (frac <= 2) niceFrac = 2;
            else if (frac <= 2.5) niceFrac = 2.5;
            else if (frac <= 3) niceFrac = 3;
            else if (frac <= 4) niceFrac = 4;
            else if (frac <= 5) niceFrac = 5;
            else if (frac <= 6) niceFrac = 6;
            else if (frac <= 8) niceFrac = 8;
            return niceFrac * exp;
        }

        function computeLatencyAxisMax(visibleSeries) {
            const values = [];
            visibleSeries.forEach((entry) => {
                entry.points.forEach((p) => {
                    if (p.latency != null) values.push(p.latency);
                });
            });
            if (!values.length) return { max: 100, clamped: false };
            values.sort((a, b) => a - b);
            const rawMax = values[values.length - 1];
            if (state.clampSpikes && values.length >= 12) {
                const p98 = values[Math.min(values.length - 1, Math.floor(values.length * 0.98))];
                if (p98 > 0 && rawMax > p98 * 2.2) {
                    return { max: niceCeil(Math.max(10, p98 * 1.25)), clamped: true };
                }
            }
            return { max: niceCeil(Math.max(10, rawMax * 1.1)), clamped: false };
        }

        function syncNetworkNodeDropdown(items) {
            const current = state.networkNodeFilter;
            const opts = ['<option value="all">全部监测节点 (' + items.length + ')</option>'];
            let hasCurrent = current === 'all';
            items.forEach((item, index) => {
                const key = nodeKeyOf(item, index);
                if (key === current) hasCurrent = true;
                const no = nodeNoOf(item);
                const label = (no > 0 ? ('#' + no + ' ') : '') + displayNodeName(item, index);
                opts.push('<option value="' + escapeHTML(key) + '">' + escapeHTML(label) + '</option>');
            });
            els.networkNodeFilter.innerHTML = opts.join('');
            els.networkNodeFilter.value = hasCurrent ? current : 'all';
            if (!hasCurrent) state.networkNodeFilter = 'all';
        }

        function getHiddenSet(nodeKey) {
            let set = state.hiddenSeriesByNode.get(nodeKey);
            if (!set) {
                set = new Set();
                state.hiddenSeriesByNode.set(nodeKey, set);
            }
            return set;
        }

        function renderNetworkView() {
            state.chartInstances.clear();
            if (!state.networkLoaded) {

            }

                const key = nodeKeyOf(item, index);

            if (!filtered.length) {
                els.networkGrid.innerHTML = '<div class="empty-state">没有符合条件的网络监测节点<small>请切换节点下拉筛选或清除搜索关键词</small></div>';

            const prepared = filtered.map((item, idx) => {

            els.networkGrid.innerHTML = prepared.map(({ item, key, idx, series }) => {

                const metaRow = chips.length ? '<div class="probe-meta-tags">' + chips.join('') + '</div>' : '';

                const onlineKnown = state.probeOnlineMap.has(key);

                const stripHTML = series.map((entry) => {
                    const stats = computeSeriesStats(entry);
                    const hidden = hiddenSet.has(entry.task_id);
                    const latestLat = stats.latest ? stats.latest.latency : null;
                    const latestLoss = stats.latest ? stats.latest.loss : null;
                    const q = latencyQuality(latestLat, latestLoss, false, stats.latest != null);
                    const latText = formatLatencyDisplay(latestLat, latestLoss, stats.latest != null);
                    const avgText = stats.avgLat != null ? (stats.avgLat.toFixed(1) + 'ms') : '—';
                    const rangeText = (stats.minLat != null && stats.maxLat != null)
                        ? (stats.minLat.toFixed(0) + '–' + stats.maxLat.toFixed(0) + 'ms')
                        : '—';
                    const lossText = stats.avgLoss != null ? (stats.avgLoss.toFixed(1) + '%') : '—';

                    return '<button type="button" class="series-chip' + (hidden ? ' hidden' : '') + '"'
                        + ' style="--series-color:' + entry.color + ';--q-color:' + q.color + '"'
                        + ' data-node-key="' + escapeHTML(key) + '" data-task-id="' + escapeHTML(entry.task_id) + '"'
                        + ' title="单击隐藏/显示曲线，双击独显此监测任务">'
                        + '<div class="series-chip-top">'
                        + '<span class="series-chip-name">' + escapeHTML(entry.task_name) + '</span>'
                        + '<span class="series-chip-latest mono">' + escapeHTML(latText) + '</span>'
                        + '</div>'
                        + '<div class="series-chip-stats mono">'
                        + '<span>均 ' + avgText + '</span>'
                        + '<span>范围 ' + rangeText + '</span>'
                        + '<span style="color:' + ((stats.avgLoss || 0) > 0 ? '#fde047' : 'var(--text-secondary)') + '">丢包 ' + lossText + '</span>'
                        + '</div>'
                        + '</button>';
                }).join('');

                const highlightClass = state.highlightNodeKey && state.highlightNodeKey === key ? ' highlight' : '';
                return '<article class="network-card' + highlightClass + '" data-network-card="' + escapeHTML(key) + '">'
                    + '<div class="network-head">'
                    + '<div class="network-node-info">'
                    + '<div class="network-title-row">' + dotHTML + '<div class="network-title">' + escapeHTML(name) + '</div>' + (nodeNo > 0 ? '<span class="node-no-tag mono">#' + nodeNo + '</span>' : '') + '</div>'
                    + metaRow
                    + '</div>'
                    + '<div class="network-hint">单击任务胶囊开关曲线 · 双击独显 · 悬停查看详情</div>'
                    + '</div>'
                    + '<div class="series-strip">' + stripHTML + '</div>'
                    + '<div class="chart-stage" data-chart-stage="' + idx + '">'
                    + '<canvas id="network-chart-' + idx + '"></canvas>'
                    + '<div id="network-tooltip-' + idx + '" class="chart-tooltip"></div>'
                    + '</div>'
                    + '<div class="chart-legend">'
                    + '<div class="legend-items">'
                    + '<span class="legend-key"><span class="legend-line"></span>延迟曲线 (左轴 ms)</span>'
                    + '<span class="legend-key"><span class="legend-bar"></span>丢包柱状 (右轴 %)</span>'
                    + '</div>'
                    + '<span class="mono" id="network-scale-note-' + idx + '"></span>'
                    + '</div>'
                    + '</article>';
            }).join('');

            prepared.forEach(({ key, idx, series }) => {
                const canvas = document.getElementById('network-chart-' + idx);
                const tooltip = document.getElementById('network-tooltip-' + idx);
                const noteEl = document.getElementById('network-scale-note-' + idx);
                if (!canvas) return;
                const inst = { key, idx, canvas, tooltip, noteEl, series, layout: null, baseCanvas: null };
                state.chartInstances.set(key, inst);
                drawInteractiveChart(inst);
                bindChartEvents(inst);
            });
        }

        function drawInteractiveChart(inst) {
            const canvas = inst.canvas;
            if (!canvas || state.activeTab !== 'network-status') return;
            const rect = canvas.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) return;

            const ratio = Math.min(window.devicePixelRatio || 1, 2);
            const width = Math.max(300, Math.floor(rect.width * ratio));
            const height = Math.max(220, Math.floor(rect.height * ratio));
            if (canvas.width !== width || canvas.height !== height) {
                canvas.width = width;
                canvas.height = height;
            }

            const base = document.createElement('canvas');
            base.width = width;
            base.height = height;
            const ctx = base.getContext('2d');
            ctx.clearRect(0, 0, width, height);

            const hiddenSet = getHiddenSet(inst.key);
            const visibleSeries = inst.series.filter((s) => !hiddenSet.has(s.task_id));

            const padL = 56 * ratio;
            const padR = 46 * ratio;
            const padT = 26 * ratio;
            const padB = 32 * ratio;
            const plotW = Math.max(1, width - padL - padR);
            const plotH = Math.max(1, height - padT - padB);

            if (!visibleSeries.length) {
                ctx.fillStyle = 'rgba(139, 155, 176, 0.8)';
                ctx.font = (12 * ratio) + 'px ' + getComputedStyle(document.body).fontFamily;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('所有监测任务已隐藏，点击上方任务胶囊恢复显示', width / 2, height / 2);
                inst.layout = null;
                inst.baseCanvas = base;
                const mainCtx = canvas.getContext('2d');
                mainCtx.clearRect(0, 0, width, height);
                mainCtx.drawImage(base, 0, 0);
                if (inst.noteEl) inst.noteEl.textContent = '';
                return;
            }

            let minTime = Infinity;
            let maxTime = -Infinity;
            const tsSet = new Set();
            visibleSeries.forEach((entry) => {
                entry.points.forEach((p) => {
                    if (p.ts < minTime) minTime = p.ts;
                    if (p.ts > maxTime) maxTime = p.ts;
                    tsSet.add(p.ts);
                });
            });
            const allTimestamps = Array.from(tsSet).sort((a, b) => a - b);
            const { max: latencyMax, clamped } = computeLatencyAxisMax(visibleSeries);
            const lossMax = 100;

            if (inst.noteEl) {
                const scaleLabel = state.networkScale === 'day' ? '180天 / 天聚合' : (state.networkScale === 'hour' ? '30天 / 小时聚合' : '24小时 / 分钟聚合');
                inst.noteEl.textContent = scaleLabel + (clamped ? ' · 已启用 P98 毛刺过滤' : '');
            }

            const xOf = (ts) => {
                if (minTime === maxTime) return padL + plotW / 2;
                return padL + ((ts - minTime) / (maxTime - minTime)) * plotW;
            };
            const latencyY = (v) => {
                const clampedV = Math.max(0, Math.min(latencyMax, v));
                return padT + plotH - (clampedV / latencyMax) * plotH;
            };
            const lossY = (v) => {
                const clampedV = Math.max(0, Math.min(lossMax, v));
                return padT + plotH - (clampedV / lossMax) * plotH;
            };

            drawAxes(ctx, ratio, width, height, padL, padR, padT, padB, plotW, plotH, latencyMax, lossMax, minTime, maxTime);

            // 1) Draw packet-loss vertical bars first (subtle & unmistakable)
            const barWidth = Math.max(2 * ratio, Math.min(8 * ratio, plotW / Math.max(40, allTimestamps.length)));
            visibleSeries.forEach((entry) => {
                ctx.fillStyle = 'rgba(248, 113, 113, 0.34)';
                ctx.strokeStyle = 'rgba(248, 113, 113, 0.72)';
                ctx.lineWidth = 1 * ratio;
                entry.points.forEach((p) => {
                    if (p.loss == null || p.loss <= 0) return;
                    const x = xOf(p.ts);
                    const y = lossY(p.loss);
                    const h = Math.max(3 * ratio, (padT + plotH) - y);
                    const topY = (padT + plotH) - h;
                    ctx.fillRect(x - barWidth / 2, topY, barWidth, h);
                    if (p.loss >= 100) {
                        ctx.beginPath();
                        ctx.moveTo(x - barWidth / 2, topY);
                        ctx.lineTo(x + barWidth / 2, topY);
                        ctx.stroke();
                    }
                });
            });

            // 2) Draw latency curves (+ soft area fill when <= 3 visible series)
            const showFill = visibleSeries.length <= 3;
            visibleSeries.forEach((entry) => {
                drawLatencySeries(ctx, entry, xOf, latencyY, padT + plotH, ratio, showFill);
            });

            inst.baseCanvas = base;
            inst.layout = {
                ratio, width, height, padL, padR, padT, padB, plotW, plotH,
                minTime, maxTime, latencyMax, xOf, latencyY, visibleSeries, allTimestamps
            };

            const mainCtx = canvas.getContext('2d');
            mainCtx.clearRect(0, 0, width, height);
            mainCtx.drawImage(base, 0, 0);
        }

        function drawAxes(ctx, ratio, width, height, padL, padR, padT, padB, plotW, plotH, latencyMax, lossMax, minTime, maxTime) {
            ctx.save();
            ctx.font = (10 * ratio) + 'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
            ctx.textBaseline = 'middle';

            ctx.fillStyle = 'rgba(139, 155, 176, 0.72)';
            ctx.textAlign = 'left';
            ctx.fillText('延迟 ms', padL, padT - 13 * ratio);
            ctx.textAlign = 'right';
            ctx.fillText('丢包 %', width - padR, padT - 13 * ratio);

            const steps = 4;
            for (let i = 0; i <= steps; i += 1) {
                const y = padT + (plotH * i) / steps;
                const frac = 1 - i / steps;
                ctx.strokeStyle = i === steps ? 'rgba(148, 163, 184, 0.22)' : 'rgba(148, 163, 184, 0.08)';
                ctx.lineWidth = (i === steps ? 1 : 0.75) * ratio;
                ctx.beginPath();
                ctx.moveTo(padL, y);
                ctx.lineTo(width - padR, y);
                ctx.stroke();

                const latTick = latencyMax * frac;
                const latStr = latencyMax < 20 ? latTick.toFixed(1) : String(Math.round(latTick));
                ctx.fillStyle = 'rgba(148, 163, 184, 0.85)';
                ctx.textAlign = 'right';
                ctx.fillText(latStr, padL - 8 * ratio, y);

                ctx.textAlign = 'left';
                ctx.fillStyle = 'rgba(248, 113, 113, 0.72)';
                ctx.fillText(Math.round(lossMax * frac) + '%', width - padR + 8 * ratio, y);
            }

            ctx.textBaseline = 'top';
            ctx.fillStyle = 'rgba(148, 163, 184, 0.78)';
            const tickCount = (Number.isFinite(minTime) && Number.isFinite(maxTime) && maxTime > minTime)
                ? Math.min(8, Math.max(2, Math.floor((plotW / ratio) / 115) + 1))
                : 1;
            for (let i = 0; i < tickCount; i += 1) {
                const pos = tickCount === 1 ? 0.5 : i / (tickCount - 1);
                const ts = minTime + (maxTime - minTime) * pos;
                const x = padL + plotW * pos;
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.05)';
                ctx.lineWidth = 0.75 * ratio;
                ctx.beginPath();
                ctx.moveTo(x, padT);
                ctx.lineTo(x, height - padB);
                ctx.stroke();

                ctx.textAlign = tickCount === 1 ? 'center' : (i === 0 ? 'left' : (i === tickCount - 1 ? 'right' : 'center'));
                ctx.fillText(formatTimeLabel(ts, state.networkScale), x, height - padB + 9 * ratio);
            }
            ctx.restore();
        }

        function hexToRgba(hex, alpha) {
            const clean = hex.replace('#', '');
            const r = parseInt(clean.slice(0, 2), 16) || 88;
            const g = parseInt(clean.slice(2, 4), 16) || 166;
            const b = parseInt(clean.slice(4, 6), 16) || 255;
            return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
        }

        function drawLatencySeries(ctx, entry, xOf, yOf, baselineY, ratio, showFill) {
            // Split contiguous non-null segments
            const segments = [];
            let current = [];
            const maxGapMS = state.networkScale === 'day'
                ? 3 * 86400 * 1000
                : (state.networkScale === 'hour' ? 4 * 3600 * 1000 : 12 * 60 * 1000);

            entry.points.forEach((p) => {
                if (p.latency == null) {
                    if (current.length) {
                        segments.push(current);
                        current = [];
                    }
                    return;
                }
                if (current.length && (p.ts - current[current.length - 1].ts) > maxGapMS) {
                    segments.push(current);
                    current = [];
                }
                current.push({ ts: p.ts, x: xOf(p.ts), y: yOf(p.latency) });
            });
            if (current.length) segments.push(current);

            ctx.save();
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            segments.forEach((seg) => {
                if (seg.length === 1) {
                    ctx.fillStyle = entry.color;
                    ctx.beginPath();
                    ctx.arc(seg[0].x, seg[0].y, 2.8 * ratio, 0, Math.PI * 2);
                    ctx.fill();
                    return;
                }

                const tracePath = () => {
                    ctx.beginPath();
                    ctx.moveTo(seg[0].x, seg[0].y);
                    if (state.smoothCurve && seg.length >= 3) {
                        for (let i = 0; i < seg.length - 1; i += 1) {
                            const p0 = seg[i];
                            const p1 = seg[i + 1];
                            const cx = (p0.x + p1.x) / 2;
                            ctx.bezierCurveTo(cx, p0.y, cx, p1.y, p1.x, p1.y);
                        }
                    } else {
                        for (let i = 1; i < seg.length; i += 1) {
                            ctx.lineTo(seg[i].x, seg[i].y);
                        }
                    }
                };

                if (showFill) {
                    tracePath();
                    ctx.lineTo(seg[seg.length - 1].x, baselineY);
                    ctx.lineTo(seg[0].x, baselineY);
                    ctx.closePath();
                    const grad = ctx.createLinearGradient(0, baselineY - 220 * ratio, 0, baselineY);
                    grad.addColorStop(0, hexToRgba(entry.color, 0.22));
                    grad.addColorStop(1, hexToRgba(entry.color, 0.0));
                    ctx.fillStyle = grad;
                    ctx.fill();
                }

                tracePath();
                ctx.strokeStyle = entry.color;
                ctx.lineWidth = 1.85 * ratio;
                ctx.stroke();
            });

            ctx.restore();
        }

        function findNearestPoint(points, targetTs, toleranceMS) {
            if (!points.length) return null;
            let lo = 0;
            let hi = points.length - 1;
            while (lo < hi) {
                const mid = (lo + hi) >> 1;
                if (points[mid].ts < targetTs) lo = mid + 1;
                else hi = mid;
            }
            let best = points[lo];
            if (lo > 0 && Math.abs(points[lo - 1].ts - targetTs) < Math.abs(best.ts - targetTs)) {
                best = points[lo - 1];
            }
            if (Math.abs(best.ts - targetTs) > toleranceMS) return null;
            return best;
        }

        function bindChartEvents(inst) {
            const canvas = inst.canvas;
            const tooltip = inst.tooltip;
            const stage = canvas.parentElement;

            const clearHover = () => {
                if (inst.baseCanvas) {
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(inst.baseCanvas, 0, 0);
                }
                tooltip.classList.remove('visible');
            };

            const onMove = (clientX, clientY) => {
                const L = inst.layout;
                if (!L || !inst.baseCanvas || !L.allTimestamps.length) return;
                const rect = canvas.getBoundingClientRect();
                const relX = (clientX - rect.left) * L.ratio;
                const relY = (clientY - rect.top) * L.ratio;
                if (relX < L.padL - 8 * L.ratio || relX > L.width - L.padR + 8 * L.ratio || relY < L.padT - 8 * L.ratio || relY > L.height - L.padB + 8 * L.ratio) {
                    clearHover();
                    return;
                }

                const frac = Math.max(0, Math.min(1, (relX - L.padL) / L.plotW));
                const hoverTs = L.minTime === L.maxTime ? L.minTime : (L.minTime + frac * (L.maxTime - L.minTime));

                // Snap to nearest available timestamp
                let lo = 0;
                let hi = L.allTimestamps.length - 1;
                while (lo < hi) {
                    const mid = (lo + hi) >> 1;
                    if (L.allTimestamps[mid] < hoverTs) lo = mid + 1;
                    else hi = mid;
                }
                let snapTs = L.allTimestamps[lo];
                if (lo > 0 && Math.abs(L.allTimestamps[lo - 1] - hoverTs) < Math.abs(snapTs - hoverTs)) {
                    snapTs = L.allTimestamps[lo - 1];
                }

                const snapX = L.xOf(snapTs);
                const tolerance = state.networkScale === 'day'
                    ? 12 * 3600 * 1000
                    : (state.networkScale === 'hour' ? 35 * 60 * 1000 : 90 * 1000);

                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, L.width, L.height);
                ctx.drawImage(inst.baseCanvas, 0, 0);

                // Crosshair line
                ctx.save();
                ctx.strokeStyle = 'rgba(226, 232, 240, 0.32)';
                ctx.lineWidth = 1 * L.ratio;
                ctx.setLineDash([4 * L.ratio, 4 * L.ratio]);
                ctx.beginPath();
                ctx.moveTo(snapX, L.padT);
                ctx.lineTo(snapX, L.height - L.padB);
                ctx.stroke();
                ctx.setLineDash([]);

                const rows = [];
                L.visibleSeries.forEach((entry) => {
                    const pt = findNearestPoint(entry.points, snapTs, tolerance);
                    if (!pt) return;
                    if (pt.latency != null) {
                        const y = L.latencyY(pt.latency);
                        ctx.beginPath();
                        ctx.arc(snapX, y, 4.5 * L.ratio, 0, Math.PI * 2);
                        ctx.fillStyle = '#070b12';
                        ctx.fill();
                        ctx.lineWidth = 2.2 * L.ratio;
                        ctx.strokeStyle = entry.color;
                        ctx.stroke();
                    }
                    const q = latencyQuality(pt.latency, pt.loss, false, true);
                    const latStr = formatLatencyDisplay(pt.latency, pt.loss, true);
                    const lossStr = pt.loss == null ? '—' : (pt.loss.toFixed(1) + '%');
                    const lossColor = pt.loss == null ? 'var(--text-muted)' : (pt.loss >= 20 ? '#fca5a5' : (pt.loss > 0 ? '#fde047' : '#86efac'));
                    rows.push('<div class="tt-row">'
                        + '<span class="tt-dot" style="background:' + entry.color + '"></span>'
                        + '<span class="tt-name">' + escapeHTML(entry.task_name) + '</span>'
                        + '<span class="tt-lat mono" style="color:' + q.color + '">' + escapeHTML(latStr) + '</span>'
                        + '<span class="tt-loss mono" style="color:' + lossColor + '">' + lossStr + '</span>'
                        + '</div>');
                });
                ctx.restore();

                if (!rows.length) {
                    clearHover();
                    return;
                }

                tooltip.innerHTML = '<div class="tt-time mono">' + escapeHTML(formatTooltipTime(snapTs, state.networkScale)) + '</div>' + rows.join('');
                tooltip.classList.add('visible');

                const stageRect = stage.getBoundingClientRect();
                const ttW = tooltip.offsetWidth || 220;
                const ttH = tooltip.offsetHeight || 90;
                const pointerX = clientX - stageRect.left;
                const pointerY = clientY - stageRect.top;
                let left = pointerX + 14;
                if (left + ttW > stageRect.width - 8) left = pointerX - ttW - 14;
                if (left < 8) left = 8;
                let top = pointerY - ttH / 2;
                if (top < 8) top = 8;
                if (top + ttH > stageRect.height - 8) top = Math.max(8, stageRect.height - ttH - 8);
                tooltip.style.transform = 'translate(' + Math.round(left) + 'px,' + Math.round(top) + 'px)';
            };

            canvas.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
            canvas.addEventListener('mouseleave', clearHover);
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches && e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            canvas.addEventListener('touchmove', (e) => {
                if (e.touches && e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            canvas.addEventListener('touchend', clearHover);
        }

        function formatTimeLabel(ts, scale) {
            const date = new Date(ts);
            if (!Number.isFinite(date.getTime())) return '-';
            if (scale === 'day') return date.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
            if (scale === 'hour') return date.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', hour12: false });
            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function formatTooltipTime(ts, scale) {
            const date = new Date(ts);
            if (!Number.isFinite(date.getTime())) return '-';
            if (scale === 'day') return date.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
            return date.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
        }

        /* ================= Data Fetching ================= */
        async function fetchStatus() {
            try {
                const res = await fetch('/dashboard/status');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                els.uptime.textContent = formatControllerUptime(data.uptime);
                els.startedAt.textContent = '启动于 ' + formatDateTime(data.started_at);
                state.lastError = false;
            } catch (_) {
                state.lastError = true;
            }
            updateLiveIndicator();
        }

        async function fetchProbes() {
            const reqID = ++state.probeReqSeq;
            try {
                const res = await fetch('/dashboard/probes');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (reqID !== state.probeReqSeq) return;
                const items = sortedByNodeNo(data.items || []);
                state.probes = items;
                state.probesLoaded = true;
                state.probeOnlineMap.clear();
                items.forEach((item, idx) => state.probeOnlineMap.set(nodeKeyOf(item, idx), Boolean(item.online)));
                state.lastSyncAt = new Date();
                state.lastError = false;
                updateKPIs(items);
                if (state.activeTab === 'probe-status') renderProbesView();
            } catch (_) {
                if (reqID === state.probeReqSeq) state.lastError = true;
            }
            updateLiveIndicator();
        }

        async function fetchNetwork(showSpinner) {
            const reqID = ++state.networkReqSeq;
            const requestedScale = state.networkScale;
            if (state.networkAbort) {
                try { state.networkAbort.abort(); } catch (_) {}
            }
            const controller = new AbortController();
            state.networkAbort = controller;
            if (showSpinner) els.manualRefresh.classList.add('loading');

            try {
                const res = await fetch('/dashboard/network?scale=' + encodeURIComponent(requestedScale), { signal: controller.signal });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (reqID !== state.networkReqSeq || requestedScale !== state.networkScale) return;
                state.networkItems = Array.isArray(data.items) ? data.items : [];
                state.networkLoaded = true;
                state.lastSyncAt = new Date();
                state.lastError = false;
                if (state.activeTab === 'network-status') renderNetworkView();
                else els.tabNetworkBadge.textContent = String(state.networkItems.length);
            } catch (err) {
                if (err && err.name === 'AbortError') return;
                if (reqID === state.networkReqSeq) state.lastError = true;
            } finally {
                if (reqID === state.networkReqSeq && showSpinner) els.manualRefresh.classList.remove('loading');
            }
            updateLiveIndicator();
        }

        function switchTab(tab) {
            state.activeTab = tab;
            document.querySelectorAll('.tab-button').forEach((btn) => {
                const active = btn.getAttribute('data-tab') === tab;
                btn.classList.toggle('active', active);
                btn.setAttribute('aria-selected', active ? 'true' : 'false');
            });
            document.querySelectorAll('.tab-panel').forEach((panel) => {
                panel.classList.toggle('active', panel.id === tab);
            });
            if (tab === 'probe-status') {
                renderProbesView();
                fetchProbes();
            } else if (tab === 'network-status') {
                if (!state.networkLoaded) {
                    fetchNetwork(true);
                } else {
                    renderNetworkView();
                }
            }
        }

        function jumpToNodeChart(nodeKey) {
            state.networkNodeFilter = nodeKey;
            state.networkQuery = '';
            els.networkSearch.value = '';
            els.networkSearchClear.classList.remove('visible');
            state.highlightNodeKey = nodeKey;
            switchTab('network-status');
            if (state.networkLoaded) {
                const card = els.networkGrid.querySelector('[data-network-card="' + CSS.escape(nodeKey) + '"]');
                if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            setTimeout(() => {
                if (state.highlightNodeKey === nodeKey) {
                    state.highlightNodeKey = '';
                    const card = els.networkGrid.querySelector('.network-card.highlight');
                    if (card) card.classList.remove('highlight');
                }
            }, 2200);
        }

        /* ================= Event Bindings ================= */
        document.querySelectorAll('.tab-button').forEach((btn) => {
            btn.addEventListener('click', () => {
                const tab = btn.getAttribute('data-tab');
                if (tab === 'network-status' && state.activeTab !== 'network-status') {
                    state.highlightNodeKey = '';
                }
                switchTab(tab);
            });
        });

        document.querySelectorAll('[data-filter]').forEach((btn) => {
            btn.addEventListener('click', () => {
                state.probeFilter = btn.getAttribute('data-filter') || 'all';
                document.querySelectorAll('[data-filter]').forEach((b) => b.classList.toggle('active', b === btn));
                renderProbesView();
            });
        });

        document.querySelectorAll('[data-view]').forEach((btn) => {
            const v = btn.getAttribute('data-view');
            btn.classList.toggle('active', v === state.probeView);
            btn.addEventListener('click', () => {
                state.probeView = v === 'list' ? 'list' : 'card';
                writeLocalPref('ch_dash_view', state.probeView);
                document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('active', b === btn));
                renderProbesView();
            });
        });

        els.probeSort.addEventListener('change', () => {
            state.probeSort = els.probeSort.value;
            renderProbesView();
        });

        els.probeSearch.addEventListener('input', () => {
            state.probeQuery = els.probeSearch.value;
            els.probeSearchClear.classList.toggle('visible', state.probeQuery.length > 0);
            renderProbesView();
        });
        els.probeSearchClear.addEventListener('click', () => {
            state.probeQuery = '';
            els.probeSearch.value = '';
            els.probeSearchClear.classList.remove('visible');
            renderProbesView();
            els.probeSearch.focus();
        });

        els.probeContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-jump-node]');
            if (btn) jumpToNodeChart(btn.getAttribute('data-jump-node'));
        });

        document.querySelectorAll('.scale-button').forEach((btn) => {
            btn.addEventListener('click', () => {
                const nextScale = btn.getAttribute('data-scale') || 'minute';
                if (nextScale === state.networkScale) return;
                state.networkScale = nextScale;
                document.querySelectorAll('.scale-button').forEach((b) => b.classList.toggle('active', b === btn));
                fetchNetwork(true);
            });
        });

        els.networkNodeFilter.addEventListener('change', () => {
            state.networkNodeFilter = els.networkNodeFilter.value || 'all';
            renderNetworkView();
        });

        els.networkSearch.addEventListener('input', () => {
            state.networkQuery = els.networkSearch.value;
            els.networkSearchClear.classList.toggle('visible', state.networkQuery.length > 0);
            renderNetworkView();
        });
        els.networkSearchClear.addEventListener('click', () => {
            state.networkQuery = '';
            els.networkSearch.value = '';
            els.networkSearchClear.classList.remove('visible');
            renderNetworkView();
            els.networkSearch.focus();
        });

        els.toggleSmooth.classList.toggle('active', state.smoothCurve);
        els.toggleSmooth.addEventListener('click', () => {
            state.smoothCurve = !state.smoothCurve;
            writeLocalPref('ch_dash_smooth', state.smoothCurve ? '1' : '0');
            els.toggleSmooth.classList.toggle('active', state.smoothCurve);
            state.chartInstances.forEach((inst) => drawInteractiveChart(inst));
        });

        els.toggleSpikeClamp.classList.toggle('active', state.clampSpikes);
        els.toggleSpikeClamp.addEventListener('click', () => {
            state.clampSpikes = !state.clampSpikes;
            writeLocalPref('ch_dash_clamp', state.clampSpikes ? '1' : '0');
            els.toggleSpikeClamp.classList.toggle('active', state.clampSpikes);
            state.chartInstances.forEach((inst) => drawInteractiveChart(inst));
        });

        // Series toggle (single click) & solo (double click)
        let chipClickTimer = null;
        els.networkGrid.addEventListener('click', (e) => {
            const chip = e.target.closest('.series-chip');
            if (!chip) return;
            const nodeKey = chip.getAttribute('data-node-key');
            const taskId = chip.getAttribute('data-task-id');
            if (chipClickTimer) clearTimeout(chipClickTimer);
            chipClickTimer = setTimeout(() => {
                chipClickTimer = null;
                const hiddenSet = getHiddenSet(nodeKey);
                if (hiddenSet.has(taskId)) hiddenSet.delete(taskId);
                else hiddenSet.add(taskId);
                chip.classList.toggle('hidden', hiddenSet.has(taskId));
                const inst = state.chartInstances.get(nodeKey);
                if (inst) drawInteractiveChart(inst);
            }, 170);
        });

        els.networkGrid.addEventListener('dblclick', (e) => {
            const chip = e.target.closest('.series-chip');
            if (!chip) return;
            if (chipClickTimer) {
                clearTimeout(chipClickTimer);
                chipClickTimer = null;
            }
            const nodeKey = chip.getAttribute('data-node-key');
            const taskId = chip.getAttribute('data-task-id');
            const inst = state.chartInstances.get(nodeKey);
            if (!inst) return;
            const hiddenSet = getHiddenSet(nodeKey);
            const allIDs = inst.series.map((s) => s.task_id);
            const isAlreadySolo = !hiddenSet.has(taskId) && hiddenSet.size === Math.max(0, allIDs.length - 1);
            hiddenSet.clear();
            if (!isAlreadySolo) {
                allIDs.forEach((id) => {
                    if (id !== taskId) hiddenSet.add(id);
                });
            }
            const card = chip.closest('.network-card');
            if (card) {
                card.querySelectorAll('.series-chip').forEach((el) => {
                    el.classList.toggle('hidden', hiddenSet.has(el.getAttribute('data-task-id')));
                });
            }
            drawInteractiveChart(inst);
        });

        els.toggleAutoRefresh.addEventListener('click', () => {
            state.autoRefresh = !state.autoRefresh;
            els.toggleAutoRefresh.textContent = state.autoRefresh ? '暂停刷新' : '恢复刷新';
            els.toggleAutoRefresh.classList.toggle('active', !state.autoRefresh);
            updateLiveIndicator();
            if (state.autoRefresh && !document.hidden) {
                fetchStatus();
                if (state.activeTab === 'probe-status') fetchProbes();
                else fetchNetwork(false);
            }
        });

        els.manualRefresh.addEventListener('click', async () => {
            els.manualRefresh.classList.add('loading');
            try {
                await fetchStatus();
                if (state.activeTab === 'probe-status') await fetchProbes();
                else await fetchNetwork(false);
            } finally {
                els.manualRefresh.classList.remove('loading');
            }
        });

        let resizeTimer = null;
        window.addEventListener('resize', () => {
            if (state.activeTab !== 'network-status') return;
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                state.chartInstances.forEach((inst) => drawInteractiveChart(inst));
            }, 120);
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && state.autoRefresh) {
                fetchStatus();
                if (state.activeTab === 'probe-status') fetchProbes();
                else if (state.networkLoaded) fetchNetwork(false);
            }
        });

        // Initial load & smart polling
        fetchStatus();
        fetchProbes();

        setInterval(() => {
            if (document.hidden || !state.autoRefresh) return;
            fetchStatus();
        }, 2000);

        setInterval(() => {
            if (document.hidden || !state.autoRefresh || state.activeTab !== 'probe-status') return;
            fetchProbes();
        }, 5000);

        setInterval(() => {
            if (document.hidden || !state.autoRefresh || state.activeTab !== 'network-status' || !state.networkLoaded) return;
            fetchNetwork(false);
        }, 30000);
    </script>
</body>
