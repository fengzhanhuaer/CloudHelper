<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CloudHelper Probe Node</title>
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="route">
  <div class="shell">
    <aside>
      <h1 class="brand">CloudHelper<br>Probe Node</h1>
      <nav>
        <a class="nav-button" data-page="status" href="status.html">状态</a>
        <a class="nav-button" data-page="route" href="route.html">路由</a>
        <a class="nav-button" data-page="settings" href="settings.html">设置</a>
      </nav>
    </aside>
    <main>
      <h2 id="pageTitle" class="page-title">路由</h2>
      <p id="pageSubtitle" class="page-subtitle"></p>
      <section class="page">
        <div class="route-control">
          <div>
            <h3>路由开关</h3>
            <p>开启后启动 Android VPN，关闭后停止 VPN 并释放本机路由能力。</p>
          </div>
          <label class="route-switch" aria-label="启用路由">
            <input id="routeEnabled" type="checkbox" role="switch" aria-describedby="routeState routeDetail">
            <span class="route-switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <div id="routeState" class="route-state" aria-live="polite"></div>
        <div id="routeDetail" class="route-detail" aria-live="polite"></div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
