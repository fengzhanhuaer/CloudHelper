<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Probe Node 系统设置</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: rgba(22, 27, 34, 0.74);
      --border: rgba(255, 255, 255, 0.12);
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-strong: #1f6feb;
      --ok: #7ee787;
      --danger: #ff938d;
    }
    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 24px;
      color: var(--text);
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #1f2937 0%, transparent 70%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main { width: 100%; margin: 0 auto; }
    h1 { margin: 0; color: #fff; font-size: 24px; }
    h2 { margin: 0 0 12px; color: #e6edf3; font-size: 17px; }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav a {
      padding: 8px 12px;
      border-radius: 8px;
      color: #d0d7de;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(139, 148, 158, 0.2);
    }
    .nav a.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #fff;
    }
    .grid { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      background: var(--panel);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28);
    }
    .kv {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      gap: 8px;
      margin-top: 8px;
      font-size: 14px;
    }
    .kv > div:nth-child(odd) { color: var(--muted); }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin: 10px 0 12px; }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 240px; flex: 1 1 240px; }
    .field label { font-size: 12px; color: var(--muted); }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: rgba(13, 17, 23, 0.55);
      color: var(--text);
    }
    textarea {
      min-height: 120px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      line-height: 1.5;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button {
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #fff;
      font-weight: 600;
    }
    button.secondary {
      background: rgba(139, 148, 158, 0.2);
      border-color: rgba(255, 255, 255, 0.18);
      color: #d0d7de;
    }
    button.warn {
      background: linear-gradient(135deg, #ff7b72, #d73a49);
    }
    button:disabled { opacity: .58; cursor: not-allowed; }
    .interface-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .interface-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: rgba(13, 17, 23, 0.36);
    }
    .interface-item input { width: auto; margin-top: 3px; }
    .interface-title { font-weight: 700; color: #e6edf3; overflow-wrap: anywhere; }
    .progress { margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; height: 10px; background: rgba(255,255,255,.08); }
    .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), #2ea043); transition: width .3s ease; }
    .msg { margin-top: 14px; min-height: 20px; font-size: 14px; color: var(--muted); }
    .msg.error { color: var(--danger); }
    .msg.success { color: var(--ok); }
    @media (max-width: 860px) {
      body { padding: 16px; }
      .topbar { flex-direction: column; }
      .kv { grid-template-columns: 140px minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <div>
        <h1>系统设置</h1>
        <p class="hint">系统升级、IP 上送、路由认证黑名单与服务操作。</p>
      </div>
      <div class="nav">
        <a href="/local/panel">首页</a>
        <a href="/local/logs">运行日志</a>
        <a href="/local/virtual-router">虚拟路由</a>
        <a href="/local/system" class="active">系统设置</a>
      </div>
    </div>

    <div class="grid">
      <section class="card">
        <h2>系统升级</h2>
        <div class="kv" style="align-items: center;">
          <div>发布仓库</div>
          <div><input id="upgradeRepoInput" type="text" value="fengzhanhuaer/CloudHelper" /></div>
          <div>当前版本</div><div id="upgradeCurrentVersionText">-</div>
          <div>最新版本</div><div id="upgradeLatestVersionText">-</div>
          <div>是否可升级</div><div id="upgradeAvailableText">-</div>
          <div>可用安装包</div><div id="upgradeAssetText">-</div>
          <div>检查模式</div><div id="upgradeCheckModeText">-</div>
          <div>升级状态</div><div id="upgradeStatusText">-</div>
          <div>当前阶段</div><div id="upgradeStepText">-</div>
          <div>下载进度</div><div id="upgradeDownloadText">-</div>
          <div>下载速度</div><div id="upgradeSpeedText">-</div>
          <div>说明</div><div id="upgradeMessageText">-</div>
          <div>错误信息</div><div id="upgradeErrorText">-</div>
        </div>
        <div class="progress"><div id="upgradeProgressFill" class="progress-fill"></div></div>
        <div class="actions">
          <button id="upgradeCheckDirectBtn" class="secondary">直连检查</button>
          <button id="upgradeCheckProxyBtn" class="secondary">控制器通道检查</button>
          <button id="upgradeDirectBtn">直连升级</button>
          <button id="upgradeProxyBtn" class="secondary">控制器通道升级</button>
          <button id="restartServiceBtn" class="secondary">重启服务</button>
          <button id="logoutBtn" class="warn">退出登录</button>
        </div>
      </section>

      <section class="card">
        <h2>路由认证黑名单</h2>
        <p class="hint">每行一个源 IP，保存后写入本地 data/probe_route_auth_blacklist.json。</p>
        <div class="kv">
          <div>当前数量</div><div id="routeAuthBlacklistCount">0</div>
          <div>黑名单</div>
          <div><textarea id="routeAuthBlacklistContent" spellcheck="false" placeholder="例如：&#10;123.232.8.66"></textarea></div>
        </div>
        <div class="actions">
          <button id="routeAuthBlacklistSaveBtn">保存黑名单</button>
          <button id="routeAuthBlacklistRefreshBtn" class="secondary">刷新黑名单</button>
        </div>
      </section>

      <section class="card">
        <h2>IP 上送</h2>
        <div class="kv">
          <div>已选网卡</div><div id="ipReportSelectedCount">0</div>
          <div>更新时间</div><div id="ipReportUpdatedAt">-</div>
        </div>
        <div id="ipReportInterfaces" class="interface-list"></div>
        <div class="actions">
          <button id="ipReportSaveBtn">保存 IP 上送设置</button>
          <button id="ipReportRefreshBtn" class="secondary">刷新网卡</button>
        </div>
      </section>
    </div>

    <p id="message" class="msg"></p>
  </main>

  <script>
    const messageEl = document.getElementById('message');
    const ipReportInterfacesEl = document.getElementById('ipReportInterfaces');
    const routeAuthBlacklistContentEl = document.getElementById('routeAuthBlacklistContent');
    let upgradeStatusPollingTimer = null;

    function setMessage(text, type) {
      messageEl.textContent = text || '';
      messageEl.className = 'msg' + (type ? ' ' + type : '');
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = (value === undefined || value === null || value === '') ? '-' : String(value);
    }

    async function requestJSON(url, options, timeoutMs) {
      const controller = new AbortController();
      const timeoutID = setTimeout(() => controller.abort(), timeoutMs || 20000);
      let res;
      try {
        res = await fetch(url, {
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          ...options,
          signal: controller.signal,
        });
      } catch (err) {
        if (err && err.name === 'AbortError') throw new Error('请求超时');
        throw err;
      } finally {
        clearTimeout(timeoutID);
      }
      let data = {};
      try { data = await res.json(); } catch (_) { data = {}; }
      if (!res.ok) {
        const error = new Error(data && data.error ? data.error : 'HTTP ' + res.status);
        error.status = res.status;
        throw error;
      }
      return data;
    }

    async function ensureSession() {
      try {
        const data = await requestJSON('/local/api/auth/session', { method: 'GET' });
        if (!data.authenticated) {
          window.location.href = '/local/login';
          return false;
        }
        setText('upgradeCurrentVersionText', data.version || '-');
        return true;
      } catch (err) {
        if (err && err.status === 401) {
          window.location.href = '/local/login';
          return false;
        }
        throw err;
      }
    }

    function isIPv4Text(value) {
      return /^\d{1,3}(?:\.\d{1,3}){3}$/.test(String(value || '').trim());
    }

    function ipReportDisplayIPs(values) {
      if (!Array.isArray(values)) return [];
      return values.map((value) => String(value || '').trim()).filter(Boolean).sort((left, right) => {
        const leftIs4 = isIPv4Text(left);
        const rightIs4 = isIPv4Text(right);
        if (leftIs4 !== rightIs4) return leftIs4 ? -1 : 1;
        return left.localeCompare(right);
      });
    }

    function formatIPReportInterface(item) {
      const data = item || {};
      const name = String(data.name || '').trim();
      const lanIPs = ipReportDisplayIPs(data.lan_ips);
      const ips = lanIPs.length > 0 ? lanIPs.join(', ') : '无局域网 IP';
      return `${name || data.id || '未命名网卡'}（${ips}）`;
    }

    function renderIPReportSettings(data) {
      const settings = data && typeof data.settings === 'object' ? data.settings : {};
      const interfaces = Array.isArray(data && data.interfaces) ? data.interfaces : [];
      setText('ipReportUpdatedAt', settings.updated_at || '-');
      setText('ipReportSelectedCount', String(interfaces.filter((item) => item && item.selected).length));
      ipReportInterfacesEl.innerHTML = '';
      if (interfaces.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'hint';
        empty.textContent = '未发现可选网卡';
        ipReportInterfacesEl.appendChild(empty);
        return;
      }
      interfaces.forEach((item) => {
        const id = String(item && item.id || '').trim();
        if (!id) return;
        const label = document.createElement('label');
        label.className = 'interface-item';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = id;
        checkbox.checked = !!item.selected;
        checkbox.dataset.interfaceId = id;
        const title = document.createElement('div');
        title.className = 'interface-title';
        title.textContent = formatIPReportInterface(item);
        label.appendChild(checkbox);
        label.appendChild(title);
        ipReportInterfacesEl.appendChild(label);
      });
    }

    async function loadIPReportSettings() {
      const data = await requestJSON('/local/api/system/ip_report_settings', { method: 'GET' });
      renderIPReportSettings(data || {});
    }

    async function saveIPReportSettings() {
      const selected = Array.from(document.querySelectorAll('[data-interface-id]'))
        .filter((item) => item.checked)
        .map((item) => item.dataset.interfaceId)
        .filter(Boolean);
      const data = await requestJSON('/local/api/system/ip_report_settings', {
        method: 'POST',
        body: JSON.stringify({
          only_selected_lan_interfaces: true,
          selected_interface_ids: selected,
        }),
      });
      renderIPReportSettings(data || {});
      setMessage('IP 上送设置已保存', 'success');
    }

    function formatBytes(value) {
      let n = Number(value);
      if (!Number.isFinite(n) || n <= 0) return '-';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let unit = 0;
      while (n >= 1024 && unit < units.length - 1) {
        n /= 1024;
        unit += 1;
      }
      return (unit === 0 ? String(Math.trunc(n)) : n.toFixed(1)) + ' ' + units[unit];
    }

    function renderUpgradeStatus(data) {
      const status = String(data && data.status || '').trim() || 'idle';
      const progress = Math.max(0, Math.min(100, Math.trunc(Number(data && data.progress) || 0)));
      const downloaded = Number(data && data.downloaded_bytes || 0);
      const total = Number(data && data.total_bytes || 0);
      setText('upgradeStatusText', status);
      setText('upgradeStepText', data && data.step || '-');
      setText('upgradeDownloadText', total > 0 ? `${formatBytes(downloaded)} / ${formatBytes(total)}` : formatBytes(downloaded));
      setText('upgradeSpeedText', formatBytes(data && data.speed_bps) === '-' ? '-' : formatBytes(data && data.speed_bps) + '/s');
      setText('upgradeMessageText', data && data.message || '-');
      setText('upgradeErrorText', data && data.error || '-');
      const fill = document.getElementById('upgradeProgressFill');
      if (fill) fill.style.width = progress + '%';
      const busy = status === 'accepted' || status === 'running';
      setUpgradeButtonsBusy(busy);
      if (!busy && upgradeStatusPollingTimer) {
        clearInterval(upgradeStatusPollingTimer);
        upgradeStatusPollingTimer = null;
      }
    }

    function setUpgradeButtonsBusy(busy) {
      ['upgradeCheckDirectBtn', 'upgradeCheckProxyBtn', 'upgradeDirectBtn', 'upgradeProxyBtn'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.disabled = !!busy;
      });
    }

    async function loadUpgradeStatus() {
      const data = await requestJSON('/local/api/system/upgrade/status', { method: 'GET' });
      renderUpgradeStatus(data || {});
    }

    function renderUpgradeCheck(data) {
      setText('upgradeCurrentVersionText', data && data.current_version || '-');
      setText('upgradeLatestVersionText', data && data.latest_version || '-');
      setText('upgradeAvailableText', data && data.upgradeable ? '是' : '否');
      setText('upgradeAssetText', data && data.asset_name || (data && data.asset_error ? '未匹配：' + data.asset_error : '-'));
      setText('upgradeCheckModeText', data && data.mode || '-');
    }

    async function checkSystemUpgrade(mode) {
      const releaseRepo = String(document.getElementById('upgradeRepoInput').value || '').trim();
      setUpgradeButtonsBusy(true);
      setMessage(`${mode === 'proxy' ? '控制器通道' : '直连'}检查升级中...`);
      try {
        const data = await requestJSON('/local/api/system/upgrade/check', {
          method: 'POST',
          body: JSON.stringify({ mode, release_repo: releaseRepo }),
        }, 30000);
        renderUpgradeCheck(data || {});
        setMessage(data && data.upgradeable ? '发现可升级版本' : '当前已是最新版本', 'success');
      } catch (err) {
        setMessage('检查升级失败：' + err.message, 'error');
      } finally {
        setUpgradeButtonsBusy(false);
      }
    }

    async function triggerSystemUpgrade(mode) {
      const releaseRepo = String(document.getElementById('upgradeRepoInput').value || '').trim();
      setUpgradeButtonsBusy(true);
      setMessage(`提交${mode === 'proxy' ? '控制器通道' : '直连'}升级中...`);
      try {
        await requestJSON('/local/api/system/upgrade', {
          method: 'POST',
          body: JSON.stringify({ mode, release_repo: releaseRepo }),
        });
        await loadUpgradeStatus();
        if (!upgradeStatusPollingTimer) {
          upgradeStatusPollingTimer = setInterval(() => loadUpgradeStatus().catch(() => {}), 1500);
        }
        setMessage('升级任务已提交', 'success');
      } catch (err) {
        setUpgradeButtonsBusy(false);
        setMessage('提交升级失败：' + err.message, 'error');
      }
    }

    function renderRouteAuthBlacklist(data) {
      routeAuthBlacklistContentEl.value = String(data && data.content || '').trim();
      setText('routeAuthBlacklistCount', String(Array.isArray(data && data.items) ? data.items.length : 0));
    }

    async function loadRouteAuthBlacklist() {
      const data = await requestJSON('/local/api/system/route_auth_blacklist', { method: 'GET' });
      renderRouteAuthBlacklist(data || {});
    }

    async function saveRouteAuthBlacklist() {
      const data = await requestJSON('/local/api/system/route_auth_blacklist', {
        method: 'POST',
        body: JSON.stringify({ content: routeAuthBlacklistContentEl.value || '' }),
      });
      renderRouteAuthBlacklist(data || {});
      setMessage('路由认证黑名单已保存', 'success');
    }

    async function refreshAll() {
      const ok = await ensureSession();
      if (!ok) return;
      await loadIPReportSettings();
      await loadUpgradeStatus();
      await loadRouteAuthBlacklist();
    }

    document.getElementById('upgradeCheckDirectBtn').addEventListener('click', () => checkSystemUpgrade('direct'));
    document.getElementById('upgradeCheckProxyBtn').addEventListener('click', () => checkSystemUpgrade('proxy'));
    document.getElementById('upgradeDirectBtn').addEventListener('click', () => triggerSystemUpgrade('direct'));
    document.getElementById('upgradeProxyBtn').addEventListener('click', () => triggerSystemUpgrade('proxy'));
    document.getElementById('restartServiceBtn').addEventListener('click', async () => {
      setMessage('提交重启服务...');
      try {
        await requestJSON('/local/api/system/restart', { method: 'POST', body: '{}' });
        setMessage('已提交重启，服务将短暂断开后恢复', 'success');
      } catch (err) {
        setMessage('重启服务失败：' + err.message, 'error');
      }
    });
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try { await requestJSON('/local/api/auth/logout', { method: 'POST', body: '{}' }); } catch (_) {}
      window.location.href = '/local/login';
    });
    document.getElementById('ipReportSaveBtn').addEventListener('click', () => saveIPReportSettings().catch((err) => setMessage('保存 IP 上送设置失败：' + err.message, 'error')));
    document.getElementById('ipReportRefreshBtn').addEventListener('click', () => loadIPReportSettings().then(() => setMessage('网卡已刷新', 'success')).catch((err) => setMessage('刷新网卡失败：' + err.message, 'error')));
    document.getElementById('routeAuthBlacklistSaveBtn').addEventListener('click', () => saveRouteAuthBlacklist().catch((err) => setMessage('保存路由认证黑名单失败：' + err.message, 'error')));
    document.getElementById('routeAuthBlacklistRefreshBtn').addEventListener('click', () => loadRouteAuthBlacklist().then(() => setMessage('路由认证黑名单已刷新', 'success')).catch((err) => setMessage('刷新路由认证黑名单失败：' + err.message, 'error')));

    refreshAll().catch((err) => setMessage('初始化失败：' + err.message, 'error'));
  </script>
</body>
</html>
